, il s'effondre. tante d'une telle structure de la moitié ou moins effectue un jet de sauvegarde de cas d'échec, la créature subit 12d6 dégâts et l'état À terre, et finit ensevelie dans les n extraire demande de réussir un test de Force sme) DD 20 au prix d'une action. En cas de réussite, it uniquement la moitié de ces dégâts.<\/p>\n"}, {"nom": "Tsunami", "ecole": "Invocation", "niveau": 8, "classes": ["Druide"], "incantation": "À vérifier", "portee": "1,5 km _", "composantes": "V, S", "duree": "Concentration, jusqu'à 6 rounds", "pages_source": [341], "description": "Une muraille d'eau se matérialise en un point que vous choisissez à portée. Ce mur peut atteindre jusqu'à 90 m de longueur, 90 m de hauteur et 15 m d'épaisseur. Le mur persiste pour toute la durée. Quand le mur apparaît, chaque créature prise dans sa zone effectue un jet de sauvegarde de Force et subit 6410 dégâts contondants en cas d'échec, la moitié en cas de réussite. Au début de chacun de vos tours suivant son apparition, le mur et toutes les créatures qu'il englobe s'éloignent de 15 m de vous. Toutes les créatures de taille TG ou inférieure qui occupent un espace dans lequel le mur se déplace doivent réussir un jet de sauvegarde de Force sous peine de subir 5d10 dégâts contondants. Une même créature ne peut subir ces dégâts qu'une fois par round. À la fin du tour, la hauteur du mur diminue de 15 m et les dégâts qu'il peut infliger aux rounds suivants diminuent de 1d10. Une fois que la hauteur du mur est de O m, le sort prend fin. Une créature prise dans le mur ne peut se déplacer qu'en nageant. La force de la vague est toutefois telle que la créature doit pour ce faire réussir un test de Force (Athlétisme) contre le DD de sauvegarde du sort. En cas d'échec, elle ne peut pas se déplacer. Une créature qui se déplace hors du mur tombe au sol.", "illustration": null, "legende_illustration": null, "notes_verification": "champ_absent:incantation", "statut": "ocr_non_valide", "id": "tsunami", "html_body": "<p>Une muraille d'eau se matérialise en un point que vous choisissez à portée. Ce mur peut atteindre jusqu'à 90 m de longueur, 90 m de hauteur et 15 m d'épaisseur. Le mur persiste pour toute la durée. Quand le mur apparaît, chaque créature prise dans sa zone effectue un jet de sauvegarde de Force et subit 6410 dégâts contondants en cas d'échec, la moitié en cas de réussite. Au début de chacun de vos tours suivant son apparition, le mur et toutes les créatures qu'il englobe s'éloignent de 15 m de vous. Toutes les créatures de taille TG ou inférieure qui occupent un espace dans lequel le mur se déplace doivent réussir un jet de sauvegarde de Force sous peine de subir 5d10 dégâts contondants. Une même créature ne peut subir ces dégâts qu'une fois par round. À la fin du tour, la hauteur du mur diminue de 15 m et les dégâts qu'il peut infliger aux rounds suivants diminuent de 1d10. Une fois que la hauteur du mur est de O m, le sort prend fin. Une créature prise dans le mur ne peut se déplacer qu'en nageant. La force de la vague est toutefois telle que la créature doit pour ce faire réussir un test de Force (Athlétisme) contre le DD de sauvegarde du sort. En cas d'échec, elle ne peut pas se déplacer. Une créature qui se déplace hors du mur tombe au sol.<\/p>\n"}, {"nom": "Vague Destructrice", "ecole": "Évocation", "niveau": 5, "classes": ["Paladin"], "incantation": "action", "portee": "personnelle", "composantes": "V", "duree": "instantanée", "pages_source": [341], "description": "Une onde d'énergie destructrice irradie de votre position sous forme d'une Émanation de 9 m. Toute créature que vous choisissez dans l'Émanation effectue un jet de\nDEAR Caneihution. En ces d'échec, elle subit _ Temps d’incantation : action Portée : personnelle Composantes : V, S Durée : instantanée\nVous produisez une vague de force tonitruante. Chaque créature prise dans un Cube de 4,50 m émanant de vous effectue un jet de sauvegarde de Constitution. En cas d'échec, la créature subit 2d8 dégâts de tonnerre et le choc l'éloigne de 3 m de vous. En cas de réussite, la créature subit uniquement la moitié de ces dégâts. En outre, les objets non fixés entièrement compris dans le Cube sont automatiquement repoussés de 3 m de vous par le sort, dont le fracas s'entend à une distance de 90 m.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d8 par niveau d'emplacement au-delà du 1‘.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "vague-destructrice", "html_body": "<p>Une onde d'énergie destructrice irradie de votre position sous forme d'une Émanation de 9 m. Toute créature que vous choisissez dans l'Émanation effectue un jet de\nDEAR Caneihution. En ces d'échec, elle subit _ Temps d’incantation : action Portée : personnelle Composantes : V, S Durée : instantanée\nVous produisez une vague de force tonitruante. Chaque créature prise dans un Cube de 4,50 m émanant de vous effectue un jet de sauvegarde de Constitution. En cas d'échec, la créature subit 2d8 dégâts de tonnerre et le choc l'éloigne de 3 m de vous. En cas de réussite, la créature subit uniquement la moitié de ces dégâts. En outre, les objets non fixés entièrement compris dans le Cube sont automatiquement repoussés de 3 m de vous par le sort, dont le fracas s'entend à une distance de 90 m.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d8 par niveau d'emplacement au-delà du 1‘.<\/p>\n"}, {"nom": "Vent Divin", "ecole": "Transmutation", "niveau": 6, "classes": ["Druide"], "incantation": "1 minute", "portee": "9 m", "composantes": "V, S, M (une bougie)", "duree": "8 heures", "pages_source": [341], "description": "Vous et un maximum de dix créatures consentantes que vous choisissez à portée adoptez une forme gazeuse pour toute la durée et apparaissez comme autant de volutes. Tant qu’elle est sous cette forme brumeuse, une cible est dotée d'une Vitesse de vol de 90 m avec la faculté de vol stationnaire, de l'Immunité contre l'état À terre et de la Résistance aux dégâts contondants, perforants et tranchants. Les seules actions qu'elle peut entreprendre sous cette forme sont l'action Pointe et commencer à reprendre sa forme normale au prix de l'action Magie. Il lui faut 1 minute pour retrouver sa forme d'origine, intervalle durant lequel elle subit l'état Étourdi. Jusqu'à la fin du sort, la créature peut également reprendre une forme gazeuse, transformation qui lui demande aussi d'entreprendre l'action Magie et nécessite 1 minute. Si une cible est sous forme gazeuse et en vol au moment où le sort prend fin, elle redescend au rythme de 18 m par round pendant 1 minute, jusqu’à atterrir sans heurt. Si cette minute ne lui a pas suffi à toucher le sol, la cible chute de la distance restante. em — _— \"", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "vent-divin", "html_body": "<p>Vous et un maximum de dix créatures consentantes que vous choisissez à portée adoptez une forme gazeuse pour toute la durée et apparaissez comme autant de volutes. Tant qu’elle est sous cette forme brumeuse, une cible est dotée d'une Vitesse de vol de 90 m avec la faculté de vol stationnaire, de l'Immunité contre l'état À terre et de la Résistance aux dégâts contondants, perforants et tranchants. Les seules actions qu'elle peut entreprendre sous cette forme sont l'action Pointe et commencer à reprendre sa forme normale au prix de l'action Magie. Il lui faut 1 minute pour retrouver sa forme d'origine, intervalle durant lequel elle subit l'état Étourdi. Jusqu'à la fin du sort, la créature peut également reprendre une forme gazeuse, transformation qui lui demande aussi d'entreprendre l'action Magie et nécessite 1 minute. Si une cible est sous forme gazeuse et en vol au moment où le sort prend fin, elle redescend au rythme de 18 m par round pendant 1 minute, jusqu’à atterrir sans heurt. Si cette minute ne lui a pas suffi à toucher le sol, la cible chute de la distance restante. em — _— &quot;<\/p>\n"}, {"nom": "Verrou Magique", "ecole": "Abjuration", "niveau": 2, "classes": ["Magicien"], "incantation": "action", "portee": "contact", "composantes": "V, S, M (poudre d’or d’une valeur minimale de 25 po, que le sort détruit)", "duree": "jusqu’à dissipation", "pages_source": [341, 342], "description": "Vous touchez un accès fermé : porte, fenêtre, portail, récipient ou écoutille. L’accès est alors verrouillé magiquement pour toute la durée. Ce verrou résiste à toutes les tentatives d’ouverture non magiques. Vous et toutes les créatures que vous désignez à l’incantation du sort pouvez ouvrir et fermer normalement l’objet malgré le verrou. Vous pouvez également décider d’un mot de passe qui déverrouille l’objet pendant 1 minute s’il est prononcé à 1,50 m ou moins de celui-ci.", "illustration": null, "legende_illustration": null, "notes_verification": "Transcription reprise directement sur les scans du manuel ; relecture exhaustive du lot encore nécessaire.", "statut": "ocr_non_valide", "id": "verrou-magique", "html_body": "<p>Vous touchez un accès fermé : porte, fenêtre, portail, récipient ou écoutille. L’accès est alors verrouillé magiquement pour toute la durée. Ce verrou résiste à toutes les tentatives d’ouverture non magiques. Vous et toutes les créatures que vous désignez à l’incantation du sort pouvez ouvrir et fermer normalement l’objet malgré le verrou. Vous pouvez également décider d’un mot de passe qui déverrouille l’objet pendant 1 minute s’il est prononcé à 1,50 m ou moins de celui-ci.<\/p>\n"}, {"nom": "Vif Carquois", "ecole": "Transmutation", "niveau": 5, "classes": ["Rôdeur"], "incantation": "À vérifier", "portee": "personnelle", "composantes": "V, S, M (un carquois d’une valeur minimale de 1 po)", "duree": "Concentration, jusqu’à 1 minute", "pages_source": [342], "description": "À l'incantation du sort et par une action Bonus jusqu’à sa fin, vous pouvez effectuer deux attaques avec une arme qui décoche des flèches ou des carreaux, comme un arc long ou une arbalète légère. Le sort produit magiquement les projectiles demandés par ces attaques. Chaque flèche et carreau que produit le sort inflige les mêmes dégâts que le projectile non magique correspondant et se désintègre aussitôt après avoir touché ou raté sa cible. ae em", "illustration": null, "legende_illustration": null, "notes_verification": "champ_absent:incantation", "statut": "ocr_non_valide", "id": "vif-carquois", "html_body": "<p>À l'incantation du sort et par une action Bonus jusqu’à sa fin, vous pouvez effectuer deux attaques avec une arme qui décoche des flèches ou des carreaux, comme un arc long ou une arbalète légère. Le sort produit magiquement les projectiles demandés par ces attaques. Chaque flèche et carreau que produit le sort inflige les mêmes dégâts que le projectile non magique correspondant et se désintègre aussitôt après avoir touché ou raté sa cible. ae em<\/p>\n"}, {"nom": "Vigueur Arcanique", "ecole": "Abjuration", "niveau": 2, "classes": ["Ensorceleur", "Magicien"], "incantation": "action Bonus", "portee": "personnelle", "composantes": "V, S", "duree": "instantanée", "pages_source": [342], "description": "Vous puisez dans votre force vitale pour vous soigner. Lancez un ou deux de vos dés de vie non dépensés et récupérez autant de points de vie que le total du jet plus votre modificateur de caractéristique d'incantation. Les deux dés sont alors dépensés.\nEmplacement de niveau supérieur. Le nombre de DV non dépensés que vous pouvez lancer augmente d'un par niveau d'emplacement au-delà du 2°.", "illustration": null, "legende_illustration": null, "notes_verification": "encadre_statistiques_a_controler", "statut": "ocr_non_valide", "id": "vigueur-arcanique", "html_body": "<p>Vous puisez dans votre force vitale pour vous soigner. Lancez un ou deux de vos dés de vie non dépensés et récupérez autant de points de vie que le total du jet plus votre modificateur de caractéristique d'incantation. Les deux dés sont alors dépensés.\nEmplacement de niveau supérieur. Le nombre de DV non dépensés que vous pouvez lancer augmente d'un par niveau d'emplacement au-delà du 2°.<\/p>\n"}, {"nom": "Vision dans le Noir", "ecole": "Transmutation", "niveau": 2, "classes": ["Druide", "Ensorceleur", "Magicien", "Rôdeur"], "incantation": "action", "portee": "contact", "composantes": "V, S, M (une carotte séchée)", "duree": "8 heures", "pages_source": [342], "description": "Pour toute la durée, une créature consentante que vous touchez physiquement acquiert la Vision dans le noir sur 45 m. Compossabes : V,S, M (p: jd minimale de 25 po, que le sort détruit) Durée : 1 heure Pour toute la durée, une créature con touchez physiquement acquiert la Vision I", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "vision-dans-le-noir", "html_body": "<p>Pour toute la durée, une créature consentante que vous touchez physiquement acquiert la Vision dans le noir sur 45 m. Compossabes : V,S, M (p: jd minimale de 25 po, que le sort détruit) Durée : 1 heure Pour toute la durée, une créature con touchez physiquement acquiert la Vision I<\/p>\n"}, {"nom": "Voie Végétale", "ecole": "Invocation", "niveau": 6, "classes": ["Druide"], "incantation": "action", "portee": "3 m", "composantes": "V, S", "duree": "1 minute", "pages_source": [342], "description": "Ce sort crée un lien magique entre une plante ina: à portée, de taille G ou supérieure, et une autre p même plan d'existence, sans contrainte de distance. devez avoir déjà vu ou touché la plante de destination a moins une fois. Pour toute la durée, toutes les créatures . peuvent s'avancer dans la plante ciblée et ressortir par. she la plante de destination en y consacrant 1,50 m de leur déplacement.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "voie-vegetale", "html_body": "<p>Ce sort crée un lien magique entre une plante ina: à portée, de taille G ou supérieure, et une autre p même plan d'existence, sans contrainte de distance. devez avoir déjà vu ou touché la plante de destination a moins une fois. Pour toute la durée, toutes les créatures . peuvent s'avancer dans la plante ciblée et ressortir par. she la plante de destination en y consacrant 1,50 m de leur déplacement.<\/p>\n"}, {"nom": "Voile Défensif", "ecole": "Abjuration", "niveau": 0, "classes": ["Barde", "Ensorceleur", "Magicien", "Occultiste"], "incantation": "action", "portee": "personnelle", "composantes": "V, S", "duree": "Concentration, jusqu'à 1 minute", "pages_source": [342, 343], "description": "Chaque fois qu'une créature effectue un jet d'attaque contre vous avant la fin du sort, elle doit soustraire 1d4 au résultat du jet. VoL Transmutation du 3° niveau (Ensorceleur, Magicien, Occultiste) Temps d’incantation : action Portée : contact Composantes : V, S, M (une plume) Durée : Concentration, jusqu’à 10 minutes\nVous touchez une créature consentante. Pour toute la durée, la cible acquiert une Vitesse de vol de 18 m et bénéficie du vol stationnaire. Lorsque le sort prend fin, la cible tombe si elle est toujours dans les airs, à moins de pouvoir arrêter sa chute. «\nEmplacement de niveau supérieur. Vous pouvez cibler une créature supplémentaire par niveau d'emplacement au-delà du 3°.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "voile-defensif", "html_body": "<p>Chaque fois qu'une créature effectue un jet d'attaque contre vous avant la fin du sort, elle doit soustraire 1d4 au résultat du jet. VoL Transmutation du 3° niveau (Ensorceleur, Magicien, Occultiste) Temps d’incantation : action Portée : contact Composantes : V, S, M (une plume) Durée : Concentration, jusqu’à 10 minutes\nVous touchez une créature consentante. Pour toute la durée, la cible acquiert une Vitesse de vol de 18 m et bénéficie du vol stationnaire. Lorsque le sort prend fin, la cible

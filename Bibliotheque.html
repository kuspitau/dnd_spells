ous peine de subir l'état Effrayé jusqu’à la fin du sort. Une cible ainsi Effrayée réitère le JS à la fin de chacun de ses tours et met un terme au sort sur elle-même en cas de réussite.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d6 par niveau d'emplacement au-delà du 1*.<\/p>\n"}, {"nom": "Châtiment divin", "ecole": "Évocation", "niveau": 1, "classes": ["Paladin"], "incantation": "À vérifier", "portee": "personnelle", "composantes": "V", "duree": "instantanée", "pages_source": [254, 255], "description": "La cible en subit 2d8 dégâts radiants supplémentaires. Ces dégâts supplémentaires augmentent de 1d8 si la cible est un Fiélon ou un Mort-vivant.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d8 par niveau d'emplacement au-delà du 1“. £ UNE PALADINE NAIÏINE RENFORCE SON ARME DE CHÂTIMENT DIVIN POUR EXPOSER DES\nMEZZOLOTHS À L'IRE DIVINE.", "illustration": null, "legende_illustration": null, "notes_verification": "champ_absent:incantation", "statut": "ocr_non_valide", "id": "chatiment-divin", "html_body": "<p>La cible en subit 2d8 dégâts radiants supplémentaires. Ces dégâts supplémentaires augmentent de 1d8 si la cible est un Fiélon ou un Mort-vivant.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d8 par niveau d'emplacement au-delà du 1“. £ UNE PALADINE NAIÏINE RENFORCE SON ARME DE CHÂTIMENT DIVIN POUR EXPOSER DES\nMEZZOLOTHS À L'IRE DIVINE.<\/p>\n"}, {"nom": "Châtiment de Fournaise", "ecole": "Évocation", "niveau": 1, "classes": ["Paladin"], "incantation": "action Bonus, que vous entrepren aussitôt après avoir touché une cible avec une ar corps à corps ou à mains nues", "portee": "personnelle", "composantes": "V", "duree": "1 minute", "pages_source": [255], "description": "3 as] Q ®m Alors que vous touchez la cible, elle subit 1d6 dégâts de feu supplémentaires de l'attaque. Au début de chacun de ses tours jusqu’à la fin du sort, la cible subit 1d6 dégâts de feu et effectue un jet de sauvegarde de Constitution. En cas d'échec, le sort se poursuit. En cas de réussite, le sort prend fin.\nEmplacement de niveau supérieur. tous les dégâts augmentent de 1d6 par niveau d'emplacement au-delà du 1°.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "chatiment-de-fournaise", "html_body": "<p>3 as] Q ®m Alors que vous touchez la cible, elle subit 1d6 dégâts de feu supplémentaires de l'attaque. Au début de chacun de ses tours jusqu’à la fin du sort, la cible subit 1d6 dégâts de feu et effectue un jet de sauvegarde de Constitution. En cas d'échec, le sort se poursuit. En cas de réussite, le sort prend fin.\nEmplacement de niveau supérieur. tous les dégâts augmentent de 1d6 par niveau d'emplacement au-delà du 1°.<\/p>\n"}, {"nom": "Châtiment de révélation", "ecole": "Transmutation", "niveau": 2, "classes": ["Paladin"], "incantation": "action Bonus, que vous entreprenez | aussitôt après avoir touché une créature avec une arme de corps à corps ou une attaque à mains nues |", "portee": "personnelle |", "composantes": "V", "duree": "Concentration, jusqu’à 1 minute", "pages_source": [255], "description": "La cible subit 2d6 dégâts radiants supplémentaires. Jusqu'à la fin du sort, la cible émet une Lumière vive dans un rayon de 1,50 m, les jets d'attaque contre elle ont l’Avantage et elle ne peut pas bénéficier de l'état Invisible.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d6 par niveau d'emplacement au-delà du 2°.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "chatiment-de-revelation", "html_body": "<p>La cible subit 2d6 dégâts radiants supplémentaires. Jusqu'à la fin du sort, la cible émet une Lumière vive dans un rayon de 1,50 m, les jets d'attaque contre elle ont l’Avantage et elle ne peut pas bénéficier de l'état Invisible.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d6 par niveau d'emplacement au-delà du 2°.<\/p>\n"}, {"nom": "Châtiment de stupeur", "ecole": "Enchantement", "niveau": 4, "classes": ["Paladin"], "incantation": "action Bonus, que vous entreprenez aussitôt après avoir touché une créature avec une arme de corps à corps ou une attaque à mains nues", "portee": "personnelle", "composantes": "V", "duree": "instantanée", "pages_source": [255, 256], "description": "La cible subit 4d6 dégâts psychiques supplémentaires et doit réussir un jet de sauvegarde de Sagesse sous peine de subir l'état Étourdi jusqu'à la fin de votre tour suivant.\nEmplacement de niveau supérieur. Les dégâts supplémentaires augmentent de 1d6 par niveau d'emplacement au-delà du 4.\n\nDo dns", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "chatiment-de-stupeur", "html_body": "<p>La cible subit 4d6 dégâts psychiques supplémentaires et doit réussir un jet de sauvegarde de Sagesse sous peine de subir l'état Étourdi jusqu'à la fin de votre tour suivant.\nEmplacement de niveau supérieur. Les dégâts supplémentaires augmentent de 1d6 par niveau d'emplacement au-delà du 4.<\/p>\n<p>Do dns<\/p>\n"}, {"nom": "Châtiment de Tonnerre", "ecole": "Évocation", "niveau": 1, "classes": ["Paladin"], "incantation": "action Bonus, que vous entreprenez aussitôt après avoir touché une cible avec une arme de corps à corps ou à mains nues", "portee": "personnelle", "composantes": "\\", "duree": "instantanée", "pages_source": [256], "description": "Votre coup retentit tel le tonnerre, ce qui s'entend dans un rayon de 90 m, et la cible subit 2d6 dégâts de tonnerre supplémentaires. De plus, si la cible est une créature, elle doit réussir un jet de sauvegarde de Force sous peine d’être repoussée de vous de 3 m et de subir l'état A terre.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d6 par niveau d'emplacement au-delà du 1°.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "chatiment-de-tonnerre", "html_body": "<p>Votre coup retentit tel le tonnerre, ce qui s'entend dans un rayon de 90 m, et la cible subit 2d6 dégâts de tonnerre supplémentaires. De plus, si la cible est une créature, elle doit réussir un jet de sauvegarde de Force sous peine d’être repoussée de vous de 3 m et de subir l'état A terre.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d6 par niveau d'emplacement au-delà du 1°.<\/p>\n"}, {"nom": "Chaudron bouillonnant de Tasha", "ecole": "Évocation", "niveau": 6, "classes": ["Magicien", "Occultiste"], "incantation": "action", "portee": "1,50 m", "composantes": "V, S, M (une louche dorée d’une valeur minim e ale", "duree": "10 minutes", "pages_source": [256], "description": "Vous invoquez un chaudron à pieds griffus, rempli d'un liquide bouillonnant. Il apparaît au sol, en un espace inoccupé dans un rayon de 1,50 m de vous et y reste pour toute : durée. On ne peut pas déplacer le chaudron, qui disparaît lu sort, ainsi que le liquide bouillonnant qu'il contient. in a we\" LA LÉGENDAIRE SORCIÈRE TASHA SE SERT DE SON SORT CHAUDRON BOUILLONNANT DE TASHA POUR CONCOCTER\nUNE POTION MAGIQUE. Le liquide du chaudron reproduit les propriétés d'une potion courante ou peu courante de votre choix (potion de guérison, par exemple). Par une action Bonus, vous ou un allié pouvez plonger la main dans le chaudron pour en retirer une potion de ce type. La potion est contenue dans une fiole qui disparaît dès son ingestion. Le chaudron peut produire autant de ces potions que votre modificateur de caractéristique d'incantation (minimum d'une potion). Quand la dernière de ces potions est extraite du chaudron, celui-ci disparaît et le sort prend fin. Les potions tirées du chaudron disparaissent si personne ne les a consommées lorsque vous relancez ce sort.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "chaudron-bouillonnant-de-tasha", "html_body": "<p>Vous invoquez un chaudron à pieds griffus, rempli d'un liquide bouillonnant. Il apparaît au sol, en un espace inoccupé dans un rayon de 1,50 m de vous et y reste pour toute : durée. On ne peut pas déplacer le chaudron, qui disparaît lu sort, ainsi que le liquide bouillonnant qu'il contient. in a we&quot; LA LÉGENDAIRE SORCIÈRE TASHA SE SERT DE SON SORT CHAUDRON BOUILLONNANT DE TASHA POUR CONCOCTER\nUNE POTION MAGIQUE. Le liquide du chaudron reproduit les propriétés d'une potion courante ou peu courante de votre choix (potion de guérison, par exemple). Par une action Bonus, vous ou un allié pouvez plonger la main dans le chaudron pour en retirer une potion de ce type. La potion est contenue dans une fiole qui disparaît dès son ingestion. Le chaudron peut produire autant de ces potions que votre modificateur de caractéristique d'incantation (minimum d'une potion). Quand la dernière de ces potions est extraite du chaudron, celui-ci disparaît et le sort prend fin. Les potions tirées du chaudron disparaissent si personne ne les a consommées lorsque vous relancez ce sort.<\/p>\n"}, {"nom": "Chien de Garde de Mordenkainen", "ecole": "Invocation", "niveau": 4, "classes": ["Magicien"], "incantation": "action", "portee": "9 m", "composantes": "V, S, M (un sifflet en argent)", "duree": "8 heures", "pages_source": [256, 257], "description": "Vous invoquez un chien de garde fantomatique en un espace inoccupé que vous voyez à portée. Le molosse reste pour toute la durée (il disparaît toutefois si vous et lui vous retrouvez éloignés de plus de 90 m). En dehors de vous, personne ne voit le chien de garde, qui est à la fois intangible et invulnérable. Quand une créature de taille S ou supérieure s'approche dans un rayon de 9 m de lui sans prononcer au préalable le mot de passe que vous > molosse est doté de la Vision lucide avec Au début a doll vos tours, le molosse tente de mordre un ennemi situé dans un rayon de 1,50 m de lui. Cet ennemi doit réussir un jet de sauvegarde de Dextérité sous peine de subir 4d8 dégâts de force. À vos tours suivants, vous pouvez entreprendre l'action\nMagie pour déplacer le molosse d’un maximum de 9 m. LUTSESENISSES a —", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "chien-de-garde-de-mordenkainen", "html_body": "<p>Vous invoquez un chien de garde fantomatique en un espace inoccupé que vous voyez à portée. Le molosse reste pour toute la durée (il disparaît toutefois si vous et lui vous retrouvez éloignés de plus de 90 m). En dehors de vous, personne ne voit le chien de garde, qui est à la fois intangible et invulnérable. Quand une créature de taille S ou supérieure s'approche dans un rayon de 9 m de lui sans prononcer au préalable le mot de passe que vous &gt; molosse est doté de la Vision lucide avec Au début a doll vos tours, le molosse tente de mordre un ennemi situé dans un rayon de 1,50 m de lui. Cet ennemi doit réussir un jet de sauvegarde de Dextérité sous peine de subir 4d8 dégâts de force. À vos tours suivants, vous pouvez entreprendre l'action\nMagie pour déplacer le molosse d’un maximum de 9 m. LUTSESENISSES a —<\/p>\n"}, {"nom": "Clairvoyance", "ecole": "Divination", "niveau": 3, "classes": ["Barde", "Clerc", "Ensorceleur", "Magicien"], "incantation": "À vérifier", "portee": "1,5 km", "composantes": "V, S, M (un focaliseur d'une valeur minimale de 100 po : une corne ornée pour écouter, un œil de verre pour observer)", "duree": "Concentration, jusqu'à 10 minutes", "pages_source": [257], "description": "Vous créez un capteur Invisible à portée en un lieu que vous connaissez (pour l'avoir déjà visité ou vu) ou en un lieu que vous ne connaissez pas, mais que vous pouvez imaginer (derrière une porte, au coin d’un couloir ou dans un bosquet d'arbres). Ce capteur intangible et invulnérable reste en place pour toute la durée. À l'incantation du sort, choisissez entre écouter et observer. Vous pouvez alors recourir au sens retenu (ouïe ou vision) comme si vous vous trouviez dans l'espace du capteur. Par une action Bonus, vous pouvez passer de l’ouiïe à la vision, ou réciproquement. Une créature qui voit le capteur (parce qu’elle bénéficie de détection de l'invisibilité ou de la Vision lucide, par exemple) perçoit un globe lumineux de la taille de votre poing.", "illustration": null, "legende_illustration": null, "notes_verification": "champ_absent:incantation", "statut": "ocr_non_valide", "id": "clairvoyance", "html_body": "<p>Vous créez un capteur Invisible à portée en un lieu que vous connaissez (pour l'avoir déjà visité ou vu) ou en un lieu que vous ne connaissez pas, mais que vous pouvez imaginer (derrière une porte, au coin d’un couloir ou dans un bosquet d'arbres). Ce capteur intangible et invulnérable reste en place pour toute la durée. À l'incantation du sort, choisissez entre écouter et observer. Vous pouvez alors recourir au sens retenu (ouïe ou vision) comme si vous vous trouviez dans l'espace du capteur. Par une action Bonus, vous pouvez passer de l’ouiïe à la vision, ou réciproquement. Une créature qui voit le capteur (parce qu’elle bénéficie de détection de l'invisibilité ou de la Vision lucide, par exemple) perçoit un globe lumineux de la taille de votre poing.<\/p>\n"}, {"nom": "Clignotement", "ecole": "Transmutation", "niveau": 3, "classes": ["Ensorceleur", "Magicien"], "incantation": "action", "portee": "personnelle", "composantes": "V, S", "duree": "1 minute", "pages_source": [257], "description": "Lancez 1d6 à la fin de chacun de vos tours, pour toute la durée. Sur un résultat de 4 à 6, vous disparaissez de votre plan d'existence actuel pour réapparaître sur le Plan Éthéré (si vous êtes déjà sur ce dernier plan, le sort prend aussitôt fin). Tant que vous êtes sur le Plan Éthéré, vous percevez J d'où vous venez, mais tout est nuances de gris et n me porte que sur 18 m. Vous pouvez affecter éatures du Plan Éthéré (et elles peuvent vous que les créatures situées sur l’autre plan ne pas, sauf celles qui disposent d'une faculté mettant de percevoir ce qui se trouve sur r l’autre plan au début de votre tour sort prend fin alors que vous êtes S : V, S, M (un diamant d’une valeur minimale _de 1 000 po que le sort détruit et un récipient d’une valeur minimale de 2 000 po, assez grand pour contenir la créature à cloner) Durée : instantanée Vous touchez physiquement une créature ou au moins 15 cm3 de sa chair. Une réplique inerte se forme à l'intérieur d’un récipient utilisé pour l’incantation, sa croissance jusqu’à maturité demandant 120 jours. Vous décidez si le clone est une version plus jeune de la créature ou du même âge. Le clone reste inerte et immarcescible tant que le récipient n'est pas endommagé. Si, une fois le clone formé, la créature d'origine meurt, son âme (à condition qu’elle soit libre et consentante) est transférée dans le clone. Le clone est identique à l'original sur le plan physique et présente la même personnalité ; ses souvenirs sont les mêmes, ainsi que ses caractéristiques, mais il ne récupère rien de l'équipement de la créature clonée. La dépouille du cloné, si elle existe, devient inerte et ne pourra être ramenée à la vie, étant donné que l'âme de la créature est ailleurs.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "clignotement", "html_body": "<p>Lancez 1d6 à la fin de chacun de vos tours, pour toute la durée. Sur un résultat de 4 à 6, vous disparaissez de votre plan d'existence actuel pour réapparaître sur le Plan Éthéré (si vous êtes déjà sur ce dernier plan, le sort prend aussitôt fin). Tant que vous êtes sur le Plan Éthéré, vous percevez J d'où vous venez, mais tout est nuances de gris et n me porte que sur 18 m. Vous pouvez affecter éatures du Plan Éthéré (et elles peuvent vous que les créatures situées sur l’autre plan ne pas, sauf celles qui disposent d'une faculté mettant de percevoir ce qui se trouve sur r l’autre plan au début de votre tour sort prend fin alors que vous êtes S : V, S, M (un diamant d’une valeur minimale _de 1 000 po que le sort détruit et un récipient d’une valeur minimale de 2 000 po, assez grand pour contenir la créature à cloner) Durée : instantanée Vous touchez physiquement une créature ou au moins 15 cm3 de sa chair. Une réplique inerte se forme à l'intérieur d’un récipient utilisé pour l’incantation, sa croissance jusqu’à maturité demandant 120 jours. Vous décidez si le clone est une version plus jeune de la créature ou du même âge. Le clone reste inerte et immarcescible tant que le récipient n'est pas endommagé. Si, une fois le clone formé, la créature d'origine meurt, son âme (à condition qu’elle soit libre et consentante) est transférée dans le clone. Le clone est identique à l'original sur le plan physique et présente la même personnalité ; ses souvenirs sont les mêmes, ainsi que ses caractéristiques, mais il ne récupère rien de l'équipement de la créature clonée. La dépouille du cloné, si elle existe, devient inerte et ne pourra être ramenée à la vie, étant donné que l'âme de la créature est ailleurs.<\/p>\n"}, {"nom": "Coffre Secret de Léomund", "ecole": "Invocation", "niveau": 4, "classes": ["Magicien"], "incantation": "action", "portee": "contact", "composantes": "V, S, M (un coffre de 90 cm par 60 et 60, fait de matériaux rares d'une valeur minimale de 5 000 po, et sa réplique de taille TP faite des mêmes matériaux d’une valeur minimale de 50 po)", "duree": "jusqu'à dissipation", "pages_source": [257, 258], "description": "Vous cachez un coffre et son contenu sur le Plan Éthéré. Vous devez toucher le coffre et la réplique miniature qui sert de composante matérielle pour le sort. Le coffre peut renfermer un maximum de 0,3 m3 de matière non vivante (90 x 60 x 60 cm). Tant que le coffre reste sur le Plan Éthéré, vous pouvez entreprendre l’action Magie pour toucher la réplique et rappeler le coffre. Il réapparaît au sol, en un espace inoccupé dans un rayon de 1,50 m de vous. Vous pouvez le renvoyer sur le Plan Éthéré au prix de l’action Magie, en touchant simultanément le coffre et sa réplique. Au bout de 60 jours, 5 % de risque s'accumulent chaque jour que le sort prenne fin. Le sort prend aussi fin si vous le relancez ou si la réplique de taille TP est détruite. Si le d fin alors que le grand coffre se trouve sur le elui-ci reste sur ce plan en attendant d'être ee een Composantes : :V,S,M ten pilllés a soute) à Une colonne verticale de flammes radieuses surgit des hauteurs. Chaque créature prise dans un Cylindre d'un rayon de 3 m, haut de 12 m et centré sur un point à portée effectue un jet de sauvegarde de Dextérité. Elle subit 5d6 dégâts de feu et 5d6 dégâts radiants en cas d'échec, la moitié en cas de réussite.\nEmplacement de niveau supérieur. Les dégâts de feu et les dégâts radiants augmentent de 1d6 par niveau d'emplacement au-delà du 5°. F1 mari ES ge Lu", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "coffre-secret-de-leomund", "html_body": "<p>Vous cachez un coffre et son contenu sur le Plan Éthéré. Vous devez toucher le coffre et la réplique miniature qui sert de composante matérielle pour le sort. Le coffre peut renfermer un maximum de 0,3 m3 de matière non vivante (90 x 60 x 60 cm). Tant que le coffre reste sur le Plan Éthéré, vous pouvez entreprendre l’action Magie pour toucher la réplique et rappeler le coffre. Il réapparaît au sol, en un espace inoccupé dans un rayon de 1,50 m de vous. Vous pouvez le renvoyer sur le Plan Éthéré au prix de l’action Magie, en touchant simultanément le coffre et sa réplique. Au bout de 60 jours, 5 % de risque s'accumulent chaque jour que le sort prenne fin. Le sort prend aussi fin si vous le relancez ou si la réplique de taille TP est détruite. Si le d fin alors que le grand coffre se trouve sur le elui-ci reste sur ce plan en attendant d'être ee een Composantes : :V,S,M ten pilllés a soute) à Une colonne verticale de flammes radieuses surgit des hauteurs. Chaque créature prise dans un Cylindre d'un rayon de 3 m, haut de 12 m et centré sur un point à portée effectue un jet de sauvegarde de Dextérité. Elle subit 5d6 dégâts de feu et 5d6 dégâts radiants en cas d'échec, la moitié en cas de réussite.\nEmplacement de niveau supérieur. Les dégâts de feu et les dégâts radiants augmentent de 1d6 par niveau d'emplacement au-delà du 5°. F1 mari ES ge Lu<\/p>\n"}, {"nom": "Communication avec les Animaux", "ecole": "Divination", "niveau": 1, "classes": ["Barde", "Druide", "Occultiste", "Rôdeur"], "incantation": "action ou rituel", "portee": "personnelle", "composantes": "V, S", "duree": "10 minutes", "pages_source": [258], "description": "Pour toute la durée, vous avez la faculté de comprendre les Bêtes et de communiquer verbalement avec elles, et toutes les options de compétence de l'action Influence vous sont accessibles avec elles. La plupart des Bêtes ont peu à dire au-delà des sujets de survie et d'affection, mais toutes sont capables de vous informer sur les environs et les monstres locaux, notamment ce qu’elles ont perçu au cours de la dernière journée.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "communication-avec-les-animaux", "html_body": "<p>Pour toute la durée, vous avez la faculté de comprendre les Bêtes et de communiquer verbalement avec elles, et toutes les options de compétence de l'action Influence vous sont accessibles avec elles. La plupart des Bêtes ont peu à dire au-delà des sujets de survie et d'affection, mais toutes sont capables de vous informer sur les environs et les monstres locaux, notamment ce qu’elles ont perçu au cours de la dernière journée.<\/p>\n"}, {"nom": "Communication à Distance", "ecole": "Divination", "niveau": 3, "classes": ["Barde", "Clerc", "Magicien"], "incantation": "À vérifier", "portee": "illimitée", "composantes": "V, S, M (du fil de cuivre)", "duree": "instantanée", "pages_source": [258], "description": "Vous envoyez un bref message n'excédant pas 25 mots à une créature que vous avez rencontrée (ou qu'une personne qui l'a rencontrée vous a décrite). L'esprit de la cible perçoit le message, celle-ci vous identifie comme expéditeur si elle vous connaît et peut vous répondre aussitôt dans le même mode. Le sort permet aux cibles de comprendre le sens de votre message. La distance qui vous sépare du destinataire n'a pas d'importance et vous pouvez même atteindre d’autres plans d'existence, mais si la cible se trouve sur un plan différent, il y a 5 % de chance pour que le message n'aboutisse pas.\nSi la transmission ne s’est pas faite, vous le savez. À la réception du message, la créature peut vous empêcher de la recontacter par ce sort pour les 8 prochaines heures. Si vous tentez de lui envoyer un autre message dans cet UN DRUIDE HUMAIN RECOURT À COMMUNICATION AVEC LES ANIMAUX POUR CONVERSER AVEC SON MEILLEUR AMI URSIDÉ", "illustration": null, "legende_illustration": null, "notes_verification": "champ_absent:incantation", "statut": "ocr_non_valide", "id": "communication-a-distance", "html_body": "<p>Vous envoyez un bref message n'excédant pas 25 mots à une créature que vous avez rencontrée (ou qu'une personne qui l'a rencontrée vous a décrite). L'esprit de la cible perçoit le message, celle-ci vous identifie comme expéditeur si elle vous connaît et peut vous répondre aussitôt dans le même mode. Le sort permet aux cibles de comprendre le sens de votre message. La distance qui vous sépare du destinataire n'a pas d'importance et vous pouvez même atteindre d’autres plans d'existence, mais si la cible se trouve sur un plan différent, il y a 5 % de chance pour que le message n'aboutisse pas.\nSi la transmission ne s’est pas faite, vous le savez. À la réception du message, la créature peut vous empêcher de la recontacter par ce sort pour les 8 prochaines heures. Si vous tentez de lui envoyer un autre message dans cet UN DRUIDE HUMAIN RECOURT À COMMUNICATION AVEC LES ANIMAUX POUR CONVERSER AVEC SON MEILLEUR AMI URSIDÉ<\/p>\n"}, {"nom": "Communication avec les Morts", "ecole": "Nécromancie", "niveau": 3, "classes": ["Barde", "Clerc", "Magicien"], "incantation": "action", "portee": "3 m", "composantes": "V, S, M (de l’encens qui brûle)", "duree": "10 minutes", "pages_source": [258], "description": "Vous octroyez un semblant de vie à un cadavre que vous choisissez à portée, pour qu'il puisse répondre aux questions que vous lui posez. La dépouille doit disposer d'une bouche et le sort échoue si la créature décédée était un\nMort-vivant au moment de trépasser. Le sort échoue également si le cadavre a déjà été ciblé par ce sort au cours des 10 derniers jours. Jusqu'à la fin du sort, vous pouvez poser jusqu'à cinq questions à la dépouille. Elle ne sait rien de plus que de son vivant et parle toujours les mêmes langues. Ses réponses ont tendance à se montrer brèves, sibyllines ou répétitives, d'autant que le cadavre n’est nullement contraint de vous répondre avec sincérité si vous lui êtes antipathique ou s’il vous voit comme un ennemi. Ce sort ne ramène pas l’âme de la créature dans son corps ; il ne fait qu’animer son esprit. Ainsi, le cadavre ne peut rien apprendre de nouveau ni comprendre ce qui a pu se passer depuis son décès, et ne peut pas davantage conjecturer sur l'avenir.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "communication-avec-les-morts", "html_body": "<p>Vous octroyez un semblant de vie à un cadavre que vous choisissez à portée, pour qu'il puisse répondre aux questions que vous lui posez. La dépouille doit disposer d'une bouche et le sort échoue si la créature décédée était un\nMort-vivant au moment de trépasser. Le sort échoue également si le cadavre a déjà été ciblé par ce sort au cours des 10 derniers jours. Jusqu'à la fin du sort, vous pouvez poser jusqu'à cinq questions à la dépouille. Elle ne sait rien de plus que de son vivant et parle toujours les mêmes langues. Ses réponses ont tendance à se montrer brèves, sibyllines ou répétitives, d'autant que le cadavre n’est nullement contraint de vous répondre avec sincérité si vous lui êtes antipathique ou s’il vous voit comme un ennemi. Ce sort ne ramène pas l’âme de la créature dans son corps ; il ne fait qu’animer son esprit. Ainsi, le cadavre ne peut rien apprendre de nouveau ni comprendre ce qui a pu se passer depuis son décès, et ne peut pas davantage conjecturer sur l'avenir.<\/p>\n"}, {"nom": "Communication avec les Plantes", "ecole": "Transmutation", "niveau": 3, "classes": ["Barde", "Druide", "Rôdeur"], "incantation": "action", "portee": "personnelle", "composantes": "V, S", "duree": "10 minutes", "pages_source": [258, 259], "description": "Lac > permet pas aux plantes de se déraciner pour mais elles peuvent agiter leurs branches, leurs vous pouvez communiquer avec elle comme si vous parliez une langue commune. ”", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "communication-avec-les-plantes", "html_body": "<p>Lac &gt; permet pas aux plantes de se déraciner pour mais elles peuvent agiter leurs branches, leurs vous pouvez communiquer avec elle comme si vous parliez une langue commune. ”<\/p>\n"}, {"nom": "Communion", "ecole": "Divination", "niveau": 5, "classes": ["Clerc"], "incantation": "1 minute ou rituel", "portee": "personnelle", "composantes": "V, S, M (encens)", "duree": "1 minute", "pages_source": [259], "description": "Vous contactez une divinité ou un intermédiaire divin pour lui poser trois questions auxquelles on peut répondre par l'affirmative ou la négative. Vous devez poser vos questions avant la fin du sort. Vous recevez une réponse juste à chaque question. Les êtres divins ne sont pas forcément omniscients, si bien que vous pouvez recevoir « incertain » comme réponse (au lieu de « oui » ou « non ») si la question fait appel à des éléments qui s'écartent du domaine de connaissance de la déité. Si une réponse en un mot peut s'avérer trompeuse ou contraire aux intérêts de la divinité, le MD peut se fendre d’une courte phrase en guise de réponse. Si vous lancez le sort plus d'une fois avant de terminer votre prochain Repos long, vous courez dès la deuxième incantation 25 % de risques cumulatifs qu’il ne vous livre aucune réponse.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "communion", "html_body": "<p>Vous contactez une divinité ou un intermédiaire divin pour lui poser trois questions auxquelles on peut répondre par l'affirmative ou la négative. Vous devez poser vos questions avant la fin du sort. Vous recevez une réponse juste à chaque question. Les êtres divins ne sont pas forcément omniscients, si bien que vous pouvez recevoir « incertain » comme réponse (au lieu de « oui » ou « non ») si la question fait appel à des éléments qui s'écartent du domaine de connaissance de la déité. Si une réponse en un mot peut s'avérer trompeuse ou contraire aux intérêts de la divinité, le MD peut se fendre d’une courte phrase en guise de réponse. Si vous lancez le sort plus d'une fois avant de terminer votre prochain Repos long, vous courez dès la deuxième incantation 25 % de risques cumulatifs qu’il ne vous livre aucune réponse.<\/p>\n"}, {"nom": "Communion avec la Nature", "ecole": "Divination", "niveau": 5, "classes": ["Druide", "Rôdeur"], "incantation": "1 minute ou rituel", "portee": "personnelle", "composantes": "V, S", "duree": "instantanée", "pages_source": [259], "description": "Vous communiez avec des esprits de la nature en quête d'informations sur les environs. En extérieur, le sort vous puit ke suivants ; vous prenez : ces éléments, en relation avec la zone n des D uit implantées des portails vers d'autres plans d'existence ion d'une créature dont le facteur de puissance est é moins 10 (choisie par le MD) et le type est Céleste, | Élémentaire, Fée, Fiélon ou Mort-vivant.\n+ Type de plante, minéral ou Bête le plus courant (choisissez sur quel aspect vous informer)\n+ Localisation des plans et cours d'eau Ainsi, vous pouvez déterminer où se trouve un puissant monstre de la zone, les plans et cours d'eau, et les bourgs des environs. CODES", "illustration": null, "legende_illustration": null, "notes_verification": "symboles_suspects", "statut": "ocr_non_valide", "id": "communion-avec-la-nature", "html_body": "<p>Vous communiez avec des esprits de la nature en quête d'informations sur les environs. En extérieur, le sort vous puit ke suivants ; vous prenez : ces éléments, en relation avec la zone n des D uit implantées des portails vers d'autres plans d'existence ion d'une créature dont le facteur de puissance est é moins 10 (choisie par le MD) et le type est Céleste, | Élémentaire, Fée, Fiélon ou Mort-vivant.<\/p>\n<ul>\n<li>Type de plante, minéral ou Bête le plus courant (choisissez sur quel aspect vous informer)<\/li>\n<li>Localisation des plans et cours d'eau Ainsi, vous pouvez déterminer où se trouve un puissant monstre de la zone, les plans et cours d'eau, et les bourgs des environs. CODES<\/li>\n<\/ul>\n"}, {"nom": "Compréhension des Langues", "ecole": "Divination", "niveau": 1, "classes": ["Barde", "Ensorceleur", "Magicien", "Occultiste"], "incantation": "action ou rituel", "portee": "personnelle", "composantes": "V, S, M (une pincée de suie et de sel)", "duree": "1 heure", "pages_source": [259], "description": "Pour toute la durée, vous comprenez le sens littéral de toute langue parlée que vous entendez. Vous comprenez également tout écrit que vous voyez, à condition de toucher la surface sur laquelle il est rédigé. Il vous faut environ 1 minute pour lire une page de texte. Ce sort ne décrypte pas les symboles ni les messages secrets. pe an", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "comprehension-des-langues", "html_body": "<p>Pour toute la durée, vous comprenez le sens littéral de toute langue parlée que vous entendez. Vous comprenez également tout écrit que vous voyez, à condition de toucher la surface sur laquelle il est rédigé. Il vous faut environ 1 minute pour lire une page de texte. Ce sort ne décrypte pas les symboles ni les messages secrets. pe an<\/p>\n"}, {"nom": "Compulsion", "ecole": "Enchantement", "niveau": 4, "classes": ["Barde"], "incantation": "action", "portee": "9 m", "composantes": "V, S", "duree": "Concentration, jusqu'à 1] minute", "pages_source": [259], "description": "Chaque créature de votre choix parmi celles que vous voyez à portée doit réussir un jet de sauvegarde de Sagesse sous peine de subir l'état Charmé jusqu’à la fin du sort. Pour toute la durée, vous pouvez par une action Bonus désigner une direction qui vous est horizontale. Chaque cible Charmée doit, à son tour suivant, consacrer autant de son déplacement que possible à se déplacer dans cette direction, selon le chemin le plus sûr. Une fois ce déplacement terminé, cible réitère le JS et met un terme au sort sur elle-même", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "compulsion", "html_body": "<p>Chaque créature de votre choix parmi celles que vous voyez à portée doit réussir un jet de sauvegarde de Sagesse sous peine de subir l'état Charmé jusqu’à la fin du sort. Pour toute la durée, vous pouvez par une action Bonus désigner une direction qui vous est horizontale. Chaque cible Charmée doit, à son tour suivant, consacrer autant de son déplacement que possible à se déplacer dans cette direction, selon le chemin le plus sûr. Une fois ce déplacement terminé, cible réitère le JS et met un terme au sort sur elle-même<\/p>\n"}, {"nom": "Cône de Froid", "ecole": "Évocation", "niveau": 5, "classes": ["Druide", "Ensorceleur", "Magicien"], "incantation": "action", "portee": "personnelle", "composantes": "V, S, M (petit cône de verre ou de cristal)", "duree": "instantanée", "pages_source": [260], "description": "Vous libérez une gerbe d'air glacial. Chaque créature prise dans un Cône de 18 m émanant de vous effectue un jet de sauvegarde de Constitution et subit 8d8 dégâts de froid en cas d'échec, la moitié en cas de réussite. Une créature tuée par ce sort se transforme en statue givrée, jusqu’à ce qu'elle dégèle.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d8 par niveau d'emplacement au-delà du 5°.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "cone-de-froid", "html_body": "<p>Vous libérez une gerbe d'air glacial. Chaque créature prise dans un Cône de 18 m émanant de vous effectue un jet de sauvegarde de Constitution et subit 8d8 dégâts de froid en cas d'échec, la moitié en cas de réussite. Une créature tuée par ce sort se transforme en statue givrée, jusqu’à ce qu'elle dégèle.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d8 par niveau d'emplacement au-delà du 5°.<\/p>\n"}, {"nom": "Confusion", "ecole": "Enchantement", "niveau": 4, "classes": ["Barde", "Druide", "Ensorceleur", "Magicien"], "incantation": "action", "portee": "27 m", "composantes": "V, S, M (trois coquilles de noix)", "duree": "Concentration, jusqu'à | minute", "pages_source": [260], "description": "/ { 4 Le GLACIAL MAGICIEN OTILUKE FRAPPE\nDES MONSTRES D'UN CÔNE DE FROID. Chaque créature prise dans une Sphère de 3 m de rayon centrée sur un point que vous choisissez à portée doit réussir un jet de sauvegarde de Sagesse, sous peine de ne pas pouvoir jouer de Réaction ni entreprendre d'action Bonus et de devoir jeter 1d10 au début de chacun de ses tours pour savoir comment elle se comporte à ce tour, selon la table ci-après. 1d10 Comportement du tour L La cible n’entreprend aucune action et consacre tout son déplacement à se déplacer. Lancez 1d4 pour la direction : 1, nord ; 2, est ; 3, sud ; 4, ouest. 2-6 La cible ne se déplace pas et n'entreprend aucune action. 7-8 La cible ne se déplace pas et entreprend l'action Attaque pour effectuer une attaque de corps à corps contre une créature aléatoire à portée d’allonge. Si aucune créature n'est à portée d’allonge, la cible n'entreprend aucune action. 9-10 La cible agit et se déplace à sa guise. La cible affectée réitère le JS à la fin de chacun de ses tours et met un terme au sort sur elle-même en cas de réussite.\nEmplacement de niveau supérieur. Le rayon de la Sphère augmente de 1,50 m par niveau d'emplacement au-delà du 4°.", "illustration": null, "legende_illustration": null, "notes_verification": "symboles_suspects", "statut": "ocr_non_valide", "id": "confusion", "html_body": "<p>/ { 4 Le GLACIAL MAGICIEN OTILUKE FRAPPE\nDES MONSTRES D'UN CÔNE DE FROID. Chaque créature prise dans une Sphère de 3 m de rayon centrée sur un point que vous choisissez à portée doit réussir un jet de sauvegarde de Sagesse, sous peine de ne pas pouvoir jouer de Réaction ni entreprendre d'action Bonus et de devoir jeter 1d10 au début de chacun de ses tours pour savoir comment elle se comporte à ce tour, selon la table ci-après. 1d10 Comportement du tour L La cible n’entreprend aucune action et consacre tout son déplacement à se déplacer. Lancez 1d4 pour la direction : 1, nord ; 2, est ; 3, sud ; 4, ouest. 2-6 La cible ne se déplace pas et n'entreprend aucune action. 7-8 La cible ne se déplace pas et entreprend l'action Attaque pour effectuer une attaque de corps à corps contre une créature aléatoire à portée d’allonge. Si aucune créature n'est à portée d’allonge, la cible n'entreprend aucune action. 9-10 La cible agit et se déplace à sa guise. La cible affectée réitère le JS à la fin de chacun de ses tours et met un terme au sort sur elle-même en cas de réussite.\nEmplacement de niveau supérieur. Le rayon de la Sphère augmente de 1,50 m par niveau d'emplacement au-delà du 4°.<\/p>\n"}, {"nom": "Contact Glacial", "ecole": "Nécromancie", "niveau": 0, "classes": ["Ensorceleur", "Magicien", "Occultiste"], "incantation": "action", "portee": "contact", "composantes": "V, S", "duree": "instantanée", "pages_source": [261], "description": "Vous canalisez l’étreinte d’outre-tombe et effectuez une attaque de sort au corps à corps contre une cible à portée d’allonge. Si l’attaque touche, la cible subit 1d10 dégâts nécrotiques et ne peut pas récupérer de points de vie jusqu’à la fin de votre tour suivant.\nAmélioration de sort mineur. Les dégâts augmentent de 1d10 lorsque vous atteignez les niveaux 5 (2d10), 11 (3d10) et 17 (4d10).", "illustration": null, "legende_illustration": null, "notes_verification": "encadre_statistiques_a_controler", "statut": "ocr_non_valide", "id": "contact-glacial", "html_body": "<p>Vous canalisez l’étreinte d’outre-tombe et effectuez une attaque de sort au corps à corps contre une cible à portée d’allonge. Si l’attaque touche, la cible subit 1d10 dégâts nécrotiques et ne peut pas récupérer de points de vie jusqu’à la fin de votre tour suivant.\nAmélioration de sort mineur. Les dégâts augmentent de 1d10 lorsque vous atteignez les niveaux 5 (2d10), 11 (3d10) et 17 (4d10).<\/p>\n"}, {"nom": "Contact avec les Plans", "ecole": "Divination", "niveau": 5, "classes": ["Magicien", "Occultiste"], "incantation": "1 minute ou rituel", "portee": "personnelle", "composantes": "V", "duree": "1 minute", "pages_source": [261], "description": "Vous contactez mentalement un demi-dieu, l'esprit d'un sage défunt ou quelque autre entité érudite d'un autre plan. Le contact avec une telle conscience extraplanaire peut vous anéantir l'esprit. À l'incantation du sort, effectuez un jet de sauvegarde d’Intelligence DD 15. En cas de sauvegarde réussie, vous pouvez poser jusqu'à cinq questions à l'entité.\nVous devez les poser avant la fin du sort. Le MD répond à chaque question par un seul mot, comme « oui », « non », « peut-être », « jamais », « hors-sujet » ou « incertain » (si l'entité ne connaît pas la réponse). Si une réponse en un mot risque de s'avérer trompeuse, le MD peut se fendre d'une courte phrase. En cas d'échec, vous subissez 6d6 dégâts psychiques, ainsi que l’état Neutralisé jusqu’à ce que vous terminiez un\nRepos long. Le sort restauration suprême lancé sur vous met un terme à cet effet.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "contact-avec-les-plans", "html_body": "<p>Vous contactez mentalement un demi-dieu, l'esprit d'un sage défunt ou quelque autre entité érudite d'un autre plan. Le contact avec une telle conscience extraplanaire peut vous anéantir l'esprit. À l'incantation du sort, effectuez un jet de sauvegarde d’Intelligence DD 15. En cas de sauvegarde réussie, vous pouvez poser jusqu'à cinq questions à l'entité.\nVous devez les poser avant la fin du sort. Le MD répond à chaque question par un seul mot, comme « oui », « non », « peut-être », « jamais », « hors-sujet » ou « incertain » (si l'entité ne connaît pas la réponse). Si une réponse en un mot risque de s'avérer trompeuse, le MD peut se fendre d'une courte phrase. En cas d'échec, vous subissez 6d6 dégâts psychiques, ainsi que l’état Neutralisé jusqu’à ce que vous terminiez un\nRepos long. Le sort restauration suprême lancé sur vous met un terme à cet effet.<\/p>\n"}, {"nom": "Contagion", "ecole": "Nécromancie", "niveau": 5, "classes": ["Clerc", "Druide"], "incantation": "action", "portee": "contact", "composantes": "V, S", "duree": "7 jours", "pages_source": [261], "description": "Votre contact transmet une maladie magique. La cible doit réussir un jet de sauvegarde de Constitution sous peine de subir 11d8 dégâts nécrotiques, ainsi que l'état Empoisonné.\nVous désignez également une caractéristique à l'incantation. Tant que la cible est Empoisonnée, elle subit le Désavantage aux jets de sauvegarde associés à la caractéristique retenue. La cible réitère le jet de sauvegarde à la fin de chacun de ses tours jusqu’à ce qu'elle ait obtenu trois réussites ou trois échecs. Si la cible réussit trois de ces JS, le sort prend fin sur elle. Si elle rate trois de ces JS, le sort persiste sur", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "contagion", "html_body": "<p>Votre contact transmet une maladie magique. La cible doit réussir un jet de sauvegarde de Constitution sous peine de subir 11d8 dégâts nécrotiques, ainsi que l'état Empoisonné.\nVous désignez également une caractéristique à l'incantation. Tant que la cible est Empoisonnée, elle subit le Désavantage aux jets de sauvegarde associés à la caractéristique retenue. La cible réitère le jet de sauvegarde à la fin de chacun de ses tours jusqu’à ce qu'elle ait obtenu trois réussites ou trois échecs. Si la cible réussit trois de ces JS, le sort prend fin sur elle. Si elle rate trois de ces JS, le sort persiste sur<\/p>\n"}, {"nom": "Contamination", "ecole": "Nécromancie", "niveau": 6, "classes": ["Clerc"], "incantation": "action", "portee": "18 m", "composantes": "V, S", "duree": "instantanée", "pages_source": [261], "description": "Vous libérez une magie virulente sur une créature que vous voyez à portée. La cible effectue un jet de sauvegarde de Constitution. En cas d’échec, elle subit 14d6 dégâts nécrotiques et son maximum de points de vie est réduit d’autant que les dégâts nécrotiques subis. En cas de réussite, elle subit uniquement la moitié de ces dégâts. Ce sort ne peut réduire son maximum de points de vie en dessous de 1.", "illustration": null, "legende_illustration": null, "notes_verification": "encadre_statistiques_a_controler", "statut": "ocr_non_valide", "id": "contamination", "html_body": "<p>Vous libérez une magie virulente sur une créature que vous voyez à portée. La cible effectue un jet de sauvegarde de Constitution. En cas d’échec, elle subit 14d6 dégâts nécrotiques et son maximum de points de vie est réduit d’autant que les dégâts nécrotiques subis. En cas de réussite, elle subit uniquement la moitié de ces dégâts. Ce sort ne peut réduire son maximum de points de vie en dessous de 1.<\/p>\n"}, {"nom": "Contresort", "ecole": "Abjuration", "niveau": 3, "classes": ["Ensorceleur", "Magicien", "Occultiste"], "incantation": "Réaction, que vous jouez en voyant dans un rayon de 18 m une créature lancer un sort avec une composante verbale, somatique ou matérielle", "portee": "18 m", "composantes": "S", "duree": "instantanée", "pages_source": [261], "description": "Vous tentez d'interrompre une créature en pleine incantation. La créature effectue un jet de sauvegarde de Constitution. En cas d'échec, son sort se dissipe sans effet et l’action, l'action Bonus ou la Réaction entreprise pour l'incantation est gaspillée. Si ce sort était lancé par un emplacement, celui-ci n'est pas dépensé. RE", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "contresort", "html_body": "<p>Vous tentez d'interrompre une créature en pleine incantation. La créature effectue un jet de sauvegarde de Constitution. En cas d'échec, son sort se dissipe sans effet et l’action, l'action Bonus ou la Réaction entreprise pour l'incantation est gaspillée. Si ce sort était lancé par un emplacement, celui-ci n'est pas dépensé. RE<\/p>\n"}, {"nom": "Contrôle du Climat", "ecole": "Transmutation", "niveau": 8, "classes": ["Clerc", "Druide", "Magicien"], "incantation": "10 minutes", "portee": "personnelle", "composantes": "V, S, M (de l'encens qui brûle)", "duree": "Concentration, jusqu’à 8 heures", "pages_source": [261, 262], "description": "Vous prenez le contrôle du climat dans un rayon de 7,5 km pour toute la durée. Vous devez vous trouver en extérieur pour lancer ce sort, qui prend fin prématurément dès que vous êtes à l’intérieur. À l'incantation du sort, vous altérez les conditions climatiques du moment, déterminées par le MD. Vous pouvez modifier les précipitations, la température et le vent. Les nouvelles conditions mettent 1d4 x 10 minutes à prendre effet. Après ce laps de temps, vous pouvez à nouveau altérer [les conditions. Quand le sort pu fin, le temps revient\n\nPRÉCIPITATIONS Stade Conditions L Ciel dégagé 2 Quelques nuages 3 Ciel chargé ou brume au sol 4 Pluie, grêle ou neige 5 Pluie torrentielle, grêle battante ou blizzard TEMPÉRATURE VENT Stade Conditions Stade Conditions 1 Caniculaire 1 Calme 2 Chaud 2 Vent modéré 3 Doux 3 Vent fort 4 Frais 4 Vent violent 5 Froid 5 Tempête 6 Glacial", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "controle-du-climat", "html_body": "<p>Vous prenez le contrôle du climat dans un rayon de 7,5 km pour toute la durée. Vous devez vous trouver en extérieur pour lancer ce sort, qui prend fin prématurément dès que vous êtes à l’intérieur. À l'incantation du sort, vous altérez les conditions climatiques du moment, déterminées par le MD. Vous pouvez modifier les précipitations, la température et le vent. Les nouvelles conditions mettent 1d4 x 10 minutes à prendre effet. Après ce laps de temps, vous pouvez à nouveau altérer [les conditions. Quand le sort pu fin, le temps revient<\/p>\n<p>PRÉCIPITATIONS Stade Conditions L Ciel dégagé 2 Quelques nuages 3 Ciel chargé ou brume au sol 4 Pluie, grêle ou neige 5 Pluie torrentielle, grêle battante ou blizzard TEMPÉRATURE VENT Stade Conditions Stade Conditions 1 Caniculaire 1 Calme 2 Chaud 2 Vent modéré 3 Doux 3 Vent fort 4 Frais 4 Vent violent 5 Froid 5 Tempête 6 Glacial<\/p>\n"}, {"nom": "Contrôle de L'Eau", "ecole": "Transmutation", "niveau": 4, "classes": ["Clerc", "Druide", "Magicien"], "incantation": "action", "portee": "90 m", "composantes": "V, S, M (un mélange d'eau et de poussière)", "duree": "Concentration, jusqu'à 10 minutes", "pages_source": [262, 263], "description": "» UN DRAGON D'AIRAIN LANCE CONTRÔLE DU CLIMAT POUR PRÉSERVER UN VILLAGE D’UNE TEMPÊTE\nDÉVASTATRICE. Jusqu'à la fin du sort, vous contrôlez tout volume d'eau compris dans la zone que vous désignez, un Cube dont l'arête ne dépasse pas 30 m, en y appliquant l’un des effets suivants. Au prix de l’action Magie à vos tours suivants, vous pouvez répéter le même effet ou en choisir un autre.\nContrôle du courant. Vous réorientez le cours des eaux de la zone à votre guise, même si les flots doivent surmonter des obstacles, grimper aux murs ou couler dans une direction insolite. Les eaux s'écoulent selon vos instructions, mais une fois qu’elles quittent la zone, la nature reprend ses droits et le courant s'adapte au terrain. Les eaux continuent à couler dans la direction de votre choix jusqu’à la fin du sort ou jusqu’à ce que vous optiez pour un autre effet.\nCrue. Vous faites monter le niveau de toutes les eaux dormantes de la zone d’un maximum de 6 m. Si vous choisissez une zone comprise dans un grand plan d'eau, vous engendrez en fait une vague haute de 6 m qui part d’un côté de la zone et déferle vers l’autre avant de s'écraser. Tous les véhicules de taille TG ou inférieure pris sur son passage sont emportés de l’autre côté. Tous les véhicules de taille TG ou inférieure frappés par la vague ont 25 % de risque de chavirer. Le niveau de l'eau reste haut jusqu’à la fin du sort ou jusqu'à ce que vous optiez pour un autre effet. Si cet effet a produit une vague, celle-ci se répète au début de votre tour suivant tant que persiste l'effet de crue.\nSéparation des eaux. Vous scindez les eaux de la zone pour créer une tranchée. Cette fosse s'étend sur toute la zone du sort, les eaux séparées formant une paroi verticale de chaque côté. La tranchée reste en place jusqu’à la fin du sort ou jusqu'à ce que vous optiez pour un autre ESPRIT ABERRANT (TYRANNŒILLIDÉ ) effet. Les eaux la remplissent ensuite progressivement en lespace d'un round, jusqu'à retrouver leur niveau initial.\nTourbillon. Vous engendrez la création d'un tourbillon au centre de la zone, d'une surface minimale de 15 m de côté et d’une profondeur d'au moins 7,50 m. Le tourbillon persiste jusqu'à ce que vous optiez pour un autre effet ou que le sort prenne fin. Les remous sont larges de 1,50 m à leur base pour atteindre jusqu’à 15 m au sommet, pour une hauteur de 7,50 m. Toute créature immergée dans l'eau et située dans un rayon de 7,50 m du tourbillon est tirée de 3 m vers les remous. Lorsqu'une créature entre dans les remous pour la première fois d'un tour ou y termine son tour, elle effectue un jet de sauvegarde de Force. En cas d'échec, elle subit 2d8 dégâts contondants. En cas de réussite, la créature subit la moitié de ces dégâts. Une créature peut s'éloigner du tourbillon à la nage à condition de consacrer au préalable une action à s'en extraire et de réussir un test de Force (Athlétisme) assorti de votre DD de sauvegarde des sorts.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "controle-de-l-eau", "html_body": "<p>» UN DRAGON D'AIRAIN LANCE CONTRÔLE DU CLIMAT POUR PRÉSERVER UN VILLAGE D’UNE TEMPÊTE\nDÉVASTATRICE. Jusqu'à la fin du sort, vous contrôlez tout volume d'eau compris dans la zone que vous désignez, un Cube dont l'arête ne dépasse pas 30 m, en y appliquant l’un des effets suivants. Au prix de l’action Magie à vos tours suivants, vous pouvez répéter le même effet ou en choisir un autre.\nContrôle du courant. Vous réorientez le cours des eaux de la zone à votre guise, même si les flots doivent surmonter des obstacles, grimper aux murs ou couler dans une direction insolite. Les eaux s'écoulent selon vos instructions, mais une fois qu’elles quittent la zone, la nature reprend ses droits et le courant s'adapte au terrain. Les eaux continuent à couler dans la direction de votre choix jusqu’à la fin du sort ou jusqu’à ce que vous optiez pour un autre effet.\nCrue. Vous faites monter le niveau de toutes les eaux dormantes de la zone d’un maximum de 6 m. Si vous choisissez une zone comprise dans un grand plan d'eau, vous engendrez en fait une vague haute de 6 m qui part d’un côté de la zone et déferle vers l’autre avant de s'écraser. Tous les véhicules de taille TG ou inférieure pris sur son passage sont emportés de l’autre côté. Tous les véhicules de taille TG ou inférieure frappés par la vague ont 25 % de risque de chavirer. Le niveau de l'eau reste haut jusqu’à la fin du sort ou jusqu'à ce que vous optiez pour un autre effet. Si cet effet a produit une vague, celle-ci se répète au début de votre tour suivant tant que persiste l'effet de crue.\nSéparation des eaux. Vous scindez les eaux de la zone pour créer une tranchée. Cette fosse s'étend sur toute la zone du sort, les eaux séparées formant une paroi verticale de chaque côté. La tranchée reste en place jusqu’à la fin du sort ou jusqu'à ce que vous optiez pour un autre ESPRIT ABERRANT (TYRANNŒILLIDÉ ) effet. Les eaux la remplissent ensuite progressivement en lespace d'un round, jusqu'à retrouver leur niveau initial.\nTourbillon. Vous engendrez la création d'un tourbillon au centre de la zone, d'une surface minimale de 15 m de côté et d’une profondeur d'au moins 7,50 m. Le tourbillon persiste jusqu'à ce que vous optiez pour un autre effet ou que le sort prenne fin. Les remous sont larges de 1,50 m à leur base pour atteindre jusqu’à 15 m au sommet, pour une hauteur de 7,50 m. Toute créature immergée dans l'eau et située dans un rayon de 7,50 m du tourbillon est tirée de 3 m vers les remous. Lorsqu'une créature entre dans les remous pour la première fois d'un tour ou y termine son tour, elle effectue un jet de sauvegarde de Force. En cas d'échec, elle subit 2d8 dégâts contondants. En cas de réussite, la créature subit la moitié de ces dégâts. Une créature peut s'éloigner du tourbillon à la nage à condition de consacrer au préalable une action à s'en extraire et de réussir un test de Force (Athlétisme) assorti de votre DD de sauvegarde des sorts.<\/p>\n"}, {"nom": "Convocation D'Aberration", "ecole": "Invocation", "niveau": 4, "classes": ["Magicien", "Occultiste"], "incantation": "À vérifier", "portee": "27 m", "composantes": "V, S, M (un tentacule mariné et un globe oculaire dans un flacon incrusté de platine d'une valeur minimale de 400 po)", "duree": "Concentration, jusqu'à 1 heure", "pages_source": [263, 264], "description": "Vous invoquez un esprit aberrant. Il se manifeste en un espace inoccupé que vous voyez à portée en reprenant le profil de l'esprit aberrant. À l'incantation du sort, choisissez entre flagelleur mental, slaad et tyrannæillidé. La créature ressemble 2 l'Aberration en question, ce qui détermine certains détails de son profil. La créature disparaît quand le sort prend fin, mais également si elle tombe à O point de vie. per niveau du sort au-delà du 4° m ; vol 9 m (vol stationnaire) (tyrannæillidé MOD JS MOD JS MOD JS | | | For 16 Dex 10 +0 +0 Con15 +2 +2 Mur 16 HSM Sac 10 40 40 CHa6 -2 -2 Immunités psychiques Sens Vision dans le noir 18 m, Perception passive 10 Langues profond, comprend les langues que vous connaissez FP aucun (PX 0 ; BM égal à votre bonus de maîtrise) TRAITS\nAura de murmures (flagelleur mental uniquement). Au début de chacun des tours de l'esprit, celui-ci émet des énergies psioniques s’il ne subit pas l’état Neutralisé. JS Sagesse : votre DD de sauvegarde des sorts, chaque créature (autre que vous) dans un rayon de 1,50 m de l'esprit. Échec : 2d6 dégâts psychiques.\nRégénération (slaad uniquement). L'esprit récupère 5 points de vie au début de son tour s’il lui reste au moins 1 point de vie. ACTIONS\nAttaques multiples. L'esprit effectue autant d'attaques que la moitié du niveau de ce sort (arrondir à l'inférieur).\nChoc psychique (flagelleur mental uniquement). Corps à corps : bonus égal à votre modificateur d'attaque des sorts, allonge 1,50 m. Touché : 1d8 + 3 + niveau du sort dégâts psychiques.\nGriffe (slaad uniquement). Corps à corps : bonus égal à votre modificateur d'attaque des sorts, allonge 1,50 m. | Touché : 1d10 + 3 + niveau du sort dégâts tranchants, et la cible ne peut pas récupérer de points de vie jusqu'au début du tour suivant de l'esprit. | |\nRayon oculaire (tyrannæillidé uniquement). À distance : bonus égal à votre modificateur d'attaque des sorts, portée 45 m. Touché : 1d8 + 3 + niveau du sort dégâts psychiques.\nLa créature constitue un allié pour vous et vos alliés. Au combat, elle partage votre rang d'’Initiative, mais elle joue son tour juste après vous. Elle obéit à vos instructions verbales (pas d'action requise de votre part). Sans ordre de votre part, elle entreprend l'action Esquive et consacre m D nn Louve ESPRIT ARTIFICIEL (PIERRE) ESPRIT ARTIFICIEL Artificiel de taille M, Neutre CA 13 + niveau du sort Pv 40 + 15 par niveau du sort au-delà du 4° Vitesse 9 m For 18 +4 +4 DEx 10 +0 +0 Con18 +4-+4 INT 14 +2 +42 Sac 11 +0\" 470! CHAS es Résistances poison Immunités Charmé, Effrayé, Empoisonné, Épuisement, Paralysé Sens Vision dans le noir 18 m, Perception passive 10 Langues comprend les langues que vous connaissez FP aucun (PX 0 ; BM égal à votre bonus de maîtrise) TRAITS_\nCorps brûlant (métal uniquement). Une créature qui touche l'esprit avec une attaque de corps à corps ou commence son tour en situation de lutte avec l'esprit subit 1d10 dégâts de feu.\nLéthargie de la pierre (pierre uniquement). Lorsqu'une créature commence son tour dans un rayon de 3 m de l'esprit, celui-ci peut s’il la voit la cibler de ses énergies magiques. JS Sagesse : votre DD de sauvegarde des sorts, la cible. Échec : jusqu'au début de son tour suivant, la cible ne peut pas effectuer d'attaque d'Opportunité et sa Vitesse est réduite de moitié. ACTIONS\nAttaques multiples. L'esprit effectue autant d'attaques que la moitié du niveau de ce sort (arrondir à l'inférieur).\nCoup. Corps à corps : bonus égal à votre modificateur d'attaque des sorts, allonge 1,50 m. Touché : 1d8 + 4 + niveau du sort dégâts contondants. RÉACTIONS | Riposte rageuse (argile uniquement). Déclencheur : l'esprit | subit des dégâts infligés par une créature. Réponse : | l'esprit effectue une attaque de Coup contre cette créature | s’il le peut, sans quoi il se déplace à concurrence de la | moitié de sa Vitesse vers cette créature sans provoquer | d'attaques d'Opportunité.", "illustration": null, "legende_illustration": null, "notes_verification": "champ_absent:incantation; encadre_statistiques_a_controler; symboles_suspects; profil_de_creature_completude_a_controler", "statut": "ocr_non_valide", "id": "convocation-d-aberration", "html_body": "<p>Vous invoquez un esprit aberrant. Il se manifeste en un espace inoccupé que vous voyez à portée en reprenant le profil de l'esprit aberrant. À l'incantation du sort, choisissez entre flagelleur mental, slaad et tyrannæillidé. La créature ressemble 2 l'Aberration en question, ce qui détermine certains détails de son profil. La créature disparaît quand le sort prend fin, mais également si elle tombe à O point de vie. per niveau du sort au-delà du 4° m ; vol 9 m (vol stationnaire) (tyrannæillidé MOD JS MOD JS MOD JS | | | For 16 Dex 10 +0 +0 Con15 +2 +2 Mur 16 HSM Sac 10 40 40 CHa6 -2 -2 Immunités psychiques Sens Vision dans le noir 18 m, Perception passive 10 Langues profond, comprend les langues que vous connaissez FP aucun (PX 0 ; BM égal à votre bonus de maîtrise) TRAITS\nAura de murmures (flagelleur mental uniquement). Au début de chacun des tours de l'esprit, celui-ci émet des énergies psioniques s’il ne subit pas l’état Neutralisé. JS Sagesse : votre DD de sauvegarde des sorts, chaque créature (autre que vous) dans un rayon de 1,50 m de l'esprit. Échec : 2d6 dégâts psychiques.\nRégénération (slaad uniquement). L'esprit récupère 5 points de vie au début de son tour s’il lui reste au moins 1 point de vie. ACTIONS\nAttaques multiples. L'esprit effectue autant d'attaques que la moitié du niveau de ce sort (arrondir à l'inférieur).\nChoc psychique (flagelleur mental uniquement). Corps à corps : bonus égal à votre modificateur d'attaque des sorts, allonge 1,50 m. Touché : 1d8 + 3 + niveau du sort dégâts psychiques.\nGriffe (slaad uniquement). Corps à corps : bonus égal à votre modificateur d'a , {"nom": "Convocations Instantanées de Drawmij", "ecole": "Invocation", "niveau": 6, "classes": ["Magicien"], "incantation": "1 minute ou rituel", "portee": "contact", "composantes": "V, S, M (un saphir d'une valeur minimale de 1 000 po)", "duree": "jusqu’à dissipation", "pages_source": [270], "description": "Vous touchez le saphir de l'incantation et un objet d'un poids maximal de 5 kg et dont la dimension la plus grande n'excède pas 1,80 m. Le sort laisse une marque Invisible sur l'objet et inscrit invisiblement le nom de l'objet sur le saphir. Chaque fois que vous lancez ce sort, vous devez utiliser un saphir différent. Par la suite, vous pouvez entreprendre l'action Magie pour prononcer le nom de l'objet et broyer le saphir. L'objet apparaît aussitôt dans votre main, quelle que soit la distance qui vous en sépare, même s'il est sur un autre plan, puis le sort prend fin. Si une autre créature tient ou porte l'objet, broyer le saphir ne le transporte pas, mais vous savez en revanche qui est la créature et où elle se trouve à l'instant même. _ ne", "illustration": null, "legende_illustration": null, "notes_verification": "profil_de_creature_completude_a_controler", "statut": "ocr_non_valide", "id": "convocations-instantanees-de-drawmij", "html_body": "<p>Vous touchez le saphir de l'incantation et un objet d'un poids maximal de 5 kg et dont la dimension la plus grande n'excède pas 1,80 m. Le sort laisse une marque Invisible sur l'objet et inscrit invisiblement le nom de l'objet sur le saphir. Chaque fois que vous lancez ce sort, vous devez utiliser un saphir différent. Par la suite, vous pouvez entreprendre l'action Magie pour prononcer le nom de l'objet et broyer le saphir. L'objet apparaît aussitôt dans votre main, quelle que soit la distance qui vous en sépare, même s'il est sur un autre plan, puis le sort prend fin. Si une autre créature tient ou porte l'objet, broyer le saphir ne le transporte pas, mais vous savez en revanche qui est la créature et où elle se trouve à l'instant même. _ ne<\/p>\n"}, {"nom": "Coquille Antivie", "ecole": "Abjuration", "niveau": 5, "classes": ["Druide"], "incantation": "action", "portee": "personnelle", "composantes": "V, S", "duree": "Concentration, jusqu'à 1 heure", "pages_source": [270], "description": "Une aura rayonne depuis vous pour toute la durée, sous forme d'une Émanation de 3 m. L'aura empêche les créatures autres que les Artificiels et les Morts-vivants de la franchir ou même d'y passer quelque partie de leur anatomie. Une créature affectée peut en revanche lancer des sorts ou effectuer des attaques à distance (ou avec des armes à allonge) à travers la barrière. Si votre déplacement oblige une créature affectée sit à traverser la barrière, le sort Fe prem SE La LA né is : Composantes : V, S, M (de la corde) Durée : 1 heure\nVous touchez une corde. Une extrémité de la corde se dresse dans les airs jusqu'à ce que toute la corde soit perpendiculaire au sol ou qu'elle atteigne un plafond. À son extrémité supérieure, un portail Invisible de 1,50 m sur 90 cm donne sur un espace extradimensionnel qui persiste jusqu'à la fin du sort. On peut accéder à cet espace en grimpant au sommet de la corde qu'on peut haler dans l'espace ou laisser choir de l'ouverture. L'espace peut accueillir un maximum de huit créatures de taille M ou inférieure. Les attaques, sorts et autres effets ne peuvent franchir l'entrée de l'espace extradimensionnel, dans un sens comme dans l'autre, mais ses occupants voient ce qui se passe à l'extérieur. Tout ce qui se trouve à l'intérieur de l'espace tombe quand le sort prend fin.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "coquille-antivie", "html_body": "<p>Une aura rayonne depuis vous pour toute la durée, sous forme d'une Émanation de 3 m. L'aura empêche les créatures autres que les Artificiels et les Morts-vivants de la franchir ou même d'y passer quelque partie de leur anatomie. Une créature affectée peut en revanche lancer des sorts ou effectuer des attaques à distance (ou avec des armes à allonge) à travers la barrière. Si votre déplacement oblige une créature affectée sit à traverser la barrière, le sort Fe prem SE La LA né is : Composantes : V, S, M (de la corde) Durée : 1 heure\nVous touchez une corde. Une extrémité de la corde se dresse dans les airs jusqu'à ce que toute la corde soit perpendiculaire au sol ou qu'elle atteigne un plafond. À son extrémité supérieure, un portail Invisible de 1,50 m sur 90 cm donne sur un espace extradimensionnel qui persiste jusqu'à la fin du sort. On peut accéder à cet espace en grimpant au sommet de la corde qu'on peut haler dans l'espace ou laisser choir de l'ouverture. L'espace peut accueillir un maximum de huit créatures de taille M ou inférieure. Les attaques, sorts et autres effets ne peuvent franchir l'entrée de l'espace extradimensionnel, dans un sens comme dans l'autre, mais ses occupants voient ce qui se passe à l'extérieur. Tout ce qui se trouve à l'intérieur de l'espace tombe quand le sort prend fin.<\/p>\n"}, {"nom": "Cordon de Flèches", "ecole": "Transmutation", "niveau": 2, "classes": ["Rôdeur"], "incantation": "action", "portee": "contact", "composantes": "V, S, M (une tresse décorative)", "duree": "8 heures", "pages_source": [270], "description": "Vous touchez quatre flèches ou carreaux non magiques et les plantez dans le sol dans votre espace. Jusqu'à la fin du sort, on ne peut extraire physiquement ces projectiles du sol et, chaque fois qu'une créature autre que vous pénètre dans un espace à 9 m ou moins de l'un de ces objets pour la première fois d'un tour ou qu'elle y termine son tour, l'objet en question jaillit vers elle pour la frapper. La créature doit réussir un jet de sauvegarde de Dextérité, sous peine de subir 2d4 dégâts perforants. Le projectile est alors détruit. Le sort prend fin quand plus aucun de ces projectiles n'est fiché dans le sol. Vous pouvez à l'incantation de ce sort désigner autant de créatures que vous le souhaitez, que le sort ignorera.\nEmplacement de niveau supérieur. Le nombre de projectiles qui peuvent être affectés augmente de deux par niveau d'emplacement au-delà du 2°. RL A", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "cordon-de-fleches", "html_body": "<p>Vous touchez quatre flèches ou carreaux non magiques et les plantez dans le sol dans votre espace. Jusqu'à la fin du sort, on ne peut extraire physiquement ces projectiles du sol et, chaque fois qu'une créature autre que vous pénètre dans un espace à 9 m ou moins de l'un de ces objets pour la première fois d'un tour ou qu'elle y termine son tour, l'objet en question jaillit vers elle pour la frapper. La créature doit réussir un jet de sauvegarde de Dextérité, sous peine de subir 2d4 dégâts perforants. Le projectile est alors détruit. Le sort prend fin quand plus aucun de ces projectiles n'est fiché dans le sol. Vous pouvez à l'incantation de ce sort désigner autant de créatures que vous le souhaitez, que le sort ignorera.\nEmplacement de niveau supérieur. Le nombre de projectiles qui peuvent être affectés augmente de deux par niveau d'emplacement au-delà du 2°. RL A<\/p>\n"}, {"nom": "Couleurs Dansantes", "ecole": "Illusion", "niveau": 1, "classes": ["Barde", "Ensorceleur", "Magicien"], "incantation": "À vérifier", "portee": "personnelle", "composantes": "V, S, M (une pincée de sable coloré)", "duree": "instantanée", "pages_source": [270, 271], "description": "Vous projetez une gerbe éblouissante de lumière colorée. Chaque créature prise dans un Cône de SAR émet: de vous doit réussir un jet de sau :S sous peine de subir l'état Avenglél tour suivant. Chapoumes : s,M (une arme dont vous avez la maîtrise, d'une valeur minimale de 1 pc) Durée : instantanée Une fulgurance magique vous guide pour effectuer une attaque avec l'arme utilisée pour l’incantation. Les jets d'attaque et de dégâts correspondants se basent sur votre caractéristique d'incantation, au lieu de la Force ou la\nDextérité. Si l'attaque inflige des dégâts, il peut s'agir de dégâts radiants ou des dégâts normaux de l'arme (à votre convenance).\nAmélioration de sort mineur. Que vous infligiez des dégâts radiants ou les dégâts normaux de l'arme, l'attaque inflige des dégâts radiants supplémentaires lorsque vous atteignez les niveaux 5 (1d6), 11 (2d6) et 17 (3d6).", "illustration": null, "legende_illustration": null, "notes_verification": "champ_absent:incantation", "statut": "ocr_non_valide", "id": "couleurs-dansantes", "html_body": "<p>Vous projetez une gerbe éblouissante de lumière colorée. Chaque créature prise dans un Cône de SAR émet: de vous doit réussir un jet de sau :S sous peine de subir l'état Avenglél tour suivant. Chapoumes : s,M (une arme dont vous avez la maîtrise, d'une valeur minimale de 1 pc) Durée : instantanée Une fulgurance magique vous guide pour effectuer une attaque avec l'arme utilisée pour l’incantation. Les jets d'attaque et de dégâts correspondants se basent sur votre caractéristique d'incantation, au lieu de la Force ou la\nDextérité. Si l'attaque inflige des dégâts, il peut s'agir de dégâts radiants ou des dégâts normaux de l'arme (à votre convenance).\nAmélioration de sort mineur. Que vous infligiez des dégâts radiants ou les dégâts normaux de l'arme, l'attaque inflige des dégâts radiants supplémentaires lorsque vous atteignez les niveaux 5 (1d6), 11 (2d6) et 17 (3d6).<\/p>\n"}, {"nom": "Coup de Tonnerre", "ecole": "Évocation", "niveau": 0, "classes": ["Barde", "Druide", "Ensorceleur", "Magicien", "Occultiste"], "incantation": "action", "portee": "personnelle", "composantes": "S", "duree": "instantanée", "pages_source": [271], "description": "Toute créature située dans une Émanation de 1,50 m dont vous êtes l'origine doit réussir un jet de sauvegarde de Constitution sous peine de subir 1d6 dégâts de tonnerre. Le bruit tonitruant du sort s'entend jusqu'à 30 m de son origine.\nAmélioration de sort mineur. Les dégâts augmentent de 1d6 lorsque vous atteignez les niveaux 5 (2d6), 11 (3d6) et 17 (4d6).", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "coup-de-tonnerre", "html_body": "<p>Toute créature située dans une Émanation de 1,50 m dont vous êtes l'origine doit réussir un jet de sauvegarde de Constitution sous peine de subir 1d6 dégâts de tonnerre. Le bruit tonitruant du sort s'entend jusqu'à 30 m de son origine.\nAmélioration de sort mineur. Les dégâts augmentent de 1d6 lorsque vous atteignez les niveaux 5 (2d6), 11 (3d6) et 17 (4d6).<\/p>\n"}, {"nom": "Couronne du Dément", "ecole": "Enchantement", "niveau": 2, "classes": ["Barde", "Ensorceleur", "Magicien", "Occultiste"], "incantation": "action", "portee": "36 m", "composantes": "V, S", "duree": "Concentration, jusqu'à 1 minute", "pages_source": [271], "description": "Une créature que vous voyez à portée doit réussir un jet de sauvegarde de Sagesse sous peine de subir l'état Charmé pour toute la durée. La cible réussit automatiquement ce\nJS si elle n’est pas Humanoïde. Une couronne spectrale apparaît sur le crâne de la cible Charmée, qui doit à chacun de ses tours consacrer son action à effectuer une attaque de corps à corps contre une créature que vous désignez mentalement, autre qu'elle-même, avant de se déplacer. Elle peut toutefois agir normalement si vous ne désignez aucune créature ou si aucune n'est à portée Dr Dre de chacun de ses tours ss 2 LES : ia COUTEAU DE GLACE À vos tours suivants, vous devez entreprendre l’action Magie pour garder le contrôle de la cible, sans quoi le sort prend fin. EE", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "couronne-du-dement", "html_body": "<p>Une créature que vous voyez à portée doit réussir un jet de sauvegarde de Sagesse sous peine de subir l'état Charmé pour toute la durée. La cible réussit automatiquement ce\nJS

 D iince avec la cible, en restant dans un rayon pour toute la durée. Pour qui perçoit le capteur, raît comme un orbe lumineux de la taille de 1 qu'une créature, vous pouvez cibler un lieu que vez déjà vu. Ce faisant, le capteur apparaît à l'endroit é et ne bouge plus.<\/p>\n"}, {"nom": "Serviteur invisible", "ecole": "Invocation", "niveau": 1, "classes": ["Barde", "Magicien", "Occultiste"], "incantation": "action ou rituel", "portee": "18 m", "composantes": "V, S, M (un bout de ficelle et un morceau de bois)", "duree": "1 heure", "pages_source": [329], "description": "Le sort crée une force de taille M, Invisible, dépourvue de conscience et de forme, qui accomplit des tâches rudimentaires sous vos ordres jusqu'à la fin du sort. Le serviteur se matérialise au sol, en un espace inoccupé à portée. Il est doté d'un CA de 10, de 1 point de vie, d'une Force de 2, et ne peut pas effectuer d'attaques. S'il tombe à O point de vie, le sort prend fin. À chacun de vos tours, vous pouvez par une action Bonus ordonner mentalement au serviteur de se déplacer d'un maximum de 4,50 m et d'interagir avec un objet. Le serviteur peut accomplir des tâches rudimentaires à la portée d'un humain, comme aller chercher des objets, nettoyer, réparer, repasser les vêtements, allumer un feu ou servir les repas et la boisson. Une fois l'instruction reçue, le serviteur s'attèle à la tâche de son mieux jusqu'à l'avoir accomplie, puis attend vos prochaines directives. Si vous lui assignez une tâche qui lui demande de s'éloigner de plus de 18 m de vous, le sort prend fin.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "serviteur-invisible", "html_body": "<p>Le sort crée une force de taille M, Invisible, dépourvue de conscience et de forme, qui accomplit des tâches rudimentaires sous vos ordres jusqu'à la fin du sort. Le serviteur se matérialise au sol, en un espace inoccupé à portée. Il est doté d'un CA de 10, de 1 point de vie, d'une Force de 2, et ne peut pas effectuer d'attaques. S'il tombe à O point de vie, le sort prend fin. À chacun de vos tours, vous pouvez par une action Bonus ordonner mentalement au serviteur de se déplacer d'un maximum de 4,50 m et d'interagir avec un objet. Le serviteur peut accomplir des tâches rudimentaires à la portée d'un humain, comme aller chercher des objets, nettoyer, réparer, repasser les vêtements, allumer un feu ou servir les repas et la boisson. Une fois l'instruction reçue, le serviteur s'attèle à la tâche de son mieux jusqu'à l'avoir accomplie, puis attend vos prochaines directives. Si vous lui assignez une tâche qui lui demande de s'éloigner de plus de 18 m de vous, le sort prend fin.<\/p>\n"}, {"nom": "Silence", "ecole": "Illusion", "niveau": 2, "classes": ["Barde", "Clerc", "Rôdeur"], "incantation": "action ou rituel", "portee": "36 m", "composantes": "V, S", "duree": "Concentration, jusqu’à 10 minutes", "pages_source": [329], "description": "Pour toute la durée, nul son ne peut être produit dans une Sphère de 6 m de rayon centrée sur un point que vous choisissez à portée. Les créatures et objets entièrement compris dans la Sphère ont l’Immunité contre les dégâts de tonnerre ; les créatures y subissent l’état Assourdi. Il est impossible de lancer un sort doté d’une composante verbale depuis l’intérieur de cette Sphère.", "illustration": null, "legende_illustration": null, "notes_verification": "Transcription reprise directement sur les scans du manuel ; relecture exhaustive du lot encore nécessaire.", "statut": "ocr_non_valide", "id": "silence", "html_body": "<p>Pour toute la durée, nul son ne peut être produit dans une Sphère de 6 m de rayon centrée sur un point que vous choisissez à portée. Les créatures et objets entièrement compris dans la Sphère ont l’Immunité contre les dégâts de tonnerre ; les créatures y subissent l’état Assourdi. Il est impossible de lancer un sort doté d’une composante verbale depuis l’intérieur de cette Sphère.<\/p>\n"}, {"nom": "Simulacre", "ecole": "Illusion", "niveau": 7, "classes": ["Magicien"], "incantation": "12 heures", "portee": "contact", "composantes": "V, S, M (poudre de rubis d’une valeur minimale de 1 500 po, que le sort détruit)", "duree": "jusqu'à dissipation", "pages_source": [329], "description": "Vous façonnez un simulacre d'une Bête ou d'un Humanoïde qui se trouve dans un rayon de 3 m pendant tout le temps d'incantation du sort. Vous terminez l'incantation en touchant physiquement la créature en même temps qu'un tas de neige ou de glace de même taille que la créature, le tas prenant alors la forme du simulacre ; une nouvelle créature. Il reprend le profil de la créature d'origine au moment de l'incantation, si ce n'est qu'il s’agit d'un Artificiel, que son maximum de points de vie est moitié moindre et qu'il ne peut pas lancer de sorts. Le simulacre est Amical envers vous et les créatures que vous désignez. Il obéit à vos ordres et agit à votre tour au combat. Le simulacre ne peut pas gagner de niveaux ni prendre de Repos, courts ou longs. Si le simulacre subit des dégâts, le seul moyen de lui restituer des points de vie consiste à le réparer lors d’un Repos long de votre part, durant lequel vous devez dépenser des composantes : l'équivalent de 100 po par point de vie restitué. Le simulacre doit rester dans un rayon de 1,50 m de vous durant toute l'opération. Le simulacre persiste jusqu’à ce qu'il tombe à 0 point de vie, après quoi il retrouve sa substance aqueuse et fond. Si vous relancez ce sort, tout autre simulacre actif que vous avez créé par ce même sort est aussitôt détruit.", "illustration": null, "legende_illustration": null, "notes_verification": "encadre_statistiques_a_controler", "statut": "ocr_non_valide", "id": "simulacre", "html_body": "<p>Vous façonnez un simulacre d'une Bête ou d'un Humanoïde qui se trouve dans un rayon de 3 m pendant tout le temps d'incantation du sort. Vous terminez l'incantation en touchant physiquement la créature en même temps qu'un tas de neige ou de glace de même taille que la créature, le tas prenant alors la forme du simulacre ; une nouvelle créature. Il reprend le profil de la créature d'origine au moment de l'incantation, si ce n'est qu'il s’agit d'un Artificiel, que son maximum de points de vie est moitié moindre et qu'il ne peut pas lancer de sorts. Le simulacre est Amical envers vous et les créatures que vous désignez. Il obéit à vos ordres et agit à votre tour au combat. Le simulacre ne peut pas gagner de niveaux ni prendre de Repos, courts ou longs. Si le simulacre subit des dégâts, le seul moyen de lui restituer des points de vie consiste à le réparer lors d’un Repos long de votre part, durant lequel vous devez dépenser des composantes : l'équivalent de 100 po par point de vie restitué. Le simulacre doit rester dans un rayon de 1,50 m de vous durant toute l'opération. Le simulacre persiste jusqu’à ce qu'il tombe à 0 point de vie, après quoi il retrouve sa substance aqueuse et fond. Si vous relancez ce sort, tout autre simulacre actif que vous avez créé par ce même sort est aussitôt détruit.<\/p>\n"}, {"nom": "Simulacre de Vie", "ecole": "Nécromancie", "niveau": 1, "classes": ["Ensorceleur", "Magicien"], "incantation": "action", "portee": "personnelle", "composantes": "V, S, M (une goutte d'alcool)", "duree": "instantanée", "pages_source": [329, 330], "description": "Vous recevez 2d4 + 4 points de vie temporaires.\nEmplacement de niveau supérieur. Vous recevez 5 points de vie temporaires supplémentaires par niveau d'emplacement au-delà du 1. Durée : instantanée La créature que vous touchez physiquement récupère un nombre de points de vie égal à 2d8 + votre modificateur de caractéristique d'incantation.\nEmplacement de niveau supérieur. Les soins augmentent de 2d8 par niveau d'emplacement au-delà du 1*. = Î°ÿ°——", "illustration": null, "legende_illustration": null, "notes_verification": "encadre_statistiques_a_controler", "statut": "ocr_non_valide", "id": "simulacre-de-vie", "html_body": "<p>Vous recevez 2d4 + 4 points de vie temporaires.\nEmplacement de niveau supérieur. Vous recevez 5 points de vie temporaires supplémentaires par niveau d'emplacement au-delà du 1. Durée : instantanée La créature que vous touchez physiquement récupère un nombre de points de vie égal à 2d8 + votre modificateur de caractéristique d'incantation.\nEmplacement de niveau supérieur. Les soins augmentent de 2d8 par niveau d'emplacement au-delà du 1*. = Î°ÿ°——<\/p>\n"}, {"nom": "Soins de Groupe", "ecole": "Abjuration", "niveau": 5, "classes": ["Barde", "Clerc", "Druide"], "incantation": "À vérifier", "portee": "18 m", "composantes": "V, S", "duree": "instantanée", "pages_source": [330], "description": "Une vague d'énergie curative déferle depuis un point que vous voyez à portée. Désignez un maximum de six créatures dans une Sphère de 9 m de rayon centrée sur ce point. Chaque cible récupère autant de points de vie que 5d8 + votre modificateur de caractéristique d’incantation.\nEmplacement de niveau supérieur. Les soins augmentent de 1d8 par niveau d'emplacement au-delà du 5°.", "illustration": null, "legende_illustration": null, "notes_verification": "champ_absent:incantation; encadre_statistiques_a_controler", "statut": "ocr_non_valide", "id": "soins-de-groupe", "html_body": "<p>Une vague d'énergie curative déferle depuis un point que vous voyez à portée. Désignez un maximum de six créatures dans une Sphère de 9 m de rayon centrée sur ce point. Chaque cible récupère autant de points de vie que 5d8 + votre modificateur de caractéristique d’incantation.\nEmplacement de niveau supérieur. Les soins augmentent de 1d8 par niveau d'emplacement au-delà du 5°.<\/p>\n"}, {"nom": "Sommeil", "ecole": "Enchantement", "niveau": 1, "classes": ["Barde", "Ensorceleur", "Magicien"], "incantation": "action", "portee": "18 m", "composantes": "V, S, M (un pincée de sable ou des pétales de rose)", "duree": "Concentration, jusqu’à 1 minute", "pages_source": [330], "description": "Chaque créature que vous choisissez dans une Sphère de 1,50 m centrée sur un point à portée doit réussir un jet de sauvegarde de Sagesse sous peine de subir l'état Neutralisé jusqu’à la fin de son tour suivant et de réitérer le JS à la fin de cet intervalle. Si la cible rate ce second JS, elle subit l'état\nInconscient pour toute la durée. Le sort prend fin sur toute cible qui subit des dégâts ou qui reçoit une secousse énergique d'une autre créature située dans un rayon de 1,50 m d'elle. Les créatures qui ne dorment pas, comme les elfes, et celles qui ont l'Immunité contre l'Épuisement réussissent automatiquement leur JS contre ce sort.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "sommeil", "html_body": "<p>Chaque créature que vous choisissez dans une Sphère de 1,50 m centrée sur un point à portée doit réussir un jet de sauvegarde de Sagesse sous peine de subir l'état Neutralisé jusqu’à la fin de son tour suivant et de réitérer le JS à la fin de cet intervalle. Si la cible rate ce second JS, elle subit l'état\nInconscient pour toute la durée. Le sort prend fin sur toute cible qui subit des dégâts ou qui reçoit une secousse énergique d'une autre créature située dans un rayon de 1,50 m d'elle. Les créatures qui ne dorment pas, comme les elfes, et celles qui ont l'Immunité contre l'Épuisement réussissent automatiquement leur JS contre ce sort.<\/p>\n"}, {"nom": "Songe", "ecole": "Illusion", "niveau": 5, "classes": ["Barde", "Magicien", "Occultiste"], "incantation": "À vérifier", "portee": "spéciale nl |", "composantes": "V, S, M (une poignée de sable)", "duree": "8 heures", "pages_source": [330], "description": "Vous ciblez une créature que vous connaissez sur votre plan d'existence. Vous-même, ou une créature consentante que vous touchez, entrez en transe pour faire office de messager onirique. Tant qu’il est en transe, le messager est Neutralisé et sa Vitesse est de 0. Si la cible est endormie, le messager lui apparaît en rêve et peut converser avec elle aussi longtemps que le sommeil se prolonge et que le sort persiste. Le messager peut également façonner l’environnement du songe en y ajoutant des paysages, des objets et autres images. Le messager peut sortir de sa transe à tout moment, ce qui met fin au sort. La cible se souvient parfaitement du songe à son réveil. Si la cible est réveillée à l’incantation du sort, le messager le sait et peut mettre un terme à sa transe (et au sort) ou attendre que la cible s'endorme, ce qui fera apparaître le messager dans ses rêves.\nVous pouvez rendre le messager terrifiant pour la cible. Dans ce cas, il livre un message qui ne dépasse pas dix mots, après quoi la cible effectue un jet de sauvegarde de Sagesse. En cas d'échec, la cible ne reçoit aucun bénéfice de son repos et subit 3d6 dégâts psychiques à son réveil.", "illustration": null, "legende_illustration": null, "notes_verification": "champ_absent:incantation", "statut": "ocr_non_valide", "id": "songe", "html_body": "<p>Vous ciblez une créature que vous connaissez sur votre plan d'existence. Vous-même, ou une créature consentante que vous touchez, entrez en transe pour faire office de messager onirique. Tant qu’il est en transe, le messager est Neutralisé et sa Vitesse est de 0. Si la cible est endormie, le messager lui apparaît en rêve et peut converser avec elle aussi longtemps que le sommeil se prolonge et que le sort persiste. Le messager peut également façonner l’environnement du songe en y ajoutant des paysages, des objets et autres images. Le messager peut sortir de sa transe à tout moment, ce qui met fin au sort. La cible se souvient parfaitement du songe à son réveil. Si la cible est réveillée à l’incantation du sort, le messager le sait et peut mettre un terme à sa transe (et au sort) ou attendre que la cible s'endorme, ce qui fera apparaître le messager dans ses rêves.\nVous pouvez rendre le messager terrifiant pour la cible. Dans ce cas, il livre un message qui ne dépasse pas dix mots, après quoi la cible effectue un jet de sauvegarde de Sagesse. En cas d'échec, la cible ne reçoit aucun bénéfice de son repos et subit 3d6 dégâts psychiques à son réveil.<\/p>\n"}, {"nom": "Souffle du Dragon", "ecole": "Transmutation", "niveau": 2, "classes": ["Ensorceleur", "Magicien"], "incantation": "action Bonus", "portee": "contact", "composantes": "V, S, M (un piment)", "duree": "Concentration, jusqu'à 1 minute", "pages_source": [330, 331], "description": "Vous touchez physiquement une créature consentante et choisissez entre acide, feu, foudre, froid et poison. Jusqu'à la fin du sort, la cible peut entreprendre l'action Magie pour exhaler un Cône de 4,50 m. Chaque créature prise dans la zone effectue un jet de sauvegarde de Dextérité, et subit 3d6 dégâts du type choisi en cas d'échec, la moitié en cas de réussite.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d6 par niveau d'emplacement au-delà du 2°. Temps d’incantation : action Portée : personnelle Composantes : V Durée : instantanée Souhait est le sort le plus puissant que puisse lancer un mortel. De votre seule voix, vous pouvez influer sur la réalité même. L'utilisation standard du sort revient à reproduire le sort de votre choix du 8° niveau ou inférieur. Dans cette version, vous n'avez pas besoin de remplir les conditions habituelles du sort, y compris ses composantes coûteuses. Le sort prend tout simplement effet. Une autre approche vous permet de produire l’un des effets suivants, au choix :\nCréation d'objet. Vous créez un objet non magique d'une valeur maximale de 25 000 po. Aucune des dimensions de l’objet ne peut dépasser 90 m et il apparaît au sol, en un espace inoccupé que vous voyez.\nSanté souveraine. Vous permettez à un maximum de vingt créatures que vous voyez de récupérer tous leurs points de vie et mettre un terme à tous les effets qui les touchent parmi ceux décrits pour le sort restauration suprême.\nRésistance. Vous octroyez la Résistance au type de dégâts de votre choix à un maximum de dix créatures que vous voyez. Cette Résistance est permanente.\nImmunité magique. Vous octroyez l'Immunité contre un sort (ou un effet magique) unique pendant 8 heures, à un maximum de dix créatures que vous voyez.\nApprentissage instantané. Vous remplacez l'un de vos dons par un autre don pour lequel vous remplissez les prérequis. Vous perdez tous les bénéfices de l’ancien don au profit de tous ceux du nouveau. Vous ne pouvez pas remplacer un don qui figure parmi les prérequis d'un autre don ou d'une aptitude.\nCaprice des dés. Vous modifiez un événement récent en faisant rejouer un jet de dés intervenu au cours du dernier round (ce qui comprend votre dernier tour). La réalité s'adapte alors à ce nouveau résultat. Souhait peut ainsi annuler le jet de sauvegarde raté d'un allié ou le Coup critique d’un ennemi. Vous pouvez décider que le jet se refasse avec l’Avantage ou le Désavantage, et vous décidez en connaissance de cause lequel s'applique entre le jet d'origine et le nouveau.\nRéalité remodelée. Vous pouvez souhaiter quelque chose qui n'entre pas dans le cadre de ces effets. Si vous avez une telle idée, faites-en part à votre MD), le plus précisément possible. Le MD est alors seul juge de ce qui peut se passer : plus le souhait est ambitieux, plus il risque de ne pas tourner comme vous l’attendez. Le sort pourrait tout simplement échouer, ou ne produire que partiellement l'effet désiré, ou vous pourriez connaître un imprévu fâcheux en raison d'une formulation hasardeuse. Si vous £ vi, mas votre héros quiterait du même coup La partie légendaire ou un Artefact pourrait vous transporter aussitôt face à l'actuel propriétaire. Si votre souhait est exaucé et que ses effets pèsent sur toute une communauté, une région ou un monde, vous risquez fort d'attirer de puissants adversaires. Si votre souhait est susceptible d’affecter un dieu, ses serviteurs divins pourraient bien intervenir dans l'instant pour empêcher ce souhait ou pour vous inciter à le formuler de manière très spécifique. Si votre souhait menace le multivers même ou la Cité de Sigil, ou qu’il risque d’affecter la Dame des Douleurs d'une quelconque manière, une image se forme dans votre esprit : la Dame secoue la tête, et votre souhait n'est pas exaucé. Dès lors qu'il ne s'agit pas seulement de reproduire les effets d'un autre sort, lancer souhait est une véritable épreuve. Après une telle gageure, chaque fois que vous jetez un sort sans avoir terminé un Repos long, vous subissez 1d10 dégâts nécrotiques par niveau du sort. Ces dégâts ne peuvent être réduits ni évités d'aucune manière. De plus, votre valeur de\nForce passe à 3 pendant 2d4 jours. Chaque jour que vous passez alors à vous reposer en vous contentant de menues tâches déduit 2 jours de cette période de convalescence. Enfin, cette épreuve entraîne un risque de 33 pour cent que vous ne soyez plus jamais capable de relancer souhait.", "illustration": null, "legende_illustration": null, "notes_verification": "encadre_statistiques_a_controler", "statut": "ocr_non_valide", "id": "souffle-du-dragon", "html_body": "<p>Vous touchez physiquement une créature consentante et choisissez entre acide, feu, foudre, froid et poison. Jusqu'à la fin du sort, la cible peut entreprendre l'action Magie pour exhaler un Cône de 4,50 m. Chaque créature prise dans la zone effectue un jet de sauvegarde de Dextérité, et subit 3d6 dégâts du type choisi en cas d'échec, la moitié en cas de réussite.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d6 par niveau d'emplacement au-delà du 2°. Temps d’incantation : action Portée : personnelle Composantes : V Durée : instantanée Souhait est le sort le plus puissant que puisse lancer un mortel. De votre seule voix, vous pouvez influer sur la réalité même. L'utilisation standard du sort revient à reproduire le sort de votre choix du 8° niveau ou inférieur. Dans cette version, vous n'avez pas besoin de remplir les conditions habituelles du sort, y compris ses composantes coûteuses. Le sort prend tout simplement effet. Une autre approche vous permet de produire l’un des effets suivants, au choix :\nCréation d'objet. Vous créez un objet non magique d'une valeur maximale de 25 000 po. Aucune des dimensions de l’objet ne peut dépasser 90 m et il apparaît au sol, en un espace inoccupé que vous voyez.\nSanté souveraine. Vous permettez à un maximum de vingt créatures que vous voyez de récupérer tous leurs points de vie et mettre un terme à tous les effets qui les touchent parmi ceux décrits pour le sort restauration suprême.\nRésistance. Vous octroyez la Résistance au type de dégâts de votre choix à un maximum de dix créatures que vous voyez. Cette Résistance est permanente.\nImmunité magique. Vous octroyez l'Immunité contre un sort (ou un effet magique) unique pendant 8 heures, à un maximum de dix créatures que vous voyez.\nApprentissage instantané. Vous remplacez l'un de vos dons par un autre don pour lequel vous remplissez les prérequis. Vous perdez tous les bénéfices de l’ancien don au profit de tous ceux du nouveau. Vous ne pouvez pas remplacer un don qui figure parmi les prérequis d'un autre don ou d'une aptitude.\nCaprice des dés. Vous modifiez un événement récent en faisant rejouer un jet de dés intervenu au cours du dernier round (ce qui comprend votre dernier tour). La réalité s'adapte alors à ce nouveau résultat. Souhait peut ainsi annuler le jet de sauvegarde raté d'un allié ou le Coup critique d’un ennemi. Vous pouvez décider que le jet se refasse avec l’Avantage ou le Désavantage, et vous décidez en connaissance de cause lequel s'applique entre le jet d'origine et le nouveau.\nRéalité remodelée. Vous pouvez souhaiter quelque chose qui n'entre pas dans le cadre de ces effets. Si vous avez une telle idée, faites-en part à votre MD), le plus précisément possible. Le MD est alors seul juge de ce qui peut se passer : plus le souhait est ambitieux, plus il risque de ne pas tourner comme vous l’attendez. Le sort pourrait tout simplement échouer, ou ne produire que partiellement l'effet désiré, ou vous pourriez connaître un imprévu fâcheux en raison d'une formulation hasardeuse. Si vous £ vi, mas votre héros quiterait du même coup La partie légendaire ou un Artefact pourrait vous transporter aussitôt face à l'actuel propriétaire. Si votre souhait est exaucé et que ses effets pèsent sur toute une communauté, une région ou un monde, vous risquez fort d'attirer de puissants adversaires. Si votre souhait est susceptible d’affecter un dieu, ses serviteurs divins pourraient bien intervenir dans l'instant pour empêcher ce souhait ou pour vous inciter à le formuler de manière très spécifique. Si votre souhait menace le multivers même ou la Cité de Sigil, ou qu’il risque d’affecter la Dame des Douleurs d'une quelconque manière, une image se forme dans votre esprit : la Dame secoue la tête, et votre souhait n'est pas exaucé. Dès lors qu'il ne s'agit pas seulement de reproduire les effets d'un autre sort, lancer souhait est une véritable épreuve. Après une telle gageure, chaque fois que vous jetez un sort sans avoir terminé un Repos long, vous subissez 1d10 dégâts nécrotiques par niveau du sort. Ces dégâts ne peuvent être réduits ni évités d'aucune manière. De plus, votre valeur de\nForce passe à 3 pendant 2d4 jours. Chaque jour que vous passez alors à vous reposer en vous contentant de menues tâches déduit 2 jours de cette période de convalescence. Enfin, cette épreuve entraîne un risque de 33 pour cent que vous ne soyez plus jamais capable de relancer souhait.<\/p>\n"}, {"nom": "Sphère de feu", "ecole": "Invocation", "niveau": 2, "classes": ["Druide", "Ensorceleur", "Magicien"], "incantation": "À vérifier", "portee": "18 m", "composantes": "V, S, M (une boule de cire)", "duree": "Concentration, jusqu'à 1 minute", "pages_source": [331, 332], "description": "Vous produisez une Sphère de flammes de 1,50 m de diamètre qui apparaît au sol en un espace inoccupé à portée.\nElle persiste pour toute la durée. Toute créature qui termine son tour dans un rayon de 1,50 m de la Sphère effectue un jet de sauvegarde de Dextérité et subit 2d6 dégâts de feu en cas d'échec, la moitié en cas de réussite. Par une action Bonus, vous pouvez déplacer la Sphère d'un maximum de 9 m, en la faisant rouler sur le sol. Si vous déplacez la Sphère dans l’espace d'une créature, celle-ci effectue un jet de sauvegarde contre les dégâts de la Sphère, puis la Sphère cesse de se déplacer pour ce tour. Lorsque vous déplacez la Sphère, vous pouvez lui faire franchir des obstacles dont la hauteur ne dépasse pas 1,50 m et des fosses d'une largeur maximale de 3 m. La Sphère embrase les objets inflammables qui ne sont portés par personne, produit une Lumière vive sur un rayon de 6 m et une Lumière faible sur 6 m de plus.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d6 par niveau d'emplacement au-delà du 2°. UNE ENSORCELEUSE TIEFFELINE LIBÈRE\nSPHÈRE DE VITRIOL SUR DES NOTHICS.", "illustration": null, "legende_illustration": null, "notes_verification": "champ_absent:incantation", "statut": "ocr_non_valide", "id": "sphere-de-feu", "html_body": "<p>Vous produisez une Sphère de flammes de 1,50 m de diamètre qui apparaît au sol en un espace inoccupé à portée.\nElle persiste pour toute la durée. Toute créature qui termine son tour dans un rayon de 1,50 m de la Sphère effectue un jet de sauvegarde de Dextérité et subit 2d6 dégâts de feu en cas d'échec, la moitié en cas de réussite. Par une action Bonus, vous pouvez déplacer la Sphère d'un maximum de 9 m, en la faisant rouler sur le sol. Si vous déplacez la Sphère dans l’espace d'une créature, celle-ci effectue un jet de sauvegarde contre les dégâts de la Sphère, puis la Sphère cesse de se déplacer pour ce tour. Lorsque vous déplacez la Sphère, vous pouvez lui faire franchir des obstacles dont la hauteur ne dépasse pas 1,50 m et des fosses d'une largeur maximale de 3 m. La Sphère embrase les objets inflammables qui ne sont portés par personne, produit une Lumière vive sur un rayon de 6 m et une Lumière faible sur 6 m de plus.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d6 par niveau d'emplacement au-delà du 2°. UNE ENSORCELEUSE TIEFFELINE LIBÈRE\nSPHÈRE DE VITRIOL SUR DES NOTHICS.<\/p>\n"}, {"nom": "Sphère Glacée d Otiluke", "ecole": "Évocation", "niveau": 6, "classes": ["Ensorceleur", "Magicien"], "incantation": "À vérifier", "portee": "90 m", "composantes": "V, S, M (une sphère miniature en cristal)", "duree": "instantanée", "pages_source": [332], "description": "Un globe glacial jaillit de vous vers un point que vous choisissez à portée, où il explose sous forme d'une Sphère de 18 m de rayon. Chaque créature prise dans la zone effectue un jet de sauvegarde de Constitution et subit 10d6 dégâts de froid en cas d'échec, la moitié en cas de réussite. Si le globe heurte un volume d’eau, il gèle cette eau sur une profondeur de 15 cm et une surface carrée de 9 m de côté.\nCette glace persiste pendant 1 minute. Les créatures qui nageaient à la surface de l'eau désormais gelée se retrouvent bloquées dans la glace, avec l'état Entravé. Une créature bloquée peut consacrer une action à effectuer un test de Force (Athlétisme) assorti de votre DD de sauvegarde des sorts pour s'extraire de la glace. Vous pouvez si vous le souhaitez vous retenir de projeter le globe une fois l’incantation terminée. Dans ce cas, un globe de la taille d'une bille de fronde, froid au contact, apparaît dans votre main. À tout moment, vous ou une créature à qui vous confiez le globe pouvez le projeter (sur une distance maximale de 12 m) ou vous servir d'une fronde pour le lancer (profitant ainsi de la portée normale de la fronde). Il se brise à l'impact, en produisant les mêmes effets que l'incantation de base du sort. Vous pouvez également poser le globe sans le briser. Au bout de 1 minute, s’il ne s'est toujours pas brisé, le globe explose. 332 CHAPITRE 7 | SORTS — +\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d6 par niveau d'emplacement au-delà du 6°.", "illustration": null, "legende_illustration": null, "notes_verification": "champ_absent:incantation; symboles_suspects", "statut": "ocr_non_valide", "id": "sphere-glacee-d-otiluke", "html_body": "<p>Un globe glacial jaillit de vous vers un point que vous choisissez à portée, où il explose sous forme d'une Sphère de 18 m de rayon. Chaque créature prise dans la zone effectue un jet de sauvegarde de Constitution et subit 10d6 dégâts de froid en cas d'échec, la moitié en cas de réussite. Si le globe heurte un volume d’eau, il gèle cette eau sur une profondeur de 15 cm et une surface carrée de 9 m de côté.\nCette glace persiste pendant 1 minute. Les créatures qui nageaient à la surface de l'eau désormais gelée se retrouvent bloquées dans la glace, avec l'état Entravé. Une créature bloquée peut consacrer une action à effectuer un test de Force (Athlétisme) assorti de votre DD de sauvegarde des sorts pour s'extraire de la glace. Vous pouvez si vous le souhaitez vous retenir de projeter le globe une fois l’incantation terminée. Dans ce cas, un globe de la taille d'une bille de fronde, froid au contact, apparaît dans votre main. À tout moment, vous ou une créature à qui vous confiez le globe pouvez le projeter (sur une distance maximale de 12 m) ou vous servir d'une fronde pour le lancer (profitant ainsi de la portée normale de la fronde). Il se brise à l'impact, en produisant les mêmes effets que l'incantation de base du sort. Vous pouvez également poser le globe sans le briser. Au bout de 1 minute, s’il ne s'est toujours pas brisé, le globe explose. 332 CHAPITRE 7 | SORTS — +\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d6 par niveau d'emplacement au-delà du 6°.<\/p>\n"}, {"nom": "Sphère Résiliente d Otiluke", "ecole": "Abjuration", "niveau": 4, "classes": ["Magicien"], "incantation": "action", "portee": "9 m", "composantes": "V, S, M (une sphère de verre)", "duree": "Concentration, jusqu'à | minute", "pages_source": [332, 333], "description": "Une sphère chatoyante séquestre une créature ou un objet de taille G ou inférieure à portée. Une créature non consentante doit réussir un jet de sauvegarde de Dextérité pour ne pas être confinée pour toute la durée. Rien, ni les objets physiques, ni l'énergie, ni les autres effets de sort, ne peut franchir cette barrière dans un sens comme dans l’autre, mais la créature séquestrée peut respirer normalement. La sphère est immunisée contre tous les dégâts, et la créature ou l’objet enfermé ne peut subir de dégâts des attaques et effets émanant de l’autre côté, pas plus qu'une créature séquestrée ne peut infliger de dégâts vers l'extérieur. La sphère, qui ne pèse rien, est juste assez grande pour contenir la créature ou l'objet. Une créature confinée peut consacrer son action à pousser sur les parois de la sphère et la faire rouler à concurrence de la moitié de sa propre\nVitesse. De même, d'autres créatures peuvent ramasser le globe et le déplacer. Le sort désintégration, s’il cible le globe, le détruit sans risque pour ce qui se trouve à l'intérieur. à portée et une boule d'acide re, y file aussitôt et y explose 6 m de rayon. Chaque créature > un jet de sauvegarde de Dextérité. 10d4 dégâts d'acide, puis 5d4 dégâts tour suivant. En cas de réussite, elle ent la moitié des dégâts initiaux. en it de niveau supérieur. Les dégâts initiaux tent de 2d4 par niveau d'emplacement au-delà du 4:.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "sphere-resiliente-d-otiluke", "html_body": "<p>Une sphère chatoyante séquestre une créature ou un objet de taille G ou inférieure à portée. Une créature non consentante doit réussir un jet de sauvegarde de Dextérité pour ne pas être confinée pour toute la durée. Rien, ni les objets physiques, ni l'énergie, ni les autres effets de sort, ne peut franchir cette barrière dans un sens comme dans l’autre, mais la créature séquestrée peut respirer normalement. La sphère est immunisée contre tous les dégâts, et la créature ou l’objet enfermé ne peut subir de dégâts des attaques et effets émanant de l’autre côté, pas plus qu'une créature séquestrée ne peut infliger de dégâts vers l'extérieur. La sphère, qui ne pèse rien, est juste assez grande pour contenir la créature ou l'objet. Une créature confinée peut consacrer son action à pousser sur les parois de la sphère et la faire rouler à concurrence de la moitié de sa propre\nVitesse. De même, d'autres créatures peuvent ramasser le globe et le déplacer. Le sort désintégration, s’il cible le globe, le détruit sans risque pour ce qui se trouve à l'intérieur. à portée et une boule d'acide re, y file aussitôt et y explose 6 m de rayon. Chaque créature &gt; un jet de sauvegarde de Dextérité. 10d4 dégâts d'acide, puis 5d4 dégâts tour suivant. En cas de réussite, elle ent la moitié des dégâts initiaux. en it de niveau supérieur. Les dégâts initiaux tent de 2d4 par niveau d'emplacement au-delà du 4:.<\/p>\n"}, {"nom": "Stabilisation", "ecole": "Nécromancie", "niveau": 0, "classes": ["Clerc", "Druide"], "incantation": "action", "portee": "4,50 m", "composantes": "V, S", "duree": "instantanée", "pages_source": [333], "description": "Choisissez à portée une créature dotée de O point de vie, mais qui n'est pas morte. La créature est Stabilisée.\nAmélioration de sort mineur. La portée augmente lorsque vous atteignez les niveaux 5 (9 m), 11 (18 m) et 17 (36 m).", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "stabilisation", "html_body": "<p>Choisissez à portée une créature dotée de O point de vie, mais qui n'est pas morte. La créature est Stabilisée.\nAmélioration de sort mineur. La portée augmente lorsque vous atteignez les niveaux 5 (9 m), 11 (18 m) et 17 (36 m).<\/p>\n"}, {"nom": "Suggestion", "ecole": "Enchantement", "niveau": 2, "classes": ["Barde", "Ensorceleur", "Magicien", "Occultiste"], "incantation": "action", "portee": "9 m", "composantes": "V, M (une goutte de miel)", "duree": "Concentration, jusqu'à 8 heures", "pages_source": [333], "description": "Vous suggérez une ligne de conduite par 25 mots ou moins afin d'influencer magiquement une créature que vous voyez à portée et qui vous entend et vous comprend. La suggestion doit paraître raisonnable et ne pas présenter de risque évident d'infliger des dégâts à la cible ni à ses alliés. Vous pourriez ainsi formuler : « Récupère la clef de la chambre forte de la secte et apporte-la-moi. » Ou bien : « Cesse de combattre, quitte la bibliothèque sans faire d'histoires et ne reviens pas. » La cible doit réussir un jet de sauvegarde de Sagesse sous peine de subir l'état Charmé pour toute la durée ou jusqu'à que vous ou l’un de vos alliés lui infligiez des dégâts. La cible\nCharmée se soumet à la suggestion de son mieux. L'activité suggérée peut s'étendre sur toute la durée, mais s’il est possible de l’accomplir plus tôt, le sort prend fin sur la cible dès qu'elle en a terminé.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "suggestion", "html_body": "<p>Vous suggérez une ligne de conduite par 25 mots ou moins afin d'influencer magiquement une créature que vous voyez à portée et qui vous entend et vous comprend. La suggestion doit paraître raisonnable et ne pas présenter de risque évident d'infliger des dégâts à la cible ni à ses alliés. Vous pourriez ainsi formuler : « Récupère la clef de la chambre forte de la secte et apporte-la-moi. » Ou bien : « Cesse de combattre, quitte la bibliothèque sans faire d'histoires et ne reviens pas. » La cible doit réussir un jet de sauvegarde de Sagesse sous peine de subir l'état Charmé pour toute la durée ou jusqu'à que vous ou l’un de vos alliés lui infligiez des dégâts. La cible\nCharmée se soumet à la suggestion de son mieux. L'activité suggérée peut s'étendre sur toute la durée, mais s’il est possible de l’accomplir plus tôt, le sort prend fin sur la cible dès qu'elle en a terminé.<\/p>\n"}, {"nom": "Suggestion de Groupe", "ecole": "Enchantement", "niveau": 6, "classes": ["Barde", "Magicien"], "incantation": "action", "portee": "18 m", "composantes": "V, M (une langue de serpent)", "duree": "24 heures", "pages_source": [333], "description": "Vous suggérez une ligne de conduite par 25 mots ou moins afin d'influencer magiquement un maximum de douze créatures que vous voyez à portée et qui vous entendent et vous comprennent. La suggestion doit paraître raisonnable et ne pas présenter de risque évident d'infliger des dégâts aux cibles ni à leurs alliés. Vous pourriez ainsi dire : « Marchez jusqu'au village suivant pour aider la population à la moisson jusqu'au crépuscule. » Ou bien : « L'heure n'est pas à la violence. Lâchez vos armes et dansez ! » Cessez dans une heure. » Chaque cible doit réussir un jet de sauvegarde de Sagesse sous peine de subir l'état Charmé pour toute la durée ou jusqu'à que vous ou l’un de vos alliés lui infligiez des dégâts. Chaque cible Charmée se soumet à la suggestion de son mieux. L'activité suggérée peut s'étendre sur toute la durée, mais s’il est possible de l’accomplir plus tôt, le sort prend fin sur la cible dès qu'elle en a terminé.\nEmplacement de niveau supérieur. La durée rallonge avec un emplacement du 7° niveau (10 jours), du 8° (30 jours) et du 9° (366 jours).", "illustration": null, "legende_illustration": null, "notes_verification": "champ_absent:incantation; classes_manquantes; titre_incertain", "statut": "ocr_non_valide", "id": "suggestion-de-groupe", "html_body": "<p>Vous suggérez une ligne de conduite par 25 mots ou moins afin d'influencer magiquement un maximum de douze créatures que vous voyez à portée et qui vous entendent et vous comprennent. La suggestion doit paraître raisonnable et ne pas présenter de risque évident d'infliger des dégâts aux cibles ni à leurs alliés. Vous pourriez ainsi dire : « Marchez jusqu'au village suivant pour aider la population à la moisson jusqu'au crépuscule. » Ou bien : « L'heure n'est pas à la violence. Lâchez vos armes et dansez ! » Cessez dans une heure. » Chaque cible doit réussir un jet de sauvegarde de Sagesse sous peine de subir l'état Charmé pour toute la durée ou jusqu'à que vous ou l’un de vos alliés lui infligiez des dégâts. Chaque cible Charmée se soumet à la suggestion de son mieux. L'activité suggérée peut s'étendre sur toute la durée, mais s’il est possible de l’accomplir plus tôt, le sort prend fin sur la cible dès qu'elle en a terminé.\nEmplacement de niveau supérieur. La durée rallonge avec un emplacement du 7° niveau (10 jours), du 8° (30 jours) et du 9° (366 jours).<\/p>\n"}, {"nom": "Symbole", "ecole": "Abjuration", "niveau": 7, "classes": ["Barde", "Clerc", "Druide", "Magicien"], "incantation": "| minute", "portee": "contact", "composantes": "V, S, M (poudre de diamant d'une valeur minimale de 1 000 po, que le sort détruit)", "duree": "jusqu'à dissipation ou activation", "pages_source": [333, 334], "description": "Vous inscrivez un glyphe nuisible à d'autres créatures, soit sur une surface (comme un pan de mur ou de sol), soit à l’intérieur d’un objet que l’on peut fermer (comme un livre ou un coffre). Le glyphe peut recouvrir une zone dont le diamètre ne dépasse pas 3 m. Si vous optez pour un objet, celui-ci doit rester à sa place ; si on le déplace de plus de 3 m de l'endroit où vous avez lancé le sort, le glyphe est rompu et le sort prend fin sans avoir été activé. Le glyphe est pratiquement imperceptible, au point qu'il faut réussir un test de Sagesse (Perception) assorti de votre\nDD de sauvegarde des sorts pour le remarquer. Lors de l'inscription du glyphe, vous décidez de son déclencheur et de l'effet porté par le symbole : discorde, douleur, étourdissement, mort, sommeil ou terreur. Chaque effet est expliqué ci-après.\nDéclencheur. Vous décidez ce qui le déclenche à l'incantation du sort. Dans le cas des glyphes de surface, les déclencheurs courants sont les suivants : toucher le glyphe, le fouler, retirer un objet qui le recouvre ou s'approcher et ss vue du glyphe. Vous pouvez préciser le déclencheut afin que seules les créatures d'un type donné l'activent (le glyphe ne pourrait ainsi affecter que les Aberrations). Vous pouvez aussi définir les critères de créatures qui ne déclenchent pas le glyphe, comme le fait de prononcer un certain mot de passe. Quand il s'active, le glyphe se met à luire en emplissant une Sphère de 18 m de rayon de Lumière faible pendant 10 minutes, après quoi le sort prend fin. Chaque créature prise dans la Sphère au moment de l'activation du glyphe est ciblée par son effet, de même que toute créature qui pénètre dans la Sphère pour la première fois d’un tour ou y termine son tour. Une même créature ne peut être ciblée qu'une fois par tour.\nDiscorde. Chaque cible effectue un jet de sauvegarde de\nSagesse. En cas d'échec, la cible se chamaille verbalement avec une autre créature pendant 1 minute. Tout ce temps, elle est incapable de communiquer de manière cohérente et ses jets d'attaque et tests de caractéristique s'effectuent avec le Désavantage.\nDouleur. Chaque cible doit réussir un jet de sauvegarde de Constitution sous peine de subir l'état Neutralisé pendant 1 minute.\nÉtourdissement. Chaque cible doit réussir un jet de sauvegarde de Sagesse sous peine de subir l'état Étourdi pendant 1 minute.\nMort. Chaque cible effectue un jet de sauvegarde de Constitution et subit 10d10 dégâts nécrotiques en cas d'échec, la moitié en cas de réussite.\nSommeil. Chaque cible doit réussir un jet de sauvegarde de Sagesse sous peine de subir l'état Inconscient pendant 10 minutes. Une telle créature reprend connaissance si elle subit des dégâts ou si quelqu'un consacre une action à la secouer.\nTerreur. Chaque cible doit réussir un jet de sauvegarde de\nSagesse sous peine de subir l'état Effrayé pendant 1 minute. Tant qu'une cible est ainsi Effrayée, elle doit s'éloigner au minimum de 9 m du glyphe à chacun de ses tours si elle en a la possibilité.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "symbole", "html_body": "<p>Vous inscrivez un glyphe nuisible à d'autres créatures, soit sur une surface (comme un pan de mur ou de sol), soit à l’intérieur d’un objet que l’on peut fermer (comme un livre ou un coffre). Le glyphe peut recouvrir une zone dont le diamètre ne dépasse pas 3 m. Si vous optez pour un objet, celui-ci doit rester à sa place ; si on le déplace de plus de 3 m de l'endroit où vous avez lancé le sort, le glyphe est rompu et le sort prend fin sans avoir été activé. Le glyphe est pratiquement imperceptible, au point qu'il faut réussir un test de Sagesse (Perception) assorti de votre\nDD de sauvegarde des sorts pour le remarquer. Lors de l'inscription du glyphe, vous décidez de son déclencheur et de l'effet porté par le symbole : discorde, douleur, étourdissement, mort, sommeil ou terreur. Chaque effet est expliqué ci-après.\nDéclencheur. Vous décidez ce qui le déclenche à l'incantation du sort. Dans le cas des glyphes de surface, les déclencheurs courants sont les suivants : toucher le glyphe, le fouler, retirer un objet qui le recouvre ou s'approcher et ss vue du glyphe. Vous pouvez préciser le déclencheut afin que seules les créatures d'un type donné l'activent (le glyphe ne pourrait ainsi affecter que les Aberrations). Vous pouvez aussi définir les critères de créatures qui ne déclenchent pas le glyphe, comme le fait de prononcer un certain mot de passe. Quand il s'active, le glyphe se met à luire en emplissant une Sphère de 18 m de rayon de Lumière faible pendant 10 minutes, après quoi le sort prend fin. Chaque créature prise dans la Sphère au moment de l'activation du glyphe est ciblée par son effet, de même que toute créature qui pénètre dans la Sphère pour la première fois d’un tour ou y termine son tour. Une même créature ne peut être ciblée qu'une fois par tour.\nDiscorde. Chaque cible effectue un jet de sauvegarde de\nSagesse. En cas d'échec, la cible se chamaille verbalement avec une autre créature pendant 1 minute. Tout ce temps, elle est incapable de communiquer de manière cohérente et ses jets d'attaque et tests de caractéristique s'effectuent avec le Désavantage.\nDouleur. Chaque cible doit réussir un jet de sauvegarde de Constitution sous peine de subir l'état Neutralisé pendant 1 minute.\nÉtourdissement. Chaque cible doit réussir un jet de sauvegarde de Sagesse sous peine de subir l'état Étourdi pendant 1 minute.\nMort. Chaque cible effectue un jet de sauvegarde de Constitution et subit 10d10 dégâts nécrotiques en cas d'échec, la moitié en cas de réussite.\nSommeil. Chaque cible doit réussir un jet de sauvegarde de Sagesse sous peine de subir l'état Inconscient pendant 10 minutes. Une telle créature reprend connaissance si elle subit des dégâts ou si quelqu'un consacre une action à la secouer.\nTerreur. Chaque cible doit réussir un jet de sauvegarde de\nSagesse sous peine de subir l'état Effrayé pendant 1 minute. Tant qu'une cible est ainsi Effrayée, elle doit s'éloigner au minimum de 9 m du glyphe à chacun de ses tours si elle en a la possibilité.<\/p>\n"}, {"nom": "Télékinésie", "ecole": "Transmutation", "niveau": 5, "classes": ["Ensorceleur", "Magicien"], "incantation": "action", "portee": "18 m", "composantes": "V, S", "duree": "Concentration, jusqu’à 10 minutes", "pages_source": [334], "description": "Vous recevez la faculté de déplacer ou manipuler objets et créatures par la simple pensée. À l'incantation, ainsi qu’au prix de l’action Magie à vos tours suivants avant la fin du sort, vous pouvez exercer votre volonté sur une créature ou un objet que vous voyez à portée pour produire l'effet adéquat décrit plus loin. Vous pouvez affecter la même cible round après round, ou en sélectionner une nouvelle chaque fois que vous le souhaitez. Si vous changez de cible, la précédente n'est plus affectée par le sort.\nCréature. Vous tentez de déplacer une créature de taille TG ou inférieure. La cible doit réussir un jet de sauvegarde de la direction de votre choix, dans les limites de portée du sort. Jusqu'à la fin de votre tour suivant, la créature subit l'état Entravé ; si vous la soulevez dans les airs, elle y reste suspendue. Elle chute à la fin de votre tour suivant sauf si vous recourez une nouvelle fois à cette option sur elle et qu'elle rate le JS.\nObjet. Vous tentez de déplacer un objet de taille TG ou inférieure. Si l'objet n'est porté par personne, vous parvenez automatiquement à le déplacer d’un maximum de 9 m dans la direction de votre choix, dans les limites de portée du sort. Si l'objet est porté par une créature, celle-ci doit réussir un jet de sauvegarde de Force, sans quoi vous lui arrachez l'objet et le déplacez d'un maximum de 9 m dans la direction de votre choix, dans les limites de portée du sort. Vous pouvez exercer un contrôle plus précis sur les objets soumis à votre poigne télékinétique, comme manipuler un outil rudimentaire, ouvrir une porte ou un récipient, ranger un objet dans un contenant ouvert ou l'en extraire, ou encore verser le contenu d’une fiole.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "telekinesie", "html_body": "<p>Vous recevez la faculté de déplacer ou manipuler objets et créatures par la simple pensée. À l'incantation, ainsi qu’au prix de l’action Magie à vos tours suivants avant la fin du sort, vous pouvez exercer votre volonté sur une créature ou un objet que vous voyez à portée pour produire l'effet adéquat décrit plus loin. Vous pouvez affecter la même cible round après round, ou en sélectionner une nouvelle chaque fois que vous le souhaitez. Si vous changez de cible, la précédente n'est plus affectée par le sort.\nCréature. Vous tentez de déplacer une créature de taille TG ou inférieure. La cible doit réussir un jet de sauvegarde de la direction de votre choix, dans les limites de portée du sort. Jusqu'à la fin de votre tour suivant, la créature subit l'état Entravé ; si vous la soulevez dans les airs, elle y reste suspendue. Elle chute à la fin de votre tour suivant sauf si vous recourez une nouvelle fois à cette option sur elle et qu'elle rate le JS.\nObjet. Vous tentez de déplacer un objet de taille TG ou inférieure. Si l'objet n'est porté par personne, vous parvenez automatiquement à le déplacer d’un maximum de 9 m dans la direction de votre choix, dans les limites de portée du sort. Si l'objet est porté par une créature, celle-ci doit réussir un jet de sauvegarde de Force, sans quoi vous lui arrachez l'objet et le déplacez d'un maximum de 9 m dans la direction de votre choix, dans les limites de portée du sort. Vous pouvez exercer un contrôle plus précis sur les objets soumis à votre poigne télékinétique, comme manipuler un outil rudimentaire, ouvrir une porte ou un récipient, ranger un objet dans un contenant ouvert ou l'en extraire, ou encore verser le contenu d’une fiole.<\/p>\n"}, {"nom": "Télépathie", "ecole": "Divination", "niveau": 8, "classes": ["Magicien"], "incantation": "action", "portee": "illimitée", "composantes": "V, S, M (deux bagues jointes en argent)", "duree": "24 heures", "pages_source": [334], "description": "Vous créez un lien télépathique entre vous-même et une créature consentante qui vous est familière. Celle-ci peut se trouver sur n'importe quel point du même plan d'existence que vous. Le sort prend fin si jamais vous et la cible vous retrouvez sur des plans différents. Jusqu'à la fin du sort, vous et la cible pouvez échanger des paroles, des images, des sons et autres messages sensoriels par ce lien, sans délai, la cible étant consciente de l'identité de la personne avec laquelle elle communique : vous. Le sort permet à la créature de comprendre le sens de vos paroles et de tout message sensoriel que vous lui envoyez.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "telepathie", "html_body": "<p>Vous créez un lien télépathique entre vous-même et une créature consentante qui vous est familière. Celle-ci peut se trouver sur n'importe quel point du même plan d'existence que vous. Le sort prend fin si jamais vous et la cible vous retrouvez sur des plans différents. Jusqu'à la fin du sort, vous et la cible pouvez échanger des paroles, des images, des sons et autres messages sensoriels par ce lien, sans délai, la cible étant consciente de l'identité de la personne avec laquelle elle communique : vous. Le sort permet à la créature de comprendre le sens de vos paroles et de tout message sensoriel que vous lui envoyez.<\/p>\n"}, {"nom": "Téléportation", "ecole": "Invocation", "niveau": 7, "classes": ["Barde", "Ensorceleur", "Magicien"], "incantation": "action", "portee": "3 m", "composantes": "V", "duree": "instantanée", "pages_source": [334, 335], "description": "Ce sort vous transporte instantanément, ainsi que huit créatures consentantes que vous voyez à portée, ou bien un seul objet que vous voyez à portée, vers la destination sélectionnée. Si vous ciblez un objet, il doit être de taille G ou inférieure et ne doit pas être porté par une créature non consentante.\nVous devez connaître la destination que vous choisissez . et elle doit se trouver sur le même plan d'existence que vous. Votre niveau de familiarité avec la destination détermine si vous y parvenez effectivement. Le MD lance 14100 en consultant la table Résultat de téléportation et l'explication correspondante. Objet lié Lù = 91-00 Grande familiarité 01-05 06-13 14-24 25-00 Vu plusieurs fois 01-33 34-43 44-53 54-00 Vu une fois ou 01-43 44-53 54-73 74-00 décrit Destination factice 01-50 51-00 — =\nFamiliarité. Les termes de la colonne Familiarité de la table se comprennent comme suit :\n+ « Cercle permanent » fait référence à un cercle de téléportation permanent dont vous connaissez la séquence de runes.\n+ « Objet lié » indique que vous détenez un objet rapporté de la destination souhaitée au cours des six derniers mois, comme un livre issu de la bibliothèque d'un Magicien.\n+ « Grande familiarité » correspond à un endroit où vous avez passé du temps, un lieu que vous avez étudié en profondeur ou un site que vous voyez à l'incantation du sort.\n+ « Vu plusieurs fois » représente un lieu que vous avez vu plus d'une fois, mais que vous connaissez finalement assez peu.\n+ « Vu une fois ou décrit » correspond à un site que vous n'avez vu qu'une fois, éventuellement par magie, ou un endroit qu'on vous a décrit avec un certain détail, éventuellement par le biais d'une carte.\n+ « Destination factice » correspond à un lieu qui n'existe pas. Vous avez par exemple tenté de scruter le sanctuaire de l'ennemi, mais avez été dupé par une illusion, à moins que vous cherchiez à atteindre un lieu qui n'existe plus.\nIncident. La magie imprévisible de ce sort se traduit par une mésaventure. Chaque créature téléportée (ou l'objet ciblé) subit 3d10 dégâts de force et le MD rejoue sur la table pour voir où vous terminez (plusieurs incidents consécutifs sont possibles, entraînant chaque fois des dégâts).\nZone comparable. Vous et votre groupe (ou l'objet ciblé) terminez dans une zone différente dont l'ambiance et l'aspect se rapprochent de la destination souhaitée. Vous apparaissez à l'endroit comparable le plus proche. Si vous souhaitiez rejoindre votre laboratoire, par exemple, vous pourriez aboutir dans celui d’une autre personne de la même ville.\nDéviation. Vous et votre groupe (ou l'objet ciblé) arrivez à 2d12 x 1,5 km et dans une direction aléatoire de la destination souhaitée. Lancez 1d8 pour la direction : 1, est ; 2, sud-est ; 3, sud ; 4, sud-ouest ; 5, ouest ; 6, nord-ouest ; 7, nord ; 8, nord-est.\nSur place. Vous et votre groupe (ou l’objet ciblé) arrivez à l'endroit souhaité.\nUne tempête de flammes éclate à portée. La zone de la tempête consiste en un maximum de 10 Cubes de 3 m, que vous disposez à votre guise. Chaque Cube doit être contigu à au moins un autre Cube. Chaque créature prise dans la zone effectue un jet de sauvegarde de Dextérité et subit 7d10 dégâts de feu en cas d'échec, la moitié en cas de réussite. L'explosion embrase les objets inflammables de la zone qui ne sont portés par personne. r", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "teleportation", "html_body": "<p>Ce sort vous transporte instantanément, ainsi que huit créatures consentantes que vous voyez à portée, ou bien un seul objet que vous voyez à portée, vers la destination sélectionnée. Si vous ciblez un objet, il doit être de taille G ou inférieure et ne doit pas être porté par une créature non consentante.\nVous devez connaître la destination que vous choisissez . et elle doit se trouver sur le même plan d'existence que vous. Votre niveau de familiarité avec la destination détermine si vous y parvenez effectivement. Le MD lance 14100 en consultant la table Résultat de téléportation et l'explication correspondante. Objet lié Lù = 91-00 Grande familiarité 01-05 06-13 14-24 25-00 Vu plusieurs fois 01-33 34-43 44-53 54-00 Vu une fois ou 01-43 44-53 54-73 74-00 décrit Destination factice 01-50 51-00 — =\nFamiliarité. Les termes de la colonne Familiarité de la table se comprennent comme suit :<\/p>\n<ul>\n<li>« Cercle permanent » fait référence à un cercle de téléportation permanent dont vous connaissez la séquence de runes.<\/li>\n<li>« Objet lié » indique que vous détenez un objet rapporté de la destination souhaitée au cours des six derniers mois, comme un livre issu de la bibliothèque d'un Magicien.<\/li>\n<li>« Grande familiarité » correspond à un endroit où vous avez passé du temps, un lieu que vous avez étudié en profondeur ou un site que vous voyez à l'incantation du sort.<\/li>\n<li>« Vu plusieurs fois » représente un lieu que vous avez vu plus d'une fois, mais que vous connaissez finalement assez peu.<\/li>\n<li>« Vu une fois ou décrit » correspond à un site que vous n'avez vu qu'une fois, éventuellement par magie, ou un endroit qu'on vous a décrit avec un certain détail, éventuellement par le biais d'une carte.<\/li>\n<li>« Destination factice » correspond à un lieu qui n'existe pas. Vous avez par exemple tenté de scruter le sanctuaire de l'ennemi, mais avez été dupé par une illusion, à moins que vous cherchiez à atteindre un lieu qui n'existe plus.\nIncident. La magie imprévisible de ce sort se traduit par une mésaventure. Chaque créature téléportée (ou l'objet ciblé) subit 3d10 dégâts de force et le MD rejoue sur la table pour voir où vous terminez (plusieurs incidents consécutifs sont possibles, entraînant chaque fois des dégâts).\nZone comparable. Vous et votre groupe (ou l'objet ciblé) terminez dans une zone différente dont l'ambiance et l'aspect se rapprochent de la destination souhaitée. Vous apparaissez à l'endroit comparable le plus proche. Si vous souhaitiez rejoindre votre laboratoire, par exemple, vous pourriez aboutir dans celui d’une autre personne de la même ville.\nDéviation. Vous et votre groupe (ou l'objet ciblé) arrivez à 2d12 x 1,5 km et dans une direction aléatoire de la destination souhaitée. Lancez 1d8 pour la direction : 1, est ; 2, sud-est ; 3, sud ; 4, sud-ouest ; 5, ouest ; 6, nord-ouest ; 7, nord ; 8, nord-est.\nSur place. Vous et votre groupe (ou l’objet ciblé) arrivez à l'endroit souhaité.\nUne tempête de flammes éclate à portée. La zone de la tempête consiste en un maximum de 10 Cubes de 3 m, que vous disposez à votre guise. Chaque Cube doit être contigu à au moins un autre Cube. Chaque créature prise dans la zone effectue un jet de sauvegarde de Dextérité et subit 7d10 dégâts de feu en cas d'échec, la moitié en cas de réussite. L'explosion embrase les objets inflammables de la zone qui ne sont portés par personne. r<\/li>\n<\/ul>\n"}, {"nom": "Tempête de Grêle", "ecole": "Évocation", "niveau": 4, "classes": ["Druide", "Ensorceleur", "Magicien"], "incantation": "action", "portee": "90 m", "composantes": "V, S, M (une moufle)", "duree": "instantanée", "pages_source": [335], "description": "La grêle s'abat au sol dans un Cylindre de 6 m de rayon et 12 m de hauteur centré sur un point à portée. Chaque créature prise dans le Cylindre effectue un jet de sauvegarde de Dextérité. Elle subit 2d10 dégâts contondants et 4d6 dégâts de froid en cas d'échec, la moitié en cas de réussite. Les grêlons transforment le sol du Cylindre en Terrain difficile jusqu’à la fin de votre tour suivant.\nEmplacement de niveau supérieur. Les dégâts contondants augmentent de 1d10 par niveau d'emplacement au-delà du 4°.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "tempete-de-grele", "html_body": "<p>La grêle s'abat au sol dans un Cylindre de 6 m de rayon et 12 m de hauteur centré sur un point à portée. Chaque créature prise dans le Cylindre effectue un jet de sauvegarde de Dextérité. Elle subit 2d10 dégâts contondants et 4d6 dégâts de froid en cas d'échec, la moitié en cas de réussite. Les grêlons transforment le sol du Cylindre en Terrain difficile jusqu’à la fin de votre tour suivant.\nEmplacement de niveau supérieur. Les dégâts contondants augmentent de 1d10 par niveau d'emplacement au-delà du 4°.<\/p>\n"}, {"nom": "Tempête de Neige", "ecole": "Invocation", "niveau": 3, "classes": ["Druide", "Ensorceleur", "Magicien"], "incantation": "À vérifier", "portee": "45 m", "composantes": "V, S, M (un parapluie miniature)", "duree": "Concentration, jusqu’à 1 minute", "pages_source": [335], "description": "Jusqu'à la fin du sort, la neige tombe dans un Cylindre de 12 m de haut et 6 m de diamètre centré sur un point que vous choisissez à portée. La Visibilité de la zone est nulle et les flammes nues s'y éteignent aussitôt.\nLe sol du Cylindre constitue un Terrain difficile. Quand une créature pénètre dans le Cylindre pour la première fois d'un tour ou qu’elle y commence son tour, elle doit réussir un jet de sauvegarde de Dextérité sous peine de subir l'état À terre et de perdre sa Concentration.", "illustration": null, "legende_illustration": null, "notes_verification": "champ_absent:incantation", "statut": "ocr_non_valide", "id": "tempete-de-neige", "html_body": "<p>Jusqu'à la fin du sort, la neige tombe dans un Cylindre de 12 m de haut et 6 m de diamètre centré sur un point que vous choisissez à portée. La Visibilité de la zone est nulle et les flammes nues s'y éteignent aussitôt.\nLe sol du Cylindre constitue un Terrain difficile. Quand une créature pénètre dans le Cylindre pour la première fois d'un tour ou qu’elle y commence son tour, elle doit réussir un jet de sauvegarde de Dextérité sous peine de subir l'état À terre et de perdre sa Concentration.<\/p>\n"}, {"nom": "Tempête Radieuse de Jallarzi", "ecole": "Évocation", "niveau": 5, "classes": ["Magicien", "Occultiste"], "incantation": "action", "portee": "36 m", "composantes": "V, S, M (une pincée de phosphore)", "duree": "Concentration, jusqu'à 1 minute", "pages_source": [336], "description": "Vous libérez une tempête d'éclats lumineux et de tonnerre dans un Cylindre haut de 12 m et de 3 m de rayon, centré sur un point que vous voyez à portée. Tant qu'elles sont dans la zone, les créatures subissent les états Assourdi et Aveuglé, et ne peuvent lancer de sorts dotés d’une composante verbale. Chaque créature prise dans la tempête à son apparition effectue un jet de sauvegarde de Constitution, et subit 2d10 dégâts radiants et 2d10 dégâts de tonnerre en cas d'échec, la moitié en cas de réussite. Une créature effectue aussi ce JS lorsqu'elle pénètre dans la zone du sort pour la première fois d'un tour ou qu’elle y termine son tour. Une même créature n'effectue en aucun cas ce JS plus d'une fois par tour.\nEmplacement de niveau supérieur. Les dégâts radiants et de tonnerre augmentent de 1d10 par niveau d'emplacement au-delà du 5°.\n\nGRÂCE À SON SORT TEMPÊTE RADIEUSE DE JALLARZI, L'OCCULTISTE ÉPONYME FAIT REGRETTER À DES VROCKS\nD’AVOIR QUITTÉ LES ABYSSES.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "tempete-radieuse-de-jallarzi", "html_body": "<p>Vous libérez une tempête d'éclats lumineux et de tonnerre dans un Cylindre haut de 12 m et de 3 m de rayon, centré sur un point que vous voyez à portée. Tant qu'elles sont dans la zone, les créatures subissent les états Assourdi et Aveuglé, et ne peuvent lancer de sorts dotés d’une composante verbale. Chaque créature prise dans la tempête à son apparition effectue un jet de sauvegarde de Constitution, et subit 2d10 dégâts radiants et 2d10 dégâts de tonnerre en cas d'échec, la moitié en cas de réussite. Une créature effectue aussi ce JS lorsqu'elle pénètre dans la zone du sort pour la première fois d'un tour ou qu’elle y termine son tour. Une même créature n'effectue en aucun cas ce JS plus d'une fois par tour.\nEmplacement de niveau supérieur. Les dégâts radiants et de tonnerre augmentent de 1d10 par niveau d'emplacement au-delà du 5°.<\/p>\n<p>GRÂCE À SON SORT TEMPÊTE RADIEUSE DE JALLARZI, L'OCCULTISTE ÉPONYME FAIT REGRETTER À DES VROCKS\nD’AVOIR QUITTÉ LES ABYSSES.<\/p>\n"}, {"nom": "Tempête Vengeresse", "ecole": "Invocation", "niveau": 9, "classes": ["Druide"], "incantation": "action", "portee": "1,5 km", "composantes": "V, S", "duree": "Concentration, jusqu'à 1 minute", "pages_source": [336, 337], "description": "Un nuage menaçant se forme pour toute la durée, centré sur un point à portée, et se déploie sur un rayon de 90 m. Chaque créature prise dans le nuage à son apparition doit réussir un jet de sauvegarde de Constitution sous peine de subir 2d6 dégâts de tonnerre, ainsi que l'état Assourdi pour toute la durée. Au début de chacun de vos tours suivants, la tempête produit des effets différents, comme détaillé ci-après.\nTour 2. Une pluie acide s’abat. Tous les objets et créatures directement dominés par le nuage subissent 4d6 dégâts d'acide.\nTour 3. Vous invoquez six éclairs qui jaillissent du nuage pour frapper six créatures ou objets dominés par le nuage. Chaque cible effectue un jet de sauvegarde de Dextérité, et subit 10d6 dégâts de foudre en cas d'échec, la moitié en cas de réussite.\nTour 4. La grêle s'abat depuis le nuage. Toute créature directement dominée par le nuage subit 2d6 dégâts contondants. UNE OCCULTISTE GOLIATH INVOQUE ARMURE D'AGATHYS ET TENTACULES DE FMADAR FACE À L'AOVERSITÉ DES PROFONDEURS\nTours 5 à 10. La zone directement dominée par le nuage est assaillie de bourrasques et d'une pluie glaciale. Toute créature qui s'y trouve subit 1d6 dégâts de froid. Jusqu'à la fin du sort, la zone constitue un Terrain difficile et présente une Visibilité nulle, les attaques à distance avec une arme y sont impossibles et un vent fort souffle dans toute la zone", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "tempete-vengeresse", "html_body": "<p>Un nuage menaçant se forme pour toute la durée, centré sur un point à portée, et se déploie sur un rayon de 90 m. Chaque créature prise dans le nuage à son apparition doit réussir un jet de sauvegarde de Constitution sous peine de subir 2d6 dégâts de tonnerre, ainsi que l'état Assourdi pour toute la durée. Au début de chacun de vos tours suivants, la tempête produit des effets différents, comme détaillé ci-après.\nTour 2. Une pluie acide s’abat. Tous les objets et créatures directement dominés par le nuage subissent 4d6 dégâts d'acide.\nTour 3. Vous invoquez six éclairs qui jaillissent du nuage pour frapper six créatures ou objets dominés par le nuage. Chaque cible effectue un jet de sauvegarde de Dextérité, et subit 10d6 dégâts de foudre en cas d'échec, la moitié en cas de réussite.\nTour 4. La grêle s'abat depuis le nuage. Toute créature directement dominée par le nuage subit 2d6 dégâts contondants. UNE OCCULTISTE GOLIATH INVOQUE ARMURE D'AGATHYS ET TENTACULES DE FMADAR FACE À L'AOVERSITÉ DES PROFONDEURS\nTours 5 à 10. La zone directement dominée par le nuage est assaillie de bourrasques et d'une pluie glaciale. Toute créature qui s'y trouve subit 1d6 dégâts de froid. Jusqu'à la fin du sort, la zone constitue un Terrain difficile et présente une Visibilité nulle, les attaques à distance avec une arme y sont impossibles et un vent fort souffle dans toute la zone<\/p>\n"}, {"nom": "Ténèbres", "ecole": "Évocation", "niveau": 2, "classes": ["Ensorceleur", "Magicien", "Occultiste"], "incantation": "action", "portee": "18 m", "composantes": "V, M (une touffe de fourrure d et un bout de charbon)", "duree": "Concentration, jusqu'à 10 minutes", "pages_source": [337], "description": "om [a 3 ee] | = [a ’ Le ’ Pour toute la durée, des Ténèbres magiques se déploient depuis un point à portée en remplissant une Sphère de 4,50 m de rayon. La Vision dans le noir ne perce pas ces lénèbres et les lumières non magiques n'illuminent pas dans la Sphère. Au lieu de cela, vous pouvez lancer le sort sur un objet porté par personne, de manière à ce que les Ténèbres emplissent une Emanation de 4,50 m centrée sur l'objet. Il suffit de recouvrir cet objet d'une surface opaque, comme une gamelle ou un heaume, pour bloquer les Ténèbres. Si tout ou partie de ce sort chevauche la zone de Lumière vive ou faible créée par un sort du 2° niveau ou inférieur, l'effet qui produit cette lumière est dissipé.", "illustration": null, "legende_illustration": null, "notes_verification": "symboles_suspects", "statut": "ocr_non_valide", "id": "tenebres", "html_body": "<p>om [a 3 ee] | = [a ’ Le ’ Pour toute la durée, des Ténèbres magiques se déploient depuis un point à portée en remplissant une Sphère de 4,50 m de rayon. La Vision dans le noir ne perce pas ces lénèbres et les lumières non magiques n'illuminent pas dans la Sphère. Au lieu de cela, vous pouvez lancer le sort sur un objet porté par personne, de manière à ce que les Ténèbres emplissent une Emanation de 4,50 m centrée sur l'objet. Il suffit de recouvrir cet objet d'une surface opaque, comme une gamelle ou un heaume, pour bloquer les Ténèbres. Si tout ou partie de ce sort chevauche la zone de Lumière vive ou faible créée par un sort du 2° niveau ou inférieur, l'effet qui produit cette lumière est dissipé.<\/p>\n"}, {"nom": "Tentacules de Hadar", "ecole": "Invocation", "niveau": 1, "classes": ["Occultiste"], "incantation": "À vérifier", "portee": "personnelle", "composantes": "V, S", "duree": "instantanée", "pages_source": [337, 338], "description": "Vous invoquez Hadar et des vrilles jaillissent de vous. Chaque créature prise dans une Emanation de 3 m centrée sur vous effectue un jet de sauvegarde de Force. En cas d'échec, elle subit 2d6 dégâts nécrotiques et ne peut pas jouer de Réaction jusqu'au début de son tour suivant. En cas de réussite, elle subit uniquement la moitié de ces dégâts.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d6 par niveau d'emplacement au-delà du 1“.\n\nLe MAGICTENE vARD INVOQUE SON SINISTRE SORT TENTACULES NOIRS D'EVARD POUR\nDONNER UNE LEÇON À DES BANDITSMALANISES. Fu at. À 14 # / ee | /", "illustration": null, "legende_illustration": null, "notes_verification": "champ_absent:incantation; symboles_suspects", "statut": "ocr_non_valide", "id": "tentacules-de-hadar", "html_body": "<p>Vous invoquez Hadar et des vrilles jaillissent de vous. Chaque créature prise dans une Emanation de 3 m centrée sur vous effectue un jet de sauvegarde de Force. En cas d'échec, elle subit 2d6 dégâts nécrotiques et ne peut pas jouer de Réaction jusqu'au début de son tour suivant. En cas de réussite, elle subit uniquement la moitié de ces dégâts.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d6 par niveau d'emplacement au-delà du 1“.<\/p>\n<p>Le MAGICTENE vARD INVOQUE SON SINISTRE SORT TENTACULES NOIRS D'EVARD POUR\nDONNER UNE LEÇON À DES BANDITSMALANISES. Fu at. À 14 # / ee | /<\/p>\n"}, {"nom": "Tentacules Noirs D'Evard", "ecole": "Invocation", "niveau": 4, "classes": ["Magicien"], "incantation": "action", "portee": "27 m", "composantes": "V, S, M (un tentacule)", "duree": "Concentration, jusqu’à 1] minute", "pages_source": [338], "description": "Des tentacules frétillants d’un noir d'ébène surgissent du sol et emplissent un espace de 6 m de côté que vous voyez à portée. Pour toute la durée, ces tentacules transforment le sol de la zone en Terrain difficile. Toute créature prise dans la zone effectue un jet de sauvegarde de Force. En cas d'échec, elle subit 3d6 dégâts contondants, ainsi que l'état Entravé jusqu’à la fin du sort. Une créature effectue aussi ce JS si elle pénètre dans la zone ou y termine son tour. Une même créature n'effectue en aucun cas ce JS plus d’une fois par tour. Une créature Entravée peut entreprendre une action pour effectuer un test de Force (Athlétisme) assorti de votre DD de sauvegarde des sorts, et met à un terme à l'état sur elle-même en cas de réussite. 338 CHAPITRE 7 | SORTS", "illustration": null, "legende_illustration": null, "notes_verification": "symboles_suspects", "statut": "ocr_non_valide", "id": "tentacules-noirs-d-evard", "html_body": "<p>Des tentacules frétillants d’un noir d'ébène surgissent du sol et emplissent un espace de 6 m de côté que vous voyez à portée. Pour toute la durée, ces tentacules transforment le sol de la zone en Terrain difficile. Toute créature prise dans la zone effectue un jet de sauvegarde de Force. En cas d'échec, elle subit 3d6 dégâts contondants, ainsi que l'état Entravé jusqu’à la fin du sort. Une créature effectue aussi ce JS si elle pénètre dans la zone ou y termine son tour. Une même créature n'effectue en aucun cas ce JS plus d’une fois par tour. Une créature Entravée peut entreprendre une action pour effectuer un test de Force (Athlétisme) assorti de votre DD de sauvegarde des sorts, et met à un terme à l'état sur elle-même en cas de réussite. 338 CHAPITRE 7 | SORTS<\/p>\n"}, {"nom": "Terrain Hallucinatoire", "ecole": "Illusion", "niveau": 4, "classes": ["Barde", "Druide", "Magicien", "Occultiste"], "incantation": "À vérifier", "portee": "90 m", "composantes": "V, S, M (un champignon)", "duree": "24 heures", "pages_source": [338, 339], "description": "Un terrain naturel qui pourrait loger dans un Cube de 45 m apparaît comme un autre type de terrain naturel, sur les plans visuel, auditif et olfactif. Ainsi un champ ou une route pourrait se présenter comme un marais, une colline, une crevasse glaciaire ou autre environnement difficile ou infranchissable. Une mare pourrait apparaître comme une jolie prairie, un précipice comme une pente douce et un ravin comme une route large et dégagée. Les bâtiments, l'équipement et les créatures de la zone ne changent pas. Les propriétés tactiles du terrain ne changent pas non plus, si bien qu'une créature qui pénètre dans la zone remarquera probablement l'illusion. Si la différence n'est pas évidente au contact, une créature qui examine la zone peut entreprendre l'action Étude pour tenter un test d'Intelligence (Investigation) assorti de votre DD de sauvegarde des sorts afin de percer l'illusion à jour. Une créature qui discerne le subterfuge perçoit une image vague superposée au véritable terrain. a ns per ke chemin n'a nulle part où aller. Si la créature 1 un espace d'où elle ne vous a plus dans on, elle effectue un jet de sauvegarde de n cas de réussite, le sort prend fin pour elle. USOIRE ue ne: S, M (de l'encre d'une valeur minimale de 10 po, que le sort détruit) Durée : 10 jours Vous écrivez sur du parchemin, du papier ou autre surface adaptée et y insufflez une illusion qui persiste pour toute la durée. À vos yeux, ainsi qu'à ceux de toute créature que vous désignez à l'incantation du sort, le texte paraît normalement écrit, de votre main, et porte le message voulu de votre part. Pour toute autre créature, le texte paraît rédigé selon un alphabet inconnu ou magique, parfaitement incompréhensible. Une autre option consiste à donner un sens différent au message, qui semble écrit par quelqu'un d'autre et dans une autre langue que vous maîtrisez. Si le sort est dissipé, le texte original et l'illusion disparaissent. Une créature dotée de la Vision lucide peut lire le message caché.", "illustration": null, "legende_illustration": null, "notes_verification": "champ_absent:incantation", "statut": "ocr_non_valide", "id": "terrain-hallucinatoire", "html_body": "<p>Un terrain naturel qui pourrait loger dans un Cube de 45 m apparaît comme un autre type de terrain naturel, sur les plans visuel, auditif et olfactif. Ainsi un champ ou une route pourrait se présenter comme un marais, une colline, une crevasse glaciaire ou autre environnement difficile ou infranchissable. Une mare pourrait apparaître comme une jolie prairie, un précipice comme une pente douce et un ravin comme une route large et dégagée. Les bâtiments, l'équipement et les créatures de la zone ne changent pas. Les propriétés tactiles du terrain ne changent pas non plus, si bien qu'une créature qui pénètre dans la zone remarquera probablement l'illusion. Si la différence n'est pas évidente au contact, une créature qui examine la zone peut entreprendre l'action Étude pour tenter un test d'Intelligence (Investigation) assorti de votre DD de sauvegarde des sorts afin de percer l'illusion à jour. Une créature qui discerne le subterfuge perçoit une image vague superposée au véritable terrain. a ns per ke chemin n'a nulle part où aller. Si la créature 1 un espace d'où elle ne vous a plus dans on, elle effectue un jet de sauvegarde de n cas de réussite, le sort prend fin pour elle. USOIRE ue ne: S, M (de l'encre d'une valeur minimale de 10 po, que le sort détruit) Durée : 10 jours Vous écrivez sur du parchemin, du papier ou autre surface adaptée et y insufflez une illusion qui persiste pour toute la durée. À vos yeux, ainsi qu'à ceux de toute créature que vous désignez à l'incantation du sort, le texte paraît normalement écrit, de votre main, et porte le message voulu de votre part. Pour toute autre créature, le texte paraît rédigé selon un alphabet inconnu ou magique, parfaitement incompréhensible. Une autre option consiste à donner un sens différent au message, qui semble écrit par quelqu'un d'autre et dans une autre langue que vous maîtrisez. Si le sort est dissipé, le texte original et l'illusion disparaissent. Une créature dotée de la Vision lucide peut lire le message caché.<\/p>\n"}, {"nom": "Thaumaturgie", "ecole": "Transmutation", "niveau": 0, "classes": ["Clerc"], "incantation": "action", "portee": "9 m", "composantes": "V", "duree": "jusqu'à 1 minute", "pages_source": [339], "description": "Vous engendrez une manifestation surnaturelle mineure.\nVous créez l’un des effets magiques suivants à portée. Si vous lancez ce sort plusieurs fois, vous pouvez faire coexister jusqu’à trois de ces effets d'une minute. fort que la normale pendant 1 minute. Pour toute la durée, vous avez l'Avantage aux tests de Charisme (Intimidation).\nYeux modifiés. Vous altérez l'aspect de vos yeux pendant 1 minute. 4 PNEU", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "thaumaturgie", "html_body": "<p>Vous engendrez une manifestation surnaturelle mineure.\nVous créez l’un des effets magiques suivants à portée. Si vous lancez ce sort plusieurs fois, vous pouvez faire coexister jusqu’à trois de ces effets d'une minute. fort que la normale pendant 1 minute. Pour toute la durée, vous avez l'Avantage aux tests de Charisme (Intimidation).\nYeux modifiés. Vous altérez l'aspect de vos yeux pendant 1 minute. 4 PNEU<\/p>\n"}, {"nom": "Toile D'Araignée", "ecole": "Invocation", "niveau": 2, "classes": ["Ensorceleur", "Magicien"], "incantation": "action", "portee": "18 m", "composantes": "V, S, M (quelques filandres de toile d'araignée)", "duree": "Concentration, jusqu'à 1 heure", "pages_source": [339, 340], "description": "Vous invoquez une masse gluante de f

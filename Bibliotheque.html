ychiques en cas d'échec, la moitié en cas de réussite. En cas d'échec, vous connaissez également la position de la cible tant que le sort persiste et que vous demeurez tous deux sur le même plan d'existence. Tant que vous savez par ce biais où se trouve la cible, elle ne peut être cachée vis-à-vis de vous et ne tire aucun bénéfice de l'état Invisible vis-à-vis de vous.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d8 par niveau d'emplacement au-delà du 2°. a", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "epine-mentale", "html_body": "<p>Vous enfoncez une pointe d'énergie psionique dans l'esprit d'une créature que vous voyez à portée. La cible effectue un jet de sauvegarde de Sagesse et subit 3d8 dégâts psychiques en cas d'échec, la moitié en cas de réussite. En cas d'échec, vous connaissez également la position de la cible tant que le sort persiste et que vous demeurez tous deux sur le même plan d'existence. Tant que vous savez par ce biais où se trouve la cible, elle ne peut être cachée vis-à-vis de vous et ne tire aucun bénéfice de l'état Invisible vis-à-vis de vous.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d8 par niveau d'emplacement au-delà du 2°. a<\/p>\n"}, {"nom": "Éruption Ensorcelée", "ecole": "Évocation", "niveau": 0, "classes": ["Ensorceleur"], "incantation": "action", "portee": "36 m", "composantes": "V, S", "duree": "instantanée", "pages_source": [283, 284], "description": "Vous projetez des énergies ensorcelées vers une créature ou un objet à portée. Effectuez une attaque de sort à distance contre la cible. Si l'attaque touche, la cible subit 1d8 dégâts du type choisi : acide, feu, foudre, froid, poison, psychiques ou tonnerre. _ Si vous obtenez un 8 sur un d8 du : sort, vous pouvez en\nLe. sort est ee à votre modificateur Jusqu'à la fin du sort, une créature consentante que Vous touchez physiquement bénéficie de l'Immunité contre les dégâts psychiques et l'état Charmé. La cible n'est pas davantage affectée par tout ce qui permet de percevoir les émotions ou l'alignement, de lire les pensées ou de détecter magiquement sa position, et aucun sort (pas même souhait) ne peut affecter l'esprit de la cible, l'observer à distance ou se renseigner sur son compte.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "eruption-ensorcelee", "html_body": "<p>Vous projetez des énergies ensorcelées vers une créature ou un objet à portée. Effectuez une attaque de sort à distance contre la cible. Si l'attaque touche, la cible subit 1d8 dégâts du type choisi : acide, feu, foudre, froid, poison, psychiques ou tonnerre. _ Si vous obtenez un 8 sur un d8 du : sort, vous pouvez en\nLe. sort est ee à votre modificateur Jusqu'à la fin du sort, une créature consentante que Vous touchez physiquement bénéficie de l'Immunité contre les dégâts psychiques et l'état Charmé. La cible n'est pas davantage affectée par tout ce qui permet de percevoir les émotions ou l'alignement, de lire les pensées ou de détecter magiquement sa position, et aucun sort (pas même souhait) ne peut affecter l'esprit de la cible, l'observer à distance ou se renseigner sur son compte.<\/p>\n"}, {"nom": "Esprits Gardiens", "ecole": "Invocation", "niveau": 3, "classes": ["Clerc"], "incantation": "action", "portee": "personnelle", "composantes": "V, S, M (un parchemin de prière)", "duree": "Concentration, jusqu'à 10 minutes", "pages_source": [284], "description": "Des esprits protecteurs volètent autour de vous pour toute la durée, sous forme d'une Émanation de 4,50 m. Si vous êtes bon ou neutre, ces formes spectrales paraissent angéliques ou féeriques (à votre convenance). Si vous êtes mauvais, elles paraissent fiélonnes. À l'incantation du sort, vous pouvez désigner des créatures qui ne seront pas affectées par ces esprits. Toutes les autres créatures voient leur Vitesse réduite de moitié dans la zone : de plus, lorsque l'Émanation pénètre dans l'espace d'une telle créature ou que celle-ci entre dans l'Émanation pour la première fois d'un tour ou y termine son propre tour, elle effectue un jet de sauvegarde de Sagesse. En cas d'échec, elle subit 3d8 dégâts radiants (si vous êtes bon ou neutre) ou 348 dégâts nécrotiques (si vous êtes mauvais). En cas de réussite, la créature subit la moitié de ces dégâts. Une même créature n'effectue en aucun cas ce JS plus d'une fois par tour.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d8 par niveau d'emplacement au-delà du 3°.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "esprits-gardiens", "html_body": "<p>Des esprits protecteurs volètent autour de vous pour toute la durée, sous forme d'une Émanation de 4,50 m. Si vous êtes bon ou neutre, ces formes spectrales paraissent angéliques ou féeriques (à votre convenance). Si vous êtes mauvais, elles paraissent fiélonnes. À l'incantation du sort, vous pouvez désigner des créatures qui ne seront pas affectées par ces esprits. Toutes les autres créatures voient leur Vitesse réduite de moitié dans la zone : de plus, lorsque l'Émanation pénètre dans l'espace d'une telle créature ou que celle-ci entre dans l'Émanation pour la première fois d'un tour ou y termine son propre tour, elle effectue un jet de sauvegarde de Sagesse. En cas d'échec, elle subit 3d8 dégâts radiants (si vous êtes bon ou neutre) ou 348 dégâts nécrotiques (si vous êtes mauvais). En cas de réussite, la créature subit la moitié de ces dégâts. Une même créature n'effectue en aucun cas ce JS plus d'une fois par tour.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d8 par niveau d'emplacement au-delà du 3°.<\/p>\n"}, {"nom": "État Cadavérique", "ecole": "Nécromancie", "niveau": 3, "classes": ["Barde", "Clerc", "Druide", "Magicien"], "incantation": "action ou rituel", "portee": "contact", "composantes": "V, S, M (une pincée de terre de cimetière)", "duree": "1 heure", "pages_source": [284], "description": "Vous touchez une créature consentante, qui se retrouve alors en catalepsie, au point qu'elle passe pour morte. Pour toute la durée, la créature paraît morte aux yeux de tous (même si la magie est employée pour l'inspecter). Due eubie les cts A tombe à 0. + Pipe La cible bénéficie aussi de la Résistance à tous les d | de 1 000 ps, ue FRE Durée : instantanée Vous consacrez le temps d ion : magiques à l'intérieur pe pass Celle-ci doit être une créature de type Bête d'une Intelligence inférieure à 4, ouunerp qui n'est pas une créature. La cible reçoit une Inte de 10 et la faculté de parler une langue que vous cor sez. Si la cible est une plante naturelle, elle devientune créature de type Plante et reçoit la capacité de se déplacer à sur ses racines, pédoncules, lianes ou autres ap he. et bénéficie de sens comparables à ceux d'un humain. Votre MD choisit un profil adapté à la Plante éveillée, comme le: profil de l'arbuste éveillé ou de l'arbre éveillé (cf. Manuel des monstres). La cible éveillée subit l'état Charmé pendant 30 jours, sauf si vous-même ou l'un de vos compagnons lui infligez des dégâts. Quand cet état prend fin, la créature éveillée choisit l'attitude qu'elle adopte à votre égard. RES 7 1\" Lea", "illustration": null, "legende_illustration": null, "notes_verification": "symboles_suspects", "statut": "ocr_non_valide", "id": "etat-cadaverique", "html_body": "<p>Vous touchez une créature consentante, qui se retrouve alors en catalepsie, au point qu'elle passe pour morte. Pour toute la durée, la créature paraît morte aux yeux de tous (même si la magie est employée pour l'inspecter). Due eubie les cts A tombe à 0. + Pipe La cible bénéficie aussi de la Résistance à tous les d | de 1 000 ps, ue FRE Durée : instantanée Vous consacrez le temps d ion : magiques à l'intérieur pe pass Celle-ci doit être une créature de type Bête d'une Intelligence inférieure à 4, ouunerp qui n'est pas une créature. La cible reçoit une Inte de 10 et la faculté de parler une langue que vous cor sez. Si la cible est une plante naturelle, elle devientune créature de type Plante et reçoit la capacité de se déplacer à sur ses racines, pédoncules, lianes ou autres ap he. et bénéficie de sens comparables à ceux d'un humain. Votre MD choisit un profil adapté à la Plante éveillée, comme le: profil de l'arbuste éveillé ou de l'arbre éveillé (cf. Manuel des monstres). La cible éveillée subit l'état Charmé pendant 30 jours, sauf si vous-même ou l'un de vos compagnons lui infligez des dégâts. Quand cet état prend fin, la créature éveillée choisit l'attitude qu'elle adopte à votre égard. RES 7 1&quot; Lea<\/p>\n"}, {"nom": "Fabrication", "ecole": "Transmutation", "niveau": 4, "classes": ["Magicien"], "incantation": "10 minutes", "portee": "36 m", "composantes": "V, S", "duree": "instantanée", "pages_source": [284], "description": "Vous convertissez des matières premières en produits finis. Vous pouvez ainsi fabriquer un pont de bois à partir d'un massif d'arbres, une corde à partir d'un tas de chanvre et des vêtements avec de la laine ou du lin en vrac. Choisissez des matières premières que vous voyez à portée. Vous pouvez fabriquer un objet de taille G ou inférieure (qui loge dans un Cube de 3 m ou huit Cubes contigus de 1,50 m), à condition de disposer de suffisamment de matières premières. Si vous optez pour du métal, de la pierre ou toute autre substance minérale, l'objet fabriqué ne peut toutefois pas dépasser une taille M (qui loge dans un Cube de 1,50 m). La facture des objets ainsi confectionnés est à la mesure de la qualité des matières premières. Vous ne pouvez pas créer d'objet magique ni de créature avec ce sort. De même, vous ne pouvez pas créer d'objets dont la confection demande un savoir-faire exceptionnel, comme des armes ou des armures, sauf si vous disposez de la maîtrise des outils d'artisan correspondants.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "fabrication", "html_body": "<p>Vous convertissez des matières premières en produits finis. Vous pouvez ainsi fabriquer un pont de bois à partir d'un massif d'arbres, une corde à partir d'un tas de chanvre et des vêtements avec de la laine ou du lin en vrac. Choisissez des matières premières que vous voyez à portée. Vous pouvez fabriquer un objet de taille G ou inférieure (qui loge dans un Cube de 3 m ou huit Cubes contigus de 1,50 m), à condition de disposer de suffisamment de matières premières. Si vous optez pour du métal, de la pierre ou toute autre substance minérale, l'objet fabriqué ne peut toutefois pas dépasser une taille M (qui loge dans un Cube de 1,50 m). La facture des objets ainsi confectionnés est à la mesure de la qualité des matières premières. Vous ne pouvez pas créer d'objet magique ni de créature avec ce sort. De même, vous ne pouvez pas créer d'objets dont la confection demande un savoir-faire exceptionnel, comme des armes ou des armures, sauf si vous disposez de la maîtrise des outils d'artisan correspondants.<\/p>\n"}, {"nom": "Façonnage de la Pierre", "ecole": "Transmutation", "niveau": 4, "classes": ["Clerc", "Druide", "Magicien"], "incantation": "action", "portee": "contact", "composantes": "V, S, Méhhmees", "duree": "instantanée |", "pages_source": [284, 285], "description": "LE SORT FESTIN DES HÉROS ME AVENTURIERS DANS LES MEILLE DISPOSITIONS Vous touchez physiquement un objet de pierre de taille M ou inférieure ou une section de pierre dont aucune dimension n'excède 1,50 m, pour les modeler à votre guise. Vous pouvez ainsi façonner un gros rocher en arme, en statue ou en caisson, ou pratiquer un passage dans une paroi dont l'épaisseur ne dépasse pas 1,50 m. Vous pourriez aussi modeler une porte de pierre ou en refaçonner l'encadrement pour la condamner. L'objet confectionné peut être doté d'un maximum de deux charnières et d’un loquet, mais les éléments mécaniques plus sophistiqués sont proscrits.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "faconnage-de-la-pierre", "html_body": "<p>LE SORT FESTIN DES HÉROS ME AVENTURIERS DANS LES MEILLE DISPOSITIONS Vous touchez physiquement un objet de pierre de taille M ou inférieure ou une section de pierre dont aucune dimension n'excède 1,50 m, pour les modeler à votre guise. Vous pouvez ainsi façonner un gros rocher en arme, en statue ou en caisson, ou pratiquer un passage dans une paroi dont l'épaisseur ne dépasse pas 1,50 m. Vous pourriez aussi modeler une porte de pierre ou en refaçonner l'encadrement pour la condamner. L'objet confectionné peut être doté d'un maximum de deux charnières et d’un loquet, mais les éléments mécaniques plus sophistiqués sont proscrits.<\/p>\n"}, {"nom": "Faux Amis", "ecole": "Enchantement", "niveau": 0, "classes": ["Barde", "Ensorceleur", "Magicien", "Occultiste"], "incantation": "À vérifier", "portee": "3 m", "composantes": "S, M (un peu de maquillage)", "duree": "Concentration, jusqu’à 1 minute", "pages_source": [285], "description": "Il émane de vous une cordialité magique adressée à une créature que vous voyez à portée. La cible doit réussir un jet de sauvegarde de Sagesse sous peine de subir l'état Charmé pour toute la durée du sort. Elle réussit automatiquement ce JS si elle n'est pas Humanoïde, si vous êtes en train de l'affronter ou si vous avez déjà lancé ce sort sur elle depuis moins de 24 heures. Le sort prend fin prématurément si la cible subit des dégâts, de même que si vous effectuez un jet d'attaque, infligez des dégâts ou contraignez quiconque à un jet de sauvegarde. Lorsque le sort prend fin, la cible sait que vous l'avez Charmée.", "illustration": null, "legende_illustration": null, "notes_verification": "champ_absent:incantation", "statut": "ocr_non_valide", "id": "faux-amis", "html_body": "<p>Il émane de vous une cordialité magique adressée à une créature que vous voyez à portée. La cible doit réussir un jet de sauvegarde de Sagesse sous peine de subir l'état Charmé pour toute la durée du sort. Elle réussit automatiquement ce JS si elle n'est pas Humanoïde, si vous êtes en train de l'affronter ou si vous avez déjà lancé ce sort sur elle depuis moins de 24 heures. Le sort prend fin prématurément si la cible subit des dégâts, de même que si vous effectuez un jet d'attaque, infligez des dégâts ou contraignez quiconque à un jet de sauvegarde. Lorsque le sort prend fin, la cible sait que vous l'avez Charmée.<\/p>\n"}, {"nom": "Faveur divine", "ecole": "Transmutation", "niveau": 1, "classes": ["Paladin"], "incantation": "action Bonus", "portee": "personnelle", "composantes": "V, S", "duree": "1 minute", "pages_source": [285], "description": "Jusqu'à la fin du sort, vos attaques avec une arme infligent 1d4 dégâts radiants supplémentaires quand elles touchent.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "faveur-divine", "html_body": "<p>Jusqu'à la fin du sort, vos attaques avec une arme infligent 1d4 dégâts radiants supplémentaires quand elles touchent.<\/p>\n"}, {"nom": "Festin des Héros", "ecole": "Invocation", "niveau": 6, "classes": ["Barde", "Clerc", "Druide"], "incantation": "10 minutes", "portee": "personnelle", "composantes": "V, S, M (un vase incrusté de gemmes d’une valeur minimale de 1 000 po, que le sort détruit)", "duree": "instantanée", "pages_source": [285, 286], "description": "Vous invoquez un festin qui se présente sur une surface dans un Cube inoccupé de 3 m, à côté de vous. Il faut 1 heure pour ingérer ce festin, tous les plats disparaissant à l'issue de cet intervalle. Les bénéfices ne se font pas sentir avant la fin de l'heure. Un maximum de douze créatures peuvent participer au banquet. Une créature qui a figuré parmi les convives reçoit plusieurs bénéfices, qui persistent pendant 24 heures. Elle bénéficie de la Résistance aux dégâts de poison et de CHAPITRE 7 | SORTS 285 ou ute chésture dans us PONTS EE eZ PES Portée : 18 m Composantes : V, 1 fune pate TRS Durée : 1 minute\nChoisissez jusqu'à cinq créatures qui chutent à portée. La Vitesse de chute de chacune passe à 18 m par round jusqu’à la fin du sort. Si la créature atterrit avant la fin du sort, elle ne subit aucun dégât de chute et le sort prend fin en ce qui la concerne. a", "illustration": null, "legende_illustration": null, "notes_verification": "symboles_suspects", "statut": "ocr_non_valide", "id": "festin-des-heros", "html_body": "<p>Vous invoquez un festin qui se présente sur une surface dans un Cube inoccupé de 3 m, à côté de vous. Il faut 1 heure pour ingérer ce festin, tous les plats disparaissant à l'issue de cet intervalle. Les bénéfices ne se font pas sentir avant la fin de l'heure. Un maximum de douze créatures peuvent participer au banquet. Une créature qui a figuré parmi les convives reçoit plusieurs bénéfices, qui persistent pendant 24 heures. Elle bénéficie de la Résistance aux dégâts de poison et de CHAPITRE 7 | SORTS 285 ou ute chésture dans us PONTS EE eZ PES Portée : 18 m Composantes : V, 1 fune pate TRS Durée : 1 minute\nChoisissez jusqu'à cinq créatures qui chutent à portée. La Vitesse de chute de chacune passe à 18 m par round jusqu’à la fin du sort. Si la créature atterrit avant la fin du sort, elle ne subit aucun dégât de chute et le sort prend fin en ce qui la concerne. a<\/p>\n"}, {"nom": "Flamme Éternelle", "ecole": "Évocation", "niveau": 2, "classes": ["Clerc", "Druide", "Magicien"], "incantation": "action", "portee": "contact", "composantes": "V, S, M (poudre de rubis d'une valeur minimale de 50 po, que le sort détruit)", "duree": "jusqu'à dissipation", "pages_source": [286], "description": "Une flamme jaillit d'un objet que vous touchez physiquement. L'effet produit une Lumière vive sur un rayon de 6 m et une Lumière faible sur 6 m de plus. La flamme paraît ordinaire, mais elle ne produit aucune chaleur et s'alimente d'elle-même. On peut recouvrir ou cacher la flamme, mais ni l'étouffer ni l'éteindre.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "flamme-eternelle", "html_body": "<p>Une flamme jaillit d'un objet que vous touchez physiquement. L'effet produit une Lumière vive sur un rayon de 6 m et une Lumière faible sur 6 m de plus. La flamme paraît ordinaire, mais elle ne produit aucune chaleur et s'alimente d'elle-même. On peut recouvrir ou cacher la flamme, mais ni l'étouffer ni l'éteindre.<\/p>\n"}, {"nom": "Flamme Sacrée", "ecole": "Évocation", "niveau": 0, "classes": ["Clerc"], "incantation": "action", "portee": "18 m", "composantes": "V, S", "duree": "instantanée", "pages_source": [286], "description": "Une radiance embrasée s'abat sur une créature que vous voyez à portée. La cible doit réussir un jet de sauvegarde de\nDextérité sous peine de subir 1d8 dégâts radiants. Les Abris partiels et supérieurs ne confèrent aucun bénéfice dans le cadre de ce jet de sauvegarde.\nAmélioration de sort mineur. Les dégâts augmentent de 1d8 lorsque vous atteignez les niveaux 5 (2d8), 11 (348) et 17 (4d8). <<", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "flamme-sacree", "html_body": "<p>Une radiance embrasée s'abat sur une créature que vous voyez à portée. La cible doit réussir un jet de sauvegarde de\nDextérité sous peine de subir 1d8 dégâts radiants. Les Abris partiels et supérieurs ne confèrent aucun bénéfice dans le cadre de ce jet de sauvegarde.\nAmélioration de sort mineur. Les dégâts augmentent de 1d8 lorsque vous atteignez les niveaux 5 (2d8), 11 (348) et 17 (4d8). &lt;&lt;<\/p>\n"}, {"nom": "Flammes", "ecole": "Invocation", "niveau": 0, "classes": ["Druide"], "incantation": "action Bonus", "portee": "personnelle", "composantes": "V, S", "duree": "10 minutes", "pages_source": [286], "description": "Une flamme vacillante prend vie dans votre main et y reste pour toute la durée. Tant qu’elles sont dans votre main, les flammes ne produisent pas de chaleur et n’embrasent rien, mais projettent une Lumière vive sur un rayon de 6 m et une Lumière faible sur 6 m de plus. Le sort prend fin si vous le lancez à nouveau.\n\nJusqu’à la fin du sort, vous pouvez entreprendre l’action Magie pour projeter des flammes sur une créature ou un objet dans un rayon de 18 m. Effectuez une attaque de sort à distance. Si l’attaque touche, la cible subit 1d8 dégâts de feu.\n\n**Amélioration de sort mineur.** Les dégâts augmentent de 1d8 lorsque vous atteignez les niveaux 5 (2d8), 11 (3d8) et 17 (4d8).", "illustration": null, "legende_illustration": null, "notes_verification": "Transcription reprise directement sur les scans du manuel ; relecture exhaustive du lot encore nécessaire.", "statut": "ocr_non_valide", "id": "flammes", "html_body": "<p>Une flamme vacillante prend vie dans votre main et y reste pour toute la durée. Tant qu’elles sont dans votre main, les flammes ne produisent pas de chaleur et n’embrasent rien, mais projettent une Lumière vive sur un rayon de 6 m et une Lumière faible sur 6 m de plus. Le sort prend fin si vous le lancez à nouveau.<\/p>\n<p>Jusqu’à la fin du sort, vous pouvez entreprendre l’action Magie pour projeter des flammes sur une créature ou un objet dans un rayon de 18 m. Effectuez une attaque de sort à distance. Si l’attaque touche, la cible subit 1d8 dégâts de feu.<\/p>\n<p><strong>Amélioration de sort mineur.<\/strong> Les dégâts augmentent de 1d8 lorsque vous atteignez les niveaux 5 (2d8), 11 (3d8) et 17 (4d8).<\/p>\n"}, {"nom": "Fléau D'Insectes", "ecole": "Invocation", "niveau": 5, "classes": [], "incantation": "action “ e.", "portee": "90 m Ar", "composantes": "V, S, M (un criquet) 4", "duree": "Concentration, jusqu'à 10 minutes", "pages_source": [286], "description": "Des nuées grouillantes de criquets emplissent une de 6 m de rayon centrée sur un point que vous choisis à portée. La Sphère persiste pour toute la durée, et sa zon est à Visibilité réduite et constitue un Terrain difficile. Chaque créature prise dans la nuée à son apparition effectue un jet de sauvegarde de Constitution, et subit 4d10 dégâts perforants en cas d'échec, la moitié en cas de réussite. Une créature effectue aussi ce JS lorsqu'elle pénètre dans la zone du sort pour la première fois d'un tour ou qu'elle y termine son tour. Une même créature n'effectue en aucun cas ce JS plus d'une fois par tour.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d10 par niveau d'emplacement au-delà du 5°. = Le", "illustration": null, "legende_illustration": null, "notes_verification": "classes_manquantes", "statut": "ocr_non_valide", "id": "fleau-d-insectes", "html_body": "<p>Des nuées grouillantes de criquets emplissent une de 6 m de rayon centrée sur un point que vous choisis à portée. La Sphère persiste pour toute la durée, et sa zon est à Visibilité réduite et constitue un Terrain difficile. Chaque créature prise dans la nuée à son apparition effectue un jet de sauvegarde de Constitution, et subit 4d10 dégâts perforants en cas d'échec, la moitié en cas de réussite. Une créature effectue aussi ce JS lorsqu'elle pénètre dans la zone du sort pour la première fois d'un tour ou qu'elle y termine son tour. Une même créature n'effectue en aucun cas ce JS plus d'une fois par tour.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d10 par niveau d'emplacement au-delà du 5°. = Le<\/p>\n"}, {"nom": "Flèche Acide de Melf", "ecole": "Évocation", "niveau": 2, "classes": ["Magicien"], "incantation": "action", "portee": "27 m", "composantes": "V, S, M (une feuille de rhubarbe en poudre)", "duree": "instantanée", "pages_source": [286, 287], "description": "Une flèche d'un vert chatoyant fuse vers une cible à portée avant de produire une gerbe d'acide. Effectuez une attaque de sort à distance contre la cible. Si l'attaque touche, la cible subit aussitôt 4d4 dégâts d'acide, puis 2d4 dégâts d'acide à la fin de son tour suivant. Si l'attaque rate, la flèche asperge la cible d'acide en lui infligeant uniquement la moitié des dégâts initiaux.\nEmplacement de niveau supérieur. Les dégâts (initiaux et consécutifs) augmentent de 1d4 par niveau d'emplacement au-delà du 2°. _ $ L'AuDACIEUX MAGICIEN MELF DARDE UN TROËL DÉVASTAIEUR D’UNE FLÈCHE ACIDE DE MELF V2 Ru LE", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "fleche-acide-de-melf", "html_body": "<p>Une flèche d'un vert chatoyant fuse vers une cible à portée avant de produire une gerbe d'acide. Effectuez une attaque de sort à distance contre la cible. Si l'attaque touche, la cible subit aussitôt 4d4 dégâts d'acide, puis 2d4 dégâts d'acide à la fin de son tour suivant. Si l'attaque rate, la flèche asperge la cible d'acide en lui infligeant uniquement la moitié des dégâts initiaux.\nEmplacement de niveau supérieur. Les dégâts (initiaux et consécutifs) augmentent de 1d4 par niveau d'emplacement au-delà du 2°. _ $ L'AuDACIEUX MAGICIEN MELF DARDE UN TROËL DÉVASTAIEUR D’UNE FLÈCHE ACIDE DE MELF V2 Ru LE<\/p>\n"}, {"nom": "Flèche de Foudre", "ecole": "Transmutation", "niveau": 3, "classes": ["Rôdeur"], "incantation": "action Bonus, que vous entreprenez juste après avoir touché ou raté une cible avec une attaque à distance avec une arme.", "portee": "personnelle", "composantes": "V, S", "duree": "instantanée", "pages_source": [287], "description": "À l'instant où votre attaque touche ou rate la cible, l'arme ou le projectile se transforme en éclair. Au lieu de subir les dégâts et éventuels effets de l'attaque, la cible subit 4d8 dégâts de foudre si l'attaque touche, la moitié si elle rate. Chaque créature située dans un rayon de 3 m de la cible effectue alors un jet de sauvegarde de Dextérité et subit 2d8 dégâts de foudre en cas d'échec, la moitié en cas de réussite.\nL'arme ou le projectile retrouve alors sa forme normale.\nEmplacement de niveau supérieur. Les dégâts des deux effets du sort augmentent de 1d8 par niveau d'emplacement au-delà du 3°.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "fleche-de-foudre", "html_body": "<p>À l'instant où votre attaque touche ou rate la cible, l'arme ou le projectile se transforme en éclair. Au lieu de subir les dégâts et éventuels effets de l'attaque, la cible subit 4d8 dégâts de foudre si l'attaque touche, la moitié si elle rate. Chaque créature située dans un rayon de 3 m de la cible effectue alors un jet de sauvegarde de Dextérité et subit 2d8 dégâts de foudre en cas d'échec, la moitié en cas de réussite.\nL'arme ou le projectile retrouve alors sa forme normale.\nEmplacement de niveau supérieur. Les dégâts des deux effets du sort augmentent de 1d8 par niveau d'emplacement au-delà du 3°.<\/p>\n"}, {"nom": "Flétrissement", "ecole": "Nécromancie", "niveau": 4, "classes": ["Druide", "Ensorceleur", "Magicien", "Occultiste"], "incantation": "action", "portee": "9 m", "composantes": "V, S", "duree": "instantanée", "pages_source": [287, 288], "description": "Une créature que voyez à portée effectue un jet de sauvegarde de Constitution et subit 8d8 dégâts nécrotiques en cas d'échec, la moitié en cas de réussite. Une Plante rate automatiquement ce JS. Au lieu de cela, vous pouvez cibler une plante non magique qui n’est pas une créature, comme un arbre ou un arbuste.\nElle n'effectue pas de JS, mais se flétrit et meurt.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d8 par niveau d'emplacement au-delà du 4:.\n\nLe 1e IV PRES RE itration, jusqu’à 1 minute L Dee. Un assaillant qui vous perçoit par la Vision aveugle ou la\nVision lucide est immunisé contre cet effet. Et on A CN EE", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "fletrissement", "html_body": "<p>Une créature que voyez à portée effectue un jet de sauvegarde de Constitution et subit 8d8 dégâts nécrotiques en cas d'échec, la moitié en cas de réussite. Une Plante rate automatiquement ce JS. Au lieu de cela, vous pouvez cibler une plante non magique qui n’est pas une créature, comme un arbre ou un arbuste.\nElle n'effectue pas de JS, mais se flétrit et meurt.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d8 par niveau d'emplacement au-delà du 4:.<\/p>\n<p>Le 1e IV PRES RE itration, jusqu’à 1 minute L Dee. Un assaillant qui vous perçoit par la Vision aveugle ou la\nVision lucide est immunisé contre cet effet. Et on A CN EE<\/p>\n"}, {"nom": "Fontaine de Lune", "ecole": "Évocation", "niveau": 4, "classes": ["Barde", "Druide"], "incantation": "action", "portee": "personnelle", "composantes": "V, S", "duree": "Concentration, jusqu'à 10 minutes", "pages_source": [288], "description": "COLE . ». a” “ ; Composantes Une douce lumière enveloppe votre corps pour toute la durée en produisant une Lumière vive dans un rayon de 6 m et une Lumière faible sur 6 m de plus. Jusqu'à la fin du sort, vous recevez la Résistance aux dégâts radiants, et vos attaques de corps à corps infligent 2d6 dégâts radiants supplémentaires quand elles touchent. De plus, aussitôt après avoir subi des dégâts par une créature que vous voyez dans un rayon de 18 m, vous pouvez jouer votre Réaction pour la contraindre à un jet de sauvegarde de Constitution. En cas d'échec, la créature subit l'état Aveuglé jusqu'à la fin de votre tour suivant.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "fontaine-de-lune", "html_body": "<p>COLE . ». a” “ ; Composantes Une douce lumière enveloppe votre corps pour toute la durée en produisant une Lumière vive dans un rayon de 6 m et une Lumière faible sur 6 m de plus. Jusqu'à la fin du sort, vous recevez la Résistance aux dégâts radiants, et vos attaques de corps à corps infligent 2d6 dégâts radiants supplémentaires quand elles touchent. De plus, aussitôt après avoir subi des dégâts par une créature que vous voyez dans un rayon de 18 m, vous pouvez jouer votre Réaction pour la contraindre à un jet de sauvegarde de Constitution. En cas d'échec, la créature subit l'état Aveuglé jusqu'à la fin de votre tour suivant.<\/p>\n"}, {"nom": "Force Fantasmagorique", "ecole": "Illusion", "niveau": 2, "classes": ["Barde", "Ensorceleur", "Magicien"], "incantation": "action", "portee": "18 m", "composantes": "V, S, M (un peu de laine brute)", "duree": "Concentration, jusqu'à 1 minute", "pages_source": [288], "description": "Vous tentez de concevoir une illusion dans l'esprit d'une créature que vous voyez à portée. La cible effectue un jet de sauvegarde d'Intelligence. Si elle le rate, vous créez un objet, une créature ou autre forme fantasmatique dont le volume n'excède pas un Cube de 3 m. Seule la cible le perçoit pour toute la durée. L'illusion fait intervenir l'ouïe, la perception de la température et d’autres sens de la créature. Au prix de l'action Étude, la cible peut examiner la manifestation en effectuant un test d'Intelligence (Investigation) contre le DD de sauvegarde du sort. En cas de réussite, elle perce l'illusion et le sort prend fin. Tant qu'elle est affectée par le sort, la cible considère ce qu'elle perçoit comme réel et tout ce qui est incohérent dans ses interactions avec l'illusion se justifie à son sens. Exemple : une cible foule un pont fantasmatique enjambant un gouffre et survit à la chute ; elle reste convaincue de", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "force-fantasmagorique", "html_body": "<p>Vous tentez de concevoir une illusion dans l'esprit d'une créature que vous voyez à portée. La cible effectue un jet de sauvegarde d'Intelligence. Si elle le rate, vous créez un objet, une créature ou autre forme fantasmatique dont le volume n'excède pas un Cube de 3 m. Seule la cible le perçoit pour toute la durée. L'illusion fait intervenir l'ouïe, la perception de la température et d’autres sens de la créature. Au prix de l'action Étude, la cible peut examiner la manifestation en effectuant un test d'Intelligence (Investigation) contre le DD de sauvegarde du sort. En cas de réussite, elle perce l'illusion et le sort prend fin. Tant qu'elle est affectée par le sort, la cible considère ce qu'elle perçoit comme réel et tout ce qui est incohérent dans ses interactions avec l'illusion se justifie à son sens. Exemple : une cible foule un pont fantasmatique enjambant un gouffre et survit à la chute ; elle reste convaincue de<\/p>\n"}, {"nom": "Forme Éthérée", "ecole": "Invocation", "niveau": 7, "classes": ["Barde", "Clerc", "Ensorceleur", "PRE", "Occultiste"], "incantation": "action", "portee": "personnelle", "composantes": "V, S", "duree": "jusqu'à 8 heures", "pages_source": [288], "description": "Vous pénétrez dans les régions frontalières du Plan Éthéré, bordure où il chevauche votre plan actuel. Vous demeurez dans la Frontière éthérée pour toute la durée. Durant cet intervalle, vous pouvez vous déplacer dans n'importe quelle direction. Si vous vous déplacez vers le haut ou le bas, toute distance parcourue vous coûte le double. Vous percevez ce qui se passe sur le plan d'où vous venez, mais tout est nuances de gris et votre vision ne porte que sur 18 m. Tant que vous êtes sur le Plan Éthéré, seuls les créatures, objets et effets de ce plan peuvent vous affecter, et réciproquement. Les créatures qui ne s'y trouvent pas ne vous perçoivent pas et ne peuvent interagir avec vous, a moins d'en avoir la faculté qui leur en donne la possibilité. Quand le sort prend fin, vous retournez aussitôt sur votre plan de départ, à l'endroit équivalent à l'espace que vous occupez actuellement dans la Frontière éthérée. Si vous apparaissez dans un espace occupé, vous subissez un transfert dans l'espace inoccupé le plus proche, chaque tranche de 30 cm de ce transfert forcé vous infligeant 2 dégâts de force. Ce sort prend fin sur-le-champ si vous le lancez tandis que vous êtes sur le Plan Éthéré ou un plan avec lequel il n'a pas de frontière, comme les Plans Extérieurs.\nEmplacement de niveau supérieur. Vous pouvez cibler un maximum de trois créatures consentantes (y compris vous) par niveau d'emplacement au-delà du 7°, Ces créatures doivent se trouver dans un rayon de 3 m de vous à l'incantation du sort.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "forme-etheree", "html_body": "<p>Vous pénétrez dans les régions frontalières du Plan Éthéré, bordure où il chevauche votre plan actuel. Vous demeurez dans la Frontière éthérée pour toute la durée. Durant cet intervalle, vous pouvez vous déplacer dans n'importe quelle direction. Si vous vous déplacez vers le haut ou le bas, toute distance parcourue vous coûte le double. Vous percevez ce qui se passe sur le plan d'où vous venez, mais tout est nuances de gris et votre vision ne porte que sur 18 m. Tant que vous êtes sur le Plan Éthéré, seuls les créatures, objets et effets de ce plan peuvent vous affecter, et réciproquement. Les créatures qui ne s'y trouvent pas ne vous perçoivent pas et ne peuvent interagir avec vous, a moins d'en avoir la faculté qui leur en donne la possibilité. Quand le sort prend fin, vous retournez aussitôt sur votre plan de départ, à l'endroit équivalent à l'espace que vous occupez actuellement dans la Frontière éthérée. Si vous apparaissez dans un espace occupé, vous subissez un transfert dans l'espace inoccupé le plus proche, chaque tranche de 30 cm de ce transfert forcé vous infligeant 2 dégâts de force. Ce sort prend fin sur-le-champ si vous le lancez tandis que vous êtes sur le Plan Éthéré ou un plan avec lequel il n'a pas de frontière, comme les Plans Extérieurs.\nEmplacement de niveau supérieur. Vous pouvez cibler un maximum de trois créatures consentantes (y compris vous) par niveau d'emplacement au-delà du 7°, Ces créatures doivent se trouver dans un rayon de 3 m de vous à l'incantation du sort.<\/p>\n"}, {"nom": "Forme Gazeuse", "ecole": "Transmutation", "niveau": 3, "classes": ["Ensorceleur", "Magicien", "Occultiste"], "incantation": "action", "portee": "contact", "composantes": "V, S, M (un peu de gaze)", "duree": "Concentration, jusqu'à 1 heure", "pages_source": [288, 289], "description": "Pour toute la durée, une créature consentante que vous touchez se métamorphose, ainsi que tout ce qu'elle porte, en nuage de brume. Le sort prend fin si la cible tombe à O point de vie ou si elle entreprend l'action Magie pour y mettre fin sur elle-même. contre l'état À terre ; LÉ ehenre: Fa us de sauvegarde de Force, Dextérité et Constitution. Elle peut se glisser dans les ouvertures les plus étroites, mais les liquides sont traités dans son cas comme des surfaces solides. La cible ne peut ni parler ni manipuler d'objets, et il lui reste impossible de lâcher ou d'utiliser ce qu'elle portait, ou d'interagir avec cet équipement. La cible ne peut ni attaquer ni lancer de sorts.\nEmplacement de niveau supérieur. Vous pouvez cibler une créature supplémentaire par niveau d'emplacement au-delà du 3°.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "forme-gazeuse", "html_body": "<p>Pour toute la durée, une créature consentante que vous touchez se métamorphose, ainsi que tout ce qu'elle porte, en nuage de brume. Le sort prend fin si la cible tombe à O point de vie ou si elle entreprend l'action Magie pour y mettre fin sur elle-même. contre l'état À terre ; LÉ ehenre: Fa us de sauvegarde de Force, Dextérité et Constitution. Elle peut se glisser dans les ouvertures les plus étroites, mais les liquides sont traités dans son cas comme des surfaces solides. La cible ne peut ni parler ni manipuler d'objets, et il lui reste impossible de lâcher ou d'utiliser ce qu'elle portait, ou d'interagir avec cet équipement. La cible ne peut ni attaquer ni lancer de sorts.\nEmplacement de niveau supérieur. Vous pouvez cibler une créature supplémentaire par niveau d'emplacement au-delà du 3°.<\/p>\n"}, {"nom": "Fou Rire de Tasha", "ecole": "Enchantement", "niveau": 1, "classes": ["Barde", "Magicien", "Occultiste"], "incantation": "action", "portee": "9 m", "composantes": "V, S, M (une tartelette et une plume)", "duree": "Concentration, jusqu'à 1 minute", "pages_source": [289], "description": "Une créature que vous voyez à portée effectue un jet de sauvegarde de Sagesse. En cas d'échec, elle subit les états\nÀ terre et Neutralisé pour toute la durée. Tout ce temps, elle est prise d'un fou rire si elle a la faculté de rire et ne peut se relever d'elle-même. À la fin de chacun de ses tours et chaque fois qu'elle subit des dégâts, la cible réitère le JS Sagesse. Elle a l'Avantage à ce JS s'il est déclenché par des dégâts. En cas de réussite, le sort prend fin.\nEmplacement de niveau supérieur. Vous pouvez cibler une créature supplémentaire par niveau d'emplacement au-delà du 1°.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "fou-rire-de-tasha", "html_body": "<p>Une créature que vous voyez à portée effectue un jet de sauvegarde de Sagesse. En cas d'échec, elle subit les états\nÀ terre et Neutralisé pour toute la durée. Tout ce temps, elle est prise d'un fou rire si elle a la faculté de rire et ne peut se relever d'elle-même. À la fin de chacun de ses tours et chaque fois qu'elle subit des dégâts, la cible réitère le JS Sagesse. Elle a l'Avantage à ce JS s'il est déclenché par des dégâts. En cas de réussite, le sort prend fin.\nEmplacement de niveau supérieur. Vous pouvez cibler une créature supplémentaire par niveau d'emplacement au-delà du 1°.<\/p>\n"}, {"nom": "Fouet Épineux", "ecole": "Transmutation", "niveau": 0, "classes": ["Druide"], "incantation": "action", "portee": "9 m", "composantes": "V, S, M (une tige de plante épineuse)", "duree": "instantanée", "pages_source": [289], "description": "Vous créez un fou ant que vous ne faites qu'un avec la pierre. Vous pouvez consacrer 1,50 m de votre déplacement à émerger de la pierre à l'endroit par lequel vous l'avez intégrée, ce qui met fin au sort. Pour le reste, vous ne pouvez pas vous déplacer. e. La ral totale de la dans une autre matière) vous ant 50 dégâts de force. Lors de vous retrouvez avec l'état À terre dans : plus proche de l'endroit par lequel vous<\/p>\n"}, {"nom": "Gardien de la Foi", "ecole": "Invocation", "niveau": 4, "classes": ["Clerc"], "incantation": "action", "portee": "9 m", "composantes": "V", "duree": "8 heures", "pages_source": [291], "description": "Un gardien spectral de taille G apparaît pour toute la durée et flotte en un espace inoccupé que vous voyez à portée. Le gardien, invulnérable, occupe cet espace et se présente sous une forme adaptée à votre divinité ou panthéon. Tout ennemi qui se déplace dans un espace à 3 m ou moins du gardien pour la première fois d’un tour ou qui y commence son tour effectue un jet de sauvegarde de Dextérité et subit 20 dégâts radiants en cas d’échec, la moitié en cas de réussite. Le gardien disparaît après avoir infligé un total de 60 dégâts.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "gardien-de-la-foi", "html_body": "<p>Un gardien spectral de taille G apparaît pour toute la durée et flotte en un espace inoccupé que vous voyez à portée. Le gardien, invulnérable, occupe cet espace et se présente sous une forme adaptée à votre divinité ou panthéon. Tout ennemi qui se déplace dans un espace à 3 m ou moins du gardien pour la première fois d’un tour ou qui y commence son tour effectue un jet de sauvegarde de Dextérité et subit 20 dégâts radiants en cas d’échec, la moitié en cas de réussite. Le gardien disparaît après avoir infligé un total de 60 dégâts.<\/p>\n"}, {"nom": "Glas", "ecole": "Nécromancie", "niveau": 0, "classes": ["Clerc", "Magicien", "Occultiste"], "incantation": "À vérifier", "portee": "18 m", "composantes": "V, S", "duree": "instantanée", "pages_source": [291], "description": "Vous pointez du doigt une créature que vous voyez à portée et le tintement mélancolique d’une cloche résonne autour d'elle, audible dans un rayon de 3 m. La cible doit réussir un jet de sauvegarde de Sagesse sous peine de subir 1d8 dégâts nécrotiques. S'il lui manquait déjà au moins un point de vie, elle subit en fait 1d12 dégâts nécrotiques.\nAmélioration de sort mineur. Les dégâts augmentent d’un dé lorsque vous atteignez les niveaux 5 (2d8 ou 2d12), 11 (3d8 ou 3d12) et 17 (4d8 ou 4d12).", "illustration": null, "legende_illustration": null, "notes_verification": "champ_absent:incantation", "statut": "ocr_non_valide", "id": "glas", "html_body": "<p>Vous pointez du doigt une créature que vous voyez à portée et le tintement mélancolique d’une cloche résonne autour d'elle, audible dans un rayon de 3 m. La cible doit réussir un jet de sauvegarde de Sagesse sous peine de subir 1d8 dégâts nécrotiques. S'il lui manquait déjà au moins un point de vie, elle subit en fait 1d12 dégâts nécrotiques.\nAmélioration de sort mineur. Les dégâts augmentent d’un dé lorsque vous atteignez les niveaux 5 (2d8 ou 2d12), 11 (3d8 ou 3d12) et 17 (4d8 ou 4d12).<\/p>\n"}, {"nom": "Glissement de Terrain", "ecole": "Transmutation", "niveau": 6, "classes": ["Druide", "Ensorceleur", "Magicien"], "incantation": "action", "portee": "36 m", "composantes": "V, S, M (une pelle miniature)", "duree": "Concentration, jusqu'à 2 heures", "pages_source": [291], "description": "Choisissez à portée une zone de terrain dont la longueur ne dépasse pas 12 m. Vous pouvez remodeler la terre, le sable ou l'argile de la zone à votre guise pour toute la durée. Vous Anne Lotions de lo none, chier CN PU - Los! or pp D 1 YO Shrdinumsie la plus grande de “si vous aectez une zone carrée de 12 m ez créer une colonne de 6 m, augmenter auteur du carré de 6 m, creuser une tranchée e 6 m, etc. Ces modifications s'accomplissent en es. Ces transformations ne s ‘opérant que lentement, RéMitires situées dans la zone ne se font généralement as piéger ni blesser par les mouvements de terrain. À la fin de chaque tranche de 10 minutes passées à vous oncentrer sur le sort, vous pouvez choisir une nouvelle one de terrain à portée pour l'affecter. Ce sort ne peut pas manipuler la pierre naturelle ni les âtiments en pierre. La roche et les édifices se contentent e s'adapter au terrain modifié. Si l’altération du terrain 1enace de rendre un édifice instable, il peut effectivement effondrer. De même, ce sort n’affecte pas directement le dévelopement de la flore. La terre déplacée emporte avec elle les lantes qui l'occupent.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "glissement-de-terrain", "html_body": "<p>Choisissez à portée une zone de terrain dont la longueur ne dépasse pas 12 m. Vous pouvez remodeler la terre, le sable ou l'argile de la zone à votre guise pour toute la durée. Vous Anne Lotions de lo none, chier CN PU - Los! or pp D 1 YO Shrdinumsie la plus grande de “si vous aectez une zone carrée de 12 m ez créer une colonne de 6 m, augmenter auteur du carré de 6 m, creuser une tranchée e 6 m, etc. Ces modifications s'accomplissent en es. Ces transformations ne s ‘opérant que lentement, RéMitires situées dans la zone ne se font généralement as piéger ni blesser par les mouvements de terrain. À la fin de chaque tranche de 10 minutes passées à vous oncentrer sur le sort, vous pouvez choisir une nouvelle one de terrain à portée pour l'affecter. Ce sort ne peut pas manipuler la pierre naturelle ni les âtiments en pierre. La roche et les édifices se contentent e s'adapter au terrain modifié. Si l’altération du terrain 1enace de rendre un édifice instable, il peut effectivement effondrer. De même, ce sort n’affecte pas directement le dévelopement de la flore. La terre déplacée emporte avec elle les lantes qui l'occupent.<\/p>\n"}, {"nom": "Globe d’invulnérabilité", "ecole": "Abjuration", "niveau": 6, "classes": ["Ensorceleur", "Magicien"], "incantation": "action", "portee": "personnelle", "composantes": "V, S, M (une perle en verre)", "duree": "Concentration, jusqu’à 1 minute", "pages_source": [291], "description": "Une barrière immobile qui chatoie se matérialise sous forme d’une Émanation de 3 m qui persiste pour toute la durée.\n\nTout sort du 5e niveau ou inférieur lancé depuis l’extérieur de la barrière ne peut affecter ce qui s’y trouve à l’intérieur. Un tel sort peut cibler les créatures et objets situés dans le globe, mais il reste sur eux sans effet. De même, la zone comprise dans la barrière est exclue des zones d’effet créées par de tels sorts.\n\n**Emplacement de niveau supérieur.** La barrière bloque les sorts d’un niveau de plus par niveau d’emplacement au-delà du 6e.", "illustration": null, "legende_illustration": null, "notes_verification": "Transcription reprise directement sur les scans du manuel ; relecture exhaustive du lot encore nécessaire.", "statut": "ocr_non_valide", "id": "globe-d-invulnerabilite", "html_body": "<p>Une barrière immobile qui chatoie se matérialise sous forme d’une Émanation de 3 m qui persiste pour toute la durée.<\/p>\n<p>Tout sort du 5e niveau ou inférieur lancé depuis l’extérieur de la barrière ne peut affecter ce qui s’y trouve à l’intérieur. Un tel sort peut cibler les créatures et objets situés dans le globe, mais il reste sur eux sans effet. De même, la zone comprise dans la barrière est exclue des zones d’effet créées par de tels sorts.<\/p>\n<p><strong>Emplacement de niveau supérieur.<\/strong> La barrière bloque les sorts d’un niveau de plus par niveau d’emplacement au-delà du 6e.<\/p>\n"}, {"nom": "Glyphe de garde", "ecole": "Abjuration", "niveau": 3, "classes": ["Barde", "Clerc", "Magicien"], "incantation": "À vérifier", "portee": "À vérifier", "composantes": "À vérifier", "duree": "À vérifier", "pages_source": [291, 292], "description": "une explosion d'énergies magiques sous forme d'une Sphère de 6 m de rayon centrée sur le glyphe. Chaque créature prise dans la zone effectue un jet de sauvegarde de Dextérité. Elle subit 5d8 dégâts d'acide, de feu, de foudre, de froid ou de tonnerre (type que vous choisissez en inscrivant le glyphe) en cas d'échec, la moitié en cas de réussite.\nGlyphe à sort. Vous pouvez charger le glyphe d'un sort du 3: niveau ou inférieur lors de l'incantation et de la création du glyphe. Le sort doit cibler une seule créature ou une zone. Le sort ainsi appliqué au glyphe n'a pas d'effet immédiat lorsque vous le lancez. C'est seulement lors du déclenchement du glyphe que le sort chargé prend effet. Si le sort a une cible, celle-ci devient la créature qui a provoqué le déclenchement du glyphe. Si le sort affecte une zone, celle-ci est centrée sur cette créature. Si le sort convoque une créature Hostile ou crée un objet nuisible ou un piège, l'élément concerné se matérialise aussi près que possible de l'intrus et l'attaque. Si le sort requiert normalement la Concentration, il persiste jusqu'à la fin de la durée maximale.\nEmplacement de niveau supérieur. Les dégâts d'une rune explosive augmentent de 1d8 par niveau d'emplacement au-delà du 3°. Si vous créez un glyphe à sort, vous pouvez y stocker un sort dont le niveau ne dépasse pas celui de l'emplacement utilisé pour votre glyphe de garde. men", "illustration": null, "legende_illustration": null, "notes_verification": "champ_absent:incantation; champ_absent:portee; champ_absent:composantes; champ_absent:duree", "statut": "ocr_non_valide", "id": "glyphe-de-garde", "html_body": "<p>une explosion d'énergies magiques sous forme d'une Sphère de 6 m de rayon centrée sur le glyphe. Chaque créature prise dans la zone effectue un jet de sauvegarde de Dextérité. Elle subit 5d8 dégâts d'acide, de feu, de foudre, de froid ou de tonnerre (type que vous choisissez en inscrivant le glyphe) en cas d'échec, la moitié en cas de réussite.\nGlyphe à sort. Vous pouvez charger le glyphe d'un sort du 3: niveau ou inférieur lors de l'incantation et de la création du glyphe. Le sort doit cibler une seule créature ou une zone. Le sort ainsi appliqué au glyphe n'a pas d'effet immédiat lorsque vous le lancez. C'est seulement lors du déclenchement du glyphe que le sort chargé prend effet. Si le sort a une cible, celle-ci devient la créature qui a provoqué le déclenchement du glyphe. Si le sort affecte une zone, celle-ci est centrée sur cette créature. Si le sort convoque une créature Hostile ou crée un objet nuisible ou un piège, l'élément concerné se matérialise aussi près que possible de l'intrus et l'attaque. Si le sort requiert normalement la Concentration, il persiste jusqu'à la fin de la durée maximale.\nEmplacement de niveau supérieur. Les dégâts d'une rune explosive augmentent de 1d8 par niveau d'emplacement au-delà du 3°. Si vous créez un glyphe à sort, vous pouvez y stocker un sort dont le niveau ne dépasse pas celui de l'emplacement utilisé pour votre glyphe de garde. men<\/p>\n"}, {"nom": "Graisse", "ecole": "Invocation", "niveau": 1, "classes": ["Ensorceleur", "Magicien"], "incantation": "action", "portee": "18 m", "composantes": "V, S, M (un peu de couenne de porc ou de beurre)", "duree": "1 minute", "pages_source": [292], "description": "Une graisse glissante non inflammable recouvre le sol sur un carré de 3 m de côté centré sur un point à portée, ce qui en fait un Terrain difficile pour toute la durée. À l'apparition de la graisse, toute créature se tenant debout dans cette zone doit réussir un jet de sauvegarde de Dextérité sous peine de subir l'état À terre. Une créature ne ee RSS ; de 3 m jusqu'à la fin du sort.\nEmplacement de niveau supérieur. Vous pouvez cibler une créature supplémentaire par niveau d'emplacement au-delà du 1*. ee —", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "graisse", "html_body": "<p>Une graisse glissante non inflammable recouvre le sol sur un carré de 3 m de côté centré sur un point à portée, ce qui en fait un Terrain difficile pour toute la durée. À l'apparition de la graisse, toute créature se tenant debout dans cette zone doit réussir un jet de sauvegarde de Dextérité sous peine de subir l'état À terre. Une créature ne ee RSS ; de 3 m jusqu'à la fin du sort.\nEmplacement de niveau supérieur. Vous pouvez cibler une créature supplémentaire par niveau d'emplacement au-delà du 1*. ee —<\/p>\n"}, {"nom": "Grêle D'Épines", "ecole": "Invocation", "niveau": 1, "classes": ["Rôdeur"], "incantation": "action Bonus, que vous entreprenez aussitôt après avoir touché une créature avec une arme à distance", "portee": "personnelle", "composantes": "V", "duree": "instantanée", "pages_source": [292], "description": "Tandis que l'attaque touche la créature, ce sort produit une pluie d'épines qui jaillit de l'arme à distance ou du projectile. La cible de l'attaque et chaque créature située dans un rayon de 1,50 m d'elle effectuent un jet de sauvegarde de Dextérité et subissent 1d10 dégâts perforants en cas d'échec, la moitié en cas de réussite.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d10 par niveau d'emplacement au-delà du 1®.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "grele-d-epines", "html_body": "<p>Tandis que l'attaque touche la créature, ce sort produit une pluie d'épines qui jaillit de l'arme à distance ou du projectile. La cible de l'attaque et chaque créature située dans un rayon de 1,50 m d'elle effectuent un jet de sauvegarde de Dextérité et subissent 1d10 dégâts perforants en cas d'échec, la moitié en cas de réussite.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d10 par niveau d'emplacement au-delà du 1®.<\/p>\n"}, {"nom": "Guérison", "ecole": "Abjuration", "niveau": 6, "classes": ["Clerc", "Druide"], "incantation": "action", "portee": "18 m", "composantes": "V, S", "duree": "instantanée", "pages_source": [292], "description": "Choisissez une créature que vous voyez à portée. Une vague d'énergie positive baigne la créature, qui récupère 70 points de vie. Ce sort met également fin aux éventuels états\nAssourdi, Aveuglé et Empoisonné de la cible.\nEmplacement de niveau supérieur. Les soins augmentent de 10 par niveau d'emplacement au-delà du 6°,", "illustration": null, "legende_illustration": null, "notes_verification": "encadre_statistiques_a_controler", "statut": "ocr_non_valide", "id": "guerison", "html_body": "<p>Choisissez une créature que vous voyez à portée. Une vague d'énergie positive baigne la créature, qui récupère 70 points de vie. Ce sort met également fin aux éventuels états\nAssourdi, Aveuglé et Empoisonné de la cible.\nEmplacement de niveau supérieur. Les soins augmentent de 10 par niveau d'emplacement au-delà du 6°,<\/p>\n"}, {"nom": "Guérison de Groupe", "ecole": "Abjuration", "niveau": 9, "classes": ["Clerc"], "incantation": "action", "portee": "18 m Th X", "composantes": "À vérifier", "duree": "instantanée Ti Frs", "pages_source": [292, 293], "description": "Temps d’incantation : action Portée : 9 m Composantes : V, S, M (un copeau de racine de réglisse) Durée : Concentration, jusqu'à 1 minute Choisissez une créature consentante que vous voyez à portée. Jusqu'à la fin du sort, la cible voit sa Vitesse doubler, sa classe d'armure reçoit un bonus de +2, elle a l'Avantage aux jets de sauvegarde de Dextérité et bénéficie d'une action supplémentaire à chacun de ses tours. Cette action ne peut servir qu'à entreprendre l’action Attaque (une seule attaque d'arme), Désengagement, Furtivité, Pointe ou Utilisation. Lorsque le sort prend fin, jusqu’à la fin de son tour suivant, la cible en proie à une vague de léthargie subit l'état Neutralisé et sa Vitesse est de O.", "illustration": null, "legende_illustration": null, "notes_verification": "champ_absent:composantes", "statut": "ocr_non_valide", "id": "guerison-de-groupe", "html_body": "<p>Temps d’incantation : action Portée : 9 m Composantes : V, S, M (un copeau de racine de réglisse) Durée : Concentration, jusqu'à 1 minute Choisissez une créature consentante que vous voyez à portée. Jusqu'à la fin du sort, la cible voit sa Vitesse doubler, sa classe d'armure reçoit un bonus de +2, elle a l'Avantage aux jets de sauvegarde de Dextérité et bénéficie d'une action supplémentaire à chacun de ses tours. Cette action ne peut servir qu'à entreprendre l’action Attaque (une seule attaque d'arme), Désengagement, Furtivité, Pointe ou Utilisation. Lorsque le sort prend fin, jusqu’à la fin de son tour suivant, la cible en proie à une vague de léthargie subit l'état Neutralisé et sa Vitesse est de O.<\/p>\n"}, {"nom": "Hérissement de Projectiles", "ecole": "Invocation", "niveau": 3, "classes": ["Rôdeur"], "incantation": "action", "portee": "personnelle", "composantes": "V, S, M (une arme de corps à corps ou à distance d’une valeur minimale de 1 pc)", "duree": "instantanée", "pages_source": [293], "description": "Vous brandissez l'arme utilisée pour l'incantation afin d'invoquer une gerbe d'armes spectrales identiques (ou de projectiles associés) jaillissant vers l'extérieur avant de disparaître. Chaque créature que vous voyez et choisissez dans un Cône de 18 m effectue un jet de sauvegarde de Dextérité et subit 5d8 dégâts de force en cas d'échec, la moitié en cas de réussite.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d8 par niveau d'emplacement au-delà du 3°.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "herissement-de-projectiles", "html_body": "<p>Vous brandissez l'arme utilisée pour l'incantation afin d'invoquer une gerbe d'armes spectrales identiques (ou de projectiles associés) jaillissant vers l'extérieur avant de disparaître. Chaque créature que vous voyez et choisissez dans un Cône de 18 m effectue un jet de sauvegarde de Dextérité et subit 5d8 dégâts de force en cas d'échec, la moitié en cas de réussite.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d8 par niveau d'emplacement au-delà du 3°.<\/p>\n"}, {"nom": "Héroïsme", "ecole": "Enchantement", "niveau": 1, "classes": ["Barde", "Paladin"], "incantation": "action", "portee": "contact", "composantes": "V, S", "duree": "Concentration, jusqu'à 1 minute", "pages_source": [293], "description": "Une créature consentante que vous touchez est investie de vaillance. Jusqu'à la fin du sort, la créature est immunisée contre l’état Effrayé et reçoit autant de points de vie temporaires que votre modificateur de caractéristique d’incantation au début de chacun de ses tours.\nEmplacement de niveau supérieur. Vous pouvez cibler une créature supplémentaire par niveau d'emplacement au-delà du 1“. ] I ; F c M Ô D D nn 7 À", "illustration": null, "legende_illustration": null, "notes_verification": "encadre_statistiques_a_controler", "statut": "ocr_non_valide", "id": "heroisme", "html_body": "<p>Une créature consentante que vous touchez est investie de vaillance. Jusqu'à la fin du sort, la créature est immunisée contre l’état Effrayé et reçoit autant de points de vie temporaires que votre modificateur de caractéristique d’incantation au début de chacun de ses tours.\nEmplacement de niveau supérieur. Vous pouvez cibler une créature supplémentaire par niveau d'emplacement au-delà du 1“. ] I ; F c M Ô D D nn 7 À<\/p>\n"}, {"nom": "Identification", "ecole": "Divination", "niveau": 1, "classes": ["Barde", "Magicien"], "incantation": "1 minute ou rituel", "portee": "contact", "composantes": "V, S, M (une perle d’une valeur minimale de 100 po)", "duree": "instantanée", "pages_source": [293], "description": "Vous touchez physiquement un objet tout au long de l’incantation. S’il s’agit d’un objet magique ou imprégné de magie, vous en apprenez les propriétés et savez les utiliser ; vous savez également si l’Harmonisation est requise et de combien de charges l’objet dispose, le cas échéant. Vous apprenez aussi quels sorts éventuels affectent l’objet. Si l’objet a été créé par un sort, vous apprenez lequel.\n\nSi au lieu d’un objet, vous touchez une créature pendant toute l’incantation, vous apprenez quels sorts éventuels l’affectent.", "illustration": null, "legende_illustration": null, "notes_verification": "Transcription reprise directement sur les scans du manuel ; relecture exhaustive du lot encore nécessaire.", "statut": "ocr_non_valide", "id": "identification", "html_body": "<p>Vous touchez physiquement un objet tout au long de l’incantation. S’il s’agit d’un objet magique ou imprégné de magie, vous en apprenez les propriétés et savez les utiliser ; vous savez également si l’Harmonisation est requise et de combien de charges l’objet dispose, le cas échéant. Vous apprenez aussi quels sorts éventuels affectent l’objet. Si l’objet a été créé par un sort, vous apprenez lequel.<\/p>\n<p>Si au lieu d’un objet, vous touchez une créature pendant toute l’incantation, vous apprenez quels sorts éventuels l’affectent.<\/p>\n"}, {"nom": "Illusion mineure", "ecole": "Illusion", "niveau": 0, "classes": ["Barde", "Ensorceleur", "Magicien", "Occultiste"], "incantation": "À vérifier", "portee": "À vérifier", "composantes": "À vérifier", "duree": "À vérifier", "pages_source": [293, 294], "description": "iteraction physique avec l’image percera l'illusion, car\nIle n’est pas tangible. AIO Mie CHAPITRE 7 | SORTS ARR: * \" PLUS FRS Re 5 Ro Pué.. à. r F2 RECOURIR À ILLUSION pen 4 4 ÊL POUR FAIRE APPARAÎTRE UN MOLOSSE QUI DEMANDE CORDIALEMENT AUX\nINTRUS DE REPARTIR.", "illustration": null, "legende_illustration": null, "notes_verification": "champ_absent:incantation; champ_absent:portee; champ_absent:composantes; champ_absent:duree; symboles_suspects", "statut": "ocr_non_valide", "id": "illusion-mineure", "html_body": "<p>iteraction physique avec l’image percera l'illusion, car\nIle n’est pas tangible. AIO Mie CHAPITRE 7 | SORTS ARR: * &quot; PLUS FRS Re 5 Ro Pué.. à. r F2 RECOURIR À ILLUSION pen 4 4 ÊL POUR FAIRE APPARAÎTRE UN MOLOSSE QUI DEMANDE CORDIALEMENT AUX\nINTRUS DE REPARTIR.<\/p>\n"}, {"nom": "Illusion Programmée", "ecole": "Illusion", "niveau": 6, "classes": ["Barde", "Magicien"], "incantation": "action", "portee": "36 m", "composantes": "V, S, M (poudre de jade d'une valeur minimale de 25 po)", "duree": "jusqu'à dissipation", "pages_source": [294], "description": "Vous créez l'illusion d'un objet, d'une créature ou d'un autre phénomène visible à portée, qui s'active lorsqu'un déclencheur spécifique se présente. L'illusion reste imperceptible jusque-là. Elle doit loger dans un Cube de 9 m et vous décidez à l'incantation du sort comment l'illusion se comporte et quels sons elle produit. Cette performance scénarisée peut durer jusqu'à 5 minutes. Quand le déclencheur se présente, l'illusion prend vie selor le scénario que vous avez décrit. Une fois qu'elle a terminé son numéro, l'illusion disparaît et reste en veilleuse pendant 10 minutes, après quoi on peut la réactiver. Les circonstances de déclenchement peuvent être générales ou détaillées, à votre convenance, mais doivent correspondre à des conditions visuelles ou auditives intervenant dans un rayon de 9 m de la zone. Vous pourriez ainsi créer une illusion de vous-même apparaissant pour mettre autrui en garde contre l'ouverture d'une porte piégée. Toute interaction physique avec l'image percera l'illusion, car elle n'est pas tangible. Une créature qui entreprend l'action Étude pour examiner l'image peut comprendre qu'il\nMr. As illusion en arésneond un prete | on) assorti", "illustration": null, "legende_illustration": null, "notes_verification": "symboles_suspects", "statut": "ocr_non_valide", "id": "illusion-programmee", "html_body": "<p>Vous créez l'illusion d'un objet, d'une créature ou d'un autre phénomène visible à portée, qui s'active lorsqu'un déclencheur spécifique se présente. L'illusion reste imperceptible jusque-là. Elle doit loger dans un Cube de 9 m et vous décidez à l'incantation du sort comment l'illusion se comporte et quels sons elle produit. Cette performance scénarisée peut durer jusqu'à 5 minutes. Quand le déclencheur se présente, l'illusion prend vie selor le scénario que vous avez décrit. Une fois qu'elle a terminé son numéro, l'illusion disparaît et reste en veilleuse pendant 10 minutes, après quoi on peut la réactiver. Les circonstances de déclenchement peuvent être générales ou détaillées, à votre convenance, mais doivent correspondre à des conditions visuelles ou auditives intervenant dans un rayon de 9 m de la zone. Vous pourriez ainsi créer une illusion de vous-même apparaissant pour mettre autrui en garde contre l'ouverture d'une porte piégée. Toute interaction physique avec l'image percera l'illusion, car elle n'est pas tangible. Une créature qui entreprend l'action Étude pour examiner l'image peut comprendre qu'il\nMr. As illusion en arésneond un prete | on) assorti<\/p>\n"}, {"nom": "Image Majeure", "ecole": "Illusion", "niveau": 3, "classes": ["Barde", "Ensorceleur", "Magicien", "Occultiste"], "incantation": "action", "portee": "36 m", "composantes": "V, S, M (un peu de laine brute)", "duree": "Concentration, jusqu'à 10 minutes", "pages_source": [294], "description": "Vous créez l'image d'un objet, d'une créature ou autre phénomène visible dont la taille ne dépasse pas celle d'un\nCube de 6 m. L'image apparaît en un endroit que vous voyez à portée et persiste pour toute la durée. Elle semble réelle, avec les sons, les odeurs et la température attendus, mais elle ne peut infliger de dégâts ni d'états. Si vous êtes à portée de l'illusion, vous pouvez entreprendre l'action Magie pour déplacer l'image vers un autre point à portée du sort. Lors de ce déplacement, vous pouvez modifier l'aspect de l'image afin que ses mouvements paraissent naturels. Exemple : si vous créez l'image d'une créature que vous faites déplacer, vous pouvez faire en sorte qu'elle donne l'impression de marcher. De même, vous pouvez lui faire produire des sons à votre guise et même la faire participer à une conversation. Toute interaction physique avec l'image percera l'illusion, car elle n'est pas tangible. Une créature qui entreprend l’action Étude pour examiner l'image peut comprendre qu'il s'agit d'une illusion en réussissant un test d'intelligence (Investigation) assorti de votre DD de sauvegarde des sorts. Une créature qui perce Fes MERE", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "image-majeure", "html_body": "<p>Vous créez l'image d'un objet, d'une créature ou autre phénomène visible dont la taille ne dépasse pas celle d'un\nCube de 6 m. L'image apparaît en un endroit que vous voyez à portée et persiste pour toute la durée. Elle semble réelle, avec les sons, les odeurs et la température attendus, mais elle ne peut infliger de dégâts ni d'états. Si vous êtes à portée de l'illusion, vous pouvez entreprendre l'action Magie pour déplacer l'image vers un autre point à portée du sort. Lors de ce déplacement, vous pouvez modifier l'aspect de l'image afin que ses mouvements paraissent naturels. Exemple : si vous créez l'image d'une créature que vous faites déplacer, vous pouvez faire en sorte qu'elle donne l'impression de marcher. De même, vous pouvez lui faire produire des sons à votre guise et même la faire participer à une conversation. Toute interaction physique avec l'image percera l'illusion, car elle n'est pas tangible. Une créature qui entreprend l’action Étude pour examiner l'image peut comprendre qu'il s'agit d'une illusion en réussissant un test d'intelligence (Investigation) assorti de votre DD de sauvegarde des sorts. Une créature qui perce Fes MERE<\/p>\n"}, {"nom": "Image Miroir", "ecole": "Illusion", "niveau": 2, "classes": ["Barde", "Ensorceleur", "Magicien", "Occultiste"], "incantation": "action", "portee": "personnelle", "composantes": "V, S", "duree": "1 minute", "pages_source": [295], "description": "Trois répliques illusoires de vous-même apparaissent dans votre espace. Jusqu'à la fin du sort, les répliques se déplacent avec vous et reproduisent vos actions en changeant constamment de position, si bien qu'il est impossible de savoir quelle version est réelle. Chaque fois qu'une créature vous touche avec une attaque avant la fin du sort, lancez un d6 pour chacune de vos répliques. Si au moins l’un de ces d6 obtient un résultat de 3 ou plus, c'est l’une des répliques qui est touchée à votre place et qui est détruite. Pour le reste, les dégâts et effets ne s'appliquent pas aux répliques.\nLe sort prend fin quand les trois répliques sont détruites. Toute créature subissant l'état Aveuglé, ou dotée de la Vision aveugle ou de la Vision lucide n'est pas affectée par ce sort.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "image-miroir", "html_body": "<p>Trois répliques illusoires de vous-même apparaissent dans votre espace. Jusqu'à la fin du sort, les répliques se déplacent avec vous et reproduisent vos actions en changeant constamment de position, si bien qu'il est impossible de savoir quelle version est réelle. Chaque fois qu'une créature vous touche avec une attaque avant la fin du sort, lancez un d6 pour chacune de vos répliques. Si au moins l’un de ces d6 obtient un résultat de 3 ou plus, c'est l’une des répliques qui est touchée à votre place et qui est détruite. Pour le reste, les dégâts et effets ne s'appliquent pas aux répliques.\nLe sort prend fin quand les trois répliques sont détruites. Toute créature subissant l'état Aveuglé, ou dotée de la Vision aveugle ou de la Vision lucide n'est pas affectée par ce sort.<\/p>\n"}, {"nom": "Image Projetée", "ecole": "Illusion", "niveau": 7, "classes": ["Barde", "Magicien"], "incantation": "action", "portee": "750 km", "composantes": "V, S, M (une statuette à votre effigie d'une valeur minimale de 5 po)", "duree": "Concentration, jusqu’à 1 jour", "pages_source": [295], "description": "Vous créez une réplique illusoire de vous-même qui persiste pour toute la durée. Ce double peut apparaître en n'importe quel lieu à portée que vous avez déjà vu, quels que soient les obstacles qui vous en séparent. L'illusion présente votre aspect et sonne comme vous, mais elle est intangible. Si elle subit des dégâts, l'illusion disparaît et le sort prend fin. Vous voyez et entendez comme si vous vous trouviez dans son espace. Au prix de l’action Magie, vous pouvez déplacer votre double d'un maximum de 18 m et le faire bouger, parler et se comporter à votre guise. Il reproduit à merveille votre façon d'être. Toute interaction physique avec l’image percera l'illusion, car elle n'est pas tangible. Une créature qui entreprend l'action Étude pour examiner l’image peut comprendre qu'il s'agit d'une illusion en réussissant un test d’Intelligence (Investigation) assorti de votre DD de sauvegarde des sorts. Une créature qui perce l'illusion voit à travers l’image, tout son produit par l'illusion sonnant par ailleurs creux à ses oreilles.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "image-projetee", "html_body": "<p>Vous créez une réplique illusoire de vous-même qui persiste pour toute la durée. Ce double peut apparaître en n'importe quel lieu à portée que vous avez déjà vu, quels que soient les obstacles qui vous en séparent. L'illusion présente votre aspect et sonne comme vous, mais elle est intangible. Si elle subit des dégâts, l'illusion disparaît et le sort prend fin. Vous voyez et entendez comme si vous vous trouviez dans son espace. Au prix de l’action Magie, vous pouvez déplacer votre double d'un maximum de 18 m et le faire bouger, parler et se comporter à votre guise. Il reproduit à merveille votre façon d'être. Toute interaction physique avec l’image percera l'illusion, car elle n'est pas tangible. Une créature qui entreprend l'action Étude pour examiner l’image peut comprendre qu'il s'agit d'une illusion en réussissant un test d’Intelligence (Investigation) assorti de votre DD de sauvegarde des sorts. Une créature qui perce l'illusion voit à travers l’image, tout son produit par l'illusion sonnant par ailleurs creux à ses oreilles.<\/p>\n"}, {"nom": "Image Silencieuse", "ecole": "Illusion", "niveau": 1, "classes": ["Barde", "Ensorceleur", "Magicien"], "incantation": "action", "portee": "18 m", "composantes": "V, S, M (un peu de laine brute)", "duree": "Concentration, jusqu'à 10 minutes", "pages_source": [295], "description": "IMAGE SILENCIEUSE PEUT CONCOCTER DES ILLUSIONS, ORDINAIRES\nOU FANTASTIQUES. Vous créez l’image d'un objet, d'une créature ou autre phénomène visible dont la taille ne dépasse pas celle d'un\nCube de 4,50 m. L'image apparaît en un endroit à portée :t persiste pour toute la durée. Elle est purement visuelle, dépourvue de son, d'odeur et de tout autre effet sensoriel. Au prix de l’action Magie, vous pouvez déplacer l'image en un point à portée. Lors de ce déplacement, vous pouvez modifier l'aspect de l’image afin que ses mouvements paraissent naturels. Exemple : si vous créez l'image d’une créature que vous faites déplacer, vous pouvez faire en sorte qu’elle donne l'impression de marcher. Toute interaction physique avec l’image percera l'illusion, car elle n’est pas tangible. Une créature qui entreprend action Étude pour examiner l'image peut comprendre qu'il s’agit d’une illusion en réussissant un test d’Intelligence\nInvestigation) assorti de votre DD de sauvegarde des sorts.\nUne créature qui perce l'illusion voit à travers l'image.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "image-silencieuse", "html_body": "<p>IMAGE SILENCIEUSE PEUT CONCOCTER DES ILLUSIONS, ORDINAIRES\nOU FANTASTIQUES. Vous créez l’image d'un objet, d'une créature ou autre phénomène visible dont la taille ne dépasse pas celle d'un\nCube de 4,50 m. L'image apparaît en un endroit à portée :t persiste pour toute la durée. Elle est purement visuelle, dépourvue de son, d'odeur et de tout autre effet sensoriel. Au prix de l’action Magie, vous pouvez déplacer l'image en un point à portée. Lors de ce déplacement, vous pouvez modifier l'aspect de l’image afin que ses mouvements paraissent naturels. Exemple : si vous créez l'image d’une créature que vous faites déplacer, vous pouvez faire en sorte qu’elle donne l'impression de marcher. Toute interaction physique avec l’image percera l'illusion, car elle n’est pas tangible. Une créature qui entreprend action Étude pour examiner l'image peut comprendre qu'il s’agit d’une illusion en réussissant un test d’Intelligence\nInvestigation) assorti de votre DD de sauvegarde des sorts.\nUne créature qui perce l'illusion voit à travers l'image.<\/p>\n"}, {"nom": "Immobilisation de monstre", "ecole": "Enchantement", "niveau": 5, "classes": ["Barde", "Ensorceleur", "Magicien", "Dccultiste"], "incantation": "action", "portee": "27 m", "composantes": "V, S, M (un brin de fer)", "duree": "Concentration, jusqu’à 1 minute", "pages_source": [295, 296], "description": "Choisissez une créature que vous voyez à portée. La cible loit réussir un jet de sauvegarde de Sagesse sous peine de subir l'état Paralysé pour toute la durée du sort. La cible réitère le JS à la fin de chacun de ses tours et met un terme iu sort sur elle-même en cas de réussite.\nEmplacement de niveau supérieur. Vous pouvez cibler PCR Portée : 18 m Composantes : V, S, M (un brin de fer) Durée : Concentration, jusqu'à 1 minute\nChoisissez un Humanoïde que vous voyez à portée. La cible doit réussir un jet de sauvegarde de Sagesse sous peine de subir l'état Paralysé pour toute la durée du sort. La cible réitère le JS à la fin de chacun de ses tours et met un terme au sort sur elle-même en cas de réussite.\nEmplacement de niveau supérieur. Vous pouvez cibler un Humanoïde supplémentaire par niveau d'emplacement au-delà du 2°. (|", "illustratio e ayant raté ce JS effectue un jet d'attaque ou un jet de sauvegarde avant la fin du sort, elle soustrait 1d4 au résultat correspondant.\nEmplacement de niveau supérieur. Vous pouvez affecter une créature supplémentaire par niveau d'emplacement au-delà du 1°.<\/p>\n"}, {"nom": "Injonction", "ecole": "Enchantement", "niveau": 1, "classes": ["Barde", "Clerc", "Paladin"], "incantation": "À vérifier", "portee": "18 m", "composantes": "V", "duree": "instantanée", "pages_source": [296, 297], "description": "Vous adressez un simple mot de commande à une créature que vous voyez à portée. La cible doit réussir un jet de sauvegarde de Sagesse sous peine de devoir s'y soumettre à son tour suivant. Choisissez votre ordre parmi les options suivantes :\nApproche. La cible se déplace dans votre direction par le chemin le plus court et direct, et termine son tour si elle se retrouve dans un rayon de 1,50 m de vous.\nHalte. À son tour, la cible ne se déplace pas, et n'entreprend ni action ni action Bonus.\nLâche. La cible lâche ce qu'elle tient et termine son tour. ete ne\nRampe. La cible subit état À terre et rmine sontour. INSECTE GÉANT ra | Invocation du 4‘ niveau (Druide) Er) DRE CN | Portée : 18 m Composantes : V, S Durée : Concentration, jusqu'à 10 minutes Vous convoquez une araignée, une guêpe ou un millepattes (choisissez à l'incantation du sort), en version géante. La créature se manifeste en un espace inoccupé que vous voyez à portée et reprend le profil de l’insecte géant. La forme retenue détermine certains détails du profil. La créature disparaît quand le sort prend fin, mais également si elle tombe à O point de vie.\nLa créature constitue un allié pour vous et vos alliés. Au combat, la créature partage votre rang d'initiative, mais elle joue son tour juste après vous. Elle obéit à vos | INSECTE GÉANT | Bête de taille G, non alignée CA 11 + niveau du sort Pv 30 + 10 par niveau du sort au-delà du 4° Vitesse 12 m, escalade 12 m, vol 12 m (guêpe . MOD JS MOD JS MOD }S For ar le chemin le plus court et direct, et termine son tour si elle se retrouve dans un rayon de 1,50 m de vous.\nHalte. À son tour, la cible ne se déplace pas, et n'entreprend ni action ni action Bonus.\nLâche. La cible lâche ce qu'elle tient et termine son tour. ete ne\nRampe. La cible subit état À terre et rmine sontour. INSECTE GÉANT ra | Invocation du 4‘ niveau (Druide) Er) DRE CN | Portée : 18 m Composantes : V, S Durée : Concentration, jusqu'à 10 minutes Vous convoquez une araignée, une guêpe ou un millepattes (choisissez à l'incantation du sort), en version géante. La créature se manifeste en un espace inoccupé que vous voyez à portée et reprend le profil de l’insecte géant. La forme retenue détermine certains détails du profil. La créature disparaît quand le sort prend fin, mais également si elle tombe à O point de vie.\nLa créature constitue un allié pour vous et vos alliés. Au combat, la créature partage votre rang d'initiative, mais elle joue son tour juste après vous. Elle obéit à vos | INSECTE GÉANT | Bête de taille G, non alignée CA 11 + niveau du sort Pv 30 + 10 par niveau du sort au-delà du 4° Vitesse 12 m, escalade 12 m, vol 12 m (guêpe . MOD JS MOD JS MOD }S For 17 +3 +3 Dex 13 # # Con15 +2 42 Cha 3 AA Sens Vision dans le noir 18 m, Perception passive 12 Langues comprend les langues que vous connaissez FP aucun (PX 0 ; BM égal à votre bonus de maîtrise) TRAITS\nPattes d'araignée. L'insecte peut parcourir les parois les | plus difficiles à escalader, y compris les plafonds, sans | passer par un test de caractéristique. ACTIONS |\nAttaques multiples. L'insecte effectue autant d'attaques | | que la moitié du niveau de ce sort (arrondir à l’inférieur).\nPiqüre toxique. Corps à corps : bonus égal à votre modificateur d'attaque des sorts, allonge 3 m. Touché : 1d6<\/p>\n<ul>\n<li>3 + niveau du sort dégâts perforants, plus 1d4 dégâts | de poison. | Jet de toile (araignée uniquement). À distance : bonus . égal à votre modificateur d'attaque des sorts, porté

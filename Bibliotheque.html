 Les dégâts de froid ugmentent de 1d6 par niveau d'emplacement au-delà du 1°. a ———— F<\/p>\n"}, {"nom": "Création", "ecole": "Illusion", "niveau": 5, "classes": ["Ensorceleur", "Magicien"], "incantation": "| minute", "portee": "9 m", "composantes": "V, S, M (un pinceau)", "duree": "spéciale", "pages_source": [271, 272], "description": "Vous extrayez des volutes de matière ombreuse issue de 5isombre pour créer un objet à portée. L'objet est soit en matière végétale (textile, corde, bois, etc.) soit en matière minérale (pierre, cristal, métal et autres). L'objet doit rendans un Cube de 1,50 m et sa forme comme sa matière ent correspondre à quelque chose que vous avez déjà vu. durée du sort dépend de la matière de l'objet, comme la durée la plus courte qui s'applique. L'art Le\nEmplacement de niveau sapérieur. L'arète du Cube co GET", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "creation", "html_body": "<p>Vous extrayez des volutes de matière ombreuse issue de 5isombre pour créer un objet à portée. L'objet est soit en matière végétale (textile, corde, bois, etc.) soit en matière minérale (pierre, cristal, métal et autres). L'objet doit rendans un Cube de 1,50 m et sa forme comme sa matière ent correspondre à quelque chose que vous avez déjà vu. durée du sort dépend de la matière de l'objet, comme la durée la plus courte qui s'applique. L'art Le\nEmplacement de niveau sapérieur. L'arète du Cube co GET<\/p>\n"}, {"nom": "Création ou Destruction D'Eau", "ecole": "Transmutation", "niveau": 1, "classes": ["Clerc", "Druide"], "incantation": "action", "portee": "9 m", "composantes": "V, S, M (un mélange d'eau et de sable)", "duree": "instantanée", "pages_source": [272], "description": "Vous accomplissez l'une des tâches suivantes :\nCréation d'eau. Vous créez jusqu'à 40 litres d'eau propre dans un récipient ouvert à portée. Une autre solution consiste à faire pleuvoir cette eau dans un Cube de 9 m à portée, ce qui éteint les flammes nues de la zone.\nDestruction d'eau. Vous détruisez jusqu'à 40 litres d'eau dans un récipient ouvert à portée. Au lieu de cela, vous pouvez chasser le brouillard dans un Cube de 9 m à portée.\nEmplacement de niveau supérieur. Vous créez ou détruisez 40 litres supplémentaires d'eau (ou l'arête du Cube augmente de 1,50 m) par niveau d'emplacement au-delà du 1*. es", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "creation-ou-destruction-d-eau", "html_body": "<p>Vous accomplissez l'une des tâches suivantes :\nCréation d'eau. Vous créez jusqu'à 40 litres d'eau propre dans un récipient ouvert à portée. Une autre solution consiste à faire pleuvoir cette eau dans un Cube de 9 m à portée, ce qui éteint les flammes nues de la zone.\nDestruction d'eau. Vous détruisez jusqu'à 40 litres d'eau dans un récipient ouvert à portée. Au lieu de cela, vous pouvez chasser le brouillard dans un Cube de 9 m à portée.\nEmplacement de niveau supérieur. Vous créez ou détruisez 40 litres supplémentaires d'eau (ou l'arête du Cube augmente de 1,50 m) par niveau d'emplacement au-delà du 1*. es<\/p>\n"}, {"nom": "Création de Mort-Vivant", "ecole": "Nécromancie", "niveau": 6, "classes": ["Clerc", "Magicien", "Occultiste"], "incantation": "1 minute", "portee": "3 m", "composantes": "V, S, M (un onyx noir d'une valeur minimale de 150 po pour chaque cadavre)", "duree": "instantanée", "pages_source": [272], "description": "Vous ne pouvez lancer ce sort que de nuit. Choisissez jusqu'à trois cadavres d'Humanoïdes de taille M ou P à portée. Chaque cadavre devient une goule sous votre contrôle (profil dans le Manuel des monstres). Par une action Bonus à chacun de vos tours, vous pouvez donner des ordres mentaux à toute créature que vous avez créée par ce sort et qui se trouve dans un rayon de 36 m de vous. Vous pouvez ainsi contrôler plusieurs créatures, en les choisissant, à condition de leur intimer le même ordre. Vous décidez quelle action la créature va entreprendre et où elle se déplacera à son tour suivant, ou pouvez vous contenter de donner une instruction générale, comme garder un antès quoi elle censé d'elle 8 CRT TE ai avez donnés. Pour garder le contrôle du Mort-vivant pendant 24 heures de plus, vous devez relancer ce sort sur lui avant avez animées par ce sort, au lieu d'en animer de nouvelles.\nEmplacement de niveau supérieur. Avec un emplacement du 7 niveau, vous prenez ou prolongez le contrôle de quatre goules. Avec un emplacement du 8° niveau, vous prenez ou prolongez le contrôle de cinq goules, ou de deux blèmes ou nécrontes. Avec un emplacement du 9° niveau, vous prenez ou prolongez le contrôle de six goules, de trois blèmes ou nécrontes, ou de deux momies. Tous ces profils se trouvent dans le Manuel des monstres. TT _————", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "creation-de-mort-vivant", "html_body": "<p>Vous ne pouvez lancer ce sort que de nuit. Choisissez jusqu'à trois cadavres d'Humanoïdes de taille M ou P à portée. Chaque cadavre devient une goule sous votre contrôle (profil dans le Manuel des monstres). Par une action Bonus à chacun de vos tours, vous pouvez donner des ordres mentaux à toute créature que vous avez créée par ce sort et qui se trouve dans un rayon de 36 m de vous. Vous pouvez ainsi contrôler plusieurs créatures, en les choisissant, à condition de leur intimer le même ordre. Vous décidez quelle action la créature va entreprendre et où elle se déplacera à son tour suivant, ou pouvez vous contenter de donner une instruction générale, comme garder un antès quoi elle censé d'elle 8 CRT TE ai avez donnés. Pour garder le contrôle du Mort-vivant pendant 24 heures de plus, vous devez relancer ce sort sur lui avant avez animées par ce sort, au lieu d'en animer de nouvelles.\nEmplacement de niveau supérieur. Avec un emplacement du 7 niveau, vous prenez ou prolongez le contrôle de quatre goules. Avec un emplacement du 8° niveau, vous prenez ou prolongez le contrôle de cinq goules, ou de deux blèmes ou nécrontes. Avec un emplacement du 9° niveau, vous prenez ou prolongez le contrôle de six goules, de trois blèmes ou nécrontes, ou de deux momies. Tous ces profils se trouvent dans le Manuel des monstres. TT _————<\/p>\n"}, {"nom": "Création de Nourriture et D'Eau", "ecole": "Invocation", "niveau": 3, "classes": ["Clerc", "Paladin"], "incantation": "action", "portee": "9 m", "composantes": "V, S", "duree": "instantanée", "pages_source": [272], "description": "Vous créez 22,5 kg de nourriture et 120 litres d'eau potable qui apparaissent au sol ou dans des récipients à portée, de quoi mettre à l'abri de la faim et de la soif. La nourriture est fade, mais nourrissante, avec l'aspect des aliments de votre choix, et l'eau est propre. La nourriture se gâte si elle n'est pas consommée dans les 24 heures.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "creation-de-nourriture-et-d-eau", "html_body": "<p>Vous créez 22,5 kg de nourriture et 120 litres d'eau potable qui apparaissent au sol ou dans des récipients à portée, de quoi mettre à l'abri de la faim et de la soif. La nourriture est fade, mais nourrissante, avec l'aspect des aliments de votre choix, et l'eau est propre. La nourriture se gâte si elle n'est pas consommée dans les 24 heures.<\/p>\n"}, {"nom": "Croissance D'Épines", "ecole": "Transmutation", "niveau": 2, "classes": ["Druide", "Rôdeur"], "incantation": "action", "portee": "45 m", "composantes": "V, S, M (sept épines)", "duree": "Concentration, jusqu'à 10 minutes", "pages_source": [272, 273], "description": "Le sol dans une Sphère de 6 m de rayon centrée sur un point à portée laisse émerger des pointes et épines coriaces.\nLa zone devient un Terrain difficile pour toute la durée. Lorsqu'une créature pénètre dans la zone ou s'y déplace, elle subit 2d4 dégâts perforants par tranche de 1,50 m qu'elle y parcourt.\nLa transformation du sol paraît naturelle. Toute créature qui ne voit pas la zone au moment de l'incantation doit entreprendre l'action Observation et réussir un test de Sagesse (Perception ou Survie) assorti de votre DD de sauvegarde des sorts pour reconnaître le danger avant de fouler ce sol. 2 :action (Embroussaillement) ou 8 heures Portée : 45 m Composantes : V, S Durée : instantanée\nCe sort gorge les plantes de vitalité. Le temps d'’incantation employé détermine l'effet du sort : Embroussaillement ou\nFertilisation, voir plus loin.\nEmbroussaillement. Choisissez un point à portée. Toutes les plantes normales dans une Sphère d’un rayon de 30 m centré sur ce point grossissent et grandissent. Une créature qui se déplace dans la zone doit dépenser le quadruple de déplacement pour toute distance parcourue. Vous pouvez désigner une ou plusieurs zones de n'importe quelle taille dans la zone d'effet du sort pour qu'elles ne soient pas affectées.\nFertilisation. Toutes les plantes dans un rayon de 750 m d'un point à portée gagnent en fécondité pendant 365 jours. Ces plantes produisent le double des apports alimentaires normaux lors des récoltes. Elles ne peuvent tirer profit de croissance végétale qu'une fois par an.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "croissance-d-epines", "html_body": "<p>Le sol dans une Sphère de 6 m de rayon centrée sur un point à portée laisse émerger des pointes et épines coriaces.\nLa zone devient un Terrain difficile pour toute la durée. Lorsqu'une créature pénètre dans la zone ou s'y déplace, elle subit 2d4 dégâts perforants par tranche de 1,50 m qu'elle y parcourt.\nLa transformation du sol paraît naturelle. Toute créature qui ne voit pas la zone au moment de l'incantation doit entreprendre l'action Observation et réussir un test de Sagesse (Perception ou Survie) assorti de votre DD de sauvegarde des sorts pour reconnaître le danger avant de fouler ce sol. 2 :action (Embroussaillement) ou 8 heures Portée : 45 m Composantes : V, S Durée : instantanée\nCe sort gorge les plantes de vitalité. Le temps d'’incantation employé détermine l'effet du sort : Embroussaillement ou\nFertilisation, voir plus loin.\nEmbroussaillement. Choisissez un point à portée. Toutes les plantes normales dans une Sphère d’un rayon de 30 m centré sur ce point grossissent et grandissent. Une créature qui se déplace dans la zone doit dépenser le quadruple de déplacement pour toute distance parcourue. Vous pouvez désigner une ou plusieurs zones de n'importe quelle taille dans la zone d'effet du sort pour qu'elles ne soient pas affectées.\nFertilisation. Toutes les plantes dans un rayon de 750 m d'un point à portée gagnent en fécondité pendant 365 jours. Ces plantes produisent le double des apports alimentaires normaux lors des récoltes. Elles ne peuvent tirer profit de croissance végétale qu'une fois par an.<\/p>\n"}, {"nom": "Crosse des Druides", "ecole": "Transmutation", "niveau": 0, "classes": ["Druide"], "incantation": "À vérifier", "portee": "personnelle", "composantes": "V, S, M (du gui)", "duree": "1 minute", "pages_source": [273], "description": "Le bois d’un gourdin ou d’un bâton de combat que vous tenez s’imprègne du pouvoir de la nature. Pour toute la durée, vous pouvez recourir à votre caractéristique d'incantation plutôt qu'à la Force pour les jets d'attaque et de dégâts de vos attaques de corps à corps effectuées avec cette arme. Le dé de dégâts de l’arme passe en outre à d8. Si l'attaque inflige des dégâts, il peut s'agir de dégâts de force ou des dégâts normaux de l'arme (à votre convenance). Le sort prend fin prématurément si vous le relancez ou si vous lâchez l'arme.\nAmélioration de sort mineur. Le dé de dégâts change lorsque vous atteignez les niveaux 5 (d10), 11 (d12) et 17 (2d6). ee — rene", "illustration": null, "legende_illustration": null, "notes_verification": "champ_absent:incantation", "statut": "ocr_non_valide", "id": "crosse-des-druides", "html_body": "<p>Le bois d’un gourdin ou d’un bâton de combat que vous tenez s’imprègne du pouvoir de la nature. Pour toute la durée, vous pouvez recourir à votre caractéristique d'incantation plutôt qu'à la Force pour les jets d'attaque et de dégâts de vos attaques de corps à corps effectuées avec cette arme. Le dé de dégâts de l’arme passe en outre à d8. Si l'attaque inflige des dégâts, il peut s'agir de dégâts de force ou des dégâts normaux de l'arme (à votre convenance). Le sort prend fin prématurément si vous le relancez ou si vous lâchez l'arme.\nAmélioration de sort mineur. Le dé de dégâts change lorsque vous atteignez les niveaux 5 (d10), 11 (d12) et 17 (2d6). ee — rene<\/p>\n"}, {"nom": "Danse Irrésistible D'Otto", "ecole": "Enchantement", "niveau": 6, "classes": ["Barde", "Magicien"], "incantation": "action", "portee": "9 m", "composantes": "V", "duree": "Concentration, jusqu'à 1 minute", "pages_source": [273], "description": "Choisissez une créature que vous voyez à portée ; elle effectue un jet de sauvegarde de Sagesse. En cas de réussite, nm re tandis que les autres créatures ont ets d'attaque contre elle. À chacun de ses e peut consacrer une action pour tenter de", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "danse-irresistible-d-otto", "html_body": "<p>Choisissez une créature que vous voyez à portée ; elle effectue un jet de sauvegarde de Sagesse. En cas de réussite, nm re tandis que les autres créatures ont ets d'attaque contre elle. À chacun de ses e peut consacrer une action pour tenter de<\/p>\n"}, {"nom": "Déblocage", "ecole": "Transmutation", "niveau": 2, "classes": ["Barde", "Ensorceleur", "Magicien"], "incantation": "action", "portee": "18 m", "composantes": "V", "duree": "instantanée", "pages_source": [273], "description": "Choisissez un objet que vous voyez à portée. Il peut s'agir d'une porte, d'une boîte, d’un coffre, de menottes, d'un cadenas ou autre objet muni d’un système de fermeture, magique ou non. Une cible verrouillée par une serrure ordinaire, barrée ou coincée est aussitôt déverrouillée, débloquée ou décoincée. Si l'objet présente plusieurs verrous, un seul d’entre eux est débloqué. Si la cible est fermée par verrou magique, ce sort est réprimé pendant 10 minutes, durant lesquelles vous pouvez ouvrir et fermer l'objet. À l'incantation du sort, un cognement sonore audible jusqu’à 90 m émane de la cible.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "deblocage", "html_body": "<p>Choisissez un objet que vous voyez à portée. Il peut s'agir d'une porte, d'une boîte, d’un coffre, de menottes, d'un cadenas ou autre objet muni d’un système de fermeture, magique ou non. Une cible verrouillée par une serrure ordinaire, barrée ou coincée est aussitôt déverrouillée, débloquée ou décoincée. Si l'objet présente plusieurs verrous, un seul d’entre eux est débloqué. Si la cible est fermée par verrou magique, ce sort est réprimé pendant 10 minutes, durant lesquelles vous pouvez ouvrir et fermer l'objet. À l'incantation du sort, un cognement sonore audible jusqu’à 90 m émane de la cible.<\/p>\n"}, {"nom": "Décharge Occulte", "ecole": "Évocation", "niveau": 0, "classes": ["Occultiste"], "incantation": "action", "portee": "36 m", "composantes": "V, S", "duree": "instantanée", "pages_source": [273], "description": "Vous projetez un rayon d'énergie crépitante. Effectuez une attaque de sort à distance contre une créature ou un objet à portée. Si l'attaque touche, la cible subit 1410 dégâts de force.\nAmélioration de sort mineur. Le sort produit deux rayons au niveau 5, trois au niveau 11 et quatre au niveau 17. Vous pouvez viser la même cible avec ces rayons ou les répartir entre plusieurs cibles. Effectuez un jet d'attaque séparé pour chaque rayon. ne on DÉDALE C s d’incantation antation : action", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "decharge-occulte", "html_body": "<p>Vous projetez un rayon d'énergie crépitante. Effectuez une attaque de sort à distance contre une créature ou un objet à portée. Si l'attaque touche, la cible subit 1410 dégâts de force.\nAmélioration de sort mineur. Le sort produit deux rayons au niveau 5, trois au niveau 11 et quatre au niveau 17. Vous pouvez viser la même cible avec ces rayons ou les répartir entre plusieurs cibles. Effectuez un jet d'attaque séparé pour chaque rayon. ne on DÉDALE C s d’incantation antation : action<\/p>\n"}, {"nom": "Déguisement", "ecole": "Illusion", "niveau": 1, "classes": ["Barde", "Ensorceleur", "Magicien"], "incantation": "action", "portee": "personnelle", "composantes": "V, S", "duree": "1 heure", "pages_source": [274], "description": "Vous vous donnez un aspect différent jusqu'à la fin du sort ; vous pouvez ainsi altérer l'apparence de vos vêtements, de votre armure, de vos armes et autres biens portés. Vous pouvez paraître jusqu'à 30 cm plus grand ou plus petit, sembler plus léger ou plus lourd. Vous devez adopter une forme présentant la même répartition de membres que vous.\nPour le reste, les détails de l'illusion vous appartiennent. Les changements apportés par le sort ne résistent pas à un examen physique. Exemple : si le sort ajoute un chapeau à votre accoutrement, ce couvre-chef n'est pas tangible, si bien que quiconque cherche à le toucher ne sentira sous ses doigts que de l'air. Pour comprendre que vous êtes déguisé, une créature doit consacrer l’action Étude à vous examiner et réussir un test d’Intelligence (Investigation) assorti de votre DD de sauvegarde des sorts.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "deguisement", "html_body": "<p>Vous vous donnez un aspect différent jusqu'à la fin du sort ; vous pouvez ainsi altérer l'apparence de vos vêtements, de votre armure, de vos armes et autres biens portés. Vous pouvez paraître jusqu'à 30 cm plus grand ou plus petit, sembler plus léger ou plus lourd. Vous devez adopter une forme présentant la même répartition de membres que vous.\nPour le reste, les détails de l'illusion vous appartiennent. Les changements apportés par le sort ne résistent pas à un examen physique. Exemple : si le sort ajoute un chapeau à votre accoutrement, ce couvre-chef n'est pas tangible, si bien que quiconque cherche à le toucher ne sentira sous ses doigts que de l'air. Pour comprendre que vous êtes déguisé, une créature doit consacrer l’action Étude à vous examiner et réussir un test d’Intelligence (Investigation) assorti de votre DD de sauvegarde des sorts.<\/p>\n"}, {"nom": "Délivrance des Malédictions", "ecole": "Abjuration", "niveau": 3, "classes": ["Clerc", "Magicien", "Occultiste", "Paladin"], "incantation": "action", "portee": "contact", "composantes": "V, S", "duree": "instantanée", "pages_source": [274], "description": "À votre contact, toutes les malédictions qui affectent une créature ou un objet prennent fin. Si la cible est un objet magique maudit, la malédiction reste en place, maïs le sort rompt l'Harmonisation du propriétaire avec l'objet, si bien que celui-ci peut s'en défaire ou s'en débarrasser.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "delivrance-des-maledictions", "html_body": "<p>À votre contact, toutes les malédictions qui affectent une créature ou un objet prennent fin. Si la cible est un objet magique maudit, la malédiction reste en place, maïs le sort rompt l'Harmonisation du propriétaire avec l'objet, si bien que celui-ci peut s'en défaire ou s'en débarrasser.<\/p>\n"}, {"nom": "Demi-Plan", "ecole": "Invocation", "niveau": 8, "classes": ["Ensorceleur", "Magicien", "Occultiste"], "incantation": "action", "portee": "18 m", "composantes": "S", "duree": "1 heure", "pages_source": [274], "description": "Hole créez uns porte ombreuse de taie M SES de. s'ouvrir et se fermer, et ouvre sur un demi-plan : gs. 2 anrtremeng Eat l avec l'état À terre. & u Chaque fois que vous lei 66 16000 CNT un nouveau demi-plan ou décider que la porte ombreuse ouvre sur un demi-plan que vous aviez engendré par une précédente incantation du même sort. Par ailleurs, si vous connaissez la nature et le contenu d'un demi-plan créé par ce sort, mais lancé par une autre créature, vous pouvez décider que votre porte ombreuse donne sur ce demi-plan.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "demi-plan", "html_body": "<p>Hole créez uns porte ombreuse de taie M SES de. s'ouvrir et se fermer, et ouvre sur un demi-plan : gs. 2 anrtremeng Eat l avec l'état À terre. &amp; u Chaque fois que vous lei 66 16000 CNT un nouveau demi-plan ou décider que la porte ombreuse ouvre sur un demi-plan que vous aviez engendré par une précédente incantation du même sort. Par ailleurs, si vous connaissez la nature et le contenu d'un demi-plan créé par ce sort, mais lancé par une autre créature, vous pouvez décider que votre porte ombreuse donne sur ce demi-plan.<\/p>\n"}, {"nom": "Désintégration", "ecole": "Transmutation", "niveau": 6, "classes": ["Ensorceleur", "Magicien"], "incantation": "action", "portee": "18 m", "composantes": "V, S, M (une magnétite et de la poussière)", "duree": "instantanée", "pages_source": [274], "description": "Vous projetez un rayon vert vers une cible que vous voyez à portée. La cible peut être une créature, un objet non magique ou une création de force magique, telle que la paroi formée par mur de force. Une créature ciblée par ce sort effectue un jet de sauvegarde de Dextérité. En cas d'échec, elle subit 1046 + 40 dégâts de force. Si ces dégâts la font tomber à O point de vie, elle est désintégrée en poussière grise avec tout ce qu'elle porte. La cible ne peut être ramenée à la vie que par résurrection suprême ou souhait. Ce sort désintègre automatiquement un objet de taille G ou inférieure non magique, de même qu'une création de force magique dans la limite de cette taille. Dans le cas d'une taille TG ou supérieure, la désintégration ne concerne qu'une portion équivalente à un Cube de 3 m.\nEmplacement de niveau supérieur. Les dégâts augmentent de 3d6 par niveau d'emplacement au-delà du 6°. ne. mnt", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "desintegration", "html_body": "<p>Vous projetez un rayon vert vers une cible que vous voyez à portée. La cible peut être une créature, un objet non magique ou une création de force magique, telle que la paroi formée par mur de force. Une créature ciblée par ce sort effectue un jet de sauvegarde de Dextérité. En cas d'échec, elle subit 1046 + 40 dégâts de force. Si ces dégâts la font tomber à O point de vie, elle est désintégrée en poussière grise avec tout ce qu'elle porte. La cible ne peut être ramenée à la vie que par résurrection suprême ou souhait. Ce sort désintègre automatiquement un objet de taille G ou inférieure non magique, de même qu'une création de force magique dans la limite de cette taille. Dans le cas d'une taille TG ou supérieure, la désintégration ne concerne qu'une portion équivalente à un Cube de 3 m.\nEmplacement de niveau supérieur. Les dégâts augmentent de 3d6 par niveau d'emplacement au-delà du 6°. ne. mnt<\/p>\n"}, {"nom": "Détection de L'Invisibilité", "ecole": "Divination", "niveau": 2, "classes": ["Barde", "Ensorceleur", "Magicien"], "incantation": "action", "portee": "personnelle", "composantes": "V, S, M (une pincée de talc)", "duree": "1 heure", "pages_source": [274], "description": "Pour toute la durée, vous voyez les créatures et objets dotés de l'état Invisible comme s'ils étaient visibles, et vous percevez le Plan Éthéré. Les créatures et objets qui s'y trouvent ont un aspect spectral.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "detection-de-l-invisibilite", "html_body": "<p>Pour toute la durée, vous voyez les créatures et objets dotés de l'état Invisible comme s'ils étaient visibles, et vous percevez le Plan Éthéré. Les créatures et objets qui s'y trouvent ont un aspect spectral.<\/p>\n"}, {"nom": "Détection de la Magie", "ecole": "Divination", "niveau": 1, "classes": [], "incantation": "À vérifier", "portee": "À vérifier", "composantes": "À vérifier", "duree": "Concentration, jusqu'à 10 minute", "pages_source": [274, 275], "description": "et porteurs de magie de la zone, et vous apprenez l'école de magie corres nte dans le cas d’un effet produit par Le sort est bloqué par 30 cm de pierre, de terre ou de bois, par 2,5 cm de métal (une simple feuille dans le cas du plomb). a TR", "illustration": null, "legende_illustration": null, "notes_verification": "champ_absent:incantation; champ_absent:portee; champ_absent:composantes; classes_manquantes", "statut": "ocr_non_valide", "id": "detection-de-la-magie", "html_body": "<p>et porteurs de magie de la zone, et vous apprenez l'école de magie corres nte dans le cas d’un effet produit par Le sort est bloqué par 30 cm de pierre, de terre ou de bois, par 2,5 cm de métal (une simple feuille dans le cas du plomb). a TR<\/p>\n"}, {"nom": "Détection du Mal et du Bien", "ecole": "Divination", "niveau": 1, "classes": ["Clerc", "Paladin"], "incantation": "À vérifier", "portee": "personnelle", "composantes": "V, S", "duree": "Concentration, jusqu'à 10 minutes", "pages_source": [275], "description": "Pour toute la durée, vous percevez la position de toutes les créatures suivantes dans un rayon de 9 m : Aberrations,\nCélestes, Élémentaires, Fées, Fiélons et Morts-vivants. Vous percevez également si le sort sanctification est actif dans la zone, et où. Le sort est bloqué par 30 cm de pierre, de terre ou de bois, par 2,5 cm de métal (une simple feuille dans le cas du plomb). pe ee ee #", "illustration": null, "legende_illustration": null, "notes_verification": "champ_absent:incantation", "statut": "ocr_non_valide", "id": "detection-du-mal-et-du-bien", "html_body": "<p>Pour toute la durée, vous percevez la position de toutes les créatures suivantes dans un rayon de 9 m : Aberrations,\nCélestes, Élémentaires, Fées, Fiélons et Morts-vivants. Vous percevez également si le sort sanctification est actif dans la zone, et où. Le sort est bloqué par 30 cm de pierre, de terre ou de bois, par 2,5 cm de métal (une simple feuille dans le cas du plomb). pe ee ee #<\/p>\n"}, {"nom": "Détection des Pensées", "ecole": "Divination", "niveau": 2, "classes": ["Barde", "Ensorceleur", "Magicien"], "incantation": "action", "portee": "personnelle", "composantes": "V, S, M (1 pièce de cuivre)", "duree": "Concentration, jusqu'à 1 minute", "pages_source": [275], "description": "Vous activez l'un des effets ci-après. À vos tours suivants jusqu’à la fin du sort, vous pouvez activer l’un des deux effets au prix de l'action Magie.\nPerception des pensées. Vous percevez la présence de pensées dans un rayon de 9 m, si elles émanent de créatures maîtrisant une langue ou télépathes. Vous ne lisez pas les pensées, mais savez qu’une créature pensante est présente, le cas échéant. Le sort est bloqué par 30 cm de pierre, de terre ou de bois, par 2,5 cm de métal (une simple feuille dans le cas du plomb).\nLecture des pensées. Dans un rayon de 9 m, ciblez une créature que vous voyez ou une créature que vous avez détectée avec l'option Perception des pensées. Vous savez ce qui occupe son esprit à l'instant présent. Si la cible ne connaît aucune langue et n'est pas télépathe, vous n'apprenez rien. Au prix de l'action Magie à votre tour suivant, vous pouvez tenter de sonder davantage l'esprit de la cible. Dans ce cas, la cible effectue un jet de sauvegarde de Sagesse. En cas d'échec, vous saisissez comment elle raisonne, vous percevez son état émotionnel et ce qui l'anime ou la tracasse (une angoisse, une passion ou une haine, par exemple). En cas de réussite, le sort prend fin. Dans les deux cas, la cible sait que Vous percevez la présence de tout piège à la fois à portée et dans votre champ de vision. Un piège, dans le cadre de ce sort, correspond à tout objet ou mécanisme conçu pour infliger des dégâts ou présenter un danger. Dans ces conditions, ce sort peut percevoir le sort alarme, un glyphe de garde ou une fosse qui s'ouvre mécaniquement, mais il ne révèle pas l'usure d'un plancher, l'instabilité d'un plafond ou un gouffre naturel caché par l'environnement. Le sort se contente de révéler la présence, pas son emplacement. Vous avez une notion de la nature du danger qu'il présente. os TRUE ne", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "detection-des-pensees", "html_body": "<p>Vous activez l'un des effets ci-après. À vos tours suivants jusqu’à la fin du sort, vous pouvez activer l’un des deux effets au prix de l'action Magie.\nPerception des pensées. Vous percevez la présence de pensées dans un rayon de 9 m, si elles émanent de créatures maîtrisant une langue ou télépathes. Vous ne lisez pas les pensées, mais savez qu’une créature pensante est présente, le cas échéant. Le sort est bloqué par 30 cm de pierre, de terre ou de bois, par 2,5 cm de métal (une simple feuille dans le cas du plomb).\nLecture des pensées. Dans un rayon de 9 m, ciblez une créature que vous voyez ou une créature que vous avez détectée avec l'option Perception des pensées. Vous savez ce qui occupe son esprit à l'instant présent. Si la cible ne connaît aucune langue et n'est pas télépathe, vous n'apprenez rien. Au prix de l'action Magie à votre tour suivant, vous pouvez tenter de sonder davantage l'esprit de la cible. Dans ce cas, la cible effectue un jet de sauvegarde de Sagesse. En cas d'échec, vous saisissez comment elle raisonne, vous percevez son état émotionnel et ce qui l'anime ou la tracasse (une angoisse, une passion ou une haine, par exemple). En cas de réussite, le sort prend fin. Dans les deux cas, la cible sait que Vous percevez la présence de tout piège à la fois à portée et dans votre champ de vision. Un piège, dans le cadre de ce sort, correspond à tout objet ou mécanisme conçu pour infliger des dégâts ou présenter un danger. Dans ces conditions, ce sort peut percevoir le sort alarme, un glyphe de garde ou une fosse qui s'ouvre mécaniquement, mais il ne révèle pas l'usure d'un plancher, l'instabilité d'un plafond ou un gouffre naturel caché par l'environnement. Le sort se contente de révéler la présence, pas son emplacement. Vous avez une notion de la nature du danger qu'il présente. os TRUE ne<\/p>\n"}, {"nom": "Détection du Poison et des Maladies", "ecole": "Divination", "niveau": 1, "classes": ["Clerc", "Druide", "Paladin", "Rôdeur"], "incantation": "action ou rituel", "portee": "personnelle", "composantes": "V, S, M (une feuille d’if)", "duree": "Concentration, jusqu’à 10 minutes", "pages_source": [275], "description": "Pour toute la durée, vous percevez la position de tous les poisons, créatures venimeuses et vénéneuses, et maladies magiques dans un rayon de 9 m. Vous percevez dans chaque cas de quel genre de poison, créature ou maladie il s’agit. Le sort est bloqué par 30 cm de pierre, de terre ou de bois, par 2,5 cm de métal (une simple feuille dans le cas du plomb). er", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "detection-du-poison-et-des-maladies", "html_body": "<p>Pour toute la durée, vous percevez la position de tous les poisons, créatures venimeuses et vénéneuses, et maladies magiques dans un rayon de 9 m. Vous percevez dans chaque cas de quel genre de poison, créature ou maladie il s’agit. Le sort est bloqué par 30 cm de pierre, de terre ou de bois, par 2,5 cm de métal (une simple feuille dans le cas du plomb). er<\/p>\n"}, {"nom": "Discours Captivant", "ecole": "Enchantement", "niveau": 2, "classes": ["Barde", "Occultiste"], "incantation": "action", "portee": "18 m", "composantes": "V, S", "duree": "Concentration, jusqu'à 1 minute", "pages_source": [275, 276], "description": "Vous composez une formulation verbale fascinante qui contraint les créatures que vous choisissez parmi celles que vous voyez à portée, à effectuer un jet de sauvegarde de Sagesse. Toute créature que vous ou vos compagnons êtes en train d'affronter réussit automatiquement ce JS. En cas d'échec, la cible subit un malus de -10 aux tests de Sagesse (Perception) et en Perception passive jusqu'à la\n\nUMTT SZ 175 Es UNE MAGICIENNE ROUGE DU THAY ORDONNE À 5ES SBIRES SQUELETTIQUES D'AMASSER SON BUTIN SUR\nUN DISQUE FLOTTANT DE TENSER.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "discours-captivant", "html_body": "<p>Vous composez une formulation verbale fascinante qui contraint les créatures que vous choisissez parmi celles que vous voyez à portée, à effectuer un jet de sauvegarde de Sagesse. Toute créature que vous ou vos compagnons êtes en train d'affronter réussit automatiquement ce JS. En cas d'échec, la cible subit un malus de -10 aux tests de Sagesse (Perception) et en Perception passive jusqu'à la<\/p>\n<p>UMTT SZ 175 Es UNE MAGICIENNE ROUGE DU THAY ORDONNE À 5ES SBIRES SQUELETTIQUES D'AMASSER SON BUTIN SUR\nUN DISQUE FLOTTANT DE TENSER.<\/p>\n"}, {"nom": "Disque flottant de Tenser", "ecole": "Invocation", "niveau": 1, "classes": ["Magicien"], "incantation": "action ou ritue", "portee": "9 m", "composantes": "V, S, M (une goutte de mercure)", "duree": "1 heure", "pages_source": [276], "description": "Ce sort crée un plan horizontal et circulaire de force, de 90 cm de diamètre pour 2,5 cm d'épaisseur, qui flotte 90 em au-dessus du sol en un espace inoccupé que vous voyez et choisissez à portée. Le disque persiste pour toute la durée et supporte 250 kg. Si on y pose un excédent de poids, le sort prend fin et tout ce qui se trouvait sur le disque tombe au sol. Le disque est immobile tant que vous restez dans un rayon de 6 m de lui. Si vous vous en écartez de plus de 6 m, le disque vous suit pour rester dans ce rayon. Il peut traver ser un Terrain difficile, monter ou descendre des marches, une pente ou équivalent, mais ne peut pas franchir une dénivellation abrupte de 3 m ou plus. Le disque ne peut ainsi pas franchir une fosse profonde de 3 m, pas plus qu'il ne pourra en sortir s'il a été créé en son fond. Si vous vous éloignez de plus de 30 m du disque (parce qu'il n'a pu contourner un obstacle pour vous suivre, notamment), le sort prend fin.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "disque-flottant-de-tenser", "html_body": "<p>Ce sort crée un plan horizontal et circulaire de force, de 90 cm de diamètre pour 2,5 cm d'épaisseur, qui flotte 90 em au-dessus du sol en un espace inoccupé que vous voyez et choisissez à portée. Le disque persiste pour toute la durée et supporte 250 kg. Si on y pose un excédent de poids, le sort prend fin et tout ce qui se trouvait sur le disque tombe au sol. Le disque est immobile tant que vous restez dans un rayon de 6 m de lui. Si vous vous en écartez de plus de 6 m, le disque vous suit pour rester dans ce rayon. Il peut traver ser un Terrain difficile, monter ou descendre des marches, une pente ou équivalent, mais ne peut pas franchir une dénivellation abrupte de 3 m ou plus. Le disque ne peut ainsi pas franchir une fosse profonde de 3 m, pas plus qu'il ne pourra en sortir s'il a été créé en son fond. Si vous vous éloignez de plus de 30 m du disque (parce qu'il n'a pu contourner un obstacle pour vous suivre, notamment), le sort prend fin.<\/p>\n"}, {"nom": "Dissimulation Suprême", "ecole": "Transmutation", "niveau": 7, "classes": ["Magicien"], "incantation": "a", "portee": "contact", "composantes": "V, S, M (poudre de gemme d'une valeur minimale le al Oo Es", "duree": "jusqu'à dissipation", "pages_source": [276], "description": "D'un contact, vous isolez magiquement un objet ou une créature consentante. Pour toute la durée, la cible a l'état Invisible et les sorts de Divination ne peuvent pas la cibler, Si la cible est une créature, elle sombre dans un état d'animation suspendue ; elle subit l'état Inconscient, ne vieillit pas et se passe de nourriture, d'eau et d'air. Vous pouvez fixer une condition qui mettra un terme prématuré au sort. Vous êtes libre de choisir n'importe quelle condition, mais elle doit intervenir ou être visible dans un rayon de 1,5 km de la cible. Ce peut être « au bout de 1 000 ans » ou « lorsque la tarasque s'éveillera », par exemple.\nLe sort prend également fin si la cible subit des dégâts.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "dissimulation-supreme", "html_body": "<p>D'un contact, vous isolez magiquement un objet ou une créature consentante. Pour toute la durée, la cible a l'état Invisible et les sorts de Divination ne peuvent pas la cibler, Si la cible est une créature, elle sombre dans un état d'animation suspendue ; elle subit l'état Inconscient, ne vieillit pas et se passe de nourriture, d'eau et d'air. Vous pouvez fixer une condition qui mettra un terme prématuré au sort. Vous êtes libre de choisir n'importe quelle condition, mais elle doit intervenir ou être visible dans un rayon de 1,5 km de la cible. Ce peut être « au bout de 1 000 ans » ou « lorsque la tarasque s'éveillera », par exemple.\nLe sort prend également fin si la cible subit des dégâts.<\/p>\n"}, {"nom": "Dissipation de la Magie", "ecole": "Abjuration", "niveau": 5, "classes": ["Barde", "Clerc", "Druide", "Ensorceleur", "Magicien", "Occultiste", "Paladin", "Rôdeur"], "incantation": "action", "portee": "36 m", "composantes": "V, S", "duree": "instantanée", "pages_source": [277], "description": "Choisissez une créature, un objet ou un effet magique à portée. Tout sort du 3° niveau ou inférieur affectant la cible prend fin. Pour chaque sort du 4° niveau ou supérieur affectant la cible, effectuez un test de caractéristique d'incantation (DD 10 plus le niveau du sort concerné).\nEn cas de réussite, le sort prend fin.\nEmplacement de niveau supérieur. Vous mettez automatiquement un terme aux sorts qui affectent la cible et sont d'un niveau qui ne dépasse pas celui de votre emplacement de sort. UNE CLERC TIEFFELINE LANCE DISSIPATION DU MAL ET DU BIEN POUR CHASSER L'ESPRIT MALÉFIQUE\nQUI POSSÈDE UN INNOCENT. Le", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "dissipation-de-la-magie", "html_body": "<p>Choisissez une créature, un objet ou un effet magique à portée. Tout sort du 3° niveau ou inférieur affectant la cible prend fin. Pour chaque sort du 4° niveau ou supérieur affectant la cible, effectuez un test de caractéristique d'incantation (DD 10 plus le niveau du sort concerné).\nEn cas de réussite, le sort prend fin.\nEmplacement de niveau supérieur. Vous mettez automatiquement un terme aux sorts qui affectent la cible et sont d'un niveau qui ne dépasse pas celui de votre emplacement de sort. UNE CLERC TIEFFELINE LANCE DISSIPATION DU MAL ET DU BIEN POUR CHASSER L'ESPRIT MALÉFIQUE\nQUI POSSÈDE UN INNOCENT. Le<\/p>\n"}, {"nom": "Dissipation du Mal et du Bien", "ecole": "Abjuration", "niveau": 5, "classes": ["Clerc", "Paladin"], "incantation": "action", "portee": "personnelle", "composantes": "V, S, M (poudre d'argent et de fer)", "duree": "Concentration, jusqu'à 1 minute", "pages_source": [277, 278], "description": "Pour toute la durée, Célestes, Elémentaires, Fées, Fiélons et Morts-vivants ont le Désavantage aux jets d'attaque contre vous. Vous pouvez mettre un terme prématuré au sort en recourant à l’une des fonctions spéciales suivantes.\nAnnulation d'enchantement. Au prix de l'action Magie, vous touchez une créature possédée ou subissant l'état Charmé ou Effrayé par au moins une créature d’un type précité. La cible n’est plus possédée, Charmée ou Effrayée par cette autre créature.\nRenvoi. Au prix de l’action Magie, vous ciblez une créature que vous voyez dans un rayon de 1,50 m, d'un type précité. La cible doit réussir un jet de sauvegarde de Charisme sous peine d’être renvoyée dans son plan d'origine (si elle ne s'y trouve pas déjà). S'ils ne sont pas sur leur plan d'origine, les Morts-vivants sont envoyés en Gisombre et les Fées en Féerie. CHAPITRE 7 | SORTS 277 Compton : VS MURS 25 po, que le sort détruit) Durée : instantanée Vous posez une question au sujet d'un objectif pré événement ou d'une activité censés intervenir dans les 7 jours. Le MD vous répond par la vérité, qui peut s'énoncer par une courte phrase ou un vers abscons. Le sort ne tient pas compte des conjonctures qui pourraient peser dans la balance, comme l'incantation de nouveaux sorts. Si vous lancez le sort plus d'une fois avant de terminer votre prochain Repos long, vous courez dès la deuxième incantation 25 % de risques cumulatifs qu'il ne vous livre aucune réponse. n 7 ‘£ 5", "illustration": null, "legende_illustration": null, "notes_verification": "symboles_suspects", "statut": "ocr_non_valide", "id": "dissipation-du-mal-et-du-bien", "html_body": "<p>Pour toute la durée, Célestes, Elémentaires, Fées, Fiélons et Morts-vivants ont le Désavantage aux jets d'attaque contre vous. Vous pouvez mettre un terme prématuré au sort en recourant à l’une des fonctions spéciales suivantes.\nAnnulation d'enchantement. Au prix de l'action Magie, vous touchez une créature possédée ou subissant l'état Charmé ou Effrayé par au moins une créature d’un type précité. La cible n’est plus possédée, Charmée ou Effrayée par cette autre créature.\nRenvoi. Au prix de l’action Magie, vous ciblez une créature que vous voyez dans un rayon de 1,50 m, d'un type précité. La cible doit réussir un jet de sauvegarde de Charisme sous peine d’être renvoyée dans son plan d'origine (si elle ne s'y trouve pas déjà). S'ils ne sont pas sur leur plan d'origine, les Morts-vivants sont envoyés en Gisombre et les Fées en Féerie. CHAPITRE 7 | SORTS 277 Compton : VS MURS 25 po, que le sort détruit) Durée : instantanée Vous posez une question au sujet d'un objectif pré événement ou d'une activité censés intervenir dans les 7 jours. Le MD vous répond par la vérité, qui peut s'énoncer par une courte phrase ou un vers abscons. Le sort ne tient pas compte des conjonctures qui pourraient peser dans la balance, comme l'incantation de nouveaux sorts. Si vous lancez le sort plus d'une fois avant de terminer votre prochain Repos long, vous courez dès la deuxième incantation 25 % de risques cumulatifs qu'il ne vous livre aucune réponse. n 7 ‘£ 5<\/p>\n"}, {"nom": "Doigt de Mort", "ecole": "Nécromancie", "niveau": 7, "classes": ["Ensorceleur", "Magicien", "Occultiste"], "incantation": "À vérifier", "portee": "18 m", "composantes": "V, S", "duree": "instantanée", "pages_source": [278], "description": "Vous libérez des énergies négatives vers une créature que vous voyez à portée. La cible effectue un jet de sauvegarde de Constitution et subit 7d8 + 30 dégâts nécrotiques en cas d'échec, la moitié en cas de réussite. Un Humanoïde tué par ce sort se relève au début de votre tour suivant comme zombi (cf. annexe B) obéissant à vos instructions verbales.", "illustration": null, "legende_illustration": null, "notes_verification": "champ_absent:incantation", "statut": "ocr_non_valide", "id": "doigt-de-mort", "html_body": "<p>Vous libérez des énergies négatives vers une créature que vous voyez à portée. La cible effectue un jet de sauvegarde de Constitution et subit 7d8 + 30 dégâts nécrotiques en cas d'échec, la moitié en cas de réussite. Un Humanoïde tué par ce sort se relève au début de votre tour suivant comme zombi (cf. annexe B) obéissant à vos instructions verbales.<\/p>\n"}, {"nom": "Domination de Bête", "ecole": "Enchantement", "niveau": 4, "classes": ["Druide", "Ensorceleur", "Rôdeur"], "incantation": "action", "portee": "18 m", "composantes": "V, S", "duree": "Concentration, jusqu'à 1 minute", "pages_source": [278], "description": "Une Bête que vous voyez à portée doit réussir un jet de sauvegarde de Sagesse sous peine de subir l'état Charmé pour toute la durée. La cible a l'Avantage au JS si vous ou vos alliés êtes en train de l’affronter. Chaque fois que la cible subit des dégâts, elle réitère le JS et met un terme au sort sur elle-même en cas de réussite. Un lien télépathique persiste entre vous et la cible Charmée tant que vous êtes tous deux sur un même plan d'existence. À votre tour, vous pouvez profiter de ce lien pour donner des ordres à la cible (pas d'action requise), tels que « Attaque cette créature », « File là-bas » ou « Attrape cet objet ». La cible fait de son mieux pour vous obéir à son tour. Si la créature con Re ce Durée : Concentration, jusqu'à 1 heure Une créature que vous voyez à portée doit réussir de sauvegarde de Sagesse sous peine de subir l'état Ch pour toute la durée. La cible a l'Avantage au JK si vous vos alliés êtes en train de l'affronter. Chaque fois que la c i Fe subit des dégâts, elle réitère le JS et met un terme ausortsur elle-même en cas de réussite. - Un lien télépathique persiste entre vous et la cible Charmée tant que vous êtes tous deux sur un même plan d'existence. À votre tour, vous pouvez profiter de ce lien pour donner des ordres à la cible (pas d'action requise), tels que « Attaque cette créature », « File là-bas » ou « Attrape cet objet ». La cible fait de son mieux pour vous obéir à son tour. Si la créature accomplit sa tâche et ne reçoit pas d'autre instruction de votre part, elle agit et se déplace à sa guise, en cherchant avant tout à se protéger. Vous pouvez aussi lui faire jouer une Réaction, au prix toutefois de votre propre Réaction.\nEmplacement de niveau supérieur. Votre Concentration peut persister plus longtemps avec un emplacement du 9: niveau (jusqu'à 8 heures).", "illustration": om": "Double Illusoire", "ecole": "Illusion", "niveau": 5, "classes": ["Barde", "Magicien", "Occultiste"], "incantation": "action", "portee": "personnelle", "composantes": "S", "duree": "Concentration, jusqu'à 1 heure", "pages_source": [279], "description": "de l'action Magie, vous pouvez déplacer votre > à concurrence du double de votre Vitesse et le faire uger, parler et se comporter à votre guise. Il est intangible Vous voyez et entendez comme si vous vous trouviez au nême endroit que lui. —————————\"\"", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "double-illusoire", "html_body": "<p>de l'action Magie, vous pouvez déplacer votre &gt; à concurrence du double de votre Vitesse et le faire uger, parler et se comporter à votre guise. Il est intangible Vous voyez et entendez comme si vous vous trouviez au nême endroit que lui. —————————&quot;&quot;<\/p>\n"}, {"nom": "Doux Repos", "ecole": "Nécromancie", "niveau": 2, "classes": ["Clerc", "Magicien", "Paladin"], "incantation": "À vérifier", "portee": "contact", "composantes": "V, S, M (2 pièces de cuivre, que le sort détruit)", "duree": "10 jours", "pages_source": [279], "description": "Vous touchez physiquement un cadavre ou autre dépouille. our toute la durée, la cible est protégée contre la putréfacion et rien ne peut en faire un Mort-vivant. Ce sort prolonge également le délai au-delà duquel la cible 1e pourra plus être ramenée d’entre les morts, les jours assés sous l'influence de ce sort n'étant pas décomptés dans le cadre de sorts tels que rappel à la vie.", "illustration": null, "legende_illustration": null, "notes_verification": "champ_absent:incantation", "statut": "ocr_non_valide", "id": "doux-repos", "html_body": "<p>Vous touchez physiquement un cadavre ou autre dépouille. our toute la durée, la cible est protégée contre la putréfacion et rien ne peut en faire un Mort-vivant. Ce sort prolonge également le délai au-delà duquel la cible 1e pourra plus être ramenée d’entre les morts, les jours assés sous l'influence de ce sort n'étant pas décomptés dans le cadre de sorts tels que rappel à la vie.<\/p>\n"}, {"nom": "Druidisme", "ecole": "Transmutation", "niveau": 0, "classes": ["Druide"], "incantation": "À vérifier", "portee": "À vérifier", "composantes": "V, S", "duree": "instantanée", "pages_source": [279, 280], "description": "Vous murmurez aux esprits de la nature pour créer l'un les effets suivants à portée :\nCapteur climatique. Vous produisez un effet sensoriel noffensif de taille TP qui prédit le temps qu'il fera où vous zous trouvez dans les 24 prochaines heures. L'effet peut se nanifester sous forme d'un globe doré pour un ciel dégagé, l'un nuage pour la pluie, de flocons qui tombent pour la eige, etc. Cet effet persiste pendant 1 round.\nFloraison. Vous faites instantanément s'épanouir une leur, s'ouvrir une cosse de graines ou fleurir un bourgeon.\nEffet sensoriel. Vous créez un effet sensoriel inoffensif ; euilles qui tombent, petites fées spectrales qui dansent, louce brise, bruit animal, vague odeur de sconse, etc. L'effet loit tenir dans un Cube de 1,50 m.\nJeu avec le feu. Vous allumez ou éteignez une bougie, ne torche ou un petit feu de camp. Durée : Concentration, jusqu’à 1 minute DIR\nVous tentez de provoquer une créature en duel. Choisissdé une créature que vous voyez à portée ; elle effectue un jet de sauvegarde de Sagesse. En cas d'échec, la cible subit le Désavantage aux jets d'attaque contre les créatures autres que vous et ne peut pas se déplacer volontairement dans un espace distant de plus de 9 m de vous. Le sort prend fin si vous attaquez une autre créature que la cible, si vous lancez un sort qui cible un autre ennemi, si un de vos alliés inflige des dégâts à la cible, ou encore si vous terminez votre tour à plus de 9 m de la cible. ee —", "illustration": null, "legende_illustration": null, "notes_verification": "champ_absent:incantation; champ_absent:portee", "statut": "ocr_non_valide", "id": "druidisme", "html_body": "<p>Vous murmurez aux esprits de la nature pour créer l'un les effets suivants à portée :\nCapteur climatique. Vous produisez un effet sensoriel noffensif de taille TP qui prédit le temps qu'il fera où vous zous trouvez dans les 24 prochaines heures. L'effet peut se nanifester sous forme d'un globe doré pour un ciel dégagé, l'un nuage pour la pluie, de flocons qui tombent pour la eige, etc. Cet effet persiste pendant 1 round.\nFloraison. Vous faites instantanément s'épanouir une leur, s'ouvrir une cosse de graines ou fleurir un bourgeon.\nEffet sensoriel. Vous créez un effet sensoriel inoffensif ; euilles qui tombent, petites fées spectrales qui dansent, louce brise, bruit animal, vague odeur de sconse, etc. L'effet loit tenir dans un Cube de 1,50 m.\nJeu avec le feu. Vous allumez ou éteignez une bougie, ne torche ou un petit feu de camp. Durée : Concentration, jusqu’à 1 minute DIR\nVous tentez de provoquer une créature en duel. Choisissdé une créature que vous voyez à portée ; elle effectue un jet de sauvegarde de Sagesse. En cas d'échec, la cible subit le Désavantage aux jets d'attaque contre les créatures autres que vous et ne peut pas se déplacer volontairement dans un espace distant de plus de 9 m de vous. Le sort prend fin si vous attaquez une autre créature que la cible, si vous lancez un sort qui cible un autre ennemi, si un de vos alliés inflige des dégâts à la cible, ou encore si vous terminez votre tour à plus de 9 m de la cible. ee —<\/p>\n"}, {"nom": "Éclair", "ecole": "Évocation", "niveau": 3, "classes": ["Ensorceleur", "Magicien"], "incantation": "action", "portee": "personnelle", "composantes": "V, S, M (une touffe de fourrure et une tige de cristal)", "duree": "instantanée", "pages_source": [280], "description": "Un éclair foudroyant jaillit de vous sous la forme d'une Ligne de 30 m de long et 1,50 m de large, dans la direction de votre choix. Chaque créature prise dans la Ligne effectue un jet de sauvegarde de Dextérité et subit 8d6 dégâts de foudre en cas d'échec, la moitié en cas de réussite.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d6 par niveau d'emplacement au-delà du 3°.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "eclair", "html_body": "<p>Un éclair foudroyant jaillit de vous sous la forme d'une Ligne de 30 m de long et 1,50 m de large, dans la direction de votre choix. Chaque créature prise dans la Ligne effectue un jet de sauvegarde de Dextérité et subit 8d6 dégâts de foudre en cas d'échec, la moitié en cas de réussite.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d6 par niveau d'emplacement au-delà du 3°.<\/p>\n"}, {"nom": "Éclat du Soleil", "ecole": "Évocation", "niveau": 8, "classes": ["Clerc", "Druide", "Ensorceleur", "Magicien"], "incantation": "action", "portee": "45 m", "composantes": "V, S, M (un morceau d'héliolite)", "duree": "instantanée", "pages_source": [280], "description": "La lumière du soleil brille soudain dans une Sphère de 18 m de rayon, centrée sur un point que vous choisissez à portée. Chaque créature prise dans la Sphère effectue un jet de sauvegarde de Constitution. En cas d'échec, elle subit 12d6 dégâts radiants, ainsi que l'état Aveuglé pendant 1 minute. En cas de réussite, elle subit uniquement la moitié de ces dégâts. Une créature Aveuglée par ce sort réitère le jet de sauvegarde de Constitution à la fin de chacun de ses tours et met un terme à l'effet sur elle-même en cas de réussite. Le sort dissipe dans la zone toutes les Ténèbres qui résultent d'un sort. Portée : 9 m\nDurée : instantanée Fo. Vous exercez votre contrôle sur les éléments, ce qui produit l'un des effets suivants à portée. ondovyer les vêtements, soulever la poussière, bruisser les feuilles et fermer les portes et volets ouverts compris dans un Cube de 1,50 m. Les portes et volets maintenus ouverts par quelqu'un ou quelque chose ne sont pas affectés.\nAppel d'eau. Vous produisez des embruns frais qui humectent les créatures et objets dans un Cube de 1,50 m. Ou bien, vous créez 20 cl d'eau claire dans un récipient ouvert ou sur une surface ; cette eau s'évapore au bout de 1 minute.\nAppel de feu. Vous produisez un nuage de fumée parfumée, colorée et ardente, mais inoffensive, dans un Cube de 1,50 m. Vous en choisissez la teinte et l'odeur ; les flammèches embrasent les bougies, torches et lampes de la zone. L'odeur de la fumée persiste pendant 1 minute.\nAppel de terre. Vous produisez un linceul de poussière ou de sable qui tapisse les surfaces d'une zone de 1,50 m de côté ou vous faites apparaître sur la terre ou le sable un mot unique qui reprend votre écriture.\nFaçonnage élémentaire. De la terre, du sable, des flammes, de la fumée, de la brume ou de l'eau qui tiennent dans un Cube de 30 cm adoptent grossièrement une forme (celle d'une créature, par exemple) pendant 1 heure. 2 — \\", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "eclat-du-soleil", "html_body": "<p>La lumière du soleil brille soudain dans une Sphère de 18 m de rayon, centrée sur un point que vous choisissez à portée. Chaque créature prise dans la Sphère effectue un jet de sauvegarde de Constitution. En cas d'échec, elle subit 12d6 dégâts radiants, ainsi que l'état Aveuglé pendant 1 minute. En cas de réussite, elle subit uniquement la moitié de ces dégâts. Une créature Aveuglée par ce sort réitère le jet de sauvegarde de Constitution à la fin de chacun de ses tours et met un terme à l'effet sur elle-même en cas de réussite. Le sort dissipe dans la zone toutes les Ténèbres qui résultent d'un sort. Portée : 9 m\nDurée : instantanée Fo. Vous exercez votre contrôle sur les éléments, ce qui produit l'un des effets suivants à portée. ondovyer les vêtements, soulever la poussière, bruisser les feuilles et fermer les portes et volets ouverts compris dans un Cube de 1,50 m. Les portes et volets maintenus ouverts par quelqu'un ou quelque chose ne sont pas affectés.\nAppel d'eau. Vous produisez des embruns frais qui humectent les créatures et objets dans un Cube de 1,50 m. Ou bien, vous créez 20 cl d'eau claire dans un récipient ouvert ou sur une surface ; cette eau s'évapore au bout de 1 minute.\nAppel de feu. Vous produisez un nuage de fumée parfumée, colorée et ardente, mais inoffensive, dans un Cube de 1,50 m. Vous en choisissez la teinte et l'odeur ; les flammèches embrasent les bougies, torches et lampes de la zone. L'odeur de la fumée persiste pendant 1 minute.\nAppel de terre. Vous produisez un linceul de poussière ou de sable qui tapisse les surfaces d'une zone de 1,50 m de côté ou vous faites apparaître sur la terre ou le sable un mot unique qui reprend votre écriture.\nFaçonnage élémentaire. De la terre, du sable, des flammes, de la fumée, de la brume ou de l'eau qui tiennent dans un Cube de 30 cm adoptent grossièrement une forme (celle d'une créature, par exemple) pendant 1 heure. 2 — \\<\/p>\n"}, {"nom": "Embruns Prismatiques", "ecole": "Évocation", "niveau": 7, "classes": ["Barde", "Ensorceleur", "Magicien"], "incantation": "action", "portee": "personnelle", "composantes": "V, S", "duree": "instantanée", "pages_source": [280, 281], "description": "Huit rayons de lumière jaillissent de vous sous forme d'un\nCône de 18 m. Chaque créature prise dans le Cône effectue un jet de sauvegarde de Dextérité. Pour chaque cible, lancez 1d8 pour déterminer le rayon de couleur qui l'affecte selon la table Rayons prismatiques. RAYONS PRISMATIQUES 1d8 Rayon 1 Rouge. Échec au JS: Lemon 1/2 dégâts. Eee he 2 Orange. Échec au JS : 12d6 dégâts d'acide. JS réussi : 1/2 dégâts. 3 Jaune. Échec au JS : 12d6 1/2 dégâts. 1d8 Rayon 4\nVert. Echec au JS : 12d6 dégâts de poison. JS réussi : 1/2 dégâts.\nBleu. Échec au JS : 12d6 dégâts de froid. JS réussi : 1/2 dégâts.\nIndigo. Échec au JS : la cible subit l'état Entravé et effectue un jet de sauvegarde de Constitution à la fin de chacun de ses tours. Si elle se sauvegarde trois fois, l'état prend fin. Si elle rate trois le JS, elle subit l'état Pétrifié jusqu'à en être libérée par un effet tel que restauration suprême. Ces réussites et échecs n'ont pas besoin d'être consécutifs ; notez-les quelque part, jusqu'à ce que la cible atteigne un total de trois pour l’un ou l’autre.\nViolet. Échec au JS : la cible subit l'état Aveuglé et effectue un jet de sauvegarde de Sagesse au début de votre tour suivant. En cas de réussite, l’état prend fin. En cas d’échec, l’état prend fin, et la créature est téléportée dans un autre plan d'existence (choisi par le MD).\nSpécial. La cible est frappée par deux rayons.\nLancez deux fois le dé, en rejouant tout 8. UN NAIN AYANT MALENCONTREUSEMENT CROISÉ LE RAYON INDIGO\nD'EMBRUNS PRISMATIQUES. Le dSER “E", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "embruns-prismatiques", "html_body": "<p>Huit rayons de lumière jaillissent de vous sous forme d'un\nCône de 18 m. Chaque créature prise dans le Cône effectue un jet de sauvegarde de Dextérité. Pour chaque cible, lancez 1d8 pour déterminer le rayon de couleur qui l'affecte selon la table Rayons prismatiques. RAYONS PRISMATIQUES 1d8 Rayon 1 Rouge. Échec au JS: Lemon 1/2 dégâts. Eee he 2 Orange. Échec au JS : 12d6 dégâts d'acide. JS réussi : 1/2 dégâts. 3 Jaune. Échec au JS : 12d6 1/2 dégâts. 1d8 Rayon 4\nVert. Echec au JS : 12d6 dégâts de poison. JS réussi : 1/2 dégâts.\nBleu. Échec au JS : 12d6 dégâts de froid. JS réussi : 1/2 dégâts.\nIndigo. Échec au JS : la cible subit l'état Entravé et effectue un jet de sauvegarde de Constitution à la fin de chacun de ses tours. Si elle se sauvegarde trois fois, l'état prend fin. Si elle rate trois le JS, elle subit l'état Pétrifié jusqu'à en être libérée par un effet tel que restauration suprême. Ces réussites et échecs n'ont pas besoin d'être consécutifs ; notez-les quelque part, jusqu'à ce que la cible atteigne un total de trois pour l’un ou l’autre.\nViolet. Échec au JS : la cible subit l'état Aveuglé et effectue un jet de sauvegarde de Sagesse au début de votre tour suivant. En cas de réussite, l’état prend fin. En cas d’échec, l’état prend fin, et la créature est téléportée dans un autre plan d'existence (choisi par le MD).\nSpécial. La cible est frappée par deux rayons.\nLancez deux fois le dé, en rejouant tout 8. UN NAIN AYANT MALENCONTREUSEMENT CROISÉ LE RAYON INDIGO\nD'EMBRUNS PRISMATIQUES. Le dSER “E<\/p>\n"}, {"nom": "Emprisonnement", "ecole": "Abjuration", "niveau": 9, "classes": ["Magicien", "Occultiste"], "incantation": "1 minute", "portee": "9 m", "composantes": "V, S, M (une statuette à l'effigie de la cible d'une valeur minimale de 5 000 po)", "duree": "jusqu’à dissipation", "pages_source": [281, 282], "description": "Vous créez des entraves magiques pour retenir une créature que vous voyez à portée. La cible effectue un jet de sauvegarde de Sagesse. En cas de réussite, la cible n'est pas affectée et elle est immunisée contre ce sort pendant 24 heures. En cas d'échec, la cible est emprisonnée. Tant qu'elle est emprisonnée, la cible se passe de respirer, de s'alimenter et de s’hydrater, et ne vieillit pas. Les sorts de Divination ne permettent pas de localiser ni de percevoir la cible emprisonnée, qui ne peut en outre pas user de téléportation. Jusqu'à la fin du sort, la cible est aussi affectée par l’un des effets suivants (choisissez) :\nChaînes. Des chaînes fermement ancrées au sol retiennent la cible. La cible subit l'état Entravé et rien ne peut la\nDétention miniature. La cible est réduite à une taille de 2,5 cm pour se retrouver bloquée dans une gemme indestructible ou un objet équivalent. La lumière traverse cette pierre (ce qui permet à la cible de voir à l'extérieur et aux autres créatures de voir à l'intérieur), mais rien d'autre ne peut y pénétrer\nEnterrement. La cible est inhumée dans les entrailles de la terre, à l'intérieur d'un globe vide de force magique juste assez grand pour la contenir. Rien ne peut entrer dans le globe ni en sortir.\nLéthargie. La cible subit l'état Inconscient et rien ne peut la réveiller\nPrison isolée. La cible est bloquée dans un demi-plan protégé contre la téléportation et le voyage planaire. Vous choisissez si ce demi-plan est un labyrinthe, une cage, une tour ou autre structure confinée.\nMettre fin au sort. A l'incantation du sort, spécifiez un déclencheur qui v mettra un terme. Le déclencheur peut être aussi spécifique et sophistiqué que vous le souhaitez, mais le MD doit convenir qu'il a une grande chance de se présenter dans la décennie à venir. Il peut aussi se traduire par une action perceptible, comme une offrande spécifique au temple de votre divinité, le sauvetage de votre grand amour ou l'élimination d'une menace donnée. 282 CHAPITRE 7 | SORTS Un DRUIDE DRAKÉIDE LANCE ENCHEVÊTREMENT POUR BLOQUER DES SACCAGEURS GNOLLS le la magie ne peut mettre un terme au est lancé au 9° niveau et s'il cible soit la prison, anti itilisée pour créer celle-ci", "illustration": null, "legende_illustration": null, "notes_verification": "symboles_suspects", "statut": "ocr_non_valide", "id": "emprisonnement", "html_body": "<p>Vous créez des entraves magiques pour retenir une créature que vous voyez à portée. La cible effectue un jet de sauvegarde de Sagesse. En cas de réussite, la cible n'est pas affectée et elle est immunisée contre ce sort pendant 24 heures. En cas d'échec, la cible est emprisonnée. Tant qu'elle est emprisonnée, la cible se passe de respirer, de s'alimenter et de s’hydrater, et ne vieillit pas. Les sorts de Divination ne permettent pas de localiser ni de percevoir la cible emprisonnée, qui ne peut en outre pas user de téléportation. Jusqu'à la fin du sort, la cible est aussi affectée par l’un des effets suivants (choisissez) :\nChaînes. Des chaînes fermement ancrées au sol retiennent la cible. La cible subit l'état Entravé et rien ne peut la\nDétention miniature. L

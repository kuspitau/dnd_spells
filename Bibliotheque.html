Créature en créature. Si vous transformez une créature en autre sorte de créature, vous choisissez sa nouvelle forme à votre guise, mais le facteur de puissance de celle-ci ne doit pas dépasser celui de la cible (ou son niveau). Le profil de la cible est remplacé par celui de la nouvelle forme, si ce n'est qu'elle conserve ses points de vie, ses dés de vie, son alignement et sa personnalité. La cible reçoit autant de points de vie temporaires que les points de vie de la nouvelle forme. S'il reste de ces pv temporaires à la cible quand le sort prend fin, ils disparaissent. La cible est limitée dans les actions qu'elle peut entreprendre par l'anatomie de sa nouvelle forme, et elle ne peut ni parler ni lancer de sorts. L'équipement porté par la cible se fond dans sa nouvelle forme. La créature ne peut pas utiliser son équipement ni en bénéficier de quelque manière que ce soit.\nObjet en créature. Vous pouvez transformer un objet en la créature de votre choix, à condition que la catégorie de taille de celle-ci ne dépasse pas celle de l'objet et que son facteur de puissance n'excède pas 9. La créature est Amicale envers vous et vos compagnons. Au combat, elle joue ses tours juste après les vôtres et se soumet à vos instructions. metro égard selon la manière dont vous l'avez traitée.\nCréature en objet. Si vous transformez une créature en objet, elle adopte sa nouvelle forme en fusionnant avec tout ce qu'elle porte, à condition que la taille de l’objet n'excède pas celle de la créature. Le profil de la créature devient celui de l'objet et la créature ne garde a posteriori (si le sort prend fin et qu'elle retrouve sa forme normale) aucun souvenir du temps passé sous cette forme.<\/p>\n"}, {"nom": "Mirage", "ecole": "Illusion", "niveau": 7, "classes": ["Barde", "Druide", "Magicien"], "incantation": "10 minutes", "portee": "champ de vision", "composantes": "V, S", "duree": "10 jours", "pages_source": [307], "description": "Vous faites en sorte que l’environnement d'une zone carrée de 1,5 km de côté apparaisse différemment sur tous les plans sensoriels. Ainsi, un champ ou une route pourrait se présenter comme un marais, une colline, une crevasse glaciaire ou quelque autre environnement accidenté ou infranchissable. Une mare pourrait apparaître comme une jolie prairie, un précipice comme une pente douce et un ravin comme une route large et dégagée. De même, vous pouvez altérer l'aspect des bâtiments ou en ajouter là où il n'y en a pas. Le sort ne permet pas de déguiser ni de cacher des créatures, ni d'en ajouter. L'illusion comprend des éléments auditifs, visuels, tactiles et olfactifs, si bien qu'un sol dégagé peut être transformé en Terrain difficile (et vice versa) ou gêner les déplacements dans la zone. Tout élément du terrain illusoire (pierre ou branche, par exemple) retiré de la zone du sort disparaît aussitôt. Les créatures dotées de la Vision lucide percent l'illusion et perçoivent le véritable environnement. Tous les autres éléments de l'illusion restent toutefois en place, si bien qu'une telle créature, consciente de l'illusion, peut toujours interagir physiquement avec ces éléments.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "mirage", "html_body": "<p>Vous faites en sorte que l’environnement d'une zone carrée de 1,5 km de côté apparaisse différemment sur tous les plans sensoriels. Ainsi, un champ ou une route pourrait se présenter comme un marais, une colline, une crevasse glaciaire ou quelque autre environnement accidenté ou infranchissable. Une mare pourrait apparaître comme une jolie prairie, un précipice comme une pente douce et un ravin comme une route large et dégagée. De même, vous pouvez altérer l'aspect des bâtiments ou en ajouter là où il n'y en a pas. Le sort ne permet pas de déguiser ni de cacher des créatures, ni d'en ajouter. L'illusion comprend des éléments auditifs, visuels, tactiles et olfactifs, si bien qu'un sol dégagé peut être transformé en Terrain difficile (et vice versa) ou gêner les déplacements dans la zone. Tout élément du terrain illusoire (pierre ou branche, par exemple) retiré de la zone du sort disparaît aussitôt. Les créatures dotées de la Vision lucide percent l'illusion et perçoivent le véritable environnement. Tous les autres éléments de l'illusion restent toutefois en place, si bien qu'une telle créature, consciente de l'illusion, peut toujours interagir physiquement avec ces éléments.<\/p>\n"}, {"nom": "Modification D'Apparence", "ecole": "Transmutation", "niveau": 2, "classes": ["Ensorceleur", "Magicien"], "incantation": "action", "portee": "personnelle", "composantes": "V, S", "duree": "Concentration, jusqu’à 1 heure", "pages_source": [307], "description": "Vous altérez votre forme physique. Choisissez l’une des options suivantes. Les effets persistent pour toute la durée, durant laquelle vous pouvez entreprendre l’action Magie pour changer d'option.\nAdaptation aquatique. Vous vous dotez de branchies et vos doigts deviennent palmés. Vous recevez une Vitesse de nage égale à votre Vitesse et pouvez respirer sous l'eau. ou de Nbre a arh de ons recourez Yrskre” attaque à mains nues pour infliger des dégâts avec ces nouveaux appendices, ils infligent 1d6 dégâts quand ils touchent, du type indiqué entre parenthèses, et vous ajoutez votre modificateur de caractéristique d'incantation aux jets d'attaque et de dégâts, au lieu de recourir à la Force.\nChangement d'aspect. Vous transformez votre aspect. Vous décidez de votre apparence, notamment de votre taille, votre poids, les traits de votre visage, le timbre de votre voix, la longueur de vos cheveux, votre teint et autres attributs. Vous pouvez vous faire passer pour un membre d'une autre espèce, mais cela n’influe pas sur votre profil de jeu. Vous ne pouvez pas prendre l'aspect d'une créature dont la catégorie de taille est différente de la vôtre et votre structure corporelle doit rester la même ; si vous êtes bipède, vous ne pouvez pas profiter de ce sort pour devenir quadrupède, par exemple. Pour toute la durée du sort, vous pouvez entreprendre l’action Magie pour changer à nouveau votre aspect de cette manière.", "illustration": null, "legende_illustration": null, "notes_verification": "encadre_statistiques_a_controler", "statut": "ocr_non_valide", "id": "modification-d-apparence", "html_body": "<p>Vous altérez votre forme physique. Choisissez l’une des options suivantes. Les effets persistent pour toute la durée, durant laquelle vous pouvez entreprendre l’action Magie pour changer d'option.\nAdaptation aquatique. Vous vous dotez de branchies et vos doigts deviennent palmés. Vous recevez une Vitesse de nage égale à votre Vitesse et pouvez respirer sous l'eau. ou de Nbre a arh de ons recourez Yrskre” attaque à mains nues pour infliger des dégâts avec ces nouveaux appendices, ils infligent 1d6 dégâts quand ils touchent, du type indiqué entre parenthèses, et vous ajoutez votre modificateur de caractéristique d'incantation aux jets d'attaque et de dégâts, au lieu de recourir à la Force.\nChangement d'aspect. Vous transformez votre aspect. Vous décidez de votre apparence, notamment de votre taille, votre poids, les traits de votre visage, le timbre de votre voix, la longueur de vos cheveux, votre teint et autres attributs. Vous pouvez vous faire passer pour un membre d'une autre espèce, mais cela n’influe pas sur votre profil de jeu. Vous ne pouvez pas prendre l'aspect d'une créature dont la catégorie de taille est différente de la vôtre et votre structure corporelle doit rester la même ; si vous êtes bipède, vous ne pouvez pas profiter de ce sort pour devenir quadrupède, par exemple. Pour toute la durée du sort, vous pouvez entreprendre l’action Magie pour changer à nouveau votre aspect de cette manière.<\/p>\n"}, {"nom": "Modification de Mémoire", "ecole": "Enchantement", "niveau": 5, "classes": ["Barde", "Magicien"], "incantation": "action", "portee": "9 m", "composantes": "V, S", "duree": "Concentration, jusqu'à 1 minute", "pages_source": [307, 308], "description": "Vous tentez de remodeler les souvenirs d'une autre créature. Une créature que vous voyez à portée effectue un jet de sauvegarde de Sagesse. Si vous êtes en train de l’'affronter, elle a l’'Avantage au JS. En cas d'échec, la cible subit l'état Charmé pour toute la durée. Ainsi Charmée, la cible subit aussi l’état Neutralisé et n'a pas conscience de son environnement, mais elle vous entend toujours. Si elle subit des dégâts ou est la cible d’un autre sort, cette modification de mémoire prend fin et nul souvenir n'est altéré. Tant que persiste ce charme, vous pouvez influer sur un souvenir de la cible ayant eu lieu au cours des 24 dernières heures et ne s’étalant pas sur plus de 10 minutes. Vous pouvez effacer toute mémoire de l'événement, permettre au contraire à la cible de se souvenir parfaitement de l'épisode dans les moindres détails, altérer certains éléments qui y sont liés dans son esprit ou créer de toutes pièces le souvenir d’un autre événement. Vous devez parler à la cible pour lui décrire en quoi sa mémoire est modifiée, sachant qu'elle doit comprendre la langue employée pour que le souvenir s'enracine. Son esprit se charge de combler les lacunes de votre description. Si le sort prend fin avant que vous ayez fini de décrire les souvenirs modifiés, la mémoire de la créature n’est pas altérée.\nSinon, l’altération prend effet quand le sort se termine. Sa mémoire modifiée, la créature ne va pas forcément se comporter différemment, surtout si ces souvenirs vont à l'encontre de ses penchants naturels, de son alignement ou de ses croyances. Si le souvenir implanté est absurde, comme un épisode dans lequel la créature se serait baignée dans l'acide en y prenant plaisir, il sera simplement perçu comme un mauvais rêve. Le MD peut décider qu'un souvenir modifié est trop contraire à la raison pour affecter la créature. Le sort délivrance des malédictions ou restauration suprême lancé sur la cible lui rend sa mémoire d'origine.\nEmplacement de niveau supérieur. Vous pouvez altérer le souvenir d'un événement qui remonte à un maximum de 7 jours (6° niveau), 30 jours (7°), 365 jours (8°) ou à tout moment de son passé (9°). MONTURE FANTÔME", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "modification-de-memoire", "html_body": "<p>Vous tentez de remodeler les souvenirs d'une autre créature. Une créature que vous voyez à portée effectue un jet de sauvegarde de Sagesse. Si vous êtes en train de l’'affronter, elle a l’'Avantage au JS. En cas d'échec, la cible subit l'état Charmé pour toute la durée. Ainsi Charmée, la cible subit aussi l’état Neutralisé et n'a pas conscience de son environnement, mais elle vous entend toujours. Si elle subit des dégâts ou est la cible d’un autre sort, cette modification de mémoire prend fin et nul souvenir n'est altéré. Tant que persiste ce charme, vous pouvez influer sur un souvenir de la cible ayant eu lieu au cours des 24 dernières heures et ne s’étalant pas sur plus de 10 minutes. Vous pouvez effacer toute mémoire de l'événement, permettre au contraire à la cible de se souvenir parfaitement de l'épisode dans les moindres détails, altérer certains éléments qui y sont liés dans son esprit ou créer de toutes pièces le souvenir d’un autre événement. Vous devez parler à la cible pour lui décrire en quoi sa mémoire est modifiée, sachant qu'elle doit comprendre la langue employée pour que le souvenir s'enracine. Son esprit se charge de combler les lacunes de votre description. Si le sort prend fin avant que vous ayez fini de décrire les souvenirs modifiés, la mémoire de la créature n’est pas altérée.\nSinon, l’altération prend effet quand le sort se termine. Sa mémoire modifiée, la créature ne va pas forcément se comporter différemment, surtout si ces souvenirs vont à l'encontre de ses penchants naturels, de son alignement ou de ses croyances. Si le souvenir implanté est absurde, comme un épisode dans lequel la créature se serait baignée dans l'acide en y prenant plaisir, il sera simplement perçu comme un mauvais rêve. Le MD peut décider qu'un souvenir modifié est trop contraire à la raison pour affecter la créature. Le sort délivrance des malédictions ou restauration suprême lancé sur la cible lui rend sa mémoire d'origine.\nEmplacement de niveau supérieur. Vous pouvez altérer le souvenir d'un événement qui remonte à un maximum de 7 jours (6° niveau), 30 jours (7°), 365 jours (8°) ou à tout moment de son passé (9°). MONTURE FANTÔME<\/p>\n"}, {"nom": "Monture Fantôme", "ecole": "Illusion", "niveau": 3, "classes": ["Magicien"], "incantation": "À vérifier", "portee": "9 m", "composantes": "V, S", "duree": "1 heure", "pages_source": [308, 309], "description": "Une créature chevaline quasi réelle de taille G se manifeste au sol en un espace inoccupé que vous choisissez à portée. Vous décidez de son apparence, sachant qu'elle est équipée d'une selle, de mors et d’une bride. Tout l'équipement créé par le sort disparaît dans une bouffée de fumée si on l’éloigne de plus de 3 m de la monture. Pour toute la durée, vous ou une créature que vous désignez pouvez chevaucher la monture. La monture reprend le profil du cheval de selle (cf. annexe B), si ce n'est que sa Vitesse est de 30 m et qu'elle peut couvrir 19,5 km en une heure. Quand le sort prend fin, la monture s’efface progressivement en laissant à son cavalier 1 minute pour en descendre. Le sort prend fin prématurément si la monture subit le moindre dégât. 2 bd om pr UNE BAROESSE GNOMIDE RECOURT À MOQUERIE CRUELLE POUR AGONIR\nUN KOBOED D'INSULTES MAGIQUES.", "illustration": null, "legende_illustration": null, "notes_verification": "champ_absent:incantation", "statut": "ocr_non_valide", "id": "monture-fantome", "html_body": "<p>Une créature chevaline quasi réelle de taille G se manifeste au sol en un espace inoccupé que vous choisissez à portée. Vous décidez de son apparence, sachant qu'elle est équipée d'une selle, de mors et d’une bride. Tout l'équipement créé par le sort disparaît dans une bouffée de fumée si on l’éloigne de plus de 3 m de la monture. Pour toute la durée, vous ou une créature que vous désignez pouvez chevaucher la monture. La monture reprend le profil du cheval de selle (cf. annexe B), si ce n'est que sa Vitesse est de 30 m et qu'elle peut couvrir 19,5 km en une heure. Quand le sort prend fin, la monture s’efface progressivement en laissant à son cavalier 1 minute pour en descendre. Le sort prend fin prématurément si la monture subit le moindre dégât. 2 bd om pr UNE BAROESSE GNOMIDE RECOURT À MOQUERIE CRUELLE POUR AGONIR\nUN KOBOED D'INSULTES MAGIQUES.<\/p>\n"}, {"nom": "Moquerie Cruelle", "ecole": "Enchantement", "niveau": 0, "classes": ["Barde"], "incantation": "À vérifier", "portee": "18 m", "composantes": "V", "duree": "instantanée", "pages_source": [309], "description": "Vous adressez un chapelet d'insultes assaisonnées de subtils enchantements à une créature que vous voyez ou entendez à portée. La cible doit réussir un jet de sauvegarde de Sagesse sous peine de subir 1d6 dégâts psychiques, ainsi que le Désavantage à son prochain jet d'attaque intervenant avant la fin de son tour suivant.\nAmélioration de sort mineur. Les dégâts augmentent de 1d6 lorsque vous atteignez les niveaux 5 (2d6), 11 (3d6) et 17 (4d6).", "illustration": null, "legende_illustration": null, "notes_verification": "champ_absent:incantation", "statut": "ocr_non_valide", "id": "moquerie-cruelle", "html_body": "<p>Vous adressez un chapelet d'insultes assaisonnées de subtils enchantements à une créature que vous voyez ou entendez à portée. La cible doit réussir un jet de sauvegarde de Sagesse sous peine de subir 1d6 dégâts psychiques, ainsi que le Désavantage à son prochain jet d'attaque intervenant avant la fin de son tour suivant.\nAmélioration de sort mineur. Les dégâts augmentent de 1d6 lorsque vous atteignez les niveaux 5 (2d6), 11 (3d6) et 17 (4d6).<\/p>\n"}, {"nom": "Mot de Guérison", "ecole": "Abjuration", "niveau": 1, "classes": ["Barde", "Clerc", "Druide"], "incantation": "À vérifier", "portee": "18 m", "composantes": "V", "duree": "instantanée", "pages_source": [309], "description": "La créature de votre choix parmi celles que vous voyez à portée récupère des points de vie : 2d4 + votre modificateur de caractéristique d’incantation.\nEmplacement de niveau supérieur. Les soins augmentent de 2d4 par niveau d'emplacement au-delà du 1°.", "illustration": null, "legende_illustration": null, "notes_verification": "champ_absent:incantation; encadre_statistiques_a_controler", "statut": "ocr_non_valide", "id": "mot-de-guerison", "html_body": "<p>La créature de votre choix parmi celles que vous voyez à portée récupère des points de vie : 2d4 + votre modificateur de caractéristique d’incantation.\nEmplacement de niveau supérieur. Les soins augmentent de 2d4 par niveau d'emplacement au-delà du 1°.<\/p>\n"}, {"nom": "Mot de Guérison de Groupe", "ecole": "Abjuration", "niveau": 3, "classes": ["Barde", "Clerc"], "incantation": "action Bonus", "portee": "18 m", "composantes": "V", "duree": "instantanée", "pages_source": [309], "description": "Un maximum de six créatures de votre choix parmi celles que vous voyez à portée récupèrent des points de vie : 2d4 + votre modificateur de caractéristique d’incantation.\nEmplacement de niveau supérieur. Les soins augmentent de id4 par niveau d'emplacement au-delà du 3°.", "illustration": null, "legende_illustration": null, "notes_verification": "encadre_statistiques_a_controler", "statut": "ocr_non_valide", "id": "mot-de-guerison-de-groupe", "html_body": "<p>Un maximum de six créatures de votre choix parmi celles que vous voyez à portée récupèrent des points de vie : 2d4 + votre modificateur de caractéristique d’incantation.\nEmplacement de niveau supérieur. Les soins augmentent de id4 par niveau d'emplacement au-delà du 3°.<\/p>\n"}, {"nom": "Mot de Pouvoir Étourdissant", "ecole": "Enchantement", "niveau": 8, "classes": ["Barde", "Ensorceleur", "Magicien", "Occultiste"], "incantation": "action", "portee": "18 m", "composantes": "V", "duree": "instantanée", "pages_source": [309], "description": "Vous assaillez l'esprit d'une créature que vous voyez à portée. Si la cible choisie est dotée de 150 points de vie CHAPITRE 7 | SORTS 309", "illustration": null, "legende_illustration": null, "notes_verification": "encadre_statistiques_a_controler; symboles_suspects", "statut": "ocr_non_valide", "id": "mot-de-pouvoir-etourdissant", "html_body": "<p>Vous assaillez l'esprit d'une créature que vous voyez à portée. Si la cible choisie est dotée de 150 points de vie CHAPITRE 7 | SORTS 309<\/p>\n"}, {"nom": "Mot de Pouvoir Fortifiant", "ecole": "Enchantement", "niveau": 7, "classes": ["Barde", "Clerc"], "incantation": "action", "portee": "18 m", "composantes": "V", "duree": "instantanée", "pages_source": [310], "description": "Vous fortifiez un maximum de six créatures que vous voyez à portée. Le sort octroie 120 points de vie temporaires, que vous répartissez entre les bénéficiaires. ere", "illustration": null, "legende_illustration": null, "notes_verification": "encadre_statistiques_a_controler", "statut": "ocr_non_valide", "id": "mot-de-pouvoir-fortifiant", "html_body": "<p>Vous fortifiez un maximum de six créatures que vous voyez à portée. Le sort octroie 120 points de vie temporaires, que vous répartissez entre les bénéficiaires. ere<\/p>\n"}, {"nom": "Mot de Pouvoir Guérisseur", "ecole": "Enchantement", "niveau": 9, "classes": ["Barde", "Clerc"], "incantation": "action", "portee": "18 m", "composantes": "V", "duree": "instantanée", "pages_source": [310], "description": "Une vague d'énergies de guérison baigne une créature que vous voyez à portée. La cible récupère tous ses points de vie. Si la créature a l'état Charmé, Effrayé, Empoisonné,\nÉtourdi ou Paralysé, cet état prend fin. Si la créature a l'état\nÀ terre, elle peut jouer sa Réaction pour se relever.", "illustration": null, "legende_illustration": null, "notes_verification": "encadre_statistiques_a_controler", "statut": "ocr_non_valide", "id": "mot-de-pouvoir-guerisseur", "html_body": "<p>Une vague d'énergies de guérison baigne une créature que vous voyez à portée. La cible récupère tous ses points de vie. Si la créature a l'état Charmé, Effrayé, Empoisonné,\nÉtourdi ou Paralysé, cet état prend fin. Si la créature a l'état\nÀ terre, elle peut jouer sa Réaction pour se relever.<\/p>\n"}, {"nom": "Mot de Pouvoir Mortel", "ecole": "Enchantement", "niveau": 9, "classes": ["Barde", "Ensorceleur", "Magicien", "Occultiste"], "incantation": "action", "portee": "18 m", "composantes": "V", "duree": "instantanée", "pages_source": [310], "description": "La mort s'impose à une créature que vous voyez à portée. Si la cible choisie est dotée de 100 points de vie ou moins, elle meurt. Dans le cas contraire, elle subit 12d12 dégâts psychiques.", "illustration": null, "legende_illustration": null, "notes_verification": "encadre_statistiques_a_controler", "statut": "ocr_non_valide", "id": "mot-de-pouvoir-mortel", "html_body": "<p>La mort s'impose à une créature que vous voyez à portée. Si la cible choisie est dotée de 100 points de vie ou moins, elle meurt. Dans le cas contraire, elle subit 12d12 dégâts psychiques.<\/p>\n"}, {"nom": "Mot de Radiance", "ecole": "Évocation", "niveau": 0, "classes": ["Clerc"], "incantation": "action", "portee": "personnelle", "composantes": "V, M (un symbole en forme de soleil)", "duree": "instantanée", "pages_source": [310], "description": "Une radiance ardente jaillit de vous sous forme d'une\nÉmanation de 1,50 m. Chaque créature choisie parmi celles que vous voyez dans la zone doit réussir un jet de sauvegarde de Constitution, sous peine de subir 1d6 dégâts radiants.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "mot-de-radiance", "html_body": "<p>Une radiance ardente jaillit de vous sous forme d'une\nÉmanation de 1,50 m. Chaque créature choisie parmi celles que vous voyez dans la zone doit réussir un jet de sauvegarde de Constitution, sous peine de subir 1d6 dégâts radiants.<\/p>\n"}, {"nom": "Mot de Retour", "ecole": "Invocation", "niveau": 6, "classes": ["Clerc"], "incantation": "action", "portee": "1,50 m", "composantes": "V", "duree": "instantanée", "pages_source": [310], "description": "Vous-même et un maximum de cinq créatures consentantes situées dans un rayon de 1,50 m vous téléportez en un sanctuaire désigné à l'avance. Vous et les créatures téléportées apparaissez dans les espaces inoccupés les plus proches du point désigné quand vous avez préparé votre sanctuaire (voir plus loin). Si vous lancez ce sort sans avoir préparé de sanctuaire, il est sans effet. Le sanctuaire se désigne au préalable en lançant ce sort en un lieu, tel qu'un temple.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "mot-de-retour", "html_body": "<p>Vous-même et un maximum de cinq créatures consentantes situées dans un rayon de 1,50 m vous téléportez en un sanctuaire désigné à l'avance. Vous et les créatures téléportées apparaissez dans les espaces inoccupés les plus proches du point désigné quand vous avez préparé votre sanctuaire (voir plus loin). Si vous lancez ce sort sans avoir préparé de sanctuaire, il est sans effet. Le sanctuaire se désigne au préalable en lançant ce sort en un lieu, tel qu'un temple.<\/p>\n"}, {"nom": "Motif Hypnotique", "ecole": "Illusion", "niveau": 3, "classes": ["Barde", "Ensorceleur", "Magicien", "Occultiste"], "incantation": "action", "portee": "36 m", "composantes": "S, M (une pincée de confettis)", "duree": "Concentration, jusqu’à 1 minute", "pages_source": [310], "description": "Vous créez un motif animé de couleurs occupant un Cube de 9 m à portée. Le motif apparaît un instant et disparaît aussitôt. Chaque créature prise dans la zone, si elle voit le motif, doit réussir un jet de sauvegarde de Sagesse sous peine de subir l’état Charmé pour toute la durée du sort. Tant qu'elle est ainsi Charmée, la créature subit l’état\nNeutralisé et sa Vitesse est de 0. Le sort prend fin pour une créature affectée si elle subit des dégâts ou si quelqu'un d'autre consacre une action à la sortir de son hébétude.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "motif-hypnotique", "html_body": "<p>Vous créez un motif animé de couleurs occupant un Cube de 9 m à portée. Le motif apparaît un instant et disparaît aussitôt. Chaque créature prise dans la zone, si elle voit le motif, doit réussir un jet de sauvegarde de Sagesse sous peine de subir l’état Charmé pour toute la durée du sort. Tant qu'elle est ainsi Charmée, la créature subit l’état\nNeutralisé et sa Vitesse est de 0. Le sort prend fin pour une créature affectée si elle subit des dégâts ou si quelqu'un d'autre consacre une action à la sortir de son hébétude.<\/p>\n"}, {"nom": "Mur D'Épines", "ecole": "Invocation", "niveau": 6, "classes": ["Druide"], "incantation": "action", "portee": "36 m", "composantes": "V, S, M (une poignée d'épines)", "duree": "Concentration, jusqu’à 10 minutes", "pages_source": [310, 311], "description": "Vous créez un mur fait d'un enchevêtrement végétal hérissé d'épines acérées. Le mur apparaît à portée sur une surface solide et persiste pour toute la durée. Vous pouvez ainsi ériger un mur dont l'épaisseur n'excède pas 1,50 m ; pour le reste, vous avez le choix entre un mur droit long d’un maximum de 18 m et haut de 3 m ou moins, et un mur circulaire dont le diamètre et la hauteur ne dépassent pas 6 m. Le mur bloque le champ de vision. Quand le mur apparaît, chaque créature prise dans sa zone effectue un jet de sauvegarde de Dextérité et subit 7d8 dégâts perforants en cas d'échec, la moitié en cas de réussite. Une créature peut se déplacer à travers ces ronces, mais l'opération est lente et douloureuse. Toute distance parcourue à travers le mur lui coûte le quadruple en termes de déplacement. De plus, la première fois d'un tour qu'une créature pénètre dans la haie ou qu'elle y termine son propre tour, elle effectue un jet de sauvegarde de Dextérité et subit 7d8 dégâts tranchants en cas d'échec, la moitié en cas de réussite. Une même créature n'effectue en aucun cas ce JS plus d'une fois par tour.\nEmplacement de niveau supérieur. Les dégâts des deux types augmentent de 1d8 par niveau d'emplacement au-delà du 6°.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "mur-d-epines", "html_body": "<p>Vous créez un mur fait d'un enchevêtrement végétal hérissé d'épines acérées. Le mur apparaît à portée sur une surface solide et persiste pour toute la durée. Vous pouvez ainsi ériger un mur dont l'épaisseur n'excède pas 1,50 m ; pour le reste, vous avez le choix entre un mur droit long d’un maximum de 18 m et haut de 3 m ou moins, et un mur circulaire dont le diamètre et la hauteur ne dépassent pas 6 m. Le mur bloque le champ de vision. Quand le mur apparaît, chaque créature prise dans sa zone effectue un jet de sauvegarde de Dextérité et subit 7d8 dégâts perforants en cas d'échec, la moitié en cas de réussite. Une créature peut se déplacer à travers ces ronces, mais l'opération est lente et douloureuse. Toute distance parcourue à travers le mur lui coûte le quadruple en termes de déplacement. De plus, la première fois d'un tour qu'une créature pénètre dans la haie ou qu'elle y termine son propre tour, elle effectue un jet de sauvegarde de Dextérité et subit 7d8 dégâts tranchants en cas d'échec, la moitié en cas de réussite. Une même créature n'effectue en aucun cas ce JS plus d'une fois par tour.\nEmplacement de niveau supérieur. Les dégâts des deux types augmentent de 1d8 par niveau d'emplacement au-delà du 6°.<\/p>\n"}, {"nom": "Mur de Feu", "ecole": "Évocation", "niveau": 4, "classes": ["Druide", "Ensorceleur", "Magicien"], "incantation": "action", "portee": "36 m", "composantes": "V, S, M (un morceau de charbon)", "duree": "Concentration, jusqu'à 1 minute", "pages_source": [311], "description": "Vous créez un mur de flammes sur une surface solide à portée. Vous pouvez ainsi ériger un mur dont la hauteur n'excède pas 6 m et l'épaisseur 30 cm ; pour le reste, vous avez le choix entre un mur droit long d’un maximum de 18 m et un mur circulaire dont le diamètre ne dépasse pas 6 m. Ce mur opaque persiste pour toute la durée. Quand le mur apparaît, chaque créature prise dans sa zone effectue un jet de sauvegarde de Dextérité et subit 5d8 dégâts de feu en cas d'échec, la moitié en cas de réussite. L'un des côtés du mur que vous choisissez à l’incantation du sort inflige 5d8 dégâts de feu à toute créature qui termine son tour à 3 m ou moins de ce côté ou dans le mur. Une créature qui pénètre dans le mur pour la première fois d'un tour ou qui y termine son tour subit ces mêmes dégâts. L'autre côté du mur n'inflige pas de dégâts.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d8 par niveau d'emplacement au-delà du 4°.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "mur-de-feu", "html_body": "<p>Vous créez un mur de flammes sur une surface solide à portée. Vous pouvez ainsi ériger un mur dont la hauteur n'excède pas 6 m et l'épaisseur 30 cm ; pour le reste, vous avez le choix entre un mur droit long d’un maximum de 18 m et un mur circulaire dont le diamètre ne dépasse pas 6 m. Ce mur opaque persiste pour toute la durée. Quand le mur apparaît, chaque créature prise dans sa zone effectue un jet de sauvegarde de Dextérité et subit 5d8 dégâts de feu en cas d'échec, la moitié en cas de réussite. L'un des côtés du mur que vous choisissez à l’incantation du sort inflige 5d8 dégâts de feu à toute créature qui termine son tour à 3 m ou moins de ce côté ou dans le mur. Une créature qui pénètre dans le mur pour la première fois d'un tour ou qui y termine son tour subit ces mêmes dégâts. L'autre côté du mur n'inflige pas de dégâts.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d8 par niveau d'emplacement au-delà du 4°.<\/p>\n"}, {"nom": "Mur de Force", "ecole": "Évocation", "niveau": 5, "classes": ["Magicien"], "incantation": "action", "portee": "36 m", "composantes": "V, S, M (un éclat de verre)", "duree": "Concentration, jusqu'à 10 minutes", "pages_source": [311], "description": "Un mur de force Invisible se matérialise en un point que vous choisissez à portée. Le mur se présente dans l'orientation de votre choix, horizontal ou vertical, voire complètement de biais. Il peut rester en suspension ou reposer sur une surface solide. Vous pouvez le façonner en dôme hémisphérique ou en globe d'un rayon maximal de 3 m, ou en faire une surface plane composée de dix pans de 3 m sur 3. Chaque pan doit être contigu avec un autre. Quelle que soit sa forme, le mur est épais de 6 mm et persiste pour toute la durée. Si le mur traverse l'espace d'une créature à son apparition, la créature est repoussée du côté du mur que vous choisissez.\nRien ne peut franchir physiquement le mur. Il est immunisé contre tous les dégâts et insensible à dissipation de la magie. Le sort désintégration détruit en revanche le mur instantanément. Ce mur s'étend en outre sur le Plan Éthéré, ce qui empêche le voyage éthéré le traversant. act 5 FE CE _— ane _ = - — Ke", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "mur-de-force", "html_body": "<p>Un mur de force Invisible se matérialise en un point que vous choisissez à portée. Le mur se présente dans l'orientation de votre choix, horizontal ou vertical, voire complètement de biais. Il peut rester en suspension ou reposer sur une surface solide. Vous pouvez le façonner en dôme hémisphérique ou en globe d'un rayon maximal de 3 m, ou en faire une surface plane composée de dix pans de 3 m sur 3. Chaque pan doit être contigu avec un autre. Quelle que soit sa forme, le mur est épais de 6 mm et persiste pour toute la durée. Si le mur traverse l'espace d'une créature à son apparition, la créature est repoussée du côté du mur que vous choisissez.\nRien ne peut franchir physiquement le mur. Il est immunisé contre tous les dégâts et insensible à dissipation de la magie. Le sort désintégration détruit en revanche le mur instantanément. Ce mur s'étend en outre sur le Plan Éthéré, ce qui empêche le voyage éthéré le traversant. act 5 FE CE _— ane _ = - — Ke<\/p>\n"}, {"nom": "Mur de Glace", "ecole": "Évocation", "niveau": 6, "classes": ["Magicien"], "incantation": "action", "portee": "36 m", "composantes": "V, S, M (un morceau de quartz)", "duree": "Concentration, jusqu'à 10 minutes", "pages_source": [311], "description": "Vous créez un mur de glace sur une surface solide à portée. Vous pouvez le façonner en dôme hémisphérique ou en globe d’un rayon maximal de 3 m, ou en faire une surface plane composée de dix pans de 3 m sur 3. Chaque pan doit être contigu avec un autre. Quelle que soit sa forme, le mur est épais de 30 cm et persiste pour toute la durée. Si le mur traverse l'espace d’une créature à son apparition, la créature est repoussée du côté du mur que vous choisissez et effectue un jet de sauvegarde de Dextérité ; elle subit 10d6 dégâts de froid en cas d'échec, la moitié en cas de réussite. Le mur est un objet que l’on peut endommager, ce qui permet d'y ouvrir une brèche. Il est doté d’une CA de 12, de 30 points de vie par section de 3 m de côté, il est immurnisé contre les dégâts de froid, de poison et psychiques, et vulnérable aux dégâts de feu. Une section de 3 m de côté réduite à O point de vie est détruite et laisse une nappe d'air glacial dans l’espace qu'elle occupait. Une créature qui traverse une telle nappe pour la première fois d’un tour effectue un jet de sauvegarde de Constitution et subit 5d6 dégâts de froid en cas d'échec, la moitié en cas de réussite.\nEmplacement de niveau supérieur. Les dégâts infligés par le mur à son apparition augmentent de 2d6 et ceux de la nappe d'air glacial de 1d6 par niveau d'emplacement au-delà du 6°.", "illustration": null, "legende_illustration": null, "notes_verification": "encadre_statistiques_a_controler", "statut": "ocr_non_valide", "id": "mur-de-glace", "html_body": "<p>Vous créez un mur de glace sur une surface solide à portée. Vous pouvez le façonner en dôme hémisphérique ou en globe d’un rayon maximal de 3 m, ou en faire une surface plane composée de dix pans de 3 m sur 3. Chaque pan doit être contigu avec un autre. Quelle que soit sa forme, le mur est épais de 30 cm et persiste pour toute la durée. Si le mur traverse l'espace d’une créature à son apparition, la créature est repoussée du côté du mur que vous choisissez et effectue un jet de sauvegarde de Dextérité ; elle subit 10d6 dégâts de froid en cas d'échec, la moitié en cas de réussite. Le mur est un objet que l’on peut endommager, ce qui permet d'y ouvrir une brèche. Il est doté d’une CA de 12, de 30 points de vie par section de 3 m de côté, il est immurnisé contre les dégâts de froid, de poison et psychiques, et vulnérable aux dégâts de feu. Une section de 3 m de côté réduite à O point de vie est détruite et laisse une nappe d'air glacial dans l’espace qu'elle occupait. Une créature qui traverse une telle nappe pour la première fois d’un tour effectue un jet de sauvegarde de Constitution et subit 5d6 dégâts de froid en cas d'échec, la moitié en cas de réussite.\nEmplacement de niveau supérieur. Les dégâts infligés par le mur à son apparition augmentent de 2d6 et ceux de la nappe d'air glacial de 1d6 par niveau d'emplacement au-delà du 6°.<\/p>\n"}, {"nom": "Mur de Pierre", "ecole": "Évocation", "niveau": 5, "classes": ["Druide", "Ensorceleur", "Magicien"], "incantation": "À vérifier", "portee": "36 m", "composantes": "V, S, M (un cube de granit)", "duree": "Concentration, jusqu'à 10 minutes", "pages_source": [311, 312], "description": "Un mur non magique de pierre solide se matérialise en un point que vous choisissez à portée. Le mur, épais de 15 cm, se compose de dix pans de 3 m sur 3. Chaque pan doit être contigu avec un autre. Une autre option consiste à créer des pans de 3 m sur 6, épais de seulement 7,5 cm. Si le mur traverse l'espace d'une créature à son apparition, la créature est repoussée du côté du mur que vous choisissez. Si une créature est censée se retrouver cernée par le mur de tous les côtés (ou par le mur et une autre surface solide), elle a droit à un jet de sauvegarde de Dextérité. En cas de réussite, elle peut jouer sa Réaction pour se déplacer dans les limites de sa Vitesse de manière à ne plus être séquestrée par le mur.\n\nir - A PT did À 34 à » er deg ms ae + Pop qu andre ESS Vous pouvez ainsi recourir à ce soft pour créer un qui enjambe un gouffre, ou un plan incliné. Si le pont ainsi créé dépasse 6 m de long, vous devez réduire de moitié la taille de chaque pan de façon à l'étayer. Vous pouvez grossièrement façonner le mur pour produire des remparts ou créneaux. Le mur est un objet de pierre que l'on peut endommager, ce qui permet d'y ouvrir une brèche. Chaque pan présente une CA de 15 et compte 30 points de vie par tranche de 2,5 cm d'épaisseur, et bénéficie de l’Immunité contre les dégâts psychiques et de poison. Un pan réduit à O point de vie est détruit, ce qui peut en outre provoquer l'effondrement de pans contigus, à l'appréciation du MD. Si vous maintenez la Concentration sur ce sort jusqu'au bout de sa durée maximale, le mur devient permanent, sans possibilité de le dissiper. Sans cela, il disparaît quand le sort prend fin.", "illustration": null, "legende_illustration": null, "notes_verification": "champ_absent:incantation; encadre_statistiques_a_controler", "statut": "ocr_non_valide", "id": "mur-de-pierre", "html_body": "<p>Un mur non magique de pierre solide se matérialise en un point que vous choisissez à portée. Le mur, épais de 15 cm, se compose de dix pans de 3 m sur 3. Chaque pan doit être contigu avec un autre. Une autre option consiste à créer des pans de 3 m sur 6, épais de seulement 7,5 cm. Si le mur traverse l'espace d'une créature à son apparition, la créature est repoussée du côté du mur que vous choisissez. Si une créature est censée se retrouver cernée par le mur de tous les côtés (ou par le mur et une autre surface solide), elle a droit à un jet de sauvegarde de Dextérité. En cas de réussite, elle peut jouer sa Réaction pour se déplacer dans les limites de sa Vitesse de manière à ne plus être séquestrée par le mur.<\/p>\n<p>ir - A PT did À 34 à » er deg ms ae + Pop qu andre ESS Vous pouvez ainsi recourir à ce soft pour créer un qui enjambe un gouffre, ou un plan incliné. Si le pont ainsi créé dépasse 6 m de long, vous devez réduire de moitié la taille de chaque pan de façon à l'étayer. Vous pouvez grossièrement façonner le mur pour produire des remparts ou créneaux. Le mur est un objet de pierre que l'on peut endommager, ce qui permet d'y ouvrir une brèche. Chaque pan présente une CA de 15 et compte 30 points de vie par tranche de 2,5 cm d'épaisseur, et bénéficie de l’Immunité contre les dégâts psychiques et de poison. Un pan réduit à O point de vie est détruit, ce qui peut en outre provoquer l'effondrement de pans contigus, à l'appréciation du MD. Si vous maintenez la Concentration sur ce sort jusqu'au bout de sa durée maximale, le mur devient permanent, sans possibilité de le dissiper. Sans cela, il disparaît quand le sort prend fin.<\/p>\n"}, {"nom": "Mur Prismatique", "ecole": "Abjuration", "niveau": 9, "classes": ["Barde", "Magicien"], "incantation": "À vérifier", "portee": "18 m", "composantes": "V, S", "duree": "10 minutes", "pages_source": [312], "description": "Un plan multicolore de lueurs chatoyantes s'érige sous forme d'un mur vertical opaque centré sur un point à portée, avec les dimensions maximales suivantes : longueur 27 m, hauteur 9 m et épaisseur 2,5 cm. Vous pouvez au lieu de cela lui donner la forme d'un globe d'un diamètre maximal de 9 m, centré sur un point à portée. Le mur persiste pour toute la durée. Si vous positionnez le mur en un espace occupé par une créature, le sort prend aussitôt fin sans effet. Le mur produit une Lumière vive sur une distance de 30 m et une Lumière faible sur 30 m de plus. Vous et les créatures que vous désignez à l’incantation du sort pouvez sans risque traverser le mur et rester à proximité. Si une autre créature qui voit le mur s'approche dans un rayon de 6 m de sa zone ou y commence son tour, elle doit réussir un jet de sauvegarde de Constitution sous peine de subir l'état Aveuglé pendant 1 minute. Le mur est constitué de sept couches, chacune d’une couleur différente. Lorsqu'une créature tente de pénétrer le mur ou de le traverser, elle le fait couche après couche jusqu’à toutes les avoir franchies. Chaque couche contraint la créature à un jet de sauvegarde de Dextérité pour éviter d'être affectée par les propriétés de la couche, décrites dans la table Couches prismatiques. On peut détruire le mur (CA 10), couche par couche, de la rouge à la violette, par des moyens propres à chaque couche. Quand une couche est détruite, elle disparaît pour toute la durée. Un champ antimagie reste sans effet sur le mur, gente ou dampetien dela magie ARE AE + COUCHES PRISMATIQUES Ordre Effets 1\nRouge. Échec au JS : 12d6 dégâts de feu. JS réussi : 1/2 dégâts. Effets supplémentaires : les attaques à distance non magiques ne peuvent traverser cette couche, détruite si elle subit au moins 25 dégâts de froid.\nOrange. Échec au JS : 12d6 dégâts d'acide. JS réussi : 1/2 dégâts. Effets supplémentaires : les attaques magiques à distance ne peuvent traverser cette couche, détruite par un vent fort (comme celui produit par bourrasque).\nJaune. Échec au JS : 12d6 dégâts de foudre. JS réussi : 1/2 dégâts. Effets supplémentaires : la couche se détruit si elle subit au moins 60 dégâts de force.\nVerte. Échec au JS : 12d6 dégâts de poison. JS réussi : 1/2 dégâts. Effets supplémentaires : le sort passemuraille, ou autre sort de niveau supérieur ou égal capable d'ouvrir un portail sur une surface solide, détruit cette couche.\nBleue. Échec au JS : 12d6 dégâts de froid. JS réussi : 1/2 dégâts. Effets supplémentaires : la couche se détruit si elle subit au moins 25 dégâts de feu.\nIndigo. Échec au JS : la cible subit l’état Entravé et effectue un jet de sauvegarde de Constitution à la fin de chacun de ses tours. Si elle se sauvegarde trois fois, l'état prend fin. Si elle rate trois le JS, elle subit l'état Pétrifié jusqu'à en être libérée par un effet tel que restauration suprême. Ces réussites et échecs n'ont pas besoin d'être consécutifs ; notez-les quelque part, jusqu’à ce que la cible atteigne un total de trois pour l’un ou l'autre. Effets supplémentaires : les sorts ne peuvent pas traverser cette couche, détruite par la Lumière vive du sort lumière du jour.\nViolette. Échec au JS : la cible subit l’état Aveuglé et effectue un jet de sauvegarde de Sagesse au début de votre tour suivant. En cas de réussite, l’état prend fin. En cas d'échec, l’état prend fin, et la créature est téléportée dans un autre plan d'existence (choisi par le MD). Effets supplémentaires : dissipation de la magie détruit cette couche.", "illustration": null, "legende_illustration": null, "notes_verification": "champ_absent:incantation; encadre_statistiques_a_controler", "statut": "ocr_non_valide", "id": "mur-prismatique", "html_body": "<p>Un plan multicolore de lueurs chatoyantes s'érige sous forme d'un mur vertical opaque centré sur un point à portée, avec les dimensions maximales suivantes : longueur 27 m, hauteur 9 m et épaisseur 2,5 cm. Vous pouvez au lieu de cela lui donner la forme d'un globe d'un diamètre maximal de 9 m, centré sur un point à portée. Le mur persiste pour toute la durée. Si vous positionnez le mur en un espace occupé par une créature, le sort prend aussitôt fin sans effet. Le mur produit une Lumière vive sur une distance de 30 m et une Lumière faible sur 30 m de plus. Vous et les créatures que vous désignez à l’incantation du sort pouvez sans risque traverser le mur et rester à proximité. Si une autre créature qui voit le mur s'approche dans un rayon de 6 m de sa zone ou y commence son tour, elle doit réussir un jet de sauvegarde de Constitution sous peine de subir l'état Aveuglé pendant 1 minute. Le mur est constitué de sept couches, chacune d’une couleur différente. Lorsqu'une créature tente de pénétrer le mur ou de le traverser, elle le fait couche après couche jusqu’à toutes les avoir franchies. Chaque couche contraint la créature à un jet de sauvegarde de Dextérité pour éviter d'être affectée par les propriétés de la couche, décrites dans la table Couches prismatiques. On peut détruire le mur (CA 10), couche par couche, de la rouge à la violette, par des moyens propres à chaque couche. Quand une couche est détruite, elle disparaît pour toute la durée. Un champ antimagie reste sans effet sur le mur, gente ou dampetien dela magie ARE AE + COUCHES PRISMATIQUES Ordre Effets 1\nRouge. Échec au JS : 12d6 dégâts de feu. JS réussi : 1/2 dégâts. Effets supplémentaires : les attaques à distance non magiques ne peuvent traverser cette couche, détruite si elle subit au moins 25 dégâts de froid.\nOrange. Échec au JS : 12d6 dégâts d'acide. JS réussi : 1/2 dégâts. Effets supplémentaires : les attaques magiques à distance ne peuvent traverser cette couche, détruite par un vent fort (comme celui produit par bourrasque).\nJaune. Échec au JS : 12d6 dégâts de foudre. JS réussi : 1/2 dégâts. Effets supplémentaires : la couche se détruit si elle subit au moins 60 dégâts de force.\nVerte. Échec au JS : 12d6 dégâts de poison. JS réussi : 1/2 dégâts. Effets supplémentaires : le sort passemuraille, ou autre sort de niveau supérieur ou égal capable d'ouvrir un portail sur une surface solide, détruit cette couche.\nBleue. Échec au JS : 12d6 dégâts de froid. JS réussi : 1/2 dégâts. Effets supplémentaires : la couche se détruit si elle subit au moins 25 dégâts de feu.\nIndigo. Échec au JS : la cible subit l’état Entravé et effectue un jet de sauvegarde de Constitution à la fin de chacun de ses tours. Si elle se sauvegarde trois fois, l'état prend fin. Si elle rate trois le JS, elle subit l'état Pétrifié jusqu'à en être libérée par un effet tel que restauration suprême. Ces réussites et échecs n'ont pas besoin d'être consécutifs ; notez-les quelque part, jusqu’à ce que la cible atteigne un total de trois pour l’un ou l'autre. Effets supplémentaires : les sorts ne peuvent pas traverser cette couche, détruite par la Lumière vive du sort lumière du jour.\nViolette. Échec au JS : la cible subit l’état Aveuglé et effectue un jet de sauvegarde de Sagesse au début de votre tour suivant. En cas de réussite, l’état prend fin. En cas d'échec, l’état prend fin, et la créature est téléportée dans un autre plan d'existence (choisi par le MD). Effets supplémentaires : dissipation de la magie détruit cette couche.<\/p>\n"}, {"nom": "Mur de Vent", "ecole": "Évocation", "niveau": 3, "classes": ["Druide", "Rôdeur"], "incantation": "action", "portee": "36 m", "composantes": "V, S, M (un éventail et une plume)", "duree": "Concentration, jusqu'à 1 minute", "pages_source": [312, 313], "description": "Un mur de vent fort se dresse depuis le sol en un point que vous choisissez à portée. Vous pouvez ainsi ériger un mur dont la hauteur n'excède pas 4,50 m, la longueur 15 m et l'épaisseur 30 cm. Vous pouvez lui donner la forme de votre choix tant que le mur reste au contact du sol tout du long.\nLe mur persiste pour toute la durée. effectue un jet de sauvegarde de Force et subit 4d8 dégâts contondants en cas d'échec, la moitié en cas de réussite. Le vent fort repousse le brouillard, la fumée et autres gaz et vapeurs. Les créatures et objets volants de taille P ou inférieure ne peuvent pas traverser le mur. Les matériaux légers et libres s'envolent verticalement au contact du mur. Flèches, carreaux d’arbalète et autres projectiles ordinaires tirés sur des cibles situées derrière le mur sont déviés vers le haut et ratent automatiquement. (Les rochers lancés par des Géants et des engins de siège, et les projectiles du même acabit ne sont pas affectés.) Les créatures sous forme gazeuse ne peuvent pas le traverser.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "mur-de-vent", "html_body": "<p>Un mur de vent fort se dresse depuis le sol en un point que vous choisissez à portée. Vous pouvez ainsi ériger un mur dont la hauteur n'excède pas 4,50 m, la longueur 15 m et l'épaisseur 30 cm. Vous pouvez lui donner la forme de votre choix tant que le mur reste au contact du sol tout du long.\nLe mur persiste pour toute la durée. effectue un jet de sauvegarde de Force et subit 4d8 dégâts contondants en cas d'échec, la moitié en cas de réussite. Le vent fort repousse le brouillard, la fumée et autres gaz et vapeurs. Les créatures et objets volants de taille P ou inférieure ne peuvent pas traverser le mur. Les matériaux légers et libres s'envolent verticalement au contact du mur. Flèches, carreaux d’arbalète et autres projectiles ordinaires tirés sur des cibles situées derrière le mur sont déviés vers le haut et ratent automatiquement. (Les rochers lancés par des Géants et des engins de siège, et les projectiles du même acabit ne sont pas affectés.) Les créatures sous forme gazeuse ne peuvent pas le traverser.<\/p>\n"}, {"nom": "Murmures Dissonants", "ecole": "Enchantement", "niveau": 1, "classes": ["Barde"], "incantation": "À vérifier", "portee": "18 m", "composantes": "V", "duree": "instantanée", "pages_source": [313], "description": "Une créature que vous choisissez parmi celles que vous voyez à portée perçoit intérieurement une mélodie discordante. La cible effectue un jet de sauvegarde de Sagesse. Elle subit 3d6 dégâts psychiques en cas d'échec et doit aussitôt jouer sa Réaction si disponible pour s'éloigner de vous autant qu'elle le peut, par le chemin le plus sûr. En cas de réussite, la cible subit uniquement la moitié de ces dégâts.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d6 par niveau d'emplacement au-delà du 1°.", "illustration": null, "legende_illustration": null, "notes_verification": "champ_absent:incantation", "statut": "ocr_non_valide", "id": "murmures-dissonants", "html_body": "<p>Une créature que vous choisissez parmi celles que vous voyez à portée perçoit intérieurement une mélodie discordante. La cible effectue un jet de sauvegarde de Sagesse. Elle subit 3d6 dégâts psychiques en cas d'échec et doit aussitôt jouer sa Réaction si disponible pour s'éloigner de vous autant qu'elle le peut, par le chemin le plus sûr. En cas de réussite, la cible subit uniquement la moitié de ces dégâts.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d6 par niveau d'emplacement au-delà du 1°.<\/p>\n"}, {"nom": "Mythes et Légendes", "ecole": "Divination", "niveau": 5, "classes": ["Barde", "Clerc", "Magicien"], "incantation": "10 minutes", "portee": "personnelle", "composantes": "V, S, M (de l’encens d’une valeur minimale de 250 po, que le sort détruit, et quatre lamelles d'ivoire d'une valeur minimale de 50 po chacune)", "duree": "instantanée", "pages_source": [313], "description": "Nommez ou décrivez un élément notoire : personne, lieu ou objet. Le sort vous fait prendre brièvement conscience d'un fait important (décrit par le MD) concernant l'élément mentionné. Cette bribe de savoir peut consister en des détails essentiels, des révélations cocasses, voire quelque secret toujours resté méconnu. Plus vous en savez déjà sur l'élément, plus précises et détaillées seront les informations transmises. Les détails révélés sont justes, mais sont parfois formulés de manière imagée ou par le biais de vers (à l'appréciation du MD). Si l'élément retenu n’est pas véritablement notoire, vous n'entendez que quelques notes tristes de trombone et le sort prend fin. eme —— - Mines", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "mythes-et-legendes", "html_body": "<p>Nommez ou décrivez un élément notoire : personne, lieu ou objet. Le sort vous fait prendre brièvement conscience d'un fait important (décrit par le MD) concernant l'élément mentionné. Cette bribe de savoir peut consister en des détails essentiels, des révélations cocasses, voire quelque secret toujours resté méconnu. Plus vous en savez déjà sur l'élément, plus précises et détaillées seront les informations transmises. Les détails révélés sont justes, mais sont parfois formulés de manière imagée ou par le biais de vers (à l'appréciation du MD). Si l'élément retenu n’est pas véritablement notoire, vous n'entendez que quelques notes tristes de trombone et le sort prend fin. eme —— - Mines<\/p>\n"}, {"nom": "Nappe de Brouillard", "ecole": "Invocation", "niveau": 1, "classes": ["Druide", "Ensorceleur", "Magicien", "Rôdeur"], "incantation": "action", "portee": "36 m", "composantes": "V, S", "duree": "Concentration, jusqu’à 1 heure", "pages_source": [313], "description": "Vous créez une Sphère de 6 m de rayon constituée de brouillard, centrée sur un point à portée. La Sphère présente une Visibilité nulle. Elle persiste pour toute la durée, à moins qu'un vent fort (comme celui engendré par bourrasque) la disperse.\nEmplacement de niveau supérieur. Le rayon du brouillard augmente de 6 m par niveau d'emplacement au-delà du 1°.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "nappe-de-brouillard", "html_body": "<p>Vous créez une Sphère de 6 m de rayon constituée de brouillard, centrée sur un point à portée. La Sphère présente une Visibilité nulle. Elle persiste pour toute la durée, à moins qu'un vent fort (comme celui engendré par bourrasque) la disperse.\nEmplacement de niveau supérieur. Le rayon du brouillard augmente de 6 m par niveau d'emplacement au-delà du 1°.<\/p>\n"}, {"nom": "Nuage Incendiaire", "ecole": "Invocation", "niveau": 8, "classes": ["Druide", "Ensorceleur", "Magicien"], "incantation": "action", "portee": "45 m", "composantes": "V, S", "duree": "Concentration, jusqu'à 1 minute", "pages_source": [313], "description": "Un nuage tourbillonnant de fumée se manifeste, chargé de flammèches, sous forme d’une Sphère de 6 m de rayon centrée sur un point à portée. La zone du nuage présente une Visibilité nulle. Elle persiste pour toute la durée, à moins qu'un vent fort (comme celui engendré par bourrasque) la disperse. Chaque créature prise dans le nuage à son apparition effectue un jet de sauvegarde de Dextérité, et subit 10d8 dégâts de feu en cas d'échec, la moitié en cas de réussite. Toute créature qui voit la Sphère se déplacer dans son espace, ou qui pénètre dans la Sphère ou y termine son tour est également soumise à ce JS. Une même créature n'effectue en aucun cas ce JS plus d'une fois par tour. Le nuage s'éloigne de 3 m de vous au début de chacun de vos tours, dans la direction de votre choix.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "nuage-incendiaire", "html_body": "<p>Un nuage tourbillonnant de fumée se manifeste, chargé de flammèches, sous forme d’une Sphère de 6 m de rayon centrée sur un point à portée. La zone du nuage présente une Visibilité nulle. Elle persiste pour toute la durée, à moins qu'un vent fort (comme celui engendré par bourrasque) la disperse. Chaque créature prise dans le nuage à son apparition effectue un jet de sauvegarde de Dextérité, et subit 10d8 dégâts de feu en cas d'échec, la moitié en cas de réussite. Toute créature qui voit la Sphère se déplacer dans son espace, ou qui pénètre dans la Sphère ou y termine son tour est également soumise à ce JS. Une même créature n'effectue en aucun cas ce JS plus d'une fois par tour. Le nuage s'éloigne de 3 m de vous au début de chacun de vos tours, dans la direction de votre choix.<\/p>\n"}, {"nom": "Nuage Nauséabond", "ecole": "Invocation", "niveau": 3, "classes": ["Barde", "Ensorceleur", "Magicien"], "incantation": "action", "portee": "27 m", "composantes": "V, S, M (un œuf pourri)", "duree": "Concentration, jusqu’à 1 minute", "pages_source": [313, 314], "description": "Vous créez une Sphère d’un rayon de 6 m remplie de vapeurs nauséeuses jaunes, centrée sur un point à portée.\nLe nuage présente une Visibilité nulle. Le nuage flotte sur place pour toute la durée, à moins qu'un vent fort (comme celui engendré par bourrasque) le disperse. Chaque créature qui commence son tour dans la Sphère doit réussir un jet de sauvegarde de Constitution sous peine de subir l'état Empoisonné jusqu’à la fin du tour en cours. Ainsi Empoisonnée, la créature ne peut pas entreprendre d'action ni d'action Bonus. CHAPITRE 7 | SORTS À SE pme IMORUT FD Portée : 18 m PPRAAS à Composantes : V, S, M tr Re 5 HR Durée : Concentration, jusqu’à | minute - Vous invoquez des dagues tournoyantes sous forme d'un\nCube de 1,50 m dont l'origine est un point à portée. Chaque créature prise dans la zone subit 4d4 dégâts tranchants. Toute créature qui voit le Cube se déplacer dans son espace, ou qui pénètre dans le Cube ou y termine son tour subit également ces dégâts. Une même créature ne peut subir ces dégâts qu'une fois par tour. À vos tours suivants, vous pouvez entreprendre l’action\nMagie pour téléporter le Cube d'un maximum de 9 m.\nEmplacement de niveau supérieur. Les dégâts augmentent de 2d4 par niveau d'emplacement au-delà du 2°.", "illustration": null, "legende_illustration": null, "notes_verification": "symboles_suspects", "statut": "ocr_non_valide", "id": "nuage-nauseabond", "html_body": "<p>Vous créez une Sphère d’un rayon de 6 m remplie de vapeurs nauséeuses jaunes, centrée sur un point à portée.\nLe nuage présente une Visibilité nulle. Le nuage flotte sur place pour toute la durée, à moins qu'un vent fort (comme celui engendré par bourrasque) le disperse. Chaque créature qui commence son tour dans la Sphère doit réussir un jet de sauvegarde de Constitution sous peine de subir l'état Empoisonné jusqu’à la fin du tour en cours. Ainsi Empoisonnée, la créature ne peut pas entreprendre d'action ni d'action Bonus. CHAPITRE 7 | SORTS À SE pme IMORUT FD Portée : 18 m PPRAAS à Composantes : V, S, M tr Re 5 HR Durée : Concentration, jusqu’à | minute - Vous invoquez des dagues tournoyantes sous forme d'un\nCube de 1,50 m dont l'origine est un point à portée. Chaque créature prise dans la zone subit 4d4 dégâts tranchants. Toute créature qui voit le Cube se déplacer dans son espace, ou qui pénètre dans le Cube ou y termine son tour subit également ces dégâts. Une même créature ne peut subir ces dégâts qu'une fois par tour. À vos tours suivants, vous pouvez entreprendre l’action\nMagie pour téléporter le Cube d'un maximum de 9 m.\nEmplacement de niveau supérieur. Les dégâts augmentent de 2d4 par niveau d'emplacement au-delà du 2°.<\/p>\n"}, {"nom": "Nuée de Météores", "ecole": "Évocation", "niveau": 9, "classes": ["Ensorceleur", "Magicien"], "incantation": "action", "portee": "1,5 km", "composantes": "V, S", "duree": "instantanée", "pages_source": [314], "description": "Des orbes embrasés s'abattent au sol en quatre points différents que vous voyez à portée. Toute créature prise dans une Sphère d'un rayon de 12 m centrée sur l’un des quatre points effectue un jet de sauvegarde de Dextérité. Une créature subit 20d6 dégâts de feu et 20d6 dégâts contondants en cas d'échec, la moitié en cas de réussite. Une créature prise dans les zones de plus d'une Sphère ardente n’est affectée qu'une fois. Un objet non magique qui n’est porté par personne subit lui aussi les dégâts s’il est dans la zone d'effet du sort, et il s'embrase s’il est inflammable. M Es 77", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_n diamant d'une ve de 50 po)", "duree": "instantanée", "pages_source": [314], "description": "Vous projetez un orbe d'énergie sur une cible à po Choisissez une énergie entre acide, feu, foudre, f et tonnerre pour composer l'orbe, puis effect d'attaque de sort à distance contre la cible. Si le touche, la cible subit 3d8 dégâts du type retenu. Si vous obtenez le même nombre sur au moins deux des l'orbe rebondit vers une autre cible de votre choix dan: rayon de 9 m de la cible. Effectuez un jet d'attaque contre ki: nouvelle cible et un nouveau jet de dégâts. L'orbe nerebondit pas une deuxième fois, sauf si vous avez lancé le sort 2e un emplacement du 2° niveau ou supérieur. 4%\nEmplacement de niveau supérieur. Les dégâts aupres de 1d8 par niveau d'emplacement au-delà du 1*. L'orbe est … susceptible de rebondir autant de fois que le niveau de l'emplacement dépensé, une même créature ne pouvant ne être ciblée qu'une fois par incantation du sort. #48 NES rt S", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "orbe-chromatique", "html_body": "<p>Vous projetez un orbe d'énergie sur une cible à po Choisissez une énergie entre acide, feu, foudre, f et tonnerre pour composer l'orbe, puis effect d'attaque de sort à distance contre la cible. Si le touche, la cible subit 3d8 dégâts du type retenu. Si vous obtenez le même nombre sur au moins deux des l'orbe rebondit vers une autre cible de votre choix dan: rayon de 9 m de la cible. Effectuez un jet d'attaque contre ki: nouvelle cible et un nouveau jet de dégâts. L'orbe nerebondit pas une deuxième fois, sauf si vous avez lancé le sort 2e un emplacement du 2° niveau ou supérieur. 4%\nEmplacement de niveau supérieur. Les dégâts aupres de 1d8 par niveau d'emplacement au-delà du 1*. L'orbe est … susceptible de rebondir autant de fois que le niveau de l'emplacement dépensé, une même créature ne pouvant ne être ciblée qu'une fois par incantation du sort. #48 NES rt S<\/p>\n"}, {"nom": "Orientation", "ecole": "Divination", "niveau": 6, "classes": ["Barde", "Clerc", "Druide"], "incantation": "À vérifier", "portee": "personnelle", "composantes": "V, S, M (des accessoires de divination, comme des cartes ou des runes, d’une valeur minimale de 100 po)", "duree": "Concentration, jusqu’à 1 jour", "pages_source": [314], "description": "Vous trouvez magiquement le chemin le plus direct jusqu'à un lieu que vous nommez. Vous devez connaître cet endroit et le sort échoue si le lieu nommé est sur un autre plan d'existence, est une destination mobile (comme une forteresse en mouvement) ou un endroit générique (comme « l'antre d'un dragon vert »). Pour toute la durée et tant que vous êtes sur le même plan d'existence que la destination, vous savez quelle distance vous en sépare et dans quelle direction elle se trouve. Chaque fois que vous avez le choix entre plusieurs itinéraires, vous savez automatiquement lequel est le plus direct.", "illustration": null, "legende_illustration": null, "notes_verification": "champ_absent:incantation", "statut": "ocr_non_valide", "id": "orientation", "html_body": "<p>Vous trouvez magiquement le chemin le plus direct jusqu'à un lieu que vous nommez. Vous devez connaître cet endroit et le sort échoue si le lieu nommé est sur un autre plan d'existence, est une destination mobile (comme une forteresse en mouvement) ou un endroit générique (comme « l'antre d'un dragon vert »). Pour toute la durée et tant que vous êtes sur le même plan d'existence que la destination, vous savez quelle distance vous en sépare et dans quelle direction elle se trouve. Chaque fois que vous avez le choix entre plusieurs itinéraires, vous savez automatiquement lequel est le plus direct.<\/p>\n"}, {"nom": "Parole Divine", "ecole": "Évocation", "niveau": 7, "classes": ["Clerc"], "incantation": "À vérifier", "portee": "9 m", "composantes": "V", "duree": "instantanée", "pages_source": [314, 315], "description": "Vous prononcez une parole porteuse de la puissance des\nPlans Supérieurs. Chaque créature que vous choisissez à portée effectue un jet de sauvegarde de Charisme. En cas d'échec, une cible dotée de 50 points de vie ou moins subit un effet qui dépend de ses points de vie actuels, comme indiqué sur la table Effets de parole divine. Quels que soient ses points de vie actuels, une cible Céleste, Élémentaire, Fée ou Fiélon qui rate son JS est renvoyée d'office dans son plan d'origine (s’il ne s'y trouve pas déjà) et ne peut revenir sur votre plan actuel pendant 24 heures, sauf par le biais du sort souhait. EFFETS DE PAROLE DIVINE Points de vie 0-20 21-30 31-40 41-50 Effet\nLa cible meurt. La cible subit les états Assourdi, Aveuglé et Etourdi pendant 1 heure La cible subit les états Assourdi et Aveuglé pendant 10 minutes. La cible subit l’état Assourdi pendant 1 minute. Fe FE À UNE ENSORCE LEUSE HUMAINE z É > 4 a RÉPRIMANDE DES GOULES PAR Hill ps 'É IERGIES IMPRÉVISIBLES RBE CHROMATIQUE", "illustration": null, "legende_illustration": null, "notes_verification": "champ_absent:incantation; encadre_statistiques_a_controler", "statut": "ocr_non_valide", "id": "parole-divine", "html_body": "<p>Vous prononcez une parole porteuse de la puissance des\nPlans Supérieurs. Chaque créature que vous choisissez à portée effectue un jet de sauvegarde de Charisme. En cas d'échec, une cible dotée de 50 points de vie ou moins subit un effet qui dépend de ses points de vie actuels, comme indiqué sur la table Effets de parole divine. Quels que soient ses points de vie actuels, une cible Céleste, Élémentaire, Fée ou Fiélon qui rate son JS est renvoyée d'office dans son plan d'origine (s’il ne s'y trouve pas déjà) et ne peut revenir sur votre plan actuel pendant 24 heures, sauf par le biais du sort souhait. EFFETS DE PAROLE DIVINE Points de vie 0-20 21-30 31-40 41-50 Effet\nLa cible meurt. La cible subit les états Assourdi, Aveuglé et Etourdi pendant 1 heure La cible subit les états Assourdi et Aveuglé pendant 10 minutes. La cible subit l’état Assourdi pendant 1 minute. Fe FE À UNE ENSORCE LEUSE HUMAINE z É &gt; 4 a RÉPRIMANDE DES GOULES PAR Hill ps 'É IERGIES IMPRÉVISIBLES RBE CHROMATIQUE<\/p>\n"}, {"nom": "Passage par les Arbres", "ecole": "Invocation", "niveau": 5, "classes": ["Druide", "Rôdeur"], "incantation": "action", "portee": "personnelle", "composantes": "V, S", "duree": "Concentration, jusqu'à 1 minute", "pages_source": [315, 316], "description": "Vous recevez la faculté d'entrer dans un arbre et de vous y déplacer pour atteindre un autre arbre du même type distant d'un maximum de 150 m. Les deux arbres doivent être vivants et d'une catégorie de taille supérieure ou égale à la vôtre. Entrer dans un arbre nécessite d'y consacrer 1,50 m de déplacement. Vous prenez aussitôt conscience de la position de tous les autres arbres de la même essence dans un rayon de 150 m et, lors du déplacement qui vous permet de pénétrer dans l'arbre, vous avez alors le choix entre passer dans l’un de ces arbres ou ressortir par celui dans lequel vous venez d'entrer. Si vous consacrez 1,50 m de déplacement supplémentaire, vous apparaissez à l'endroit de votre choix dans un rayon de 1,50 m de l'arbre de destination. S'il ne vous reste aucun déplacement, vous réapparaissez dans un rayon de 1,50 m de l'arbre de départ. Vous ne pouvez utiliser cette faculté de transport qu'une seule fois à chacun de vos tours. Vous devez terminer chaque tour à l'extérieur d’un arbre.\n\nVOIE VÉGÉTALE ET PASSAGE PAR LES ARBRES TRANSFORMENT LA VÉGÉTATION EN RÉSEAU DE\nTRANSPORT.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "passage-par-les-arbres", "html_body": "<p>Vous recevez la faculté d'entrer dans un arbre et de vous y déplacer pour atteindre un autre arbre du même type distant d'un maximum de 150 m. Les deux arbres doivent être vivants et d'une catégorie de taille supérieure ou égale à la vôtre. Entrer dans un arbre nécessite d'y consacrer 1,50 m de déplacement. Vous prenez aussitôt conscience de la position de tous les autres arbres de la même essence dans un rayon de 150 m et, lors du déplacement qui vous permet de pénétrer dans l'arbre, vous avez alors le choix entre passer dans l’un de ces arbres ou ressortir par celui dans lequel vous venez d'entrer. Si vous consacrez 1,50 m de déplacement supplémentaire, vous apparaissez à l'endroit de votre choix dans un rayon de 1,50 m de l'arbre de destination. S'il ne vous reste aucun déplacement, vous réapparaissez dans un rayon de 1,50 m de l'arbre de départ. Vous ne pouvez utiliser cette faculté de transport qu'une seule fois à chacun de vos tours. Vous devez terminer chaque tour à l'extérieur d’un arbre.<\/p>\n<p>VOIE VÉGÉTALE ET PASSAGE PAR LES ARBRES TRANSFORMENT LA VÉGÉTATION EN RÉSEAU DE\nTRANSPORT.<\/p>\n"}, {"nom": "Passage sans Trace", "ecole": "Abjuration", "niveau": 2, "classes": ["Druide", "Rôdeur"], "incantation": "action", "portee": "personnelle", "composantes": "V, S, M (les cendres d’une feuille calcinée a ui)", "duree": "Concentration, jusqu’à 1 heure", "pages_source": [316], "description": "® [aie] Vous projetez pour toute la durée une aura de camouflage sous forme d'une Emanation de 9 m. Pour toute la durée, chaque créature que vous désignez dans un rayon de 9 m (y compris vous) bénéficie d'un bonus de +10 aux tests de\nDextérité (Discrétion) et ne laisse pas de traces.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "passage-sans-trace", "html_body": "<p>® [aie] Vous projetez pour toute la durée une aura de camouflage sous forme d'une Emanation de 9 m. Pour toute la durée, chaque créature que vous désignez dans un rayon de 9 m (y compris vous) bénéficie d'un bonus de +10 aux tests de\nDextérité (Discrétion) et ne laisse pas de traces.<\/p>\n"}, {"nom": "Passe-Muraille", "ecole": "Transmutation", "niveau": 5, "classes": ["Magicien"], "incantation": "action", "portee": "9 m", "composantes": "V, S, M (une pincée de graines de sésame)", "duree": "1 heure", "pages_source": [316], "description": "Un passage se forme en un point que vous voyez sur une surface de bois, de plâtre ou de pierre (comme un mur, un plafond ou un sol) à portée, et persiste pour toute la durée. Vous choisissez les dimensions de l'ouverture : jusqu’à 1,50 m de large, 2,40 m de haut et 6 m de profondeur. Le passage n'engendre aucune instabilité dans la structure qui l'entoure. Lorsque le passage disparaît, tous les objets et créatures qui s'y trouvent encore sont éjectés sans heurt dans les espaces inoccupés les plus proches de la surface affectée.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "passe-muraille", "html_body": "<p>Un passage se forme en un point que vous voyez sur une surface de bois, de plâtre ou de pierre (comme un mur, un plafond ou un sol) à portée, et persiste pour toute la durée. Vous choisissez les dimensions de l'ouverture : jusqu’à 1,50 m de large, 2,40 m de haut et 6 m de profondeur. Le passage n'engendre aucune instabilité dans la structure qui l'entoure. Lorsque le passage disparaît, tous les objets et créatures qui s'y trouvent encore sont éjectés sans heurt dans les espaces inoccupés les plus proches de la surface affectée.<\/p>\n"}, {"nom": "Pattes D'Araignée", "ecole": "Transmutation", "niveau": 2, "classes": ["Ensorceleur", "Magicien", "Occultiste"], "incantation": "action", "portee": "contact", "composantes": "V, S, M (une goutte de bitume et une araignée)", "duree": "Concentration, jusqu’à 1 heure", "pages_source": [316], "description": "Jusqu'à la fin du sort, une créature consentante que vous touchez reçoit la capacité de se déplacer dans toutes les directions le long des surfaces verticales, ainsi que sur les plafonds, tout en gardant les mains libres. La cible acquiert en outre une Vitesse d'escalade égale à sa Vitesse.\nEmplacement de niveau supérieur. Vous pouvez cibler une créature supplémentaire par niveau d'emplacement au-delà du 2°.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "pattes-d-araignee", "html_body": "<p>Jusqu'à la fin du sort, une créature consentante que vous touchez reçoit la capacité de se déplacer dans toutes les directions le long des surfaces verticales, ainsi que sur les plafonds, tout en gardant les mains libres. La cible acquiert en outre une Vitesse d'escalade égale à sa Vitesse.\nEmplacement de niveau supérieur. Vous pouvez cibler une créature supplémentaire par niveau d'emplacement au-delà du 2°.<\/p>\n"}, {"nom": "Peau D'Écorce", "ecole": "Transmutation", "niveau": 2, "classes": ["Druide", "Rôdeur"], "incantation": "action Bonus", "portee": "contact", "composantes": "V, S, M (une poignée d'écorce)", "duree": "1 heure", "pages_source": [316], "description": "Vous touchez une créature consentante. Jusqu'à la fin du sort, la peau de la cible adopte un aspect d'écorce et sa classe d’armure passe à 17 si elle est inférieure à cette valeur.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "peau-d-ecorce", "html_body": "<p>Vous touchez une créature consentante. Jusqu'à la fin du sort, la peau de la cible adopte un aspect d'écorce et sa classe d’armure passe à 17 si elle est inférieure à cette valeur.<\/p>\n"}, {"nom": "Peau de Pierre", "ecole": "Transmutation", "niveau": 4, "classes": ["Druide", "Ensorceleur", "Magicien", "Rôdeur"], "incantation": "action", "portee": "contact", "composantes": "V, S, M (poudre de diamant d’une valeur minimale de 100 po, que le sort détruit)", "duree": "Concentration, jusqu’à 1 heure", "pages_source": [316, 317], "description": "fin du sort, une créature consentante que vous physiquement a la Résistance aux dégâts contonperforants et tranchants.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "peau-de-pierre", "html_body": "<p>fin du sort, une créature consentante que vous physiquement a la Résistance aux dégâts contonperforants et tranchants.<\/p>\n"}, {"nom": "Perception Bestiale", "ecole": "Divination", "niveau": 2, "classes": ["Druide", "Rôdeur"], "incantation": "action ou rituel", "portee": "contact", "composantes": "S", "duree": "Concentration, jusqu’à 1 heure", "pages_source": [317], "description": "Vous touchez une Bête consentante. Pour toute la durée, vous pouvez percevoir par les sens de la Bête ainsi que par les vôtres. Quand vous percevez par le biais des sens de la\nBête, vous bénéficiez de tous ses éventuels sens spéciaux.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "perception-bestiale", "html_body": "<p>Vous touchez une Bête consentante. Pour toute la durée, vous pouvez percevoir par les sens de la Bête ainsi que par les vôtres. Quand vous percevez par le biais des sens de la\nBête, vous bénéficiez de tous ses éventuels sens spéciaux.<\/p>\n"}, {"nom": "Perturbations Synaptiques", "ecole": "Enchantement", "niveau": 5, "classes": ["Barde", "Ensorceleur", "Magicien", "Occultiste"], "incantation": "action", "portee": "36 m", "composantes": "V, S", "duree": "instantanée", "pages_source": [317], "description": "Vous provoquez une explosion d'énergies synaptiques en un point à portée. Chaque créature prise dans la Sphère de 6 m de rayon centrée sur ce point d'origine effectue un jet de sauvegarde d’Intelligence et subit 8d6 dégâts psychiques en cas d'échec, la moitié en cas de réussite. Les pensées d'une créature ayant raté son JS sont en outre perturbées pendant 1 minute. Pendant cet intervalle, elle lance 1d6 chaque fois qu'elle effectue un jet d'attaque ou un test de caractéristique, ou encore un JS Constitution visant à maintenir sa Concentration. Une cible ainsi affectée effectue un JS Intelligence à la fin de chacun de ses tours et met un terme à l'effet sur elle-même en cas de réussite.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "perturbations-synaptiques", "html_body": "<p>Vous provoquez une explosion d'énergies synaptiques en un point à portée. Chaque créature prise dans la Sphère de 6 m de rayon centrée sur ce point d'origine effectue un jet de sauvegarde d’Intelligence et subit 8d6 dégâts psychiques en cas d'échec, la moitié en cas de réussite. Les pensées d'une créature ayant raté son JS sont en outre perturbées pendant 1 minute. Pendant cet intervalle, elle lance 1d6 chaque fois qu'elle effectue un jet d'attaque ou un test de caractéristique, ou encore un JS Constitution visant à maintenir sa Concentration. Une cible ainsi affectée effectue un JS Intelligence à la fin de chacun de ses tours et met un terme à l'effet sur elle-même en cas de réussite.<\/p>\n"}, {"nom": "Petite Hutte de Léomund", "ecole": "Évocation", "niveau": 3, "classes": ["Barde", "Magicien"], "incantation": "1 minute ou rituel", "portee": "personnelle", "composantes": "V, S, M (une bille de cristal)", "duree": "8 heures", "pages_source": [317], "description": "Une Émanation de 3 m se manifeste autour de vous, mais reste sur place pour toute la durée. Le sort échoue à l'incantation si l'Émanation ne suffit pas à englober toutes les créatures de sa zone. um PDP © ff A nn 2 um  _i ban LL 4 mn Les créatures et objets situés dans l'Émanation à l'incantation peuvent s’y déplacer librement, y entrer et en sortir.\nTous les autres objets et créatures ne peuvent le traverser. Les sorts du 3° niveau et inférieur ne peuvent franchir l'Émanation et leurs effets ne peuvent la chevaucher. L'atmosphère à l'intérieur de l'Émanation est sèche et agréable, quel que soit le temps à l'extérieur. Jusqu'à la fin du sort, vous pouvez rendre l’intérieur faiblement éclairé ou enténébré, sur commande (pas d'action requise). L'Émanation est opaque depuis l'extérieur, de la couleur de votre choix, mais elle est transparente depuis l'intérieur. Le sort prend fin prématurément si vous quittez l'Émanaion ou si vous le lancez à nouveau.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "petite-hutte-de-leomund", "html_body": "<p>Une Émanation de 3 m se manifeste autour de vous, mais reste sur place pour toute la durée. Le sort échoue à l'incantation si l'Émanation ne suffit pas à englober toutes les créatures de sa zone. um PDP © ff A nn 2 um  _i ban LL 4 mn Les créatures et objets situés dans l'Émanation à l'incantation peuvent s’y déplacer librement, y entrer et en sortir.\nTous les autres objets et créatures ne peuvent le traverser. Les sorts du 3° niveau et inférieur ne peuvent franchir l'Émanation et leurs effets ne peuvent la chevaucher. L'atmosphère à l'intérieur de l'Émanation est sèche et agréable, quel que soit le temps à l'extérieur. Jusqu'à la fin du sort, vous pouvez rendre l’intérieur faiblement éclairé ou enténébré, sur commande (pas d'action requise). L'Émanation est opaque depuis l'extérieur, de la couleur de votre choix, mais elle est transparente depuis l'intérieur. Le sort prend fin prématurément si vous quittez l'Émanaion ou si vous le lancez à nouveau.<\/p>\n"}, {"nom": "Pétrification", "ecole": "Transmutation", "niveau": 6, "classes": ["Druide", "Ensorceleur", "Magicien"], "incantation": "À vérifier", "portee": "18 m", "composantes": "V, S, M (une plume de cockatrice)", "duree": "Concentration, jusqu’à 1 minute", "pages_source": [317], "description": "Vous tentez de transformer en pierre une créature que vous voyez à portée. La cible effectue un jet de sauvegarde le Constitution. En cas d'échec, elle subit l’état Entravé\nJour toute la durée. En cas de réussite, sa Vitesse tombe à O jusqu'au début de votre tour suivant. Les Artificiels ‘éussissent automatiquement ce JS. Une créature ainsi Entravée réitère le jet de sauvegarde le Constitution à la fin de chacun de ses tours. Si elle se sauv

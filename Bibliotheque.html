e 18 m. Touché : 1d10 + 3 + niveau du sort dégâts contondants, et la Vitesse de la cible tombe à 0 jusqu'au début du tour suivant de l'insecte. ACTIONS BONUS\nCrachat venimeux (mille-pattes uniquement). | JS Constitution : votre DD de sauvegarde des sorts, | une créature que l'insecte voit dans un rayon de 3 m._ Échec : la cible subit l'état Empoisonné PRMIPE du tour suivant de l’insecte. instructions verbales (pas d'action requise de votre part). Sans ordre de votre part, elle entreprend l'action Esquive et consacre son déplacement à se mettre à l'abri du danger.\nEmplacement de niveau supérieur. Le niveau de l'emplacement s'applique chaque fois que le profil de jeu y fait référence.<\/li>\n<\/ul>\n"}, {"nom": "Interdiction", "ecole": "Abjuration", "niveau": 6, "classes": ["Clerc"], "incantation": "10 minutes ou rituel", "portee": "contact", "composantes": "V, S, M (poudre de rubis d'une valeur minimale de 1 000 po)", "duree": "1 jour", "pages_source": [297], "description": "Vous créez une barrière contre le voyage magique qui protège jusqu’à 3 600 m2 d'espace au sol, sur une hauteur de 9 m. Pour toute la durée, aucune créature ne peut se téléporter dans la zone ou y pénétrer par le biais d’un accès magique comme celui que crée le sort portail. Le sort proscrit tout voyage planaire dans la zone, ce qui empêche quiconque de s'y rendre depuis le Plan Astral, le Plan Éthéré, la Féerie ou la Gisombre, ou par le biais du sort changement de plan. De plus, le sort inflige des dégâts aux types de créature que vous désignez à l'incantation. Choisissez un ou plusieurs types parmi les suivants : Aberrations, Célestes, Élémentaires, Fées, Fiélons et Morts-vivants. Lorsqu'une créature désignée entre dans la zone pour la première fois d'un tour ou y termine son tour, elle subit 5d10 dégâts nécrotiques ou radiants (vous choisissez à l’incantation du sort). Vous pouvez choisir un mot de passe à l'incantation du sort. Une créature qui prononce ce sésame en pénétrant dans la zone ne subit aucun dégât du sort. La zone du sort ne peut pas chevaucher celle d’un autre sort d'interdiction. Si vous lancez chaque jour interdiction au même endroit pendant 30 jours, le sort persiste jusqu'à dissipation, les composantes matérielles étant détruites à la dernière incantation.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "interdiction", "html_body": "<p>Vous créez une barrière contre le voyage magique qui protège jusqu’à 3 600 m2 d'espace au sol, sur une hauteur de 9 m. Pour toute la durée, aucune créature ne peut se téléporter dans la zone ou y pénétrer par le biais d’un accès magique comme celui que crée le sort portail. Le sort proscrit tout voyage planaire dans la zone, ce qui empêche quiconque de s'y rendre depuis le Plan Astral, le Plan Éthéré, la Féerie ou la Gisombre, ou par le biais du sort changement de plan. De plus, le sort inflige des dégâts aux types de créature que vous désignez à l'incantation. Choisissez un ou plusieurs types parmi les suivants : Aberrations, Célestes, Élémentaires, Fées, Fiélons et Morts-vivants. Lorsqu'une créature désignée entre dans la zone pour la première fois d'un tour ou y termine son tour, elle subit 5d10 dégâts nécrotiques ou radiants (vous choisissez à l’incantation du sort). Vous pouvez choisir un mot de passe à l'incantation du sort. Une créature qui prononce ce sésame en pénétrant dans la zone ne subit aucun dégât du sort. La zone du sort ne peut pas chevaucher celle d’un autre sort d'interdiction. Si vous lancez chaque jour interdiction au même endroit pendant 30 jours, le sort persiste jusqu'à dissipation, les composantes matérielles étant détruites à la dernière incantation.<\/p>\n"}, {"nom": "Inversion de la Gravité", "ecole": "Transmutation", "niveau": 7, "classes": ["Druide", "Ensorceleur", "Magicien"], "incantation": "action", "portee": "30 m", "composantes": "V, S, M (une magnétite et de la limaille de fer)", "duree": "Concentration, jusqu’à 1 minute", "pages_source": [297], "description": "Ce sort inverse la gravité dans un Cylindre de 15 m de rayon et 30 m de haut centré sur un point à portée. Tous les objets et créatures de la zone qui ne sont pas ancrés au sol « chutent » vers le haut pour atteindre le sommet du Cylindre. Une créature à droit à un jet de sauvegarde de Dextérité pour saisir un objet fixé à portée d'allonge et ainsi éviter la « chute ». Si un plafond ou un objet ancré se présente en travers de la chute, les objets et créatures qui tombent le heurtent comme ils le feraient lors d’une chute normale. Les objets et créatures qui atteignent le sommet du Cylindre sans rien heurter y restent en suspension pour toute la durée. À la fin du sort, les objets et créatures affectés retombent vers le bas.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "inversion-de-la-gravite", "html_body": "<p>Ce sort inverse la gravité dans un Cylindre de 15 m de rayon et 30 m de haut centré sur un point à portée. Tous les objets et créatures de la zone qui ne sont pas ancrés au sol « chutent » vers le haut pour atteindre le sommet du Cylindre. Une créature à droit à un jet de sauvegarde de Dextérité pour saisir un objet fixé à portée d'allonge et ainsi éviter la « chute ». Si un plafond ou un objet ancré se présente en travers de la chute, les objets et créatures qui tombent le heurtent comme ils le feraient lors d’une chute normale. Les objets et créatures qui atteignent le sommet du Cylindre sans rien heurter y restent en suspension pour toute la durée. À la fin du sort, les objets et créatures affectés retombent vers le bas.<\/p>\n"}, {"nom": "Invisibilité", "ecole": "Illusion", "niveau": 2, "classes": ["Barde", "Ensorceleur", "Magicien", "Occultiste"], "incantation": "action", "portee": "contact", "composantes": "V, S, M (un cil dans de la sève)", "duree": "Concentration, jusqu'à 1 heure", "pages_source": [297], "description": "La créature que vous touchez physiquement reçoit l'état\nInvisible jusqu’à la fin du sort. Le sort prend fin prématurément si la cible effectue un jet d'attaque, inflige des dégâts ou lance un sort.\nEmplacement de niveau supérieur. Vous pouvez cibler une créature supplémentaire par niveau d'emplacement au-delà du 2°.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "invisibilite", "html_body": "<p>La créature que vous touchez physiquement reçoit l'état\nInvisible jusqu’à la fin du sort. Le sort prend fin prématurément si la cible effectue un jet d'attaque, inflige des dégâts ou lance un sort.\nEmplacement de niveau supérieur. Vous pouvez cibler une créature supplémentaire par niveau d'emplacement au-delà du 2°.<\/p>\n"}, {"nom": "Invisibilité Suprême", "ecole": "Illusion", "niveau": 4, "classes": ["Barde", "Ensorceleur", "Magicien"], "incantation": "action", "portee": "contact", "composantes": "V, S", "duree": "Concentration, jusqu’à 1 minute", "pages_source": [297], "description": "La créature que vous touchez physiquement reçoit l'état invisible jusqu'à la fin du sort.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "invisibilite-supreme", "html_body": "<p>La créature que vous touchez physiquement reçoit l'état invisible jusqu'à la fin du sort.<\/p>\n"}, {"nom": "Invocation d’animaux", "ecole": "Invocation", "niveau": 3, "classes": ["Druide", "Rôdeur"], "incantation": "action", "portee": "18 m", "composantes": "V, S", "duree": "Concentration, jusqu'à 10 minutes", "pages_source": [297, 298], "description": "Vous invoquez des esprits de la nature qui prennent la forme d'une « meute » de taille G d'animaux intangibles apparaissant en un espace inoccupé que vous voyez à portée. Cette meute persiste pour toute la durée et vous choisissez la forme animale des esprits (loups, serpents ou oiseaux, par -xemple). Vous avez l'Avantage aux jets de sauvegarde de Force tant que vous êtes dans un rayon de 1,50 m de la meute. Lorsque vous vous déplacez à votre tour, vous pouvez également léplacer la meute d'un maximum de 9 m jusqu'à un espace noccupé que vous voyez. Chaque fois que la meute se déplace dans un rayon de 5 m d'une créature que vous voyez, ainsi que chaque fois qu'une créature que vous voyez pénètre dans un espace 1 3 m ou moins de la meute ou y termine son tour, vous >ouvez contraindre cette créature à un jet de sauvegarde le Dextérité. En cas d'échec, elle subit 3d10 dégâts tran- -hants. Une même créature n'effectue en aucun cas ce JS lus d'une fois par tour.\nEmplacement de niveau supérieur. Les dégâts augmentent le 1d10 par niveau d'emplacement au-delà du 3°.\n\nCT 2 Er ve ps ir dr MT 97 . PRE É Portée : 27 m Composantes : V, S , Durée : Concentration, jusqu’à 10 minutes sde: has feste telle une colonne de lumière ; un Cylindre de 3 m de rayon et 12 m de haut, centré sur un point à portée. Pour chaque créature que vous voyez dans le Cylindre, choisissez par laquelle des lumières suivantes elle est baignée :\nLumière calcinante. La cible effectue un jet de sauvegarde de Dextérité, et subit 6d12 dégâts radiants en cas d'échec, la moitié en cas de réussite.\nLumière guérisseuse. La cible récupère autant de points de vie que 4d12 + votre modificateur de caractéristique d'incantation. Jusqu'à la fin du sort, le Cylindre est empli d'une Lumière vive et, quand vous vous déplacez à votre tour, vous pouvez également déplacer le Cylindre d'un maximum de 9 m. Chaque fois que le Cylindre se déplace dans l'espace d'une créature que vous voyez, ainsi que chaque fois qu'une créature que vous voyez pénètre dans le Cylindre ou y termine son tour, vous pouvez la baigner de l'une des lumières. Une même créature ne peut être affectée par ce sort plus d'une fois par tour.\nEmplacement de niveau supérieur. Les soins et les dégâts augmentent de 1d12 par niveau d'emplacement au-delà du 7.", "illustration": null, "legende_illustration": null, "notes_verification": "encadre_statistiques_a_controler", "statut": "ocr_non_valide", "id": "invocation-d-animaux", "html_body": "<p>Vous invoquez des esprits de la nature qui prennent la forme d'une « meute » de taille G d'animaux intangibles apparaissant en un espace inoccupé que vous voyez à portée. Cette meute persiste pour toute la durée et vous choisissez la forme animale des esprits (loups, serpents ou oiseaux, par -xemple). Vous avez l'Avantage aux jets de sauvegarde de Force tant que vous êtes dans un rayon de 1,50 m de la meute. Lorsque vous vous déplacez à votre tour, vous pouvez également léplacer la meute d'un maximum de 9 m jusqu'à un espace noccupé que vous voyez. Chaque fois que la meute se déplace dans un rayon de 5 m d'une créature que vous voyez, ainsi que chaque fois qu'une créature que vous voyez pénètre dans un espace 1 3 m ou moins de la meute ou y termine son tour, vous &gt;ouvez contraindre cette créature à un jet de sauvegarde le Dextérité. En cas d'échec, elle subit 3d10 dégâts tran- -hants. Une même créature n'effectue en aucun cas ce JS lus d'une fois par tour.\nEmplacement de niveau supérieur. Les dégâts augmentent le 1d10 par niveau d'emplacement au-delà du 3°.<\/p>\n<p>CT 2 Er ve ps ir dr MT 97 . PRE É Portée : 27 m Composantes : V, S , Durée : Concentration, jusqu’à 10 minutes sde: has feste telle une colonne de lumière ; un Cylindre de 3 m de rayon et 12 m de haut, centré sur un point à portée. Pour chaque créature que vous voyez dans le Cylindre, choisissez par laquelle des lumières suivantes elle est baignée :\nLumière calcinante. La cible effectue un jet de sauvegarde de Dextérité, et subit 6d12 dégâts radiants en cas d'échec, la moitié en cas de réussite.\nLumière guérisseuse. La cible récupère autant de points de vie que 4d12 + votre modificateur de caractéristique d'incantation. Jusqu'à la fin du sort, le Cylindre est empli d'une Lumière vive et, quand vous vous déplacez à votre tour, vous pouvez également déplacer le Cylindre d'un maximum de 9 m. Chaque fois que le Cylindre se déplace dans l'espace d'une créature que vous voyez, ainsi que chaque fois qu'une créature que vous voyez pénètre dans le Cylindre ou y termine son tour, vous pouvez la baigner de l'une des lumières. Une même créature ne peut être affectée par ce sort plus d'une fois par tour.\nEmplacement de niveau supérieur. Les soins et les dégâts augmentent de 1d12 par niveau d'emplacement au-delà du 7.<\/p>\n"}, {"nom": "Invocation D'Élémentaire", "ecole": "Invocation", "niveau": 5, "classes": ["Druide", "Magicien"], "incantation": "action", "portee": "18 m", "composantes": "V, S", "duree": "Concentration, jusqu'à 10 minutes", "pages_source": [298], "description": "Vous invoquez un esprit intangible de taille G issu des Plans Élémentaires, qui apparaît en un espace inoccupé à portée. Choisissez l'élément de l'esprit, qui définit son type de dégâts : air (foudre), eau (froid), feu (feu) ou terre (tonnerre). L'esprit persiste pour toute la durée. Chaque fois qu'une créature que vous voyez pénètre dans l'espace de l'esprit ou commence son tour dans un rayon de 1,50 m de celui-ci, vous pouvez la contraindre à un jet de sauvegarde de Dextérité si l'esprit n'a pas de créature\nEntravée. En cas d'échec, la cible subit 8d8 dégâts du type associé à l'esprit, ainsi que l'état Entravé jusqu'à la fin du sort. Au début de chacun de ses tours, la cible Entravée réitère le JS. En cas d'échec, elle subit 4d8 dégâts du type de l'esprit. En cas de réussite, elle n'est plus Entravée par l'esprit.\nEmplacement de niveau supérieur. Les dégâts SEE de 2d8 par niveau d' emplacement au-delà du 5°. ré Durée : Concentration, jusqu'à 10 minutes Vous invoquez des esprits issus des Plans Élémentaires qui volètent autour de vous pour toute la durée, sous forme d'une Émanation de 4,50 m. Jusqu'à la fin du sort, toute attaque que vous effectuez inflige 2d8 dégâts supplémentaires lorsque vous touchez une créature prise dans l'Émanation. Ces dégâts sont d'acide, de feu, de foudre ou de froid (vous choisissez en effectuant l'attaque). De plus, le sol dans l'Émanation constitue un Terrain difficile pour vos ennemis.\nEmplacement de niveau supérieur. Les dégâts augmentent de 2d8 par niveau d'emplacement au-delà du 4°. re CT ne Cu", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "invocation-d-elementaire", "html_body": "<p>Vous invoquez un esprit intangible de taille G issu des Plans Élémentaires, qui apparaît en un espace inoccupé à portée. Choisissez l'élément de l'esprit, qui définit son type de dégâts : air (foudre), eau (froid), feu (feu) ou terre (tonnerre). L'esprit persiste pour toute la durée. Chaque fois qu'une créature que vous voyez pénètre dans l'espace de l'esprit ou commence son tour dans un rayon de 1,50 m de celui-ci, vous pouvez la contraindre à un jet de sauvegarde de Dextérité si l'esprit n'a pas de créature\nEntravée. En cas d'échec, la cible subit 8d8 dégâts du type associé à l'esprit, ainsi que l'état Entravé jusqu'à la fin du sort. Au début de chacun de ses tours, la cible Entravée réitère le JS. En cas d'échec, elle subit 4d8 dégâts du type de l'esprit. En cas de réussite, elle n'est plus Entravée par l'esprit.\nEmplacement de niveau supérieur. Les dégâts SEE de 2d8 par niveau d' emplacement au-delà du 5°. ré Durée : Concentration, jusqu'à 10 minutes Vous invoquez des esprits issus des Plans Élémentaires qui volètent autour de vous pour toute la durée, sous forme d'une Émanation de 4,50 m. Jusqu'à la fin du sort, toute attaque que vous effectuez inflige 2d8 dégâts supplémentaires lorsque vous touchez une créature prise dans l'Émanation. Ces dégâts sont d'acide, de feu, de foudre ou de froid (vous choisissez en effectuant l'attaque). De plus, le sol dans l'Émanation constitue un Terrain difficile pour vos ennemis.\nEmplacement de niveau supérieur. Les dégâts augmentent de 2d8 par niveau d'emplacement au-delà du 4°. re CT ne Cu<\/p>\n"}, {"nom": "Invocation D'Êtres Sylvestres", "ecole": "Invocation", "niveau": 4, "classes": ["Druide", "Rôdeur"], "incantation": "action", "portee": "personnelle", "composantes": "V, S", "duree": "Concentration, jusqu'à 10 minutes", "pages_source": [298], "description": "Vous invoquez des esprits de la nature qui volètent autour de vous pour toute la durée, sous forme d'une Émanation de 3 m. Chaque fois que l'Émanation pénètre dans l'espace d'une créature que vous voyez, ainsi que chaque fois qu'une créature que vous voyez pénètre dans l'Émanation ou y termine son tour, vous pouvez la contraindre à un jet de sauvegarde de Sagesse. Elle subit 5d8 dégâts de force en cas d'échec, la moitié en cas de réussite. Une même créature n'effectue en aucun cas ce JS plus d'une fois par tour. De plus, pour toute la durée du sort, vous pouvez entreprendre l'action Désengagement par une action\nBonus.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d8 par niveau d'emplacement au-delà du 4°.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "invocation-d-etres-sylvestres", "html_body": "<p>Vous invoquez des esprits de la nature qui volètent autour de vous pour toute la durée, sous forme d'une Émanation de 3 m. Chaque fois que l'Émanation pénètre dans l'espace d'une créature que vous voyez, ainsi que chaque fois qu'une créature que vous voyez pénètre dans l'Émanation ou y termine son tour, vous pouvez la contraindre à un jet de sauvegarde de Sagesse. Elle subit 5d8 dégâts de force en cas d'échec, la moitié en cas de réussite. Une même créature n'effectue en aucun cas ce JS plus d'une fois par tour. De plus, pour toute la durée du sort, vous pouvez entreprendre l'action Désengagement par une action\nBonus.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d8 par niveau d'emplacement au-delà du 4°.<\/p>\n"}, {"nom": "Invocation de Fée", "ecole": "Invocation", "niveau": 6, "classes": ["Druide"], "incantation": "action", "portee": "18 m", "composantes": "V, S", "duree": "Concentration, jusqu'à 10 minutes", "pages_source": [298, 299], "description": "Vous invoquez un esprit de taille M issu de Féerie, en un espace inoccupé que vous voyez à portée. L'esprit persiste pour toute la durée, avec l'aspect de la Fée de votre choix. Quand l'esprit apparaît, vous pouvez effectuer une attaque de sort au corps à corps contre une créature située dans un rayon de 1,50 m de l'esprit. Si l'attaque touche, la cible subit Ë des dégâts psychiques égaux à 3d12 plus votre modificateur de ne t Par une action Bonus à vos tours suivants, vous pouvez téléporter l'esprit en un espace inoccupé que vous voyez dans un rayon de 9 m de l'espace que vous lui faites quitter et effectuer l'attaque contre une créature située à 1,50 m ou moins de lui.\nEmplacement de niveau supérieur. Les dégâts augmentent de 2d12 par niveau d'emplacement au-delà du 6°.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "invocation-de-fee", "html_body": "<p>Vous invoquez un esprit de taille M issu de Féerie, en un espace inoccupé que vous voyez à portée. L'esprit persiste pour toute la durée, avec l'aspect de la Fée de votre choix. Quand l'esprit apparaît, vous pouvez effectuer une attaque de sort au corps à corps contre une créature située dans un rayon de 1,50 m de l'esprit. Si l'attaque touche, la cible subit Ë des dégâts psychiques égaux à 3d12 plus votre modificateur de ne t Par une action Bonus à vos tours suivants, vous pouvez téléporter l'esprit en un espace inoccupé que vous voyez dans un rayon de 9 m de l'espace que vous lui faites quitter et effectuer l'attaque contre une créature située à 1,50 m ou moins de lui.\nEmplacement de niveau supérieur. Les dégâts augmentent de 2d12 par niveau d'emplacement au-delà du 6°.<\/p>\n"}, {"nom": "Invocation de Volée", "ecole": "Invocation", "niveau": 5, "classes": ["Rôdeur"], "incantation": "action", "portee": "45 m", "composantes": "V, S, M (une arme de corps à corps ou à distance d’une valeur minimale de 1 pc)", "duree": "instantanée", "pages_source": [299], "description": "Vous brandissez l'arme utilisée pour l’incantation et choisissez un point à portée. Des centaines d'armes identiques (ou des projectiles associés) pleuvent avant de disparaître. Chaque créature de votre choix parmi celles que vous voyez dans un Cylindre de 12 m de rayon et 6 m de haut centré sur le point choisi effectue un jet de sauvegarde de Dextérité. Elle subit 8d8 dégâts de force en cas d'échec, la moitié en cas de réussite.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "invocation-de-volee", "html_body": "<p>Vous brandissez l'arme utilisée pour l’incantation et choisissez un point à portée. Des centaines d'armes identiques (ou des projectiles associés) pleuvent avant de disparaître. Chaque créature de votre choix parmi celles que vous voyez dans un Cylindre de 12 m de rayon et 6 m de haut centré sur le point choisi effectue un jet de sauvegarde de Dextérité. Elle subit 8d8 dégâts de force en cas d'échec, la moitié en cas de réussite.<\/p>\n"}, {"nom": "Lame de Feu", "ecole": "Évocation", "niveau": 2, "classes": ["Druide", "Ensorceleur"], "incantation": "action Bonus", "portee": "personnelle", "composantes": "V, S, M (une feuille d'amarante)", "duree": "Concentration, jusqu’à 10 minutes", "pages_source": [299], "description": "Vous faites apparaître une lame ardente dans votre main libre. La lame est comparable en taille et forme à un cimeterre. Elle persiste pour toute la durée. Si vous la lâchez, la lame disparaît, mais vous pouvez la faire réapparaître par une action Bonus. Au prix de l’action Magie, vous pouvez effectuer une attaque de sort avec la lame enflammée. Si l'attaque touche, la cible subit des dégâts de feu : 3d6 plus votre modificateur de caractéristique d'incantation. La lame ardente projette une Lumière vive sur un rayon de 3 m, et une Lumière faible sur 3 m de plus.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d6 par niveau d'emplacement au-delà du 2°.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "lame-de-feu", "html_body": "<p>Vous faites apparaître une lame ardente dans votre main libre. La lame est comparable en taille et forme à un cimeterre. Elle persiste pour toute la durée. Si vous la lâchez, la lame disparaît, mais vous pouvez la faire réapparaître par une action Bonus. Au prix de l’action Magie, vous pouvez effectuer une attaque de sort avec la lame enflammée. Si l'attaque touche, la cible subit des dégâts de feu : 3d6 plus votre modificateur de caractéristique d'incantation. La lame ardente projette une Lumière vive sur un rayon de 3 m, et une Lumière faible sur 3 m de plus.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d6 par niveau d'emplacement au-delà du 2°.<\/p>\n"}, {"nom": "Lenteur", "ecole": "Transmutation", "niveau": 3, "classes": ["Barde", "Ensorceleur", "Magicien"], "incantation": "action", "portee": "36 m", "composantes": "V, S, M (une goutte de mélasse)", "duree": "Concentration, jusqu'à 1 minute", "pages_source": [299], "description": "Vous altérez le temps autour d'un maximum de six créatures de votre choix dans un Cube de 12 m à portée. Chaque cible doit réussir un jet de sauvegarde de Sagesse sous peine d'être affectée par ce sort pour toute la durée. Une cible affectée voit sa Vitesse réduite de moitié, subit un malus de —-2 à la CA et aux jets de sauvegarde de «' Êr } Y. 7 Jet elle peut entreprendre une action ou une action Bonus, mais pas les deux, et elle ne peut effectuer qu'une attaque dans le cadre de l’action Attaque. Si elle lance un sort avec une composante somatique, il y a 25 % de chances que le sort échoue en raison de la torpeur de sa gestuelle. Une cible affectée réitère le JS à la fin de chacun de ses tours et met un terme au sort sur elle-même en cas de réussite.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "lenteur", "html_body": "<p>Vous altérez le temps autour d'un maximum de six créatures de votre choix dans un Cube de 12 m à portée. Chaque cible doit réussir un jet de sauvegarde de Sagesse sous peine d'être affectée par ce sort pour toute la durée. Une cible affectée voit sa Vitesse réduite de moitié, subit un malus de —-2 à la CA et aux jets de sauvegarde de «' Êr } Y. 7 Jet elle peut entreprendre une action ou une action Bonus, mais pas les deux, et elle ne peut effectuer qu'une attaque dans le cadre de l’action Attaque. Si elle lance un sort avec une composante somatique, il y a 25 % de chances que le sort échoue en raison de la torpeur de sa gestuelle. Une cible affectée réitère le JS à la fin de chacun de ses tours et met un terme au sort sur elle-même en cas de réussite.<\/p>\n"}, {"nom": "Lévitation", "ecole": "Transmutation", "niveau": 2, "classes": ["Ensorceleur", "Magicien"], "incantation": "action", "portee": "18 m", "composantes": "V, S, M (un ressort métallique)", "duree": "Concentration, jusqu'à 10 minutes", "pages_source": [299], "description": "Une créature ou un objet de votre choix que vous voyez à portée monte verticalement jusqu’à un maximum de 6 m et y reste, en suspension, pour toute la durée. Le sort peut faire léviter un objet dont le poids n'excède pas 250 kg. Une créature non consentante qui réussit un jet de sauvegarde de Constitution n'est pas affectée. La cible ne peut se déplacer qu’en prenant appui sur des objets et surfaces fixes à portée (murs, plafonds, etc.), comme si elle escaladait. À votre tour, vous pouvez modifier l'altitude de la cible d'un maximum de 6 m vers le haut ou vers le bas. Si vous êtes la cible, vous pouvez vous déplacer ainsi dans le cadre de votre déplacement. Sans cela, vous devez entreprendre l’action Magie pour déplacer la cible, qui doit rester à portée du sort. Lorsque le sort prend fin, la cible redescend en flottant vers le sol si elle est toujours dans les airs.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "levitation", "html_body": "<p>Une créature ou un objet de votre choix que vous voyez à portée monte verticalement jusqu’à un maximum de 6 m et y reste, en suspension, pour toute la durée. Le sort peut faire léviter un objet dont le poids n'excède pas 250 kg. Une créature non consentante qui réussit un jet de sauvegarde de Constitution n'est pas affectée. La cible ne peut se déplacer qu’en prenant appui sur des objets et surfaces fixes à portée (murs, plafonds, etc.), comme si elle escaladait. À votre tour, vous pouvez modifier l'altitude de la cible d'un maximum de 6 m vers le haut ou vers le bas. Si vous êtes la cible, vous pouvez vous déplacer ainsi dans le cadre de votre déplacement. Sans cela, vous devez entreprendre l’action Magie pour déplacer la cible, qui doit rester à portée du sort. Lorsque le sort prend fin, la cible redescend en flottant vers le sol si elle est toujours dans les airs.<\/p>\n"}, {"nom": "Liane Avide", "ecole": "Invocation", "niveau": 4, "classes": ["Druide", "Rôdeur"], "incantation": "action Bonus", "portee": "18 m", "composantes": "V, S", "duree": "Concentration, jusqu'à 1 minute", "pages_source": [299, 300], "description": "Vous invoquez une plante grimpante qui surgit d'une surface dans un espace inoccupé que vous voyez à portée.\nLa plante persiste pour toute la durée. Effectuez une attaque de sort au corps à corps contre une créature dans un rayon de 9 m de la plante. Si l'attaque touche, la cible subit 4d8 dégâts contondants et se retrouve tirée d'un maximum de 9 m vers la plante ; si la cible est de taille TG ou inférieure, elle subit l'état Agrippé (évasion DD égal à votre DD de sauvegarde des sorts). La plante ne peut agripper qu'une créature à la fois, sachant que vous pouvez lui faire relâcher une créature Agrippée (pas d'action requise). Par une action Bonus à vos tours suivants, vous pouvez réitérer l'attaque contre une créature située dans un rayon de 9 m de la plante.\nEmplacement de niveau supérieur. Le nombre de créatures que la plante peut agripper augmente d'un par niveau d'emplacement au-delà du 4°. late\" +4 CHAPITRE 7 | SORTS Le terme me —\nVous touchez une créature consentante. Porto UE les déplacements de la cible ne sont pas affectés par le Terrain difficile, et les sorts et effets magiques ne peuvent ni réduire sa Vitesse, ni lui infliger l'état Paralysé ou Entravé. La cible dispose aussi d’une Vitesse de nage égale à sa Vitesse. De plus, la cible peut consacrer 1,50 m de son déplacement à s'extraire automatiquement d'entraves non magiques, comme des menottes ou l'étreinte d'une créature qui lui impose l'état Agrippé.\nEmplacement de niveau supérieur. Vous pouvez cibler une créature supplémentaire par niveau d'emplacement au-delà du 4.", "illustration": null, "legende_illustration": null, "notes_verification": "symboles_suspects", "statut": "ocr_non_valide", "id": "liane-avide", "html_body": "<p>Vous invoquez une plante grimpante qui surgit d'une surface dans un espace inoccupé que vous voyez à portée.\nLa plante persiste pour toute la durée. Effectuez une attaque de sort au corps à corps contre une créature dans un rayon de 9 m de la plante. Si l'attaque touche, la cible subit 4d8 dégâts contondants et se retrouve tirée d'un maximum de 9 m vers la plante ; si la cible est de taille TG ou inférieure, elle subit l'état Agrippé (évasion DD égal à votre DD de sauvegarde des sorts). La plante ne peut agripper qu'une créature à la fois, sachant que vous pouvez lui faire relâcher une créature Agrippée (pas d'action requise). Par une action Bonus à vos tours suivants, vous pouvez réitérer l'attaque contre une créature située dans un rayon de 9 m de la plante.\nEmplacement de niveau supérieur. Le nombre de créatures que la plante peut agripper augmente d'un par niveau d'emplacement au-delà du 4°. late&quot; +4 CHAPITRE 7 | SORTS Le terme me —\nVous touchez une créature consentante. Porto UE les déplacements de la cible ne sont pas affectés par le Terrain difficile, et les sorts et effets magiques ne peuvent ni réduire sa Vitesse, ni lui infliger l'état Paralysé ou Entravé. La cible dispose aussi d’une Vitesse de nage égale à sa Vitesse. De plus, la cible peut consacrer 1,50 m de son déplacement à s'extraire automatiquement d'entraves non magiques, comme des menottes ou l'étreinte d'une créature qui lui impose l'état Agrippé.\nEmplacement de niveau supérieur. Vous pouvez cibler une créature supplémentaire par niveau d'emplacement au-delà du 4.<\/p>\n"}, {"nom": "Lien de Protection", "ecole": "Abjuration", "niveau": 2, "classes": ["Clerc", "Paladin"], "incantation": "action", "portee": "contact", "composantes": "V, S, M (deux bagues de platine d'une valeur minimale de 50 po chacune, que la cible et vous devez porter pour toute la durée)", "duree": "1 heure", "pages_source": [300], "description": "Vous touchez physiquement une créature consentante pour forger un lien magique entre elle et vous jusqu'à la fin du sort. Tant que la cible se trouve dans un rayon de 18 m de vous, elle reçoit un bonus de +1 à la CA et aux jets de sauvegarde, et bénéficie de la Résistance à tous les dégâts. Par ailleurs, chaque fois qu'elle subit des dégâts, vous en subissez autant. Le sort prend fin si vous tombez à O point de vie ou si la cible et vous vous retrouvez distants de plus de 18 m. Il prend également fin s'il est relancé sur l'une des deux créatures ainsi liées.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "lien-de-protection", "html_body": "<p>Vous touchez physiquement une créature consentante pour forger un lien magique entre elle et vous jusqu'à la fin du sort. Tant que la cible se trouve dans un rayon de 18 m de vous, elle reçoit un bonus de +1 à la CA et aux jets de sauvegarde, et bénéficie de la Résistance à tous les dégâts. Par ailleurs, chaque fois qu'elle subit des dégâts, vous en subissez autant. Le sort prend fin si vous tombez à O point de vie ou si la cible et vous vous retrouvez distants de plus de 18 m. Il prend également fin s'il est relancé sur l'une des deux créatures ainsi liées.<\/p>\n"}, {"nom": "Lien Télépathique de Rary", "ecole": "Divination", "niveau": 5, "classes": ["Barde", "Magicien"], "incantation": "action ou rituel", "portee": "9 m", "composantes": "V, S, M (deux œufs)", "duree": "1 heure", "pages_source": [300], "description": "Vous forgez un lien télépathique entre un maximum de huit créatures consentantes que vous choisissez à portée, chacune se retrouvant en relation psychique avec toutes les autres pour toute la durée. Les créatures incapables de communiquer par le biais d'une eue n ne sontpas affectées par ce sort. ue tele co ET \\ télépathie via Le lien ps qu ne s'étend Durée : instantanée Décrivez ou nommez une Re\nPlante, ou une plante non magique. c quelle direction et à quelle gen ou la plante de cette sorte la plusF 7,5 km, le cas échéant.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "lien-telepathique-de-rary", "html_body": "<p>Vous forgez un lien télépathique entre un maximum de huit créatures consentantes que vous choisissez à portée, chacune se retrouvant en relation psychique avec toutes les autres pour toute la durée. Les créatures incapables de communiquer par le biais d'une eue n ne sontpas affectées par ce sort. ue tele co ET \\ télépathie via Le lien ps qu ne s'étend Durée : instantanée Décrivez ou nommez une Re\nPlante, ou une plante non magique. c quelle direction et à quelle gen ou la plante de cette sorte la plusF 7,5 km, le cas échéant.<\/p>\n"}, {"nom": "Localisation de Créature", "ecole": "Divination", "niveau": 4, "classes": ["Barde", "Clerc", "Druide", "Ma", "Paladin", "Rôdeur"], "incantation": "À vérifier", "portee": "personnelle", "composantes": "V, S, M (une touffe de poils de nie)", "duree": "Concentration, jusqu'à 1 heure", "pages_source": [300], "description": "Décrivez ou nommez une créature qui vous est familière Vous percevez dans quelle direction la créature se trouve, à condition qu'elle soit située dans un rayon de 300 m. …\nSi la créature se déplace, vous savez dans quelle direction. Le sort peut localiser une créature donnée que vous connaissez ou la créature d'une certaine catégorie (un humain ou une licorne, par exemple) la plus proche, à condition que vous ayez déjà vu une telle créature de près (9 m ou moins). Si la créature décrite ou nommée se trouve sous une forme différente, parce qu'elle est sous les effets du sort métamorphose ou pétrification par exemple, le sort ne parvient pas à la localiser. Ce sort ne trouve pas davantage la créature si la moindre épaisseur de plomb vous sépare d'elle.", "illustration": null, "legende_illustration": null, "notes_verification": "champ_absent:incantation", "statut": "ocr_non_valide", "id": "localisation-de-creature", "html_body": "<p>Décrivez ou nommez une créature qui vous est familière Vous percevez dans quelle direction la créature se trouve, à condition qu'elle soit située dans un rayon de 300 m. …\nSi la créature se déplace, vous savez dans quelle direction. Le sort peut localiser une créature donnée que vous connaissez ou la créature d'une certaine catégorie (un humain ou une licorne, par exemple) la plus proche, à condition que vous ayez déjà vu une telle créature de près (9 m ou moins). Si la créature décrite ou nommée se trouve sous une forme différente, parce qu'elle est sous les effets du sort métamorphose ou pétrification par exemple, le sort ne parvient pas à la localiser. Ce sort ne trouve pas davantage la créature si la moindre épaisseur de plomb vous sépare d'elle.<\/p>\n"}, {"nom": "Localisation D'Objet", "ecole": "Divination", "niveau": 2, "classes": ["Barde", "Clerc", "Druide", "Magicien", "Paladin", "Rôdeur"], "incantation": "À vérifier", "portee": "personnelle", "composantes": "V, S, M (une brindille fourchue)", "duree": "Concentration, jusqu'à 10 minutes", "pages_source": [300, 301], "description": "Décrivez ou nommez un objet qui vous est familier. Vous percevez dans quelle direction l'objet se trouve, à condition qu'il soit situé dans un rayon de 300 m. Si l'objet est en mouvement, vous savez dans quelle direction il se déplace. Le sort peut localiser un objet donné que vous connaissez, à condition que vous l'ayez déjà vu de près (9 m ou moins). Une autre option vous permet de localiser l'objet d'une certaine catégorie le plus proche, en mentionnant par exemple un certain genre de vêtement, de bijou, de meuble, d'outil ou d'arme. Ce sort ne trouve pas davantage l'objet si la moindre épaisseur de plomb vous en sépare. o |: *\"Æ. Un CLERC ELFE COMPTE SUR LE SORT LUMIÈRE DU JOUR POUR BAIGNER UNE COUR DE VAMPIRES *\nDES RAYONS DE L'AUBE. *", "illustration": null, "legende_illustration": null, "notes_verification": "champ_absent:incantation; symboles_suspects", "statut": "ocr_non_valide", "id": "localisation-d-objet", "html_body": "<p>Décrivez ou nommez un objet qui vous est familier. Vous percevez dans quelle direction l'objet se trouve, à condition qu'il soit situé dans un rayon de 300 m. Si l'objet est en mouvement, vous savez dans quelle direction il se déplace. Le sort peut localiser un objet donné que vous connaissez, à condition que vous l'ayez déjà vu de près (9 m ou moins). Une autre option vous permet de localiser l'objet d'une certaine catégorie le plus proche, en mentionnant par exemple un certain genre de vêtement, de bijou, de meuble, d'outil ou d'arme. Ce sort ne trouve pas davantage l'objet si la moindre épaisseur de plomb vous en sépare. o |: *&quot;Æ. Un CLERC ELFE COMPTE SUR LE SORT LUMIÈRE DU JOUR POUR BAIGNER UNE COUR DE VAMPIRES *\nDES RAYONS DE L'AUBE. *<\/p>\n"}, {"nom": "Lueur D'Espoir", "ecole": "Abjuration", "niveau": 3, "classes": ["Clerc"], "incantation": "action", "portee": "9 m", "composantes": "V, S", "duree": "Concentration, jusqu'à 1 minute", "pages_source": [301], "description": "Choisissez autant de créatures que vous le souhaitez à portée. Pour toute la durée, chaque cible a l'Avantage aux jets de sauvegarde de Sagesse et JS contre la mort, et récupère le maximum possible de points de vie chaque fois qu'on la soigne.", "illustration": null, "legende_illustration": null, "notes_verification": "encadre_statistiques_a_controler", "statut": "ocr_non_valide", "id": "lueur-d-espoir", "html_body": "<p>Choisissez autant de créatures que vous le souhaitez à portée. Pour toute la durée, chaque cible a l'Avantage aux jets de sauvegarde de Sagesse et JS contre la mort, et récupère le maximum possible de points de vie chaque fois qu'on la soigne.<\/p>\n"}, {"nom": "Lueurs Féeriques", "ecole": "Évocation", "niveau": 1, "classes": ["Barde", "Druide"], "incantation": "action", "portee": "18 m", "composantes": "V", "duree": "Concentration, jusqu'à 1 minute", "pages_source": [301], "description": "Le contour des objets compris dans un Cube de 6 m à portée luit de bleu, de vert ou de violet, à votre convenance. Chaque créature prise dans le Cube est aussi nimbée si elle rate un jet de sauvegarde de Dextérité. Pour toute la durée, les objets et les créatures affectées projettent une Lumière faible sur un rayon de 3 m, et ne peuvent bénéficier de l’état Invisible. Les jets d'attaque contre une créature ou un objet affectés ont l'Avantage si l’assaillant voit la cible.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "lueurs-feeriques", "html_body": "<p>Le contour des objets compris dans un Cube de 6 m à portée luit de bleu, de vert ou de violet, à votre convenance. Chaque créature prise dans le Cube est aussi nimbée si elle rate un jet de sauvegarde de Dextérité. Pour toute la durée, les objets et les créatures affectées projettent une Lumière faible sur un rayon de 3 m, et ne peuvent bénéficier de l’état Invisible. Les jets d'attaque contre une créature ou un objet affectés ont l'Avantage si l’assaillant voit la cible.<\/p>\n"}, {"nom": "Lumière", "ecole": "Évocation", "niveau": 0, "classes": ["Barde", "Clerc", "Ensorceleur", "Magicien"], "incantation": "action", "portee": "contact", "composantes": "V, M (une luciole ou de la mousse phosphorescente)", "duree": "1 heure", "pages_source": [301], "description": "Vous touchez physiquement un objet de taille G ou inférieure qui n'est porté par personne d'autre. Jusqu'à la fin du sort, l'objet produit une Lumière vive sur un rayon de 6 met une Lumière faible sur 6 m de plus. La lumière peut présenter les teintes de votre choix.\nRecouvrir l’objet d’une surface opaque bloque la lumière.\nLe sort prend fin si vous le lancez à nouveau.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "lumiere", "html_body": "<p>Vous touchez physiquement un objet de taille G ou inférieure qui n'est porté par personne d'autre. Jusqu'à la fin du sort, l'objet produit une Lumière vive sur un rayon de 6 met une Lumière faible sur 6 m de plus. La lumière peut présenter les teintes de votre choix.\nRecouvrir l’objet d’une surface opaque bloque la lumière.\nLe sort prend fin si vous le lancez à nouveau.<\/p>\n"}, {"nom": "Lumière du Jour", "ecole": "Évocation", "niveau": 3, "classes": ["Clerc", "Druide", "Ensorceleur", "Paladin", "Rôdeur"], "incantation": "action", "portee": "18 m", "composantes": "V, S", "duree": "1 heure", "pages_source": [301, 302], "description": "CHAPITRE 7 | SORTS 301 Lg O\nPHARE MAIN DE BiG8Y POUR PRÉVENIR TOUTE.\nINTERRUPTION DANS SES RECHERCHES. - Pour toute la durée, la lumière du soleil rayonne depuis un point à portée en emplissant une Sphère de 18 m de rayon. La Sphère constitue une zone de Lumière vive et produit ne Lumière faible sur 18 m de plus Au lieu de cela, vous pouvez lancer le sort sur un objet porté par personne, de manière à ce que les rayons du soleil emplissent une Emanation de 18 m centrée sur l'objet. Il suffit de recouvrir cet objet d'une surface opaque, comme une gamelle ou un heaume, pour bloquer la lumière du soleil. Si tout ou partie de ce sort chevauche la zone de Ténèbres créée par un sort du 3° niveau ou inférieur, l'effet qui produit cette lumière est dissipé.", "illustration": null, "legende_illustration": null, "notes_verification": "symboles_suspects", "statut": "ocr_non_valide", "id": "lumiere-du-jour", "html_body": "<p>CHAPITRE 7 | SORTS 301 Lg O\nPHARE MAIN DE BiG8Y POUR PRÉVENIR TOUTE.\nINTERRUPTION DANS SES RECHERCHES. - Pour toute la durée, la lumière du soleil rayonne depuis un point à portée en emplissant une Sphère de 18 m de rayon. La Sphère constitue une zone de Lumière vive et produit ne Lumière faible sur 18 m de plus Au lieu de cela, vous pouvez lancer le sort sur un objet porté par personne, de manière à ce que les rayons du soleil emplissent une Emanation de 18 m centrée sur l'objet. Il suffit de recouvrir cet objet d'une surface opaque, comme une gamelle ou un heaume, pour bloquer la lumière du soleil. Si tout ou partie de ce sort chevauche la zone de Ténèbres créée par un sort du 3° niveau ou inférieur, l'effet qui produit cette lumière est dissipé.<\/p>\n"}, {"nom": "Lumières Dansantes", "ecole": "Illusion", "niveau": 0, "classes": ["Barde", "Ensorceleur", "Magicien"], "incantation": "action", "portee": "36 m", "composantes": "V, S, M (un peu de phosphore)", "duree": "Concentration, jusqu’à 1] minute", "pages_source": [302], "description": "Vous créez jusqu'à quatre lumières de la taille d'une torche, à portée ; pour toute la durée, elles ont l'aspect de torches, de lanternes ou de globes luisants qui flottent dans les airs. Au lieu de cela, vous pouvez fusionner les quatre lumières en forme luisante vaguement humaine, de taille M. Quelle que soit la forme choisie, chaque lueur émet une Lumière faible dans un rayon de 3 m. Par une action Bonus, vous pouvez déplacer les lueurs d'un maximum de 18 m vers un nouvel espace à portée. Chaque lueur du sort, à sa création, doit se situer dans un rayon de 6 m d'une autre, et s'évanouit si jamais elle quitte la portée du sort.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "lumieres-dansantes", "html_body": "<p>Vous créez jusqu'à quatre lumières de la taille d'une torche, à portée ; pour toute la durée, elles ont l'aspect de torches, de lanternes ou de globes luisants qui flottent dans les airs. Au lieu de cela, vous pouvez fusionner les quatre lumières en forme luisante vaguement humaine, de taille M. Quelle que soit la forme choisie, chaque lueur émet une Lumière faible dans un rayon de 3 m. Par une action Bonus, vous pouvez déplacer les lueurs d'un maximum de 18 m vers un nouvel espace à portée. Chaque lueur du sort, à sa création, doit se situer dans un rayon de 6 m d'une autre, et s'évanouit si jamais elle quitte la portée du sort.<\/p>\n"}, {"nom": "Main de Bigby", "ecole": "Évocation", "niveau": 5, "classes": ["Ensorceleur", "Magicien"], "incantation": "action", "portee": "36 m", "composantes": "V, S, M (une coquille d'œuf et un gant)", "duree": "Concentration, jusqu'à | minute", "pages_source": [302, 303], "description": "Vous créez une main de taille G faite d'énergies magiques chatoyantes. Elle apparaît dans un espace inoccupé que vous voyez à portée. La main persiste pendant toute la durée et se déplace sous votre contrôle, en reproduisant les mouvements de votre propre main. La main est un objet doté d'une CA de 20 et de points de vie égaux à votre maximum de points de vie. S'il tombe à O point de vie, le sort prend fin. La main n'occupe pas son espace. À l'incantation du sort, ainsi que par une action Bonus à vos tours suivants, vous pouvez déplacer la main d’un maximum de 18 m puis lui faire produire l’un des effets suivants : vous p D Diéndre une que que la main la brole et lui inflige des égaux à 4d6 ee votre modificateur inférieure située dans un rayon de 1,50 m le doit réussir un jet de sauvegarde de Force, la main la repousse d'un maximum de 1,50 m, s 1,50 m multiplié par votre modificateur de caractée d'incantation. La main se déplace avec la cible _pour rester dans un rayon de 1,50 m d'elle.\nMain interposée. La main vous octroie un Abri partiel contre les attaques et effets émanant de son espace ou qui le traversent. De plus, son espace est considéré comme un Terrain difficile pour vos ennemis.\nPoing serré. La main frappe une cible dans un rayon de 1,50 m d'elle. Effectuez une attaque de sort au corps à corps. Si l'attaque touche, la cible subit 5d8 dégâts de force.\nEmplacement de niveau supérieur. Les dégâts de l'option poing serré augmentent de 2d8 et ceux de main agrippeuse de 2d6 par niveau d'emplacement au-delà du 5°. ue", "illustration": null, "legende_illustration": null, "notes_verification": "encadre_statistiques_a_controler", "statut": "ocr_non_valide", "id": "main-de-bigby", "html_body": "<p>Vous créez une main de taille G faite d'énergies magiques chatoyantes. Elle apparaît dans un espace inoccupé que vous voyez à portée. La main persiste pendant toute la durée et se déplace sous votre contrôle, en reproduisant les mouvements de votre propre main. La main est un objet doté d'une CA de 20 et de points de vie égaux à votre maximum de points de vie. S'il tombe à O point de vie, le sort prend fin. La main n'occupe pas son espace. À l'incantation du sort, ainsi que par une action Bonus à vos tours suivants, vous pouvez déplacer la main d’un maximum de 18 m puis lui faire produire l’un des effets suivants : vous p D Diéndre une que que la main la brole et lui inflige des égaux à 4d6 ee votre modificateur inférieure située dans un rayon de 1,50 m le doit réussir un jet de sauvegarde de Force, la main la repousse d'un maximum de 1,50 m, s 1,50 m multiplié par votre modificateur de caractée d'incantation. La main se déplace avec la cible _pour rester dans un rayon de 1,50 m d'elle.\nMain interposée. La main vous octroie un Abri partiel contre les attaques et effets émanant de son espace ou qui le traversent. De plus, son espace est considéré comme un Terrain difficile pour vos ennemis.\nPoing serré. La main frappe une cible dans un rayon de 1,50 m d'elle. Effectuez une attaque de sort au corps à corps. Si l'attaque touche, la cible subit 5d8 dégâts de force.\nEmplacement de niveau supérieur. Les dégâts de l'option poing serré augmentent de 2d8 et ceux de main agrippeuse de 2d6 par niveau d'emplacement au-delà du 5°. ue<\/p>\n"}, {"nom": "Main du Mage", "ecole": "Invocation", "niveau": 0, "classes": ["Barde", "Ensorceleur", "Magicien", "Occultiste"], "incantation": "action", "portee": "9 m", "composantes": "V, S", "duree": "1 minute", "pages_source": [303], "description": "Une main spectrale et flottante apparaît en un point que vous choisissez à portée. La main persiste pour toute la durée. Elle disparaît si jamais elle se retrouve à plus de 9 m de vous ou si vous relancez ce sort. À l'incantation du sort, la main peut servir à manipuler un objet, à ouvrir une porte ou un récipient non verrouillés, à ranger ou récupérer un objet dans un conteneur ouvert ou à déverser le contenu d’une fiole. Au prix de l’action Magie à vos tours suivants, vous pouvez de nouveau contrôler ainsi la main. Dans le cadre de cette action, vous pouvez déplacer la main d'un maximum de 9 m. Elle ne peut ni attaquer, ni activer d'objet magique, ni porter plus de 5 kg.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "main-du-mage", "html_body": "<p>Une main spectrale et flottante apparaît en un point que vous choisissez à portée. La main persiste pour toute la durée. Elle disparaît si jamais elle se retrouve à plus de 9 m de vous ou si vous relancez ce sort. À l'incantation du sort, la main peut servir à manipuler un objet, à ouvrir une porte ou un récipient non verrouillés, à ranger ou récupérer un objet dans un conteneur ouvert ou à déverser le contenu d’une fiole. Au prix de l’action Magie à vos tours suivants, vous pouvez de nouveau contrôler ainsi la main. Dans le cadre de cette action, vous pouvez déplacer la main d'un maximum de 9 m. Elle ne peut ni attaquer, ni activer d'objet magique, ni porter plus de 5 kg.<\/p>\n"}, {"nom": "Mains Brûlantes", "ecole": "Évocation", "niveau": 1, "classes": ["Ensorceleur", "Magicien"], "incantation": "action", "portee": "personnelle", "composantes": "V, S", "duree": "instantanée", "pages_source": [303], "description": "Une fine nappe de flammes jaillit de vous. Chaque créature prise dans un Cône de 4,50 m effectue un jet de sauvegarde à em di om  __f Émnge LL. 4 Ml din MS\nGR ON. ne LL. À Fm nn bd ER Ee pris dns 1e Cône féutioent ils ne sont portés par personne.\nEmplacement de niveau supérieur. Les dégâts augmentent le 1d6 par niveau d'emplacement au-delà du 1°. ex er mme e-mcannt (Cac is", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "mains-brulantes", "html_body": "<p>Une fine nappe de flammes jaillit de vous. Chaque créature prise dans un Cône de 4,50 m effectue un jet de sauvegarde à em di om  __f Émnge LL. 4 Ml din MS\nGR ON. ne LL. À Fm nn bd ER Ee pris dns 1e Cône féutioent ils ne sont portés par personne.\nEmplacement de niveau supérieur. Les dégâts augmentent le 1d6 par niveau d'emplacement au-delà du 1°. ex er mme e-mcannt (Cac is<\/p>\n"}, {"nom": "Malédiction", "ecole": "Nécromancie", "niveau": 3, "classes": ["Barde", "Clerc", "Magicien"], "incantation": "action", "portee": "contact", "composantes": "V, S", "duree": "Concentration, jusqu'à 1 minute", "pages_source": [303], "description": "Vous touchez physiquement une créature, qui doit réussir in jet de sauvegarde de Sagesse sous peine d'être maudite\nJour toute la durée. Jusqu'à la fin de la malédiction, la cible subit l’un des effets suivants, à votre convenance :\nChoisissez une caractéristique. La cible a le Désavantage aux tests de caractéristique et jets de sauvegarde associés à cette caractéristique.\nLa cible a le Désavantage aux jets d'attaque contre vous. Au combat, la cible doit réussir un jet de sauvegarde de Sagesse au début de chacun de ses tours sous peine de devoir entreprendre l’action Esquive à ce tour. . Si vous infligez des dégâts à la cible par un jet d'attaque ou un sort, elle subit 1d8 dégâts nécrotiques supplémentaires.\nEmplacement de niveau supérieur. Si vous lancez ce sort Jar un emplacement du 4° niveau, vous pouvez maintenir otre Concentration un maximum de 10 minutes. Avec un mplacement du 5° niveau ou supérieur, le sort ne requiert as de Concentration et la durée passe à 8 heures (5° et >° niveau) ou 24 heures (7 et 8° niveau). Avec un emplacenent du 9° niveau, la durée passe à « jusqu’à dissipation ».", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "malediction", "html_body": "<p>Vous touchez physiquement une créature, qui doit réussir in jet de sauvegarde de Sagesse sous peine d'être maudite\nJour toute la durée. Jusqu'à la fin de la malédiction, la cible subit l’un des effets suivants, à votre convenance :\nChoisissez une caractéristique. La cible a le Désavantage aux tests de caractéristique et jets de sauvegarde associés à cette caractéristique.\nLa cible a le Désavantage aux jets d'attaque contre vous. Au combat, la cible doit réussir un jet de sauvegarde de Sagesse au début de chacun de ses tours sous peine de devoir entreprendre l’action Esquive à ce tour. . Si vous infligez des dégâts à la cible par un jet d'attaque ou un sort, elle subit 1d8 dégâts nécrotiques supplémentaires.\nEmplacement de niveau supérieur. Si vous lancez ce sort Jar un emplacement du 4° niveau, vous pouvez maintenir otre Concentration un maximum de 10 minutes. Avec un mplacement du 5° niveau ou supérieur, le sort ne requiert as de Concentration et la durée passe à 8 heures (5° et &gt;° niveau) ou 24 heures (7 et 8° niveau). Avec un emplacenent du 9° niveau, la durée passe à « jusqu’à dissipation ».<\/p>\n"}, {"nom": "Maléfice", "ecole": "Enchantement", "niveau": 1, "classes": ["Occultiste"], "incantation": "À vérifier", "portee": "À vérifier", "composantes": "V, S, M (un œil pétrifié de triton)", "duree": "Concentration, jusqu’à 1 heure", "pages_source": [303, 304], "description": "Vous maudissez une créature que vous voyez à portée. usqu'’à la fin du sort, vous infligez 1d6 dégâts nécrotiques la cible chaque fois que vous la touchez avec un jet l'attaque. Vous désignez également une caractéristique l'incantation. La cible subit le Désavantage aux tests de aractéristique associés à la caractéristique en question. Si la cible tombe à O point de vie avant la fin du sort, ous pouvez désigner une nouvelle cible à l’un de vos tours uivants, par une action Bonus.\nEmplacement de niveau supérieur. Votre Concentration eut persister plus longtemps avec un emplacement du e niveau (jusqu'à 4 heures), du 3° ou 4° (jusqu’à 8 heures), yu du 5° et supérieur (24 heures).\n\nLe MAGICIEN MORDENKAINEN ACCUEILLE SES CONVIVES DANS LE SANCTUAIRE MAGIQUE DU\nMANOIR SOMPTUEUX DE MORDENKAINEN.", "illustration": null, "legende_illustration": null, "notes_verification": "champ_absent:incantation; champ_absent:portee", "statut": "ocr_non_valide", "id": "malefice", "html_body": "<p>Vous maudissez une créature que vous voyez à portée. usqu'’à la fin du sort, vous infligez 1d6 dégâts nécrotiques la cible chaque fois que vous la touchez avec un jet l'attaque. Vous désignez également une caractéristique l'incantation. La cible subit le Désavantage aux tests de aractéristique associés à la caractéristique en question. Si la cible tombe à O point de vie avant la fin du sort, ous pouvez désigner une nouvelle cible à l’un de vos tours uivants, par une action Bonus.\nEmplacement de niveau supérieur. Votre Concentration eut persister plus longtemps avec un emplacement du e niveau (jusqu'à 4 heures), du 3° ou 4° (jusqu’à 8 heures), yu du 5° et supérieur (24 heures).<\/p>\n<p>Le MAGICIEN MORDENKAINEN ACCUEILLE SES CONVIVES DANS LE SANCTUAIRE MAGIQUE DU\nMANOIR SOMPTUEUX DE MORDENKAINEN.<\/p>\n"}, {"nom": "Manoir Somptueux de Mordenkainen", "ecole": "Invocation", "niveau": 7, "classes": ["Barde", "Magicien"], "incantation": "1 minute", "portee": "90 m", "composantes": "V, S, M (une porte miniature d’une valeur minimale de 15 po)", "duree": "24 heures", "pages_source": [304], "description": "Vous invoquez une porte chatoyante à portée, qui persiste pour toute la durée. La porte, large de 1,50 m et haute de 3 m, ouvre sur une demeure extradimensionnelle. Vous et toute créature que vous désignez à l’incantation du sort pouvez pénétrer dans cette demeure tant que la porte reste ouverte. Vous pouvez l'ouvrir ou la refermer (pas d’action requise) si vous vous trouvez dans un rayon de 9 m d'elle.\nTant qu'elle est fermée, on ne peut pas la percevoir. Par-delà la porte, un magnifique vestibule se dévoile, ouvrant sur de nombreuses pièces. L’atmosphère y est propre, douce et agréable. La configuration des étages est laissée à votre discrétion, mais l’espace total ne peut excéder l'équivalent de 50 Cubes contigus de 3 m. La demeure est meublée et décorée selon vos désirs. Elle renferme suffisamment de nourriture pour servir un banquet composé de neuf plats pour 100 convives. Les meubles et autres objets créés par ce sort se dissipent en fumée si on les soustrait du manoir.\n\n100 serviteurs quasi transparents accueillent les invités. Vous décidez de l'aspect visuel de ces domestiques et de leur livrée. Invulnérables, ils obéissent à vos ordres. Les serviteurs peuvent accomplir toute tâche à la portée d'un humain, mais ils ne peuvent attaquer ni entreprendre d'action qui pourrait nuire directement à une autre créature. Ils peuvent donc aller chercher des objets, nettoyer, réparer, repasser les vêtements, allumer un feu, servir à manger et à boire, etc.\nLes domestiques ne peuvent pas quitter la demeure. Quand le sort prend fin, tous les objets et créatures qui occupent son espace extradimensionnel sont renvoyés dans les espaces inoccupés les plus proches de l'entrée.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "manoir-somptueux-de-mordenkainen", "html_body": "<p>Vous invoquez une porte chatoyante à portée, qui persiste pour toute la durée. La porte, large de 1,50 m et haute de 3 m, ouvre sur une demeure extradimensionnelle. Vous et toute créature que vous désignez à l’incantation du sort pouvez pénétrer dans cette demeure tant que la porte reste ouverte. Vous pouvez l'ouvrir ou la refermer (pas d’action requise) si vous vous trouvez dans un rayon de 9 m d'elle.\nTant qu'elle est fermée, on ne peut pas la percevoir. Par-delà la porte, un magnifique vestibule se dévoile, ouvrant sur de nombreuses pièces. L’atmosphère y est propre, douce et agréable. La configuration des étages est laissée à votre discrétion, mais l’espace total ne peut excéder l'équivalent de 50 Cubes contigus de 3 m. La demeure est meublée et décorée selon vos désirs. Elle renferme suffisamment de nourriture pour servir un banquet composé de neuf plats pour 100 convives. Les meubles et autres objets créés par ce sort se dissipent en fumée si on les soustrait du manoir.<\/p>\n<p>100 serviteurs quasi transparents accueillent les invités. Vous décidez de l'aspect visuel de ces domestiques et de leur livrée. Invulnérables, ils obéissent à vos ordres. Les serviteurs peuvent accomplir toute tâche à la portée d'un humain, mais ils ne peuvent attaquer ni entreprendre d'action qui pourrait nuire directement à une autre créature. Ils peuvent donc aller chercher des objets, nettoyer, réparer, repasser les vêtements, allumer un feu, servir à manger et à boire, etc.\nLes domestiques ne peuvent pas quitter la demeure. Quand le sort prend fin, tous les objets et créatures qui occupent son espace extradimensionnel sont renvoyés dans les espaces inoccupés les plus proches de l'entrée.<\/p>\n"}, {"nom": "Marche sur L'Onde", "ecole": "Transmutation", "niveau": 3, "classes": ["Clerc", "Druide", "Ensorceleur", "Rôdeur"], "incantation": "action ou rituel", "portee": "9 m", "composantes": "V, S, M (un morceau de liège)", "duree": "1 heure", "pages_source": [304, 305], "description": "Ce sort octroie la faculté de se déplacer sur n'importe quelle surface liquide (eau, acide, boue, neige, sables mouvants et même lave) comme s’il s'agissait d'une surface solide ne présentant aucun risque (sur de la lave, les créatures s'exposent tout de même aux dégâts que peut engendrer la chaleur). Un maximum de dix créatures consentantes que vous choisissez à portée reçoivent cette faculté pour toute la durée. : action Bonus s désignez magiquement une créature que vous voyez\nLe à portée comme votre proie. Jusqu'à la fin du sort, vous infligez 1d6 dégâts de force à la cible chaque fois que vous la touchez avec un jet d'attaque. Vous avez aussi l'Avantage __ aux tests de Sagesse (Perception ou Survie) visant à la DE Si la cible tombe à 0 point de vie avant la fin du sort, vous pouvez par une action Bonus déplacer la marque vers une autre créature que vous voyez à portée. -…. Emplacement de niveau supérieur. Votre Concentration re … peut persister plus longtemps avec un emplacement du 3° ou 4° niveau (iusqu'è à 8 heures), ou du 5° et supérieur (24 heures). a", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "marche-sur-l-onde", "html_body": "<p>Ce sort octroie la faculté de se déplacer sur n'importe quelle surface liquide (eau, acide, boue, neige, sables mouvants et même lave) comme s’il s'agissait d'une surface solide ne présentant aucun risque (sur de la lave, les créatures s'exposent tout de même aux dégâts que peut engendrer la chaleur). Un maximum de dix créatures consentantes que vous choisissez à portée reçoivent cette faculté pour toute la durée. : action Bonus s désignez magiquement une créature que vous voyez\nLe à portée comme votre proie. Jusqu'à la fin du sort, vous infligez 1d6 dégâts de force à la cible chaque fois que vous la touchez avec un jet d'attaque. Vous avez aussi l'Avantage __ aux tests de Sagesse (Perception ou Survie) visant à la DE Si la cible tombe à 0 point de vie avant la fin du sort, vous pouvez par une action Bonus déplacer la marque vers une autre créature que vous voyez à portée. -…. Emplacement de niveau supérieur. Votre Concentration re … peut persister plus longtemps avec un emplacement du 3° ou 4° niveau (iusqu'è à 8 heures), ou du 5° et supérieur (24 heures). a<\/p>\n"}, {"nom": "Mauvais Œil", "ecole": "Nécromancie", "niveau": 6, "classes": ["Barde", "Ensorceleur", "Magicien", "Occultiste"], "incantation": "action", "portee": "personnelle", "composantes": "V, S", "duree": "Concentration, jusqu'à 1 minute", "pages_source": [305], "description": "Pour toute la durée, vos yeux sont d’un noir d'encre. Une créature que vous choisissez parmi celles que vous voyez dans un rayon de 18 m doit réussir un jet de sauvegarde de Sagesse pour ne pas être affectée par l'un des effets suivants de votre choix, pour toute la durée. À chacun de vos tours jusqu’à la fin du sort, vous pouvez entreprendre l’action Magie à cibler une autre créature, sans toutefois pouvoir choisir une créature qui a réussi son JS contre cette incantation du sort.\nEndormie. La cible subit l’état Inconscient. Elle reprend conscience si elle subit des dégâts ou si une autre créature consacre une action à la secouer.\nNauséeuse. La cible subit l'état Empoisonné.\nPaniquée. La cible subit l'état Effrayé. Ainsi Effrayée, la cible doit à chacun de ses tours entreprendre l’action Pointe et s'éloigner de vous par le chemin le plus sûr et le plus court. Si la cible atteint un espace distant de plus de 18 m de vous d'où elle ne vous voit plus, cet effet prend fin.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "mauvais-il", "html_body": "<p>Pour toute la durée, vos yeux sont d’un noir d'encre. Une créature que vous choisissez parmi celles que vous voyez dans un rayon de 18 m doit réussir un jet de sauvegarde de Sagesse pour ne pas être affectée par l'un des effets suivants de votre choix, pour toute la durée. À chacun de vos tours jusqu’à la fin du sort, vous pouvez entreprendre l’action Magie à cibler une autre créature, sans toutefois pouvoir choisir une créature qui a réussi son JS contre cette incantation du sort.\nEndormie. La cible subit l’état Inconscient. Elle reprend conscience si elle subit des dégâts ou si une autre créature consacre une action à la secouer.\nNauséeuse. La cible subit l'état Empoisonné.\nPaniquée. La cible subit l'état Effrayé. Ainsi Effrayée, la cible doit à chacun de ses tours entreprendre l’action Pointe et s'éloigner de vous par le chemin le plus sûr et le plus court. Si la cible atteint un espace distant de plus de 18 m de vous d'où elle ne vous voit plus, cet effet prend fin.<\/p>\n"}, {"nom": "Message", "ecole": "Transmutation", "niveau": 0, "classes": ["Barde", "Druide", "Ensorceleur", "Magicien"], "incantation": "action", "portee": "36 m", "composantes": "S, M (du fil de cuivre)", "duree": "1 round", "pages_source": [305], "description": "Vous pointez le doigt vers une créature à portée et murmurez un message. La cible (et seulement elle) entend votre message et peut y répondre par un murmure audible de votre seule personne. Vous pouvez lancer ce sort à travers des objets solides si vous connaissez la cible et savez qu'elle se trouve derrière ces obstacles. Le silence magique, 30 cm de pierre, de métal ou de bois, ou une simple feuille de plomb suffisent à bloquer le sort.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "message", "html_body": "<p>Vous pointez le doigt vers une créature à portée et murmurez un message. La cible (et seulement elle) entend votre message et peut y répondre par un murmure audible de votre seule personne. Vous pouvez lancer ce sort à travers des objets solides si vous connaissez la cible et savez qu'elle se trouve derrière ces obstacles. Le silence magique, 30 cm de pierre, de métal ou de bois, ou une simple feuille de plomb suffisent à bloquer le sort.<\/p>\n"}, {"nom": "Messager Animal", "ecole": "Enchantement", "niveau": 2, "classes": ["Barde", "Druide", "Rôdeur"], "incantation": "action ou rituel", "portee": "9 m", "composantes": "V, S, M (un peu de nourriture)", "duree": "24 heures", "pages_source": [305], "description": "La Bête de taille TP de votre choix parmi celles que vous voyez à portée doit réussir un jet de sauvegarde de Charisme, sans quoi elle s'efforce de livrer le message que vous lui confiez (si son facteur de puissance n’est pas O, elle réussit automatiquement). Vous spécifiez un lieu que vous avez déjà visité et un destinataire qui correspond à une description générale, tel que « une personne vêtue de l'uniforme du guet » ou « un nain roux coiffé d’un chapeau pointu. » Vous lui communiquez de plus un message limité à vingt-cinq mots. La Bête voyage vers le lieu spécifié tant que le sort est actif, ce qui lui permet de parcourir 75 km en 24 heures dans le cas d’un animal volant, 37,5 km sinon. Quand la Bête arrive à destination, elle livre votre message à la créature décrite, en imitant votre manière de communiquer. Si elle ne parvient pas à destination avant la fin du sort, le message est perdu et la Bête revient à l'endroit de l'incantation.\nEmplacement de niveau supérieur. La durée augmente de 48 heures par niveau d'emplacement au-delà du 2°.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "messager-animal", "html_body": "<p>La Bête de taille TP de votre choix parmi celles que vous voyez à portée doit réussir un jet de sauvegarde de Charisme, sans quoi elle s'efforce de livrer le message que vous lui confiez (si son facteur de puissance n’est pas O, elle réussit automatiquement). Vous spécifiez un lieu que vous avez déjà visité et un destinataire qui correspond à une description générale, tel que « une personne vêtue de l'uniforme du guet » ou « un nain roux coiffé d’un chapeau pointu. » Vous lui communiquez de plus un message limité à vingt-cinq mots. La Bête voyage vers le lieu spécifié tant que le sort est actif, ce qui lui permet de parcourir 75 km en 24 heures dans le cas d’un animal volant, 37,5 km sinon. Quand la Bête arrive à destination, elle livre votre message à la créature décrite, en imitant votre manière de communiquer. Si elle ne parvient pas à destination avant la fin du sort, le message est perdu et la Bête revient à l'endroit de l'incantation.\nEmplacement de niveau supérieur. La durée augmente de 48 heures par niveau d'emplacement au-delà du 2°.<\/p>\n"}, {"nom": "Métal Brülant", "ecole": "Transmutation", "niveau": 2, "classes": ["Barde", "Druide"], "incantation": "action", "portee": "18 m", "composantes": "V, S, M (un bout de fer et une flamme)", "duree": "Concentration, jusqu'à 1 minute", "pages_source": [305, 306], "description": "Choisissez un objet manufacturé en métal, tel qu'une arme, ou une armure métallique intermédiaire ou lourde, que vous voyez à portée. Vous faites chauffer l’objet au rouge CHAPITRE 7 | SORTS 4 30% pp C 2 a où Didi Re PP El Une créature qui thé en NES SE | subit les dégâts correspondants doit réussir un jet rh vf garde de Constitution sous peine de lâcher l'objet (si elle en a la possibilité). Si elle ne peut pas le lâcher, elle a le Désavantage à ses jets d'attaque et tests de caractéristique jusqu’au début de votre tour suivant.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d8 par niveau d'emplacement au-delà du 2°. . TT CT Ne", "illustration": null, "legende_illustration": null, "notes_verification": "symboles_suspects", "statut": "ocr_non_valide", "id": "metal-brulant", "html_body": "<p>Choisissez un objet manufacturé en métal, tel qu'une arme, ou une armure métallique intermédiaire ou lourde, que vous voyez à portée. Vous faites chauffer l’objet au rouge CHAPITRE 7 | SORTS 4 30% pp C 2 a où Didi Re PP El Une créature qui thé en NES SE | subit les dégâts correspondants doit réussir un jet rh vf garde de Constitution sous peine de lâcher l'objet (si elle en a la possibilité). Si elle ne peut pas le lâcher, elle a le Désavantage à ses jets d'attaque et tests de caractéristique jusqu’au début de votre tour suivant.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d8 par niveau d'emplacement au-delà du 2°. . TT CT Ne<\/p>\n"}, {"nom": "Métamorphose", "ecole": "Transmutation", "niveau": 4, "classes": ["Barde", "Druide", "Ensorceleur", "Magicien"], "incantation": "action", "portee": "18 m", "composantes": "V, S, M (une chrysalide)", "duree": "Concentration, jusqu’à 1 heure", "pages_source": [306], "description": "Vous tentez de transformer en Bête une créature que vous voyez à portée. La cible doit réussir un jet de sauvegarde de Sagesse sous peine d’être métamorphosée en Bête pour toute la durée. Cette forme est une Bête de votre choix dont le facteur de puissance est inférieur ou égal à celui de la cible (ou à son niveau, si elle n’a pas de facteur de puissance). Le profil de la cible est remplacé par celui de la Bête retenue, si ce n'est que la cible conserve son alignement, sa personnalité, son type de créature, ses points de vie et ses dés de vie.\nL'annexe B propose un échantillon de profils de Bêtes. La cible reçoit autant de points de vie temporaires que les points de vie de sa forme de Bête. Le sort prend fin prématurément sur la cible s’il ne lui reste plus de points de vie temporaires. S'il reste de ces pv temporaires à la cible quand le sort prend fin, ils disparaissent. La cible est limitée dans les actions qu’elle peut entreprendre par l'anatomie de sa nouvelle forme, et elle ne peut ni parler ni lancer de sorts. L'équipement porté par la cible se fond dans sa nouvelle forme. La créature ne peut pas utiliser son équipement ni en bénéficier de quelque manière que ce soit. Rene", "illustration": null, "legende_illustration": null, "notes_verification": "encadre_statistiques_a_controler", "statut": "ocr_non_valide", "id": "metamorphose", "html_body": "<p>Vous tentez de transformer en Bête une créature que vous voyez à portée. La cible doit réussir un jet de sauvegarde de Sagesse sous peine d’être métamorphosée en Bête pour toute la durée. Cette forme est une Bête de votre choix dont le facteur de puissance est inférieur ou égal à celui de la cible (ou à son niveau, si elle n’a pas de facteur de puissance). Le profil de la cible est remplacé par celui de la Bête retenue, si ce n'est que la cible conserve son alignement, sa personnalité, son type de créature, ses points de vie et ses dés de vie.\nL'annexe B propose un échantillon de profils de Bêtes. La cible reçoit autant de points de vie temporaires que les points de vie de sa forme de Bête. Le sort prend fin prématurément sur la cible s’il ne lui reste plus de points de vie temporaires. S'il reste de ces pv temporaires à la cible quand le sort prend fin, ils disparaissent. La cible est limitée dans les actions qu’elle peut entreprendre par l'anatomie de sa nouvelle forme, et elle ne peut ni parler ni lancer de sorts. L'équipement porté par la cible se fond dans sa nouvelle forme. La créature ne peut pas utiliser son équipement ni en bénéficier de quelque manière que ce soit. Rene<\/p>\n"}, {"nom": "Métamorphose Animale", "ecole": "Transmutation", "niveau": 8, "classes": ["Druide"], "incantation": "action", "portee": "9 m", "composantes": "V, S", "duree": "24 heures", "pages_source": [306], "description": "Choisissez autant de créatures consentantes que vous souhaitez, parmi celles que vous voyez à portée. Chaque cible se transforme en Bête de taille G ou inférieure de votre choix, dont le facteur de puissance ne dépasse pas 4. Vous\n* : : . Aux tours suivants, vous pouvez entreprendre l’action\nMagie pour de nouveau transformer les cibles. Le profil de jeu de chaque cible est remplacé par celui de la Bête choisie, à l'exception de son type de créature, de ses points de vie et dés de vie, de sa faculté de communication, de son alignement et de ses valeurs d’Intelligence, Sagesse et Charisme, qui restent les siens. Les actions de la cible sont limitées par l'anatomie de la Bête retenue et elle ne peut pas lancer de sorts. L'équipement porté par la cible se fond dans sa nouvelle forme, sachant qu’elle ne peut pas recourir à cet équipement tant qu'elle reste sous cette forme. La cible reçoit autant de points de vie temporaires que les points de vie de la première forme adoptée. S'il reste de ces pv temporaires à la cible quand le sort prend fin, ils disparaissent. La transformation persiste pour toute la durée, sauf si la cible y met prématurément un terme par une action Bonus.", "illustration": null, "legende_illustration": null, "notes_verification": "encadre_statistiques_a_controler", "statut": "ocr_non_valide", "id": "metamorphose-animale", "html_body": "<p>Choisissez autant de créatures consentantes que vous souhaitez, parmi celles que vous voyez à portée. Chaque cible se transforme en Bête de taille G ou inférieure de votre choix, dont le facteur de puissance ne dépasse pas 4. Vous<\/p>\n<ul>\n<li>: : . Aux tours suivants, vous pouvez entreprendre l’action\nMagie pour de nouveau transformer les cibles. Le profil de jeu de chaque cible est remplacé par celui de la Bête choisie, à l'exception de son type de créature, de ses points de vie et dés de vie, de sa faculté de communication, de son alignement et de ses valeurs d’Intelligence, Sagesse et Charisme, qui restent les siens. Les actions de la cible sont limitées par l'anatomie de la Bête retenue et elle ne peut pas lancer de sorts. L'équipement porté par la cible se fond dans sa nouvelle forme, sachant qu’elle ne peut pas recourir à cet équipement tant qu'elle reste sous cette forme. La cible reçoit autant de points de vie temporaires que les points de vie de la première forme adoptée. S'il reste de ces pv temporaires à la cible quand le sort prend fin, ils disparaissent. La transformation persiste pour toute la durée, sauf si la cible y met prématurément un terme par une action Bonus.<\/li>\n<\/ul>\n"}, {"nom": "Métamorphose Suprême", "ecole": "Transmutation", "niveau": 9, "classes": ["Barde", "Magicien", "Occultiste"], "incantation": "action", "portee": "9 m", "composantes": "V, S, M (une goutte de mercure, un bon morceau de gomme arabique et une volute de fumée)", "duree": "Concentration, jusqu'à 1 heure", "pages_source": [306, 307], "description": "Choisissez une créature ou un objet non magique que vous voyez à portée. La créature se métamorphose en une autre créature ou en objet non magique, ou l'objet se transforme en créature (sachant qu'il ne peut pas au départ être porté par une autre créature). La transformation persiste pour toute la durée, sauf si la cible meurt ou est détruite. Toutefois, si vous maintenez votre Concentration pour la totalité de la durée du sort, celui-ci persiste jusqu’à dissipation. Une créature non consentante peut effectuer un jet de sauvegarde de Sagesse. En cas de réussite, elle n’est pas affectée par le sort.\nCréature en créature. Si vous transformez une créature en autre sorte de créature, vous choisissez sa nouvelle forme à votre guise, mais le facteur de puissance de celle-ci ne doit pas dépasser celui de la cible (ou son niveau). Le profil de la cible est remplacé par celui de la nouvelle forme, si ce n'est qu'elle conserve ses points de vie, ses dés de vie, son alignement et sa personnalité. La cible reçoit autant de points de vie temporaires que les points de vie de la nouvelle forme. S'il reste de ces pv temporaires à la cible quand le sort prend fin, ils disparaissent. La cible est limitée dans les actions qu'elle peut entreprendre par l'anatomie de sa nouvelle forme, et elle ne peut ni parler ni lancer de sorts. L'équipement porté par la cible se fond dans sa nouvelle forme. La créature ne peut pas utiliser son équipement ni en bénéficier de quelque manière que ce soit.\nObjet en créature. Vous pouvez transformer un objet en la créature de votre choix, à condition que la catégorie de taille de celle-ci ne dépasse pas celle de l'objet et que son facteur de puissance n'excède pas 9. La créature est Amicale envers vous et vos compagnons. Au combat, elle joue ses tours juste après les vôtres et se soumet à vos instructions. metro égard selon la manière dont vous l'avez traitée.\nCréature en objet. Si vous transformez une créature en objet, elle adopte sa nouvelle forme en fusionnant avec tout ce qu'elle porte, à condition que la taille de l’objet n'excède pas celle de la créature. Le profil de la créature devient celui de l'objet et la créature ne garde a posteriori (si le sort prend fin et qu'elle retrouve sa forme normale) aucun souvenir du temps passé sous cette forme.", "illustration": null, "legende_illustration": null, "notes_verification": "encadre_statistiques_a_controler", "statut": "ocr_non_valide", "id": "metamorphose-supreme", "html_body": "<p>Choisissez une créature ou un objet non magique que vous voyez à portée. La créature se métamorphose en une autre créature ou en objet non magique, ou l'objet se transforme en créature (sachant qu'il ne peut pas au départ être porté par une autre créature). La transformation persiste pour toute la durée, sauf si la cible meurt ou est détruite. Toutefois, si vous maintenez votre Concentration pour la totalité de la durée du sort, celui-ci persiste jusqu’à dissipation. Une créature non consentante peut effectuer un jet de sauvegarde de Sagesse. En cas de réussite, elle n’est pas affectée par le sort.\n

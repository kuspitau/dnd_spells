spect des créatures que vous choisissez parmi celles que vous voyez à portée. Une créature non consentante peut effectuer un jet de sauvegarde de Charisme. En cas de réussite, elle n'est pas affectée par le sort. Vous pouvez donner le même aspect à chaque cible ou varier les illusions. Le sort altère l'aspect du corps des cibles comme de leur équipement. Vous pouvez aussi les faire paraître plus grandes ou plus petites, individuellement, rrence de 30 cm, et les faire passer pour plus lourdes res. Le nouvel aspect de chaque cible doit préconfiguration de membres que la sienne, sauvegarde de tie ue TON TT<\/p>\n"}, {"nom": "Bouclier de la Foi", "ecole": "Abjuration", "niveau": 1, "classes": ["Clerc", "Paladin"], "incantation": "action Bonus", "portee": "18 m", "composantes": "V, S, M (un parchemin de prière)", "duree": "Concentration, jusqu'à 10 minutes", "pages_source": [250], "description": "Un champ scintillant enveloppe une créature de votre choix à portée et lui octroie un bonus de +2 à la CA pour toute la durée. RS Re", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "bouclier-de-la-foi", "html_body": "<p>Un champ scintillant enveloppe une créature de votre choix à portée et lui octroie un bonus de +2 à la CA pour toute la durée. RS Re<\/p>\n"}, {"nom": "Bouffée de Poison", "ecole": "Nécromancie", "niveau": 0, "classes": ["Druide", "Ensorceleur", "Magicien", "Occultiste"], "incantation": "action", "portee": "9 m", "composantes": "V, S", "duree": "instantanée", "pages_source": [250], "description": "Vous projetez une brume toxique vers une créature à portée.\nEffectuez une attaque de sort à distance contre la cible.\nSi l'attaque touche, la cible subit 1d12 dégâts de poison.\nAmélioration de sort mineur. Les dégâts augmentent de 1d12 lorsque vous atteignez les niveaux 5 (2d12), 11 (3d12) et 17 (4d12).", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "bouffee-de-poison", "html_body": "<p>Vous projetez une brume toxique vers une créature à portée.\nEffectuez une attaque de sort à distance contre la cible.\nSi l'attaque touche, la cible subit 1d12 dégâts de poison.\nAmélioration de sort mineur. Les dégâts augmentent de 1d12 lorsque vous atteignez les niveaux 5 (2d12), 11 (3d12) et 17 (4d12).<\/p>\n"}, {"nom": "Boule de Feu", "ecole": "Évocation", "niveau": 3, "classes": ["Ensorceleur", "Magicien"], "incantation": "action", "portee": "45 m", "composantes": "V, S, M (une boulette de guano de chauve- souris et de soufre)", "duree": "instantanée", "pages_source": [250], "description": "Une zébrure éblouissante jaillit de vous jusqu’au point que vous choisissez à portée, produisant une déflagration au grondement sourd. Chaque créature prise dans la Sphère de 6 m de rayon centrée sur ce point d'origine effectue un jet de sauvegarde de Dextérité et subit 8d6 dégâts de feu en cas d'échec, la moitié en cas de réussite. L'explosion embrase les objets inflammables de la zone qui ne sont portés par personne.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d6 par niveau d'emplacement au-delà du 3°. —————— ç@——", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "boule-de-feu", "html_body": "<p>Une zébrure éblouissante jaillit de vous jusqu’au point que vous choisissez à portée, produisant une déflagration au grondement sourd. Chaque créature prise dans la Sphère de 6 m de rayon centrée sur ce point d'origine effectue un jet de sauvegarde de Dextérité et subit 8d6 dégâts de feu en cas d'échec, la moitié en cas de réussite. L'explosion embrase les objets inflammables de la zone qui ne sont portés par personne.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d6 par niveau d'emplacement au-delà du 3°. —————— ç@——<\/p>\n"}, {"nom": "Boule de Feu à Retardement", "ecole": "Évocation", "niveau": 7, "classes": ["Ensorceleur", "Magicien"], "incantation": "action", "portee": "45 m", "composantes": "V, S, M une boue de uan de chauve. \" Eh 2 ge de 6 m de rayon centrée sur ce poibt effeCt it sauvegarde de Dextérité. Elle subit des dégâts de feu égaux aux dégâts accumulés en cas d'échec, la moitié en cas de réussite. Les dégâts de base du sort sont de 12d6 et les dégâts augmentent de 1d6 chaque fois que votre tour prend fin tandis que le sort persiste. Si une créature touche physiquement la bille avant la fin de l'intervalle, elle effectue un jet de sauvegarde de Dex- térité. En cas d'échec, le sort prend fin et la bille explose. En cas de réussite, la créature peut projeter la bille d'un maximum de 12 m. Si la bille pénètre dans l'espace d'une créature ou heurte un objet solide, le sort prend fin et la bille explose. Quand la bille explose, les objets inflammables pris dans la déflagration s'embrasent s'ils ne sont portés par personne. Emplacement de niveau supérieur. Les dégâts de base augmentent de 1d6 par niveau d'emplacement au-delà du 7°. ere", "duree": "À vérifier", "pages_source": [250], "description": "maximum de 12 m. Si la bille pénètre dans l'espace d'une créature ou heurte un objet solide, le sort prend fin et la bille explose. Quand la bille explose, les objets inflammables pris dans la déflagration s'embrasent s'ils ne sont portés par personne.\nEmplacement de niveau supérieur. Les dégâts de base augmentent de 1d6 par niveau d'emplacement au-delà du 7°. ere", "illustration": null, "legende_illustration": null, "notes_verification": "champ_absent:duree", "statut": "ocr_non_valide", "id": "boule-de-feu-a-retardement", "html_body": "<p>maximum de 12 m. Si la bille pénètre dans l'espace d'une créature ou heurte un objet solide, le sort prend fin et la bille explose. Quand la bille explose, les objets inflammables pris dans la déflagration s'embrasent s'ils ne sont portés par personne.\nEmplacement de niveau supérieur. Les dégâts de base augmentent de 1d6 par niveau d'emplacement au-delà du 7°. ere<\/p>\n"}, {"nom": "Bourrasque", "ecole": "Évocation", "niveau": 2, "classes": ["Druide", "Ensorceleur", "Magicien", "Rôdeur"], "incantation": "action", "portee": "personnelle", "composantes": "V, S, M (une graine de légumineuse)", "duree": "Concentration, jusqu’à 1 minute", "pages_source": [250], "description": "Une Ligne de vent fort longue de 18 m et large de 3 m souffle depuis vous dans la direction de votre choix pour toute la durée. Toute créature prise dans la Ligne doit réussir un jet de sauvegarde de Force sous peine d’être repoussée de 4,50 m de vous selon la direction de la Ligne. Une créature qui termine son tour dans la Ligne est soumise au même JS. Toute créature prise dans la Ligne qui se déplace vers vous doit consacrer le double du déplacement normal pour toute distance parcourue. La bourrasque disperse les gaz et vapeurs, éteint les bougies et autres flammes exposées de la zone. Les flammes protégées, comme celles des lanternes, vacillent vigoureusement avec un risque de 50 % de s'éteindre. Par une action Bonus à vos tours suivants, vous pouvez changer la direction dans laquelle la Ligne jaillit de vous.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "bourrasque", "html_body": "<p>Une Ligne de vent fort longue de 18 m et large de 3 m souffle depuis vous dans la direction de votre choix pour toute la durée. Toute créature prise dans la Ligne doit réussir un jet de sauvegarde de Force sous peine d’être repoussée de 4,50 m de vous selon la direction de la Ligne. Une créature qui termine son tour dans la Ligne est soumise au même JS. Toute créature prise dans la Ligne qui se déplace vers vous doit consacrer le double du déplacement normal pour toute distance parcourue. La bourrasque disperse les gaz et vapeurs, éteint les bougies et autres flammes exposées de la zone. Les flammes protégées, comme celles des lanternes, vacillent vigoureusement avec un risque de 50 % de s'éteindre. Par une action Bonus à vos tours suivants, vous pouvez changer la direction dans laquelle la Ligne jaillit de vous.<\/p>\n"}, {"nom": "Brume Mortelle", "ecole": "Invocation", "niveau": 5, "classes": ["Ensorceleur", "Magicien"], "incantation": "action", "portee": "36 m", "composantes": "V, S", "duree": "Concentration, jusqu’à 10 minutes", "pages_source": [250, 251], "description": "Vous créez une Sphère de 6 m de rayon constituée de brouillard d'un jaune verdâtre, centrée sur un point à portée. La brume persiste pour toute la durée, à moins qu'un vent fort (comme celui engendré par bourrasque) la disperse et mette fin au sort. Sa zone présente une Visibilité nulle. ge pps dans son espace, ou qui pénètre Mi re bu y traine son tour est également soumise à ce JS. Une même créature n'effectue en aucun cas ce JS plus d'une fois par tour. La Sphère s'éloigne de vous de 3 m au début de chacun de vos tours.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d8 par niveau d'emplacement au-delà du 5°.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "brume-mortelle", "html_body": "<p>Vous créez une Sphère de 6 m de rayon constituée de brouillard d'un jaune verdâtre, centrée sur un point à portée. La brume persiste pour toute la durée, à moins qu'un vent fort (comme celui engendré par bourrasque) la disperse et mette fin au sort. Sa zone présente une Visibilité nulle. ge pps dans son espace, ou qui pénètre Mi re bu y traine son tour est également soumise à ce JS. Une même créature n'effectue en aucun cas ce JS plus d'une fois par tour. La Sphère s'éloigne de vous de 3 m au début de chacun de vos tours.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d8 par niveau d'emplacement au-delà du 5°.<\/p>\n"}, {"nom": "Cage de Force", "ecole": "Évocation", "niveau": 7, "classes": ["Barde", "Magicien", "Occultiste"], "incantation": "action", "portee": "30 m", "composantes": "V, S, M (poudre de rubis d'une valeur minimale de 1 500 po, que le sort détruit)", "duree": "Concentration, jusqu’à 1 heure", "pages_source": [251], "description": "Une prison cubique, immobile et Invisible de force magique se matérialise autour d'une zone que vous choisissez à portée. Il peut s'agir d'une cage ou d'une cellule aux parois pleines, à votre convenance. Une prison qui se présente comme une cage peut atteindre 6 m par côté. Elle se compose de barreaux de 1,25 cm de diamètre, espacés d'autant. Une prison aux parois pleines peut atteindre 3 m par côté. Ses parois empêchent toute matière d'y pénétrer et bloquent tout sort qui tenterait de les franchir dans un sens ou dans l’autre. À l'incantation du sort, toute créature entièrement comprise dans la zone de la prison s'y retrouve bloquée. Les créatures partiellement comprises dans la zone, ou trop grandes pour y loger, sont écartées du centre de la prison jusqu’à se retrouver entièrement en dehors. Une créature bloquée dans la prison ne peut en sortir par des moyens non magiques. Si un détenu tente de recourir à la téléportation ou au voyage interplanaire pour s'évader, il effectue d'abord un jet de sauvegarde de Charisme. En cas de réussite, la créature peut se servir de cette magie pour quitter la prison. En cas d'échec, elle ne sort pas de la zone et gaspille l’utilisation du sort ou de l'effet correspondant. La cage de force s'étend en outre dans le Plan Éthéré, ce qui empêche le voyage éthéré.\nDissipation de la magie ne permet pas de dissiper ce sort.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "cage-de-force", "html_body": "<p>Une prison cubique, immobile et Invisible de force magique se matérialise autour d'une zone que vous choisissez à portée. Il peut s'agir d'une cage ou d'une cellule aux parois pleines, à votre convenance. Une prison qui se présente comme une cage peut atteindre 6 m par côté. Elle se compose de barreaux de 1,25 cm de diamètre, espacés d'autant. Une prison aux parois pleines peut atteindre 3 m par côté. Ses parois empêchent toute matière d'y pénétrer et bloquent tout sort qui tenterait de les franchir dans un sens ou dans l’autre. À l'incantation du sort, toute créature entièrement comprise dans la zone de la prison s'y retrouve bloquée. Les créatures partiellement comprises dans la zone, ou trop grandes pour y loger, sont écartées du centre de la prison jusqu’à se retrouver entièrement en dehors. Une créature bloquée dans la prison ne peut en sortir par des moyens non magiques. Si un détenu tente de recourir à la téléportation ou au voyage interplanaire pour s'évader, il effectue d'abord un jet de sauvegarde de Charisme. En cas de réussite, la créature peut se servir de cette magie pour quitter la prison. En cas d'échec, elle ne sort pas de la zone et gaspille l’utilisation du sort ou de l'effet correspondant. La cage de force s'étend en outre dans le Plan Éthéré, ce qui empêche le voyage éthéré.\nDissipation de la magie ne permet pas de dissiper ce sort.<\/p>\n"}, {"nom": "Caresse du Vampire", "ecole": "Nécromancie", "niveau": 3, "classes": ["Ensorceleur", "Magicien", "Occultiste"], "incantation": "action", "portee": "personnelle", "composantes": "V, S", "duree": "Concentration, jusqu'à 1 minute", "pages_source": [251], "description": "Le contact de votre main nimbée d'ombres siphonne l’énergie vitale d'autrui pour refermer vos plaies. Effectuez une attaque de sort au corps à corps contre une créature à portée d’allonge. Si l'attaque touche, la cible subit 3d6 dégâts Le rh he de points de vie que s nécrotiques ir", "illustration": null, "legende_illustration": null, "notes_verification": "encadre_statistiques_a_controler", "statut": "ocr_non_valide", "id": "caresse-du-vampire", "html_body": "<p>Le contact de votre main nimbée d'ombres siphonne l’énergie vitale d'autrui pour refermer vos plaies. Effectuez une attaque de sort au corps à corps contre une créature à portée d’allonge. Si l'attaque touche, la cible subit 3d6 dégâts Le rh he de points de vie que s nécrotiques ir<\/p>\n"}, {"nom": "Cécité/Surdité", "ecole": "Transmutation", "niveau": 2, "classes": ["Barde", "Clerc", "Ensorceleur", "Magicien"], "incantation": "action", "portee": "36 m", "composantes": "V", "duree": "1 minute", "pages_source": [251], "description": "Une créature que vous voyez à portée doit réussir un jet de sauvegarde de Constitution, sous peine de subir l'état\nAssourdi ou Aveuglé (vous choisissez) pour toute la durée. La cible réitère le JS à la fin de chacun de ses tours et met un terme au sort sur elle-même en cas de réussite.\nEmplacement de niveau supérieur. Vous pouvez cibler une créature supplémentaire par niveau d'emplacement au-delà du 2°. ere", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "cecite-surdite", "html_body": "<p>Une créature que vous voyez à portée doit réussir un jet de sauvegarde de Constitution, sous peine de subir l'état\nAssourdi ou Aveuglé (vous choisissez) pour toute la durée. La cible réitère le JS à la fin de chacun de ses tours et met un terme au sort sur elle-même en cas de réussite.\nEmplacement de niveau supérieur. Vous pouvez cibler une créature supplémentaire par niveau d'emplacement au-delà du 2°. ere<\/p>\n"}, {"nom": "Cercle Magique", "ecole": "Abjuration", "niveau": 3, "classes": ["Clerc", "Magicien", "Occultiste", "Paladin"], "incantation": "1 minute", "portee": "3 m", "composantes": "V, S, M (poudre d'argent et sel d’une valeur minimale de 100 po, que le sort détruit)", "duree": "1 heure", "pages_source": [251], "description": "Vous créez un Cylindre d'énergies magiques, de 3 m de rayon et 6 m de haut, centré sur un point du sol que vous voyez à portée. Des runes luisantes apparaissent sur toute surface comprise dans le Cylindre, y compris le sol. Choisissez un ou plusieurs types parmi les suivants :\nCélestes, Élémentaires, Fées, Fiélons et Morts-vivants. Le cercle affecte les créatures du ou des types retenus des façons suivantes :\n+ La créature ne peut pénétrer dans le Cylindre de son plein gré sans recourir à des moyens magiques. Si la créature recourt à la téléportation ou au voyage interplanaire pour ce faire, elle doit d’abord réussir un jet de sauvegarde de Charisme. La créature a le Désavantage aux jets d'attaque contre les cibles situées dans le Cylindre.\n- La créature ne peut pas posséder une cible comprise dans le Cylindre ni lui imposer l'état Charmé ou Effrayé. À chaque incantation du sort, vous pouvez inverser l'orientation de sa magie, c'est-à-dire en empêchant toute | tur se ou des types retenus de quitter le Cylindre et égeant les cibles qui se trouvent à l'extérieur. de niveau supérieur. La durée augmente", "illustration": null, "legende_illustration": null, "notes_verification": "symboles_suspects", "statut": "ocr_non_valide", "id": "cercle-magique", "html_body": "<p>Vous créez un Cylindre d'énergies magiques, de 3 m de rayon et 6 m de haut, centré sur un point du sol que vous voyez à portée. Des runes luisantes apparaissent sur toute surface comprise dans le Cylindre, y compris le sol. Choisissez un ou plusieurs types parmi les suivants :\nCélestes, Élémentaires, Fées, Fiélons et Morts-vivants. Le cercle affecte les créatures du ou des types retenus des façons suivantes :<\/p>\n<ul>\n<li>La créature ne peut pénétrer dans le Cylindre de son plein gré sans recourir à des moyens magiques. Si la créature recourt à la téléportation ou au voyage interplanaire pour ce faire, elle doit d’abord réussir un jet de sauvegarde de Charisme. La créature a le Désavantage aux jets d'attaque contre les cibles situées dans le Cylindre.<\/li>\n<\/ul>\n<ul>\n<li>La créature ne peut pas posséder une cible comprise dans le Cylindre ni lui imposer l'état Charmé ou Effrayé. À chaque incantation du sort, vous pouvez inverser l'orientation de sa magie, c'est-à-dire en empêchant toute | tur se ou des types retenus de quitter le Cylindre et égeant les cibles qui se trouvent à l'extérieur. de niveau supérieur. La durée augmente<\/li>\n<\/ul>\n"}, {"nom": "Cercle de Mort", "ecole": "Nécromancie", "niveau": 6, "classes": ["Ensorceleur", "Magicien", "Occultiste"], "incantation": "action", "portee": "45 m", "composantes": "V, 5, M (uen dune valeur de 500 po réduite en poudre) +6 A", "duree": "instantanée", "pages_source": [252], "description": "Des ondes d'énergie négative rayonnent sous forme d'une Sphère de 18 m de rayon centrée sur un point que vous choisissez à portée. Chaque créature prise dans la zone effectue un jet de sauvegarde de Constitution et subit 8d8 dégâts nécrotiques en cas d'échec, la moitié en cas de réussite.\nEmplacement de niveau supérieur. Les dégâts augmentent de 2d8 par niveau d'emplacement au-delà du 6°.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "cercle-de-mort", "html_body": "<p>Des ondes d'énergie négative rayonnent sous forme d'une Sphère de 18 m de rayon centrée sur un point que vous choisissez à portée. Chaque créature prise dans la zone effectue un jet de sauvegarde de Constitution et subit 8d8 dégâts nécrotiques en cas d'échec, la moitié en cas de réussite.\nEmplacement de niveau supérieur. Les dégâts augmentent de 2d8 par niveau d'emplacement au-delà du 6°.<\/p>\n"}, {"nom": "Cercle de Pouvoir", "ecole": "Abjuration", "niveau": 5, "classes": ["Clerc", "Magicien", "Paladin"], "incantation": "action", "portee": "personnelle", "composantes": "V", "duree": "Concentration, jusqu’à 10 minutes", "pages_source": [252], "description": "Une aura rayonne depuis vous pour toute la durée, sous forme d'une Émanation de 9 m. Toute créature alliée comprise dans l'aura (y compris vous) a l'Avantage aux jets de sauvegarde contre les sorts et autres effets magiques. Lorsqu'une telle créature réussit un jet de sauvegarde contre un sort ou effet magique lui permettant de réduire les dégâts de moitié en cas de sauvegarde réussie, elle ne subit en fait aucun dégât si elle réussit son JS.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "cercle-de-pouvoir", "html_body": "<p>Une aura rayonne depuis vous pour toute la durée, sous forme d'une Émanation de 9 m. Toute créature alliée comprise dans l'aura (y compris vous) a l'Avantage aux jets de sauvegarde contre les sorts et autres effets magiques. Lorsqu'une telle créature réussit un jet de sauvegarde contre un sort ou effet magique lui permettant de réduire les dégâts de moitié en cas de sauvegarde réussie, elle ne subit en fait aucun dégât si elle réussit son JS.<\/p>\n"}, {"nom": "Cercle de Téléportation", "ecole": "Invocation", "niveau": 5, "classes": ["Barde", "Ensorceleur", "Magicien", "Occultiste"], "incantation": "| minute", "portee": "3 m", "composantes": "V, M (encres rares d'une valeur minimale de 50 po, que le sort détruit)", "duree": "1 round", "pages_source": [252], "description": "À l'incantation du sort, vous tracez un cercle de 1,50 m de diamètre au sol, composé de symboles qui relient votre emplacement à un cercle de téléportation permanent de votre choix dont vous connaissez la séquence de runes et situé sur le même plan d'existence que vous. Un portail chatoyant s'ouvre au sein du cercle ainsi tracé et reste ouvert jusqu’à la fin de votre tour suivant. Toute créature qui pénètre dans le portail apparaît aussitôt dans un rayon de 1,50 m du cercle de destination ou, si cet espace n'est pas libre, dans l'espace inoccupé le plus proche. De nombreux temples et guildes importants disposent d'un cercle de téléportation permanent dans leurs locaux. Chaque cercle comprend toujours sa propre séquence de runes, une suite de symboles à l'agencement unique. tinations du “rh Matériel, dé y ajouterez éventuellement d aventures. Graver une pere votre mémoire nécessite de l'étu Vous pouvez créer un cercle de té : en lançant quotidiennement ce sort au même pendant 365 jours.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "cercle-de-teleportation", "html_body": "<p>À l'incantation du sort, vous tracez un cercle de 1,50 m de diamètre au sol, composé de symboles qui relient votre emplacement à un cercle de téléportation permanent de votre choix dont vous connaissez la séquence de runes et situé sur le même plan d'existence que vous. Un portail chatoyant s'ouvre au sein du cercle ainsi tracé et reste ouvert jusqu’à la fin de votre tour suivant. Toute créature qui pénètre dans le portail apparaît aussitôt dans un rayon de 1,50 m du cercle de destination ou, si cet espace n'est pas libre, dans l'espace inoccupé le plus proche. De nombreux temples et guildes importants disposent d'un cercle de téléportation permanent dans leurs locaux. Chaque cercle comprend toujours sa propre séquence de runes, une suite de symboles à l'agencement unique. tinations du “rh Matériel, dé y ajouterez éventuellement d aventures. Graver une pere votre mémoire nécessite de l'étu Vous pouvez créer un cercle de té : en lançant quotidiennement ce sort au même pendant 365 jours.<\/p>\n"}, {"nom": "Chaîne D'Éclairs", "ecole": "Évocation", "niveau": 6, "classes": ["Ensorceleur", "Magicien"], "incantation": "action", "portee": "45 m", "composantes": "V, S, M (trois broches en argent)", "duree": "instantanée", "pages_source": [252], "description": "Vous projetez un trait de foudre vers une cible que vous voyez à portée. Trois éclairs jaillissent alors de cette cible. vers un maximum de trois autres cibles, que vous choisissez, distantes de 9 m ou moins de la première. Toutes ces cibles peuvent être des créatures ou des objets, et ne peuvent être ciblées par plus d'un éclair. Chaque cible effectue un jet de sauvegarde de Dextérité, et subit 10d8 dégâts de foudre en cas d'échec, la moitié en cas de réussite.\nEmplacement de niveau supérieur. Un éclair supplémentaire jaillit de la première cible vers une autre par niveau d'emplacement au-delà du 6:.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "chaine-d-eclairs", "html_body": "<p>Vous projetez un trait de foudre vers une cible que vous voyez à portée. Trois éclairs jaillissent alors de cette cible. vers un maximum de trois autres cibles, que vous choisissez, distantes de 9 m ou moins de la première. Toutes ces cibles peuvent être des créatures ou des objets, et ne peuvent être ciblées par plus d'un éclair. Chaque cible effectue un jet de sauvegarde de Dextérité, et subit 10d8 dégâts de foudre en cas d'échec, la moitié en cas de réussite.\nEmplacement de niveau supérieur. Un éclair supplémentaire jaillit de la première cible vers une autre par niveau d'emplacement au-delà du 6:.<\/p>\n"}, {"nom": "Champ Antimagie", "ecole": "Abjuration", "niveau": 8, "classes": ["Clerc", "Magicien"], "incantation": "action", "portee": "personnelle", "composantes": "V, S, M (limaille de fer)", "duree": "Concentration, jusqu’à 1 heure", "pages_source": [252, 253], "description": "Une aura d'antimagie vous entoure sous forme d'une\nÉmanation de 3 m. Nul ne peut lancer de sorts dans la zone, ni y entreprendre l’action Magie ou y produire des effets magiques. De tels effets, quelle que soit leur source, n'ont en outre aucun effet sur les cibles dans la zone. Les propriétés magiques des objets magiques ne fonctionnent pas à l'intérieur de l’aura ni sur ce qui s'y trouve. Les zones d'effet produites par des sorts ou effets magiques n'englobent pas l'aura et nul ne peut se téléporter ou recourir au voyage planaire pour entrer dans l'aura ou en sortir.\nLes portails sont fermés tant qu'ils sont dans l'aura. Les sorts en cours, à l'exception de ceux qui émanent d'un Artefact ou d'une divinité, sont réprimés dans l'aura. Tant qu'un effet est réprimé, il n'est pas actif, mais tout le temps qu'il passe ainsi réprimé est décompté de sa durée. Dissipation de la magie reste sans effet sur l'aura et les auras créées par plusieurs sorts champ antimagie ne s'annulent pas mutuellement. DES MAGES RIVAUX RECOURENT À CHANGEMENT DE FORME POUR SE TRANSFORMER EN TYRANNŒIL ET EN BÉHIR DANS\nLE CADRE D'UN OUEL DE MAGIE. RE”", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "champ-antimagie", "html_body": "<p>Une aura d'antimagie vous entoure sous forme d'une\nÉmanation de 3 m. Nul ne peut lancer de sorts dans la zone, ni y entreprendre l’action Magie ou y produire des effets magiques. De tels effets, quelle que soit leur source, n'ont en outre aucun effet sur les cibles dans la zone. Les propriétés magiques des objets magiques ne fonctionnent pas à l'intérieur de l’aura ni sur ce qui s'y trouve. Les zones d'effet produites par des sorts ou effets magiques n'englobent pas l'aura et nul ne peut se téléporter ou recourir au voyage planaire pour entrer dans l'aura ou en sortir.\nLes portails sont fermés tant qu'ils sont dans l'aura. Les sorts en cours, à l'exception de ceux qui émanent d'un Artefact ou d'une divinité, sont réprimés dans l'aura. Tant qu'un effet est réprimé, il n'est pas actif, mais tout le temps qu'il passe ainsi réprimé est décompté de sa durée. Dissipation de la magie reste sans effet sur l'aura et les auras créées par plusieurs sorts champ antimagie ne s'annulent pas mutuellement. DES MAGES RIVAUX RECOURENT À CHANGEMENT DE FORME POUR SE TRANSFORMER EN TYRANNŒIL ET EN BÉHIR DANS\nLE CADRE D'UN OUEL DE MAGIE. RE”<\/p>\n"}, {"nom": "Changement de Forme", "ecole": "Transmutation", "niveau": 9, "classes": ["Druide", "Magicien"], "incantation": "action", "portee": "personnelle", "composantes": "V, S, M (diadème de jade d’une valeur minimale de 1 500 po)", "duree": "Concentration, jusqu’à 1 heure", "pages_source": [253], "description": "Vous vous métamorphosez en une autre créature pour toute la durée, mais avez la possibilité d'entreprendre l'action\nMagie pour adopter une autre forme couverte par le sort. La nouvelle forme doit être une créature dont le facteur de puissance n’est pas supérieur à votre niveau ou FP. Vous devez déjà avoir vu une telle créature, qui ne doit être ni un Artificiel ni un Mort-vivant. À l'incantation du sort, vous recevez autant de points de vie temporaires que les points de vie de la première forme adoptée. S'il vous en reste quand le sort prend fin, ces pv temporaires disparaissent. Votre profil de jeu est remplacé par celui de la créature | retenue, mais vous conservez certains de vos aspects : type | de créature, alignement, personnalité, valeurs d’Intelligence, | de Sagesse et de Charisme, points de vie, dés de vie, maîtrises | et faculté de communication. Si vous disposez de l'aptitude |\nSorts ou Incantation, vous la conservez aussi. Lors de la transformation, vous déterminez si votre équipement tombe au sol ou change de taille et de configuration pour s'adapter à votre nouvelle forme.", "illustration": null, "legende_illustration": null, "notes_verification": "encadre_statistiques_a_controler; symboles_suspects", "statut": "ocr_non_valide", "id": "changement-de-forme", "html_body": "<p>Vous vous métamorphosez en une autre créature pour toute la durée, mais avez la possibilité d'entreprendre l'action\nMagie pour adopter une autre forme couverte par le sort. La nouvelle forme doit être une créature dont le facteur de puissance n’est pas supérieur à votre niveau ou FP. Vous devez déjà avoir vu une telle créature, qui ne doit être ni un Artificiel ni un Mort-vivant. À l'incantation du sort, vous recevez autant de points de vie temporaires que les points de vie de la première forme adoptée. S'il vous en reste quand le sort prend fin, ces pv temporaires disparaissent. Votre profil de jeu est remplacé par celui de la créature | retenue, mais vous conservez certains de vos aspects : type | de créature, alignement, personnalité, valeurs d’Intelligence, | de Sagesse et de Charisme, points de vie, dés de vie, maîtrises | et faculté de communication. Si vous disposez de l'aptitude |\nSorts ou Incantation, vous la conservez aussi. Lors de la transformation, vous déterminez si votre équipement tombe au sol ou change de taille et de configuration pour s'adapter à votre nouvelle forme.<\/p>\n"}, {"nom": "Changement de Plan", "ecole": "Invocation", "niveau": 7, "classes": ["Clerc", "Druide", "Ensorceleur", "Magicien", "Occultiste"], "incantation": "À vérifier", "portee": "contact", "composantes": "V, S, M (une badine métallique fourchue d'une valeur minimale de 250 po, accordée avec un plan d'existence.)", "duree": "instantanée", "pages_source": [253, 254], "description": "Vous et un maximum de huit créatures consentantes avec lesquelles vous formez un cercle en vous tenant par la main êtes transportés sur un autre plan d'existence. Vous pouvez spécifier une destination en des termes généraux, comme la cité d’Airain sur le Plan Elémentaire du Feu ou le palais de Dispater sur la deuxième strate des Neuf Enfers, auquel cas vous apparaissez à destination ou à proximité (à l'appréciation du MD). Ou bien, si vous connaissez la séquence de runes d'un cercle de téléportation sur un autre plan d'existence, ce sort vous transporte directement dans le cercle. Si le cercle de téléportation est trop petit pour accueillir toutes les créatures transportées, elles apparaissent dans les espaces noccupés les plus proches du cercle.\n\n| | Portée : 9m _ Composantes : V, S Durée : 1 heure Une créature que vous voyez à portée effectué Re sauvegarde de Sagesse. Ce jet s'effectue avec l'Avant si vous ou vos alliés êtes en train de l’affronter. Encas d'échec, la cible subit l'état Charmé jusqu’à la fin du sort ou que vous ou vos alliés lui infligiez des dégâts. La créature ainsi Charmée vous est Amicale. Lorsque le sort prend fin, la cible sait que vous l'avez Charmée.\nEmplacement de niveau supérieur. Vous pouvez cibler une créature supplémentaire par niveau d'emplacement au-delà du 4°. ai (Er", "illustration": null, "legende_illustration": null, "notes_verification": "champ_absent:incantation; symboles_suspects", "statut": "ocr_non_valide", "id": "changement-de-plan", "html_body": "<p>Vous et un maximum de huit créatures consentantes avec lesquelles vous formez un cercle en vous tenant par la main êtes transportés sur un autre plan d'existence. Vous pouvez spécifier une destination en des termes généraux, comme la cité d’Airain sur le Plan Elémentaire du Feu ou le palais de Dispater sur la deuxième strate des Neuf Enfers, auquel cas vous apparaissez à destination ou à proximité (à l'appréciation du MD). Ou bien, si vous connaissez la séquence de runes d'un cercle de téléportation sur un autre plan d'existence, ce sort vous transporte directement dans le cercle. Si le cercle de téléportation est trop petit pour accueillir toutes les créatures transportées, elles apparaissent dans les espaces noccupés les plus proches du cercle.<\/p>\n<p>| | Portée : 9m _ Composantes : V, S Durée : 1 heure Une créature que vous voyez à portée effectué Re sauvegarde de Sagesse. Ce jet s'effectue avec l'Avant si vous ou vos alliés êtes en train de l’affronter. Encas d'échec, la cible subit l'état Charmé jusqu’à la fin du sort ou que vous ou vos alliés lui infligiez des dégâts. La créature ainsi Charmée vous est Amicale. Lorsque le sort prend fin, la cible sait que vous l'avez Charmée.\nEmplacement de niveau supérieur. Vous pouvez cibler une créature supplémentaire par niveau d'emplacement au-delà du 4°. ai (Er<\/p>\n"}, {"nom": "Charme-Personne", "ecole": "Enchantement", "niveau": 1, "classes": ["Barde", "Druide", "Ensorceleur", "Magicien", "Occultiste"], "incantation": "action", "portee": "9 m", "composantes": "V, S", "duree": "1 heure", "pages_source": [254], "description": "Un Humanoïde que vous voyez à portée effectue un jet de sauvegarde de Sagesse. Ce jet s'effectue avec l'Avantage si vous ou vos alliés êtes en train de l’affronter. En cas d'échec, la cible subit l’état Charmé jusqu’à la fin du sort ou que vous ou vos alliés lui infligiez des dégâts. La créature ainsi\nCharmée vous est Amicale. Lorsque le sort prend fin, la cible sait que vous l’avez Charmée.\nEmplacement de niveau supérieur. Vous pouvez affecter une créature supplémentaire par niveau d'emplacement au-delà du 1*.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "charme-personne", "html_body": "<p>Un Humanoïde que vous voyez à portée effectue un jet de sauvegarde de Sagesse. Ce jet s'effectue avec l'Avantage si vous ou vos alliés êtes en train de l’affronter. En cas d'échec, la cible subit l’état Charmé jusqu’à la fin du sort ou que vous ou vos alliés lui infligiez des dégâts. La créature ainsi\nCharmée vous est Amicale. Lorsque le sort prend fin, la cible sait que vous l’avez Charmée.\nEmplacement de niveau supérieur. Vous pouvez affecter une créature supplémentaire par niveau d'emplacement au-delà du 1*.<\/p>\n"}, {"nom": "Châtiment du Ban", "ecole": "Invocation", "niveau": 5, "classes": ["Paladin"], "incantation": "action Bonus, que vous entreprenez aussitôt après avoir touché une créature avec une arme de corps à corps ou une attaque à mains nues", "portee": "personnelle", "composantes": "V", "duree": "Concentration, jusqu’à 1 minute", "pages_source": [254], "description": "La cible touchée par le jet d'attaque en subit 5d10 dégâts de force supplémentaires. Si cette attaque fait tomber la cible à 50 points de vie ou moins, elle doit réussir un jet de sauvegarde de Charisme sous peine d'être transportée dans un demi-plan sans danger, pour toute la durée. Tant qu’elle y reste, la cible subit l’état Neutralisé. Lorsque le sort prend fin, la cible réapparaît dans l'espace qu'elle avait quitté ou, si celui-ci n'est plus libre, dans l'espace ce inooouéle pau is de corps à corps ou une attaque Portée : personnelle Composantes : V Durée : 1 minute du sort. À la fin de chacun de ses tours, la © effectue un jet de sauvegarde

+1 | +1 |\n| CON | 14 | +2 | +2 |\n| INT | 6 | −2 | −2 |\n| SAG | 12 | +1 | +1 |\n| CHA | 8 | −1 | −1 |\n\n**Sens** Perception passive 11  \n**Langues** télépathie 1,5 km (fonctionne uniquement avec vous)  \n**FP** aucun (PX 0 ; BM égal à votre bonus de maîtrise)\n\n### Traits\n\n**Lien vital.** Lorsque vous récupérez des points de vie par un sort du 1er niveau ou supérieur, la monture en récupère autant si vous vous trouvez à 1,50 m ou moins d'elle.\n\n### Actions\n\n**Coup d'outre-monde.** *Corps à corps* : bonus égal à votre modificateur d'attaque des sorts, allonge 1,50 m. *Touché* : 1d8 plus niveau du sort dégâts radiants (Céleste), psychiques (Fée) ou nécrotiques (Fiélon).\n\n### Actions Bonus\n\n**Contact guérisseur (Céleste uniquement ; recharge après un Repos long).** Une créature dans un rayon de 1,50 m de la monture récupère un nombre de points de vie égal à 2d8 + niveau du sort.\n\n**Foulée féerique (Fée uniquement ; recharge après un Repos long).** La monture se téléporte avec son cavalier en un espace inoccupé de votre choix dans un rayon de 18 m.\n\n**Regard fiélon (Fiélon uniquement ; recharge après un Repos long).** JS Sagesse : votre DD de sauvegarde des sorts, une créature dans un rayon de 18 m que la monture voit. *Échec* : la cible subit l'état Effrayé jusqu'à la fin de votre tour suivant.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "transcription_revue_visuellement", "id": "appel-de-destrier", "html_body": "<p>Vous convoquez un être d'outre-monde qui se présente comme une monture fidèle en un espace inoccupé que vous choisissez à portée. Cette créature reprend le profil de la <strong>monture d'outre-monde<\/strong>. Si vous disposez déjà d'une telle monture par le biais de ce sort, elle est remplacée par la nouvelle.<\/p>\n<p>Vous choisissez l'aspect de votre monture, un animal que l'on peut monter de taille G, comme un cheval, un chameau, un loup sanguinaire ou un grand cervidé. Chaque fois que vous lancez le sort, choisissez le type de créature de la monture : Céleste, Fée ou Fiélon, qui détermine certains traits du profil.<\/p>\n<p><strong>Combat.<\/strong> La monture constitue un allié pour vous et vos alliés. Au combat, elle partage votre rang d'Initiative et se gère comme une monture contrôlée lorsque vous la chevauchez (comme décrit dans les règles du combat monté). Si vous subissez l'état Neutralisé, la monture joue son tour juste après vous et agit de manière autonome en veillant à vous protéger.<\/p>\n<p><strong>Disparition de la monture.<\/strong> La monture disparaît si elle tombe à 0 point de vie ou si vous mourez. À sa disparition, elle laisse derrière elle tout ce qu'elle portait. Si vous relancez ce sort, vous décidez si vous convoquez la monture disparue ou une autre.<\/p>\n<p><strong>Emplacement de niveau supérieur.<\/strong> Le niveau de l'emplacement s'applique chaque fois que le profil de jeu y fait référence.<\/p>\n<h2>Monture d'outre-monde<\/h2>\n<p><em>Céleste, Fée ou Fiélon (à votre convenance) de taille G, Neutre<\/em><\/p>\n<p><strong>CA<\/strong> 10 + 1 par niveau du sort<br />\n<strong>PV<\/strong> 5 + 10 par niveau du sort (la monture dispose d'un nombre de DV [d10] égal au niveau du sort)<br />\n<strong>Vitesse<\/strong> 18 m, vol 18 m (sort du 4e niveau ou plus)<\/p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">Caractéristique<\/th>\n<th style=\"text-align:right\">Valeur<\/th>\n<th style=\"text-align:right\">Mod.<\/th>\n<th style=\"text-align:right\">JS<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">FOR<\/td>\n<td style=\"text-align:right\">18<\/td>\n<td style=\"text-align:right\">+4<\/td>\n<td style=\"text-align:right\">+4<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">DEX<\/td>\n<td style=\"text-align:right\">12<\/td>\n<td style=\"text-align:right\">+1<\/td>\n<td style=\"text-align:right\">+1<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">CON<\/td>\n<td style=\"text-align:right\">14<\/td>\n<td style=\"text-align:right\">+2<\/td>\n<td style=\"text-align:right\">+2<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">INT<\/td>\n<td style=\"text-align:right\">6<\/td>\n<td style=\"text-align:right\">−2<\/td>\n<td style=\"text-align:right\">−2<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">SAG<\/td>\n<td style=\"text-align:right\">12<\/td>\n<td style=\"text-align:right\">+1<\/td>\n<td style=\"text-align:right\">+1<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">CHA<\/td>\n<td style=\"text-align:right\">8<\/td>\n<td style=\"text-align:right\">−1<\/td>\n<td style=\"text-align:right\">−1<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Sens<\/strong> Perception passive 11<br />\n<strong>Langues<\/strong> télépathie 1,5 km (fonctionne uniquement avec vous)<br />\n<strong>FP<\/strong> aucun (PX 0 ; BM égal à votre bonus de maîtrise)<\/p>\n<h3>Traits<\/h3>\n<p><strong>Lien vital.<\/strong> Lorsque vous récupérez des points de vie par un sort du 1er niveau ou supérieur, la monture en récupère autant si vous vous trouvez à 1,50 m ou moins d'elle.<\/p>\n<h3>Actions<\/h3>\n<p><strong>Coup d'outre-monde.<\/strong> <em>Corps à corps<\/em> : bonus égal à votre modificateur d'attaque des sorts, allonge 1,50 m. <em>Touché<\/em> : 1d8 plus niveau du sort dégâts radiants (Céleste), psychiques (Fée) ou nécrotiques (Fiélon).<\/p>\n<h3>Actions Bonus<\/h3>\n<p><strong>Contact guérisseur (Céleste uniquement ; recharge après un Repos long).<\/strong> Une créature dans un rayon de 1,50 m de la monture récupère un nombre de points de vie égal à 2d8 + niveau du sort.<\/p>\n<p><strong>Foulée féerique (Fée uniquement ; recharge après un Repos long).<\/strong> La monture se téléporte avec son cavalier en un espace inoccupé de votre choix dans un rayon de 18 m.<\/p>\n<p><strong>Regard fiélon (Fiélon uniquement ; recharge après un Repos long).<\/strong> JS Sagesse : votre DD de sauvegarde des sorts, une créature dans un rayon de 18 m que la monture voit. <em>Échec<\/em> : la cible subit l'état Effrayé jusqu'à la fin de votre tour suivant.<\/p>\n"}, {"nom": "Appel de familier", "ecole": "Invocation", "niveau": 1, "classes": ["Magicien"], "incantation": "1 heure ou rituel", "portee": "3 m", "composantes": "V, S, M (de l'encens qui brûle d'une valeur minimale de 10 po, que le sort détruit)", "duree": "instantanée", "pages_source": [242, 243], "description": "Vous recevez les services d'un familier, esprit qui prend la forme animale de votre choix : **araignée, belette, chat, chauve-souris, chouette, corbeau, faucon, grenouille, lézard, pieuvre, rat** ou autre Bête dont le facteur de puissance est de 0. Le familier se présente en un espace inoccupé à portée, avec le profil de jeu de la forme retenue (cf. annexe B), si ce n'est qu'il s'agit d'un Céleste, d'une Fée ou d'un Fiélon (à votre convenance) et non d'une Bête. Votre familier agit indépendamment de vous, mais il obéit à vos instructions.\n\n**Lien télépathique.** Tant que votre familier se trouve dans un rayon de 30 m de vous, vous pouvez communiquer avec lui par télépathie. De plus, par une action Bonus, vous pouvez voir par ses yeux et entendre par son ouïe jusqu'au début de votre tour suivant, en bénéficiant de ses éventuels sens spéciaux.\n\nEnfin, si vous lancez un sort dont la portée est « contact », votre familier peut appliquer ce contact. Il doit se trouver dans un rayon de 30 m de vous et doit jouer sa Réaction pour appliquer le contact lors de l'incantation.\n\n**Combat.** Le familier est votre allié, ainsi que celui de vos alliés. Il joue sa propre Initiative et agit à son tour. Un familier ne peut pas attaquer, mais il peut entreprendre normalement d'autres actions.\n\n**Disparition du familier.** Quand le familier tombe à 0 point de vie, il disparaît. Il réapparaît si vous relancez ce sort. Au prix de l'action Magie, vous pouvez provisoirement révoquer le familier dans une niche dimensionnelle. Vous pouvez également le révoquer à tout jamais. Au prix de l'action Magie, tant qu'il est provisoirement révoqué, vous pouvez le faire réapparaître en un espace inoccupé dans un rayon de 9 m de vous. Quand le familier tombe à 0 point de vie ou disparaît dans une niche dimensionnelle, il laisse tout ce qu'il porte sur lui dans son espace.\n\n**Un seul familier.** Vous ne pouvez pas disposer de plus d'un familier à la fois. Si vous lancez ce sort alors que vous disposez déjà d'un familier, ce dernier adopte en fait une nouvelle forme adaptée.", "illustration": "familiers.jpg", "legende_illustration": "Les formes des esprits convoqués par Appel de familier s'inspirent des mages qui les invoquent.", "notes_verification": "", "statut": "transcription_revue_visuellement", "id": "appel-de-familier", "html_body": "<p>Vous recevez les services d'un familier, esprit qui prend la forme animale de votre choix : <strong>araignée, belette, chat, chauve-souris, chouette, corbeau, faucon, grenouille, lézard, pieuvre, rat<\/strong> ou autre Bête dont le facteur de puissance est de 0. Le familier se présente en un espace inoccupé à portée, avec le profil de jeu de la forme retenue (cf. annexe B), si ce n'est qu'il s'agit d'un Céleste, d'une Fée ou d'un Fiélon (à votre convenance) et non d'une Bête. Votre familier agit indépendamment de vous, mais il obéit à vos instructions.<\/p>\n<p><strong>Lien télépathique.<\/strong> Tant que votre familier se trouve dans un rayon de 30 m de vous, vous pouvez communiquer avec lui par télépathie. De plus, par une action Bonus, vous pouvez voir par ses yeux et entendre par son ouïe jusqu'au début de votre tour suivant, en bénéficiant de ses éventuels sens spéciaux.<\/p>\n<p>Enfin, si vous lancez un sort dont la portée est « contact », votre familier peut appliquer ce contact. Il doit se trouver dans un rayon de 30 m de vous et doit jouer sa Réaction pour appliquer le contact lors de l'incantation.<\/p>\n<p><strong>Combat.<\/strong> Le familier est votre allié, ainsi que celui de vos alliés. Il joue sa propre Initiative et agit à son tour. Un familier ne peut pas attaquer, mais il peut entreprendre normalement d'autres actions.<\/p>\n<p><strong>Disparition du familier.<\/strong> Quand le familier tombe à 0 point de vie, il disparaît. Il réapparaît si vous relancez ce sort. Au prix de l'action Magie, vous pouvez provisoirement révoquer le familier dans une niche dimensionnelle. Vous pouvez également le révoquer à tout jamais. Au prix de l'action Magie, tant qu'il est provisoirement révoqué, vous pouvez le faire réapparaître en un espace inoccupé dans un rayon de 9 m de vous. Quand le familier tombe à 0 point de vie ou disparaît dans une niche dimensionnelle, il laisse tout ce qu'il porte sur lui dans son espace.<\/p>\n<p><strong>Un seul familier.<\/strong> Vous ne pouvez pas disposer de plus d'un familier à la fois. Si vous lancez ce sort alors que vous disposez déjà d'un familier, ce dernier adopte en fait une nouvelle forme adaptée.<\/p>\n"}, {"nom": "Appel de la foudre", "ecole": "Invocation", "niveau": 3, "classes": ["Druide"], "incantation": "action", "portee": "36 m", "composantes": "V, S", "duree": "Concentration, jusqu'à 10 minutes", "pages_source": [243], "description": "Un nuage menaçant se présente en un point que vous voyez à portée et qui vous surplombe directement. Il prend la forme d'un Cylindre haut de 3 m pour un rayon de 18 m.\n\nÀ l'incantation du sort, choisissez un point que vous voyez sous le nuage. Un trait de foudre jaillit du nuage vers ce point. Chaque créature située dans un rayon de 1,50 m de ce point effectue un jet de sauvegarde de Dextérité et subit 3d10 dégâts de foudre en cas d'échec, la moitié en cas de réussite.\n\nJusqu'à la fin du sort, vous pouvez entreprendre l'action Magie pour invoquer chaque fois un nouvel éclair, en ciblant le même point ou un autre.\n\nSi vous êtes en extérieur et en conditions orageuses à l'incantation du sort, il vous donne le contrôle de l'orage en cours au lieu d'en créer un. Dans de telles conditions, les dégâts du sort augmentent de 1d10.\n\n**Emplacement de niveau supérieur.** Les dégâts augmentent de 1d10 par niveau d'emplacement au-delà du 3e.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "transcription_revue_visuellement", "id": "appel-de-la-foudre", "html_body": "<p>Un nuage menaçant se présente en un point que vous voyez à portée et qui vous surplombe directement. Il prend la forme d'un Cylindre haut de 3 m pour un rayon de 18 m.<\/p>\n<p>À l'incantation du sort, choisissez un point que vous voyez sous le nuage. Un trait de foudre jaillit du nuage vers ce point. Chaque créature située dans un rayon de 1,50 m de ce point effectue un jet de sauvegarde de Dextérité et subit 3d10 dégâts de foudre en cas d'échec, la moitié en cas de réussite.<\/p>\n<p>Jusqu'à la fin du sort, vous pouvez entreprendre l'action Magie pour invoquer chaque fois un nouvel éclair, en ciblant le même point ou un autre.<\/p>\n<p>Si vous êtes en extérieur et en conditions orageuses à l'incantation du sort, il vous donne le contrôle de l'orage en cours au lieu d'en créer un. Dans de telles conditions, les dégâts du sort augmentent de 1d10.<\/p>\n<p><strong>Emplacement de niveau supérieur.<\/strong> Les dégâts augmentent de 1d10 par niveau d'emplacement au-delà du 3e.<\/p>\n"}, {"nom": "Arme élémentaire", "ecole": "Transmutation", "niveau": 3, "classes": ["Druide", "Paladin", "Rôdeur"], "incantation": "action", "portee": "contact", "composantes": "V, S", "duree": "Concentration, jusqu'à 1 heure", "pages_source": [243], "description": "Une arme non magique que vous touchez devient magique. Choisissez un type de dégâts parmi les suivants : acide, feu, foudre, froid et tonnerre. Pour toute la durée, l'arme dispose d'un bonus de +1 aux jets d'attaque et inflige 1d4 dégâts supplémentaires du type choisi en cas de réussite.\n\n**Emplacement de niveau supérieur.** Avec un emplacement du 5e ou 6e niveau, le bonus aux jets d'attaque passe à +2 et les dégâts supplémentaires à 2d4. Avec un emplacement du 7e niveau ou supérieur, le bonus passe à +3 et les dégâts supplémentaires à 3d4.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "transcription_revue_visuellement", "id": "arme-elementaire", "html_body": "<p>Une arme non magique que vous touchez devient magique. Choisissez un type de dégâts parmi les suivants : acide, feu, foudre, froid et tonnerre. Pour toute la durée, l'arme dispose d'un bonus de +1 aux jets d'attaque et inflige 1d4 dégâts supplémentaires du type choisi en cas de réussite.<\/p>\n<p><strong>Emplacement de niveau supérieur.<\/strong> Avec un emplacement du 5e ou 6e niveau, le bonus aux jets d'attaque passe à +2 et les dégâts supplémentaires à 2d4. Avec un emplacement du 7e niveau ou supérieur, le bonus passe à +3 et les dégâts supplémentaires à 3d4.<\/p>\n"}, {"nom": "Arme magique", "ecole": "Transmutation", "niveau": 2, "classes": ["Ensorceleur", "Magicien", "Paladin", "Rôdeur"], "incantation": "action Bonus", "portee": "contact", "composantes": "V, S", "duree": "1 heure", "pages_source": [244], "description": "Vous touchez une arme non magique. Jusqu'à la fin du sort, l'arme devient magique, dotée d'un bonus de +1 aux jets d'attaque et aux jets de dégâts. Le sort prend fin prématurément si vous le lancez à nouveau.\n\n**Emplacement de niveau supérieur.** Le bonus passe à +2 avec un emplacement du 3e, 4e ou 5e niveau. Le bonus passe à +3 avec un emplacement du 6e niveau ou supérieur.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "transcription_revue_visuellement", "id": "arme-magique", "html_body": "<p>Vous touchez une arme non magique. Jusqu'à la fin du sort, l'arme devient magique, dotée d'un bonus de +1 aux jets d'attaque et aux jets de dégâts. Le sort prend fin prématurément si vous le lancez à nouveau.<\/p>\n<p><strong>Emplacement de niveau supérieur.<\/strong> Le bonus passe à +2 avec un emplacement du 3e, 4e ou 5e niveau. Le bonus passe à +3 avec un emplacement du 6e niveau ou supérieur.<\/p>\n"}, {"nom": "Arme spirituelle", "ecole": "Évocation", "niveau": 2, "classes": ["Clerc"], "incantation": "action Bonus", "portee": "18 m", "composantes": "V, S", "duree": "Concentration, jusqu'à 1 minute", "pages_source": [244], "description": "Vous créez une arme spectrale et flottante à l'image de l'arme de votre choix, qui persiste pour toute la durée. L'arme apparaît à portée dans l'espace de votre choix et vous pouvez aussitôt effectuer une attaque de sort au corps à corps contre une créature située dans un rayon de 1,50 m de l'arme. Si l'attaque touche, la cible subit des dégâts de force égaux à 1d8 + votre modificateur de caractéristique d'incantation.\n\nPar une action Bonus à chaque tour consécutif, vous pouvez déplacer l'arme d'un maximum de 6 m et répéter l'attaque contre une créature située dans un rayon de 1,50 m de l'arme.\n\n**Emplacement de niveau supérieur.** Les dégâts augmentent de 1d8 par niveau d'emplacement au-delà du 2e.", "illustration": "arme-spirituelle.jpg", "legende_illustration": "Un clerc goliath lance arme spirituelle face à un mastodonte des ombres.", "notes_verification": "", "statut": "transcription_revue_visuellement", "id": "arme-spirituelle", "html_body": "<p>Vous créez une arme spectrale et flottante à l'image de l'arme de votre choix, qui persiste pour toute la durée. L'arme apparaît à portée dans l'espace de votre choix et vous pouvez aussitôt effectuer une attaque de sort au corps à corps contre une créature située dans un rayon de 1,50 m de l'arme. Si l'attaque touche, la cible subit des dégâts de force égaux à 1d8 + votre modificateur de caractéristique d'incantation.<\/p>\n<p>Par une action Bonus à chaque tour consécutif, vous pouvez déplacer l'arme d'un maximum de 6 m et répéter l'attaque contre une créature située dans un rayon de 1,50 m de l'arme.<\/p>\n<p><strong>Emplacement de niveau supérieur.<\/strong> Les dégâts augmentent de 1d8 par niveau d'emplacement au-delà du 2e.<\/p>\n"}, {"nom": "Armure d’Agathys", "ecole": "Abjuration", "niveau": 1, "classes": ["Occultiste"], "incantation": "action Bonus", "portee": "personnelle", "composantes": "V, S, M (un éclat de verre bleu)", "duree": "1 heure", "pages_source": [245], "description": "Un givre magique protecteur vous enveloppe. Vous recevez 5 points de vie temporaires. Si une créature vous touche avec un jet d'attaque de corps à corps avant la fin du sort, elle subit 5 dégâts de froid. Le sort prend fin prématurément si vous n'avez plus de points de vie temporaires.\n\n**Emplacement de niveau supérieur.** Les points de vie temporaires et les dégâts de froid augmentent de 5 par niveau d'emplacement au-delà du 1er.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "transcription_revue_visuellement", "id": "armure-d-agathys", "html_body": "<p>Un givre magique protecteur vous enveloppe. Vous recevez 5 points de vie temporaires. Si une créature vous touche avec un jet d'attaque de corps à corps avant la fin du sort, elle subit 5 dégâts de froid. Le sort prend fin prématurément si vous n'avez plus de points de vie temporaires.<\/p>\n<p><strong>Emplacement de niveau supérieur.<\/strong> Les points de vie temporaires et les dégâts de froid augmentent de 5 par niveau d'emplacement au-delà du 1er.<\/p>\n"}, {"nom": "Armure du mage", "ecole": "Abjuration", "niveau": 1, "classes": ["Ensorceleur", "Magicien"], "incantation": "action", "portee": "contact", "composantes": "V, S, M (un morceau de cuir traité)", "duree": "8 heures", "pages_source": [245], "description": "Vous touchez une créature consentante qui ne porte pas d'armure. Jusqu'à la fin du sort, sa CA de base est de 13 plus son modificateur de Dextérité. Le sort prend fin prématurément si la cible enfile une armure.", "illustration": "armure-du-mage.jpg", "legende_illustration": "Un magicien humain pare au danger grâce à armure du mage et aux traits infaillibles de projectile magique.", "notes_verification": "", "statut": "transcription_revue_visuellement", "id": "armure-du-mage", "html_body": "<p>Vous touchez une créature consentante qui ne porte pas d'armure. Jusqu'à la fin du sort, sa CA de base est de 13 plus son modificateur de Dextérité. Le sort prend fin prématurément si la cible enfile une armure.<\/p>\n"}, {"nom": "Arrêt du temps", "ecole": "Transmutation", "niveau": 9, "classes": ["Ensorceleur", "Magicien"], "incantation": "action", "portee": "personnelle", "composantes": "V", "duree": "instantanée", "pages_source": [245], "description": "Vous mettez un bref coup d'arrêt à l'écoulement du temps, pour tout le monde sauf vous-même. Le temps s'arrête pour les autres créatures tandis que vous prenez 1d4 + 1 tours d'affilée, durant lesquels vous pouvez entreprendre des actions et vous déplacer comme en temps normal.\n\nCe sort prend fin si l'une des actions que vous entreprenez durant l'intervalle, ou l'un des effets créés, affecte une créature autre que vous ou un objet porté par quelqu'un d'autre que vous. Il se termine également si vous vous déplacez en un lieu distant de plus de 300 m de l'endroit où vous l'avez lancé.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "transcription_revue_visuellement", "id": "arret-du-temps", "html_body": "<p>Vous mettez un bref coup d'arrêt à l'écoulement du temps, pour tout le monde sauf vous-même. Le temps s'arrête pour les autres créatures tandis que vous prenez 1d4 + 1 tours d'affilée, durant lesquels vous pouvez entreprendre des actions et vous déplacer comme en temps normal.<\/p>\n<p>Ce sort prend fin si l'une des actions que vous entreprenez durant l'intervalle, ou l'un des effets créés, affecte une créature autre que vous ou un objet porté par quelqu'un d'autre que vous. Il se termine également si vous vous déplacez en un lieu distant de plus de 300 m de l'endroit où vous l'avez lancé.<\/p>\n"}, {"nom": "Aspersion acide", "ecole": "Évocation", "niveau": 0, "classes": ["Ensorceleur", "Magicien"], "incantation": "action", "portee": "18 m", "composantes": "V, S", "duree": "instantanée", "pages_source": [246], "description": "Vous créez une bulle acide en un point à portée, où elle explose sous forme de Sphère de 1,50 m de rayon. Chaque créature prise dans la Sphère doit réussir un jet de sauvegarde de Dextérité sous peine de subir 1d6 dégâts d'acide.\n\n**Amélioration de sort mineur.** Les dégâts augmentent de 1d6 lorsque vous atteignez les niveaux 5 (2d6), 11 (3d6) et 17 (4d6).", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "transcription_revue_visuellement", "id": "aspersion-acide", "html_body": "<p>Vous créez une bulle acide en un point à portée, où elle explose sous forme de Sphère de 1,50 m de rayon. Chaque créature prise dans la Sphère doit réussir un jet de sauvegarde de Dextérité sous peine de subir 1d6 dégâts d'acide.<\/p>\n<p><strong>Amélioration de sort mineur.<\/strong> Les dégâts augmentent de 1d6 lorsque vous atteignez les niveaux 5 (2d6), 11 (3d6) et 17 (4d6).<\/p>\n"}, {"nom": "Assassin imaginaire", "ecole": "Illusion", "niveau": 4, "classes": ["Barde", "Magicien"], "incantation": "action", "portee": "36 m", "composantes": "V, S", "duree": "Concentration, jusqu'à 1 minute", "pages_source": [246], "description": "Vous puisez dans les cauchemars d'une créature que vous voyez à portée pour créer une illusion de ses plus grandes craintes, visible uniquement de la créature. La cible effectue un jet de sauvegarde de Sagesse. En cas d'échec, la cible subit 4d10 dégâts psychiques, ainsi que le Désavantage aux tests de caractéristique et aux jets d'attaque pour toute la durée. En cas de réussite, la cible subit la moitié de ces dégâts et le sort prend fin.\n\nPour toute la durée, la cible peut effectuer un JS Sagesse à la fin de chacun de ses tours. En cas d'échec, elle subit de nouveau les dégâts psychiques. En cas de réussite, le sort prend fin.\n\n**Emplacement de niveau supérieur.** Les dégâts augmentent de 1d10 par niveau d'emplacement au-delà du 4e.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "transcription_revue_visuellement", "id": "assassin-imaginaire", "html_body": "<p>Vous puisez dans les cauchemars d'une créature que vous voyez à portée pour créer une illusion de ses plus grandes craintes, visible uniquement de la créature. La cible effectue un jet de sauvegarde de Sagesse. En cas d'échec, la cible subit 4d10 dégâts psychiques, ainsi que le Désavantage aux tests de caractéristique et aux jets d'attaque pour toute la durée. En cas de réussite, la cible subit la moitié de ces dégâts et le sort prend fin.<\/p>\n<p>Pour toute la durée, la cible peut effectuer un JS Sagesse à la fin de chacun de ses tours. En cas d'échec, elle subit de nouveau les dégâts psychiques. En cas de réussite, le sort prend fin.<\/p>\n<p><strong>Emplacement de niveau supérieur.<\/strong> Les dégâts augmentent de 1d10 par niveau d'emplacement au-delà du 4e.<\/p>\n"}, {"nom": "Assistance", "ecole": "Divination", "niveau": 0, "classes": ["Clerc", "Druide"], "incantation": "action", "portee": "contact", "composantes": "V, S", "duree": "Concentration, jusqu'à 1 minute", "pages_source": [246], "description": "Vous touchez physiquement une créature consentante en choisissant une compétence. Jusqu'à la fin du sort, la créature ajoute 1d4 au résultat de tout test de caractéristique associé à cette compétence.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "transcription_revue_visuellement", "id": "assistance", "html_body": "<p>Vous touchez physiquement une créature consentante en choisissant une compétence. Jusqu'à la fin du sort, la créature ajoute 1d4 au résultat de tout test de caractéristique associé à cette compétence.<\/p>\n"}, {"nom": "Augure", "ecole": "Divination", "niveau": 2, "classes": ["Clerc", "Druide", "Magicien"], "incantation": "1 minute ou rituel", "portee": "personnelle", "composantes": "V, S, M (cartes, os ou bâtonnets gravés spécialement, ou objets divinatoires comparables, d’une valeur minimale de 25 po)", "duree": "instantanée", "pages_source": [246], "description": "Vous recevez un présage d'une entité surnaturelle vous renseignant sur l'issue d'une opération que vous comptez mener dans les 30 minutes. Le MD choisit une option de la table Présages :\n\n### Présages\n\n| Présage | Pour une issue qui s'annonce… |\n|:---|:---|\n| Fortune | favorable |\n| Misère | défavorable |\n| Fortune et misère | favorable et défavorable |\n| Indifférence | ni favorable ni défavorable |\n\nLe sort ne tient pas compte des conjonctures qui pourraient peser dans la balance, comme l'incantation de nouveaux sorts.\n\nSi vous lancez le sort plus d'une fois avant de terminer votre prochain Repos long, vous courez dès la deuxième incantation 25 % de risques cumulatifs qu'il ne vous livre aucune réponse.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "transcription_revue_visuellement", "id": "augure", "html_body": "<p>Vous recevez un présage d'une entité surnaturelle vous renseignant sur l'issue d'une opération que vous comptez mener dans les 30 minutes. Le MD choisit une option de la table Présages :<\/p>\n<h3>Présages<\/h3>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">Présage<\/th>\n<th style=\"text-align:left\">Pour une issue qui s'annonce…<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">Fortune<\/td>\n<td style=\"text-align:left\">favorable<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Misère<\/td>\n<td style=\"text-align:left\">défavorable<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Fortune et misère<\/td>\n<td style=\"text-align:left\">favorable et défavorable<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">Indifférence<\/td>\n<td style=\"text-align:left\">ni favorable ni défavorable<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Le sort ne tient pas compte des conjonctures qui pourraient peser dans la balance, comme l'incantation de nouveaux sorts.<\/p>\n<p>Si vous lancez le sort plus d'une fois avant de terminer votre prochain Repos long, vous courez dès la deuxième incantation 25 % de risques cumulatifs qu'il ne vous livre aucune réponse.<\/p>\n"}, {"nom": "Aura du croisé", "ecole": "Évocation", "niveau": 3, "classes": ["Paladin"], "incantation": "action", "portee": "personnelle", "composantes": "V", "duree": "Concentration, jusqu'à 1 minute", "pages_source": [246], "description": "Vous produisez une aura magique sous forme d'une Émanation de 9 m. Toute créature alliée comprise dans l'aura (y compris vous) inflige 1d4 dégâts radiants supplémentaires lorsqu'elle touche avec une arme ou une attaque à mains nues.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "transcription_revue_visuellement", "id": "aura-du-croise", "html_body": "<p>Vous produisez une aura magique sous forme d'une Émanation de 9 m. Toute créature alliée comprise dans l'aura (y compris vous) inflige 1d4 dégâts radiants supplémentaires lorsqu'elle touche avec une arme ou une attaque à mains nues.<\/p>\n"}, {"nom": "Aura magique de Nystul", "ecole": "Illusion", "niveau": 2, "classes": ["Magicien"], "incantation": "action", "portee": "contact", "composantes": "V, S, M (un petit carré de soie)", "duree": "24 heures", "pages_source": [246, 247], "description": "D'un contact, vous placez une illusion sur une créature consentante ou un objet qui n'est porté par personne. Une créature reçoit l'effet Masque, tandis qu'un objet reçoit l'effet Aura factice (voir plus loin). Les effets persistent pour toute la durée. Si vous lancez ce sort sur une même créature ou un même objet pendant 30 jours consécutifs, l'illusion persiste jusqu'à dissipation.\n\n**Masque (créature).** Choisissez un type de créature autre que celui de la cible. Les sorts et effets magiques considèrent désormais la cible comme du type retenu.\n\n**Aura factice (objet).** Vous altérez la manière dont la cible se dévoile au gré de sorts et effets magiques qui perçoivent les auras magiques, tels que *détection de la magie*. Vous pouvez ainsi faire qu'un objet ordinaire paraisse magique, qu'un objet magique paraisse ordinaire, ou modifier l'aura magique d'un objet pour qu'elle soit associée à l'école de magie de votre choix.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "transcription_revue_visuellement", "id": "aura-magique-de-nystul", "html_body": "<p>D'un contact, vous placez une illusion sur une créature consentante ou un objet qui n'est porté par personne. Une créature reçoit l'effet Masque, tandis qu'un objet reçoit l'effet Aura factice (voir plus loin). Les effets persistent pour toute la durée. Si vous lancez ce sort sur une même créature ou un même objet pendant 30 jours consécutifs, l'illusion persiste jusqu'à dissipation.<\/p>\n<p><strong>Masque (créature).<\/strong> Choisissez un type de créature autre que celui de la cible. Les sorts et effets magiques considèrent désormais la cible comme du type retenu.<\/p>\n<p><strong>Aura factice (objet).<\/strong> Vous altérez la manière dont la cible se dévoile au gré de sorts et effets magiques qui perçoivent les auras magiques, tels que <em>détection de la magie<\/em>. Vous pouvez ainsi faire qu'un objet ordinaire paraisse magique, qu'un objet magique paraisse ordinaire, ou modifier l'aura magique d'un objet pour qu'elle soit associée à l'école de magie de votre choix.<\/p>\n"}, {"nom": "Aura de pureté", "ecole": "Abjuration", "niveau": 4, "classes": ["Clerc", "Paladin"], "incantation": "action", "portee": "personnelle", "composantes": "V", "duree": "Concentration, jusqu'à 10 minutes", "pages_source": [247], "description": "Une aura rayonne depuis vous pour toute la durée, sous forme d'une Émanation de 9 m. Toute créature alliée comprise dans l'aura (y compris vous) bénéficie de la Résistance aux dégâts de poison, et de l'Avantage aux jets de sauvegarde contre tout effet qui engendre n'importe lequel des états suivants : Assourdi, Aveuglé, Charmé, Effrayé, Empoisonné, Étourdi et Paralysé.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "transcription_revue_visuellement", "id": "aura-de-purete", "html_body": "<p>Une aura rayonne depuis vous pour toute la durée, sous forme d'une Émanation de 9 m. Toute créature alliée comprise dans l'aura (y compris vous) bénéficie de la Résistance aux dégâts de poison, et de l'Avantage aux jets de sauvegarde contre tout effet qui engendre n'importe lequel des états suivants : Assourdi, Aveuglé, Charmé, Effrayé, Empoisonné, Étourdi et Paralysé.<\/p>\n"}, {"nom": "Aura sacrée", "ecole": "Abjuration", "niveau": 8, "classes": ["Clerc"], "incantation": "action", "portee": "personnelle", "composantes": "V, S, M (un reliquaire d’une valeur minimale de 1 000 po)", "duree": "Concentration, jusqu'à 1 minute", "pages_source": [247], "description": "Pour toute la durée, vous émettez une aura sous forme d'une Émanation de 9 m. Tant qu'elles sont dans l'aura, les créatures que vous choisissez ont l'Avantage aux jets de sauvegarde et les autres ont contre elle le Désavantage aux jets d'attaque. De plus, lorsqu'un Fiélon ou un Mort-vivant touche une créature affectée avec un jet d'attaque de corps à corps, l'assaillant doit réussir un jet de sauvegarde de Constitution sous peine de subir l'état Aveuglé jusqu'à la fin de son tour suivant.", "illustration": null, "legende_illustration": null, "notes_verification": "Formulation « contre elle » conservée telle qu'imprimée.", "statut": "transcription_revue_visuellement", "id": "aura-sacree", "html_body": "<p>Pour toute la durée, vous émettez une aura sous forme d'une Émanation de 9 m. Tant qu'elles sont dans l'aura, les créatures que vous choisissez ont l'Avantage aux jets de sauvegarde et les autres ont contre elle le Désavantage aux jets d'attaque. De plus, lorsqu'un Fiélon ou un Mort-vivant touche une créature affectée avec un jet d'attaque de corps à corps, l'assaillant doit réussir un jet de sauvegarde de Constitution sous peine de subir l'état Aveuglé jusqu'à la fin de son tour suivant.<\/p>\n"}, {"nom": "Aura de vie", "ecole": "Abjuration", "niveau": 4, "classes": ["Clerc", "Paladin"], "incantation": "action", "portee": "personnelle", "composantes": "V", "duree": "Concentration, jusqu'à 10 minutes", "pages_source": [247], "description": "Une aura rayonne depuis vous pour toute la durée, sous forme d'une Émanation de 9 m. Toute créature alliée comprise dans l'aura (y compris vous) bénéficie de la Résistance aux dégâts nécrotiques et rien ne peut réduire son maximum de points de vie. Si un allié à 0 point de vie commence son tour dans l'aura, il récupère 1 point de vie.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "transcription_revue_visuellement", "id": "aura-de-vie", "html_body": "<p>Une aura rayonne depuis vous pour toute la durée, sous forme d'une Émanation de 9 m. Toute créature alliée comprise dans l'aura (y compris vous) bénéficie de la Résistance aux dégâts nécrotiques et rien ne peut réduire son maximum de points de vie. Si un allié à 0 point de vie commence son tour dans l'aura, il récupère 1 point de vie.<\/p>\n"}, {"nom": "Aura de vitalité", "ecole": "Abjuration", "niveau": 3, "classes": ["Clerc", "Druide", "Paladin"], "incantation": "action", "portee": "personnelle", "composantes": "V", "duree": "Concentration, jusqu'à 1 minute", "pages_source": [247], "description": "Une aura rayonne depuis vous pour toute la durée, sous forme d'une Émanation de 9 m. À la création de l'aura ainsi qu'au début de chacun de vos tours tant qu'elle persiste, vous pouvez restituer 2d6 points de vie à une créature comprise dans l'aura.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "transcription_revue_visuellement", "id": "aura-de-vitalite", "html_body": "<p>Une aura rayonne depuis vous pour toute la durée, sous forme d'une Émanation de 9 m. À la création de l'aura ainsi qu'au début de chacun de vos tours tant qu'elle persiste, vous pouvez restituer 2d6 points de vie à une créature comprise dans l'aura.<\/p>\n"}, {"nom": "Aversion/attirance", "ecole": "Enchantement", "niveau": 8, "classes": ["Barde", "Druide", "Magicien"], "incantation": "1 heure", "portee": "18 m", "composantes": "V, S, M (un mélange de vinaigre et de miel)", "duree": "10 jours", "pages_source": [247], "description": "À l'incantation, choisissez si le sort produit de l'aversion ou de l'attirance, et ciblez une créature ou un objet de taille TG ou inférieure. Spécifiez alors une catégorie de créatures, comme les dragons rouges, les gobelins ou les vampires. Toute créature de la catégorie désignée effectue un jet de sauvegarde de Sagesse quand elle entre dans un rayon de 36 m de la cible. Ce qui arrive à une telle créature si elle rate son JS dépend de votre choix : attirance ou aversion.\n\n**Attirance.** La créature subit l'état Charmé. La créature Charmée doit consacrer le déplacement de ses tours à se rapprocher autant que possible de la cible par le chemin le plus sûr. Si la créature se trouve dans un rayon de 1,50 m de la cible, elle ne peut s'en éloigner volontairement. Si la cible inflige des dégâts à la créature Charmée, cette dernière peut réitérer le JS Sagesse pour mettre un terme à l'effet, comme décrit ci-après.\n\n**Aversion.** La créature subit l'état Effrayé. La créature Effrayée doit consacrer le déplacement de ses tours à s'éloigner autant que possible de la cible par le chemin le plus sûr.\n\n**Mettre fin à l'effet.** Une créature ainsi Charmée ou Effrayée qui termine son tour au-delà de 36 m de la cible effectue un jet de sauvegarde de Sagesse. En cas de réussite, la créature n'est plus affectée par la cible. Une créature qui réussit son JS contre cet effet est immunisée contre celui-ci pendant 1 minute, après quoi elle peut de nouveau être affectée.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "transcription_revue_visuellement", "id": "aversion-attirance", "html_body": "<p>À l'incantation, choisissez si le sort produit de l'aversion ou de l'attirance, et ciblez une créature ou un objet de taille TG ou inférieure. Spécifiez alors une catégorie de créatures, comme les dragons rouges, les gobelins ou les vampires. Toute créature de la catégorie désignée effectue un jet de sauvegarde de Sagesse quand elle entre dans un rayon de 36 m de la cible. Ce qui arrive à une telle créature si elle rate son JS dépend de votre choix : attirance ou aversion.<\/p>\n<p><strong>Attirance.<\/strong> La créature subit l'état Charmé. La créature Charmée doit consacrer le déplacement de ses tours à se rapprocher autant que possible de la cible par le chemin le plus sûr. Si la créature se trouve dans un rayon de 1,50 m de la cible, elle ne peut s'en éloigner volontairement. Si la cible inflige des dégâts à la créature Charmée, cette dernière peut réitérer le JS Sagesse pour mettre un terme à l'effet, comme décrit ci-après.<\/p>\n<p><strong>Aversion.<\/strong> La créature subit l'état Effrayé. La créature Effrayée doit consacrer le déplacement de ses tours à s'éloigner autant que possible de la cible par le chemin le plus sûr.<\/p>\n<p><strong>Mettre fin à l'effet.<\/strong> Une créature ainsi Charmée ou Effrayée qui termine son tour au-delà de 36 m de la cible effectue un jet de sauvegarde de Sagesse. En cas de réussite, la créature n'est plus affectée par la cible. Une créature qui réussit son JS contre cet effet est immunisée contre celui-ci pendant 1 minute, après quoi elle peut de nouveau être affectée.<\/p>\n"}, {"nom": "Bagou", "ecole": "Enchantement", "niveau": 8, "classes": ["Barde", "Occultiste"], "incantation": "action", "portee": "personnelle", "composantes": "V", "duree": "1 heure", "pages_source": [248], "description": "Jusqu'à la fin du sort, chaque fois que vous effectuez un test de Charisme, vous pouvez substituer 15 au nombre que vous obtenez sur le dé. De plus, quoi que vous disiez, toute magie censée vérifier que vous ne mentez pas identifie vos paroles comme sincères.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "transcription_revue_visuellement", "id": "bagou", "html_body": "<p>Jusqu'à la fin du sort, chaque fois que vous effectuez un test de Charisme, vous pouvez substituer 15 au nombre que vous obtenez sur le dé. De plus, quoi que vous disiez, toute magie censée vérifier que vous ne mentez pas identifie vos paroles comme sincères.<\/p>\n"}, {"nom": "Baies nourricières", "ecole": "Invocation", "niveau": 1, "classes": ["Druide", "Rôdeur"], "incantation": "action", "portee": "personnelle", "composantes": "V, S, M (une branche de gui)", "duree": "24 heures", "pages_source": [248], "description": "Dix baies se matérialisent dans votre main, gorgées de magie pour toute la durée. Une créature peut manger l'une de ces baies par une action Bonus. L'ingestion d'une baie fait récupérer 1 point de vie et fournit l'équivalent d'une journée de sustentation pour une créature.\n\nLes baies non consommées disparaissent quand le sort prend fin.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "transcription_revue_visuellement", "id": "baies-nourricieres", "html_body": "<p>Dix baies se matérialisent dans votre main, gorgées de magie pour toute la durée. Une créature peut manger l'une de ces baies par une action Bonus. L'ingestion d'une baie fait récupérer 1 point de vie et fournit l'équivalent d'une journée de sustentation pour une créature.<\/p>\n<p>Les baies non consommées disparaissent quand le sort prend fin.<\/p>\n"}, {"nom": "Bannissement", "ecole": "Abjuration", "niveau": 4, "classes": ["Clerc", "Ensorceleur", "Magicien", "Occultiste", "Paladin"], "incantation": "action", "portee": "9 m", "composantes": "V, S, M (un pentacle)", "duree": "Concentration, jusqu'à 1 minute", "pages_source": [248], "description": "Une créature que vous voyez à portée doit réussir un jet de sauvegarde de Charisme sous peine d'être transportée dans un demi-plan sans danger pour toute la durée. Tant qu'elle y reste, la cible subit l'état Neutralisé. Lorsque le sort prend fin, la cible réapparaît dans l'espace qu'elle avait quitté ou, si celui-ci n'est plus libre, dans l'espace inoccupé le plus proche.\n\nSi la cible est de type Aberration, Céleste, Élémentaire, Fée ou Fiélon, elle ne revient pas si le sort persiste pendant 1 minute. Au lieu de cela, elle est transportée en un lieu aléatoire d'un plan (choisi par le MD) associé à son type de créature.\n\n**Emplacement de niveau supérieur.** Vous pouvez cibler une créature supplémentaire par niveau d'emplacement au-delà du 4e.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "transcription_revue_visuellement", "id": "bannissement", "html_body": "<p>Une créature que vous voyez à portée doit réussir un jet de sauvegarde de Charisme sous peine d'être transportée dans un demi-plan sans danger pour toute la durée. Tant qu'elle y reste, la cible subit l'état Neutralisé. Lorsque le sort prend fin, la cible réapparaît dans l'espace qu'elle avait quitté ou, si celui-ci n'est plus libre, dans l'espace inoccupé le plus proche.<\/p>\n<p>Si la cible est de type Aberration, Céleste, Élémentaire, Fée ou Fiélon, elle ne revient pas si le sort persiste pendant 1 minute. Au lieu de cela, elle est transportée en un lieu aléatoire d'un plan (choisi par le MD) associé à son type de créature.<\/p>\n<p><strong>Emplacement de niveau supérieur.<\/strong> Vous pouvez cibler une créature supplémentaire par niveau d'emplacement au-delà du 4e.<\/p>\n"}, {"nom": "Barrière de lames", "ecole": "Évocation", "niveau": 6, "classes": ["Clerc"], "incantation": "action", "portee": "27 m", "composantes": "V, S", "duree": "Concentration, jusqu'à 10 minutes", "pages_source": [248], "description": "Vous créez un mur de lames tourbillonnantes d'énergie magique. Le mur apparaît à portée et persiste pour toute la durée. Vous érigez ainsi un mur dont la hauteur n'excède pas 6 m et l'épaisseur 1,50 m ; pour le reste, vous avez le choix entre créer un mur droit long de 30 m au maximum ou un mur circulaire dont le diamètre ne dépasse pas 18 m. Le mur octroie un Abri supérieur et son espace constitue un Terrain difficile.\n\nToute créature prise dans l'espace du mur effectue un jet de sauvegarde de Dextérité, et subit 6d10 dégâts de force en cas d'échec, la moitié en cas de réussite. Une créature effectue aussi ce JS si elle pénètre dans l'espace du mur ou y termine son tour. Une même créature n'effectue en aucun cas ce JS plus d'une fois par tour.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "transcription_revue_visuellement", "id": "barriere-de-lames", "html_body": "<p>Vous créez un mur de lames tourbillonnantes d'énergie magique. Le mur apparaît à portée et persiste pour toute la durée. Vous érigez ainsi un mur dont la hauteur n'excède pas 6 m et l'épaisseur 1,50 m ; pour le reste, vous avez le choix entre créer un mur droit long de 30 m au maximum ou un mur circulaire dont le diamètre ne dépasse pas 18 m. Le mur octroie un Abri supérieur et son espace constitue un Terrain difficile.<\/p>\n<p>Toute créature prise dans l'espace du mur effectue un jet de sauvegarde de Dextérité, et subit 6d10 dégâts de force en cas d'échec, la moitié en cas de réussite. Une créature effectue aussi ce JS si elle pénètre dans l'espace du mur ou y termine son tour. Une même créature n'effectue en aucun cas ce JS plus d'une fois par tour.<\/p>\n"}, {"nom": "Bénédiction", "ecole": "Enchantement", "niveau": 1, "classes": ["Clerc", "Paladin"], "incantation": "action", "portee": "9 m", "composantes": "V, S, M (un symbole sacré d’une valeur minimale de 5 po)", "duree": "Concentration, jusqu'à 1 minute", "pages_source": [248], "description": "Vous bénissez jusqu'à trois créatures à portée. Chaque fois qu'une de ces cibles effectue un jet d'attaque ou un jet de sauvegarde avant la fin du sort, elle ajoute 1d4 au résultat correspondant.\n\n**Emplacement de niveau supérieur.** Vous pouvez affecter une créature supplémentaire par niveau d'emplacement au-delà du 1er.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "transcription_revue_visuellement", "id": "benediction", "html_body": "<p>Vous bénissez jusqu'à trois créatures à portée. Chaque fois qu'une de ces cibles effectue un jet d'attaque ou un jet de sauvegarde avant la fin du sort, elle ajoute 1d4 au résultat correspondant.<\/p>\n<p><strong>Emplacement de niveau supérieur.<\/strong> Vous pouvez affecter une créature supplémentaire par niveau d'emplacement au-delà du 1er.<\/p>\n"}, {"nom": "Blessure", "ecole": "Nécromancie", "niveau": 1, "classes": ["Clerc"], "incantation": "action", "portee": "contact", "composantes": "V, S", "duree": "instantanée", "pages_source": [248], "description": "La créature que vous touchez physiquement effectue un jet de sauvegarde de Constitution et subit 2d10 dégâts nécrotiques en cas d'échec, la moitié en cas de réussite.\n\n**Emplacement de niveau supérieur.** Les dégâts augmentent de 1d10 par niveau d'emplacement au-delà du 1er.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "transcription_revue_visuellement", "id": "blessure", "html_body": "<p>La créature que vous touchez physiquement effectue un jet de sauvegarde de Constitution et subit 2d10 dégâts nécrotiques en cas d'échec, la moitié en cas de réussite.<\/p>\n<p><strong>Emplacement de niveau supérieur.<\/strong> Les dégâts augmentent de 1d10 par niveau d'emplacement au-delà du 1er.<\/p>\n"}, {"nom": "Bouche magique", "ecole": "Illusion", "niveau": 2, "classes": ["Barde", "Magicien"], "incantation": "1 minute ou rituel", "portee": "9 m", "composantes": "V, S, M (poudre de jade d’une valeur minimale de 10 po, que le sort détruit)", "duree": "jusqu’à dissipation", "pages_source": [249], "description": "Vous chargez un objet à portée d'un message qui sera prononcé lorsqu'une condition de déclenchement se présentera. Choisissez un objet que vous voyez et qui n'est pas porté par une autre créature. Prononcez alors un message d'un maximum de 25 mots (vous disposez toutefois de 10 minutes pour le peaufiner). Enfin, déterminez les circonstances qui déclencheront la transmission du message par le sort.\n\nQuand cette condition se présente, une bouche magique apparaît sur l'objet et récite le message avec votre voix, au même volume que vous. Si l'objet choisi est lui-même doté d'une ouverture qui peut passer pour une bouche (comme sur une statue d'humanoïde), la bouche magique s'y manifeste et les mots semblent en émaner. À l'incantation du sort, vous pouvez décider que le sort prenne fin après avoir livré son message ou qu'il reste en place et répète son annonce chaque fois que le déclencheur se présente.\n\nLes circonstances de déclenchement peuvent être générales ou détaillées, à votre convenance, mais doivent correspondre à des conditions visuelles ou auditives intervenant dans un rayon de 9 m de l'objet. Vous pourriez ainsi statuer que la bouche s'exprime quand une créature s'approche à 9 m ou moins de l'objet ou quand une cloche d'argent sonne dans ce même rayon.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "transcription_revue_visuellement", "id": "bouche-magique", "html_body": "<p>Vous chargez un objet à portée d'un message qui sera prononcé lorsqu'une condition de déclenchement se présentera. Choisissez un objet que vous voyez et qui n'est pas porté par une autre créature. Prononcez alors un message d'un maximum de 25 mots (vous disposez toutefois de 10 minutes pour le peaufiner). Enfin, déterminez les circonstances qui déclencheront la transmission du message par le sort.<\/p>\n<p>Quand cette condition se présente, une bouche magique apparaît sur l'objet et récite le message avec votre voix, au même volume que vous. Si l'objet choisi est lui-même doté d'une ouverture qui peut passer pour une bouche (comme sur une statue d'humanoïde), la bouche magique s'y manifeste et les mots semblent en émaner. À l'incantation du sort, vous pouvez décider que le sort prenne fin après avoir livré son message ou qu'il reste en place et répète son annonce chaque fois que le déclencheur se présente.<\/p>\n<p>Les circonstances de déclenchement peuvent être générales ou détaillées, à votre convenance, mais doivent correspondre à des conditions visuelles ou auditives intervenant dans un rayon de 9 m de l'objet. Vous pourriez ainsi statuer que la bouche s'exprime quand une créature s'approche à 9 m ou moins de l'objet ou quand une cloche d'argent sonne dans ce même rayon.<\/p>\n"}, {"nom": "Bouclier", "ecole": "Abjuration", "niveau": 1, "classes": ["Ensorceleur", "Magicien"], "incantation": "Réaction, que vous jouez lorsqu’un jet d’attaque vous touche ou que le sort projectile magique vous cible", "portee": "personnelle", "composantes": "V, S", "duree": "1 round", "pages_source": [249], "description": "Une barrière imperceptible de force magique vous protège. Jusqu'au début de votre tour suivant, vous recevez un bonus de +5 à la CA, y compris contre l'attaque qui a déclenché le sort, et vous ne subissez aucun dégât de *projectile magique*.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "transcription_revue_visuellement", "id": "bouclier", "html_body": "<p>Une barrière imperceptible de force magique vous protège. Jusqu'au début de votre tour suivant, vous recevez un bonus de +5 à la CA, y compris contre l'attaque qui a déclenché le sort, et vous ne subissez aucun dégât de <em>projectile magique<\/em>.<\/p>\n"}, {"nom": "Bouclier de feu", "ecole": "Évocation", "niveau": 4, "classes": ["Druide", "Ensorceleur", "Magicien"], "incantation": "action", "portee": "personnelle", "composantes": "V, S, M (un peu de phosphore ou une luciole)", "duree": "10 minutes", "pages_source": [249, 250], "description": "Des flammes ondoyantes vous enveloppent pour toute la durée en produisant une Lumière vive dans un rayon de 3 m et une Lumière faible sur 3 m de plus.\n\nLes flammes vous procurent un écran chaud ou frais, à votre convenance. Un écran chaud vous octroie la Résistance aux dégâts de froid, un écran frais la Résistance aux dégâts de feu.\n\nDe plus, chaque fois qu'une créature située dans un rayon de 1,50 m de vous vous touche avec un jet d'attaque de corps à corps, les flammes s'attisent brusquement. L'assaillant subit 2d8 dégâts de feu si l'écran est chaud, 2d8 dégâts de froid s'il est frais.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "transcription_revue_visuellement", "id": "bouclier-de-feu", "html_body": "<p>Des flammes ondoyantes vous enveloppent pour toute la durée en produisant une Lumière vive dans un rayon de 3 m et une Lumière faible sur 3 m de plus.<\/p>\n<p>Les flammes vous procurent un écran chaud ou frais, à votre convenance. Un écran chaud vous octroie la Résistance aux dégâts de froid, un écran frais la Résistance aux dégâts de feu.<\/p>\n<p>De plus, chaque fois qu'une créature située dans un rayon de 1,50 m de vous vous touche avec un jet d'attaque de corps à corps, les flammes s'attisent brusquement. L'assaillant subit 2d8 dégâts de feu si l'écran est chaud, 2d8 dégâts de froid s'il est frais.<\/p>\n"}, {"nom": "Agrandissement/Rapetissement", "ecole": "Transmutation", "niveau": 2, "classes": ["Barde", "Druide", "Ensorceleur", "Magicien"], "incantation": "action", "portee": "9 m", "composantes": "V, S, M (une pincée de poudre de fer)", "duree": "Concentration, jusqu'à 1 minute", "pages_source": [239], "description": "Pour toute la durée, le sort agrandit ou rapetisse une créature ou un objet que vous voyez à portée (voir l'effet retenu ci-après). Dans le cas d’un objet, il ne doit être porté par personne. Si la cible est une créature non consentante, elle effectue un jet de sauvegarde de Constitution. En cas de réussite, le sort est sans effet. Tout ce que porte une créature ciblée change également de taille. Tout objet qu'elle lâche retrouve aussitôt sa taille normale. Les armes lancées et les projectiles retrouvent aussi leur taille dès qu'ils ont touché ou raté leur cible.\nAgrandissement. La taille de la cible augmente d'une catégorie ; de taille M à G, par exemple. La cible a l'Avantage aux tests de Force et aux jets de sauvegarde de Force. Les attaques que la cible effectue avec une arme agrandie ou à mains nues infligent 1d4 dégâts supplémentaires quand elles touchent.\nRapetissement. La taille de la cible diminue d'une catégorie ; de taille M à G, par exemple. La cible subit le Désavantage aux tests de Force et aux jets de sauvegarde de Force. Les attaques que la cible effectue avec une arme rapetissée ou à mains nues infligent 1d4 dégâts de moins quand elles touchent (minimum de 1 dégât).", "illustration": null, "legende_illustration": null, "notes_verification": "titre_incertain", "statut": "ocr_non_valide", "id": "agrandissement-rapetissement", "html_body": "<p>Pour toute la durée, le sort agrandit ou rapetisse une créature ou un objet que vous voyez à portée (voir l'effet retenu ci-après). Dans le cas d’un objet, il ne doit être porté par personne. Si la cible est une créature non consentante, elle effectue un jet de sauvegarde de Constitution. En cas de réussite, le sort est sans effet. Tout ce que porte une créature ciblée change également de taille. Tout objet qu'elle lâche retrouve aussitôt sa taille normale. Les armes lancées et les projectiles retrouvent aussi leur taille dès qu'ils ont touché ou raté leur cible.\nAgrandissement. La taille de la cible augmente d'une catégorie ; de taille M à G, par exemple. La cible a l'Avantage aux tests de Force et aux jets de sauvegarde de Force. Les attaques que la cible effectue avec une arme agrandie ou à mains nues infligent 1d4 dégâts supplémentaires quand elles touchent.\nRapetissement. La taille de la cible diminue d'une catégorie ; de taille M à G, par exemple. La cible subit le Désavantage aux tests de Force et aux jets de sauvegarde de Force. Les attaques que la cible effectue avec une arme rapetissée ou à mains nues infligent 1d4 dégâts de moins quand elles touchent (minimum de 1 dégât).<\/p>\n"}, {"nom": "Aide", "ecole": "Abjuration", "niveau": 2, "classes": ["Barde", "Clerc", "Druide", "Paladin", "Rôdeur"], "incantation": "action", "portee": "9 m", "composantes": "V, S, M (une bandelette de tissu blanc)", "duree": "8 heures", "pages_source": [239], "description": "Choisissez jusqu'à trois créatures à portée. Le maximum de points de vie de chaque cible et ses points de vie actuels augmentent de 5 pour toute la durée.\nEmplacement de niveau supérieur. Les points de vie de chaque cible augmentent de 5 de plus par niveau d'emplacement au-delà du 2°. Le", "illustration": null, "legende_illustration": null, "notes_verification": "encadre_statistiques_a_controler", "statut": "ocr_non_valide", "id": "aide", "html_body": "<p>Choisissez jusqu'à trois créatures à portée. Le maximum de points de vie de chaque cible et ses points de vie actuels augmentent de 5 pour toute la durée.\nEmplacement de niveau supérieur. Les points de vie de chaque cible augmentent de 5 de plus par niveau d'emplacement au-delà du 2°. Le<\/p>\n"}, {"nom": "Alarme", "ecole": "Abjuration", "niveau": 1, "classes": ["Magicien", "Rôdeur"], "incantation": "1 minute ou rituel", "portee": "9 m", "composantes": "V, S, M (une cloche et du fil d'argent) | PR larme vous alerte par un signal psy- n que vous soyez dans un rayon de 1,5 km tégée. Si vous dormez, ce signal vous réveille. e L'alarme produit le même son qu'une", "duree": "8 heures", "pages_source": [239], "description": "Vous disposez une alarme contre les intrus. Choisissez une porte, une fenêtre ou une zone à portée dont la taille n’excède pas un Cube de 6 m. Jusqu’à la fin du sort, vous êtes alerté chaque fois qu’une créature touche la zone protégée ou y pénètre. À l’incantation du sort, vous pouvez désigner des créatures qui ne déclencheront pas l’alarme. Vous choisissez également si l’alarme est mentale ou sonore :\n\n**Alarme mentale.** L’alarme vous alerte par un signal psychique, à condition que vous soyez dans un rayon de 1,5 km de la zone protégée. Si vous dormez, ce signal vous réveille.\n\n**Alarme sonore.** L’alarme produit le même son qu’une clochette, pendant 10 secondes, audible sur un rayon de 18 m de la zone protégée.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "alarme", "html_body": "<p>Vous disposez une alarme contre les intrus. Choisissez une porte, une fenêtre ou une zone à portée dont la taille n’excède pas un Cube de 6 m. Jusqu’à la fin du sort, vous êtes alerté chaque fois qu’une créature touche la zone protégée ou y pénètre. À l’incantation du sort, vous pouvez désigner des créatures qui ne déclencheront pas l’alarme. Vous choisissez également si l’alarme est mentale ou sonore :<\/p>\n<p><strong>Alarme mentale.<\/strong> L’alarme vous alerte par un signal psychique, à condition que vous soyez dans un rayon de 1,5 km de la zone protégée. Si vous dormez, ce signal vous réveille.<\/p>\n<p><strong>Alarme sonore.<\/strong> L’alarme produit le même son qu’une clochette, pendant 10 secondes, audible sur un rayon de 18 m de la zone protégée.<\/p>\n"}, {"nom": "Aliénation", "ecole": "Enchantement", "niveau": 8, "classes": ["Barde", "Druide", "Magicien", "Occultiste"], "incantation": "action", "portee": "45 m", "composantes": "V, S, M (l'anneau seul d’un trousseau de clefs)", "duree": "instantanée", "pages_source": [239], "description": "Vous assaillez l'esprit d'une créature que vous voyez à portée.\nLa cible effectue un jet de sauvegarde d'Intelligence. En cas d'échec, elle subit 10d12 dégâts psychiques et ne peut pas lancer de sort ni entreprendre l’action Magie. À l'issue de chaque tranche de 30 jours, la cible réitère le\nJS et met un terme à l'effet en cas de réussite. Les sorts guérison, restauration suprême et souhait mettent également chacun fin à l'effet. En cas de réussite, la cible subit uniquement la moitié de ces dégâts. me —", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "alienation", "html_body": "<p>Vous assaillez l'esprit d'une créature que vous voyez à portée.\nLa cible effectue un jet de sauvegarde d'Intelligence. En cas d'échec, elle subit 10d12 dégâts psychiques et ne peut pas lancer de sort ni entreprendre l’action Magie. À l'issue de chaque tranche de 30 jours, la cible réitère le\nJS et met un terme à l'effet en cas de réussite. Les sorts guérison, restauration suprême et souhait mettent également chacun fin à l'effet. En cas de réussite, la cible subit uniquement la moitié de ces dégâts. me —<\/p>\n"}, {"nom": "Allié Planaire", "ecole": "Invocation", "niveau": 6, "classes": ["Clerc"], "incantation": "10 minutes", "portee": "18 m", "composantes": "V, S", "duree": "instantanée", "pages_source": [239, 240], "description": "Vous implorez l'assistance d'une entité d'outre-monde. l'être doit vous être familier : un dieu, un prince démon ou toute autre entité de puissance cosmique. Il dépêche un Céleste, un Élémentaire ou un Fiélon parmi ses fidèles pour vous porter assistance, et la créature désignée se matérialise dans un espace inoccupé à portée. Si vous connaissez l'identité d'une créature donnée, vous pouvez prononcer son nom à l'incantation du sort pour la solliciter spécifiquement, mais rien ne vous garantit qu'une autre ne sera pas envoyée à sa place (à la discrétion du MD). Quand la créature se présente, rien ne la contraint à se comporter d'une manière ou d'une autre. Vous pouvez lui demander d'accomplir un service en contrepartie d'autre chose, mais elle n'est pas tenue d'y consentir. La tâche requise peut aller du simple (fais-nous franchir ce gouffre par les airs ou épaule-nous dans un combat) au plus complexe (espionne Dos ennemis ou protège-nous durant notre incursion dans moitié, voire dispensé. Les tâches sans xs risque voient généralement la rétribution réduite de moitié, tandis que les plus dangereuses entraînent des dons bien plus importants. Les créatures n'ont pas pour habitude d'accepter les missions qui s'annoncent suicidaires. Une fois la tâche accomplie par la créature ou la durée convenue pour le service écoulée, la créature retourne sur son plan d'origine après vous avoir fait son rapport dans la mesure du possible. Si vous ne pouvez convenir d'une rémunération pour les services de la créature, elle repart sans attendre sur son plan d'origine. ee =", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "allie-planaire", "html_body": "<p>Vous implorez l'assistance d'une entité d'outre-monde. l'être doit vous être familier : un dieu, un prince démon ou toute autre entité de puissance cosmique. Il dépêche un Céleste, un Élémentaire ou un Fiélon parmi ses fidèles pour vous porter assistance, et la créature désignée se matérialise dans un espace inoccupé à portée. Si vous connaissez l'identité d'une créature donnée, vous pouvez prononcer son nom à l'incantation du sort pour la solliciter spécifiquement, mais rien ne vous garantit qu'une autre ne sera pas envoyée à sa place (à la discrétion du MD). Quand la créature se présente, rien ne la contraint à se comporter d'une manière ou d'une autre. Vous pouvez lui demander d'accomplir un service en contrepartie d'autre chose, mais elle n'est pas tenue d'y consentir. La tâche requise peut aller du simple (fais-nous franchir ce gouffre par les airs ou épaule-nous dans un combat) au plus complexe (espionne Dos ennemis ou protège-nous durant notre incursion dans moitié, voire dispensé. Les tâches sans xs risque voient généralement la rétribution réduite de moitié, tandis que les plus dangereuses entraînent des dons bien plus importants. Les créatures n'ont pas pour habitude d'accepter les missions qui s'annoncent suicidaires. Une fois la tâche accomplie par la créature ou la durée convenue pour le service écoulée, la créature retourne sur son plan d'origine après vous avoir fait son rapport dans la mesure du possible. Si vous ne pouvez convenir d'une rémunération pour les services de la créature, elle repart sans attendre sur son plan d'origine. ee =<\/p>\n"}, {"nom": "Amélioration de Caractéristique", "ecole": "Transmutation", "niveau": 2, "classes": ["Barde", "Clerc", "Druide", "Ensorceleur", "Magicien", "Rôdeur"], "incantation": "À vérifier", "portee": "contact", "composantes": "V, S, M (une plume ou une touffe de fourrure)", "duree": "Concentration, jusqu'à 1 heure", "pages_source": [240], "description": "Vous touchez physiquement une créature et choisissez entre Force, Dextérité, Intelligence, Sagesse et Charisme. Pour toute la durée, la cible a l'Avantage aux tests de caractéristique associés à la caractéristique retenue.\nEmplacement de niveau supérieur. Vous pouvez cibler une créature supplémentaire par niveau d'emplacement au-delà du 2°. Vous pouvez opter pour une caractéristique différente pour chaque cible.", "illustration": null, "legende_illustration": null, "notes_verification": "champ_absent:incantation", "statut": "ocr_non_valide", "id": "amelioration-de-caracteristique", "html_body": "<p>Vous touchez physiquement une créature et choisissez entre Force, Dextérité, Intelligence, Sagesse et Charisme. Pour toute la durée, la cible a l'Avantage aux tests de caractéristique associés à la caractéristique retenue.\nEmplacement de niveau supérieur. Vous pouvez cibler une créature supplémentaire par niveau d'emplacement au-delà du 2°. Vous pouvez opter pour une caractéristique différente pour chaque cible.<\/p>\n"}, {"nom": "Amitié avec les Animaux", "ecole": "Enchantement", "niveau": 1, "classes": ["Barde", "Druide", "Rôdeur"], "incantation": "action", "portee": "9 m", "composantes": "V, S, M (un peu de nourriture)", "duree": "24 heures", "pages_source": [240], "description": "Ciblez une Bête que vous voyez à portée. La cible doit réussir un jet de sauvegarde de Sagesse sous peine de subir l’état\nCharmé pour toute la durée du sort. Si vous ou l’un de vos alliés infligez des dégâts à la cible, le sort prend fin.\nEmplacement de niveau supérieur. Vous pouvez affecter une\nBête supplémentaire par niveau d'emplacement au-delà du 1*. mines à rique MOREL DUO V7 — --25u)d", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "amitie-avec-les-animaux", "html_body": "<p>Ciblez une Bête que vous voyez à portée. La cible doit réussir un jet de sauvegarde de Sagesse sous peine de subir l’état\nCharmé pour toute la durée du sort. Si vous ou l’un de vos alliés infligez des dégâts à la cible, le sort prend fin.\nEmplacement de niveau supérieur. Vous pouvez affecter une\nBête supplémentaire par niveau d'emplacement au-delà du 1*. mines à rique MOREL DUO V7 — --25u)d<\/p>\n"}, {"nom": "Animation des Morts", "ecole": "Nécromancie", "niveau": 3, "classes": ["Clerc", "Magicien"], "incantation": "1 minute .", "portee": "3 m", "composantes": "V,S, M (une goutte de sang, un Fed rage ie L ' Choisissez un tas d'os ou un cadavre à portée, tiré d'un Humanoïde de taille M ou P. La cible devient un Mort- vivant : un squelette si vous avez opté pour des os ou un zombi si vous avez choisi un cadavre (profil de la créature en annexe B). À chacun de vos tours, vous pouvez consacrer une action Bonus à donner des ordres mentaux à toute créature que vous avez créée par ce sort et qui se trouve dans un rayon de 18 m. Vous pouvez ainsi contrôler plusieurs créatures, en les choisissant, à condition de leur intimer le même ordre. Vous décidez quelle action la créature va entreprendre et où elle se déplacera à son tour suivant, ou pouvez vous contenter de donner une instruction générale, comme garder une salle ou un couloir. Sans instruction de votre part, la créature entreprend l’action Esquive et ne se déplace que pour éviter les dangers. Une fois qu’elle a reçu un ordre, la créature s'y soumet jusqu’à ce que la tâche soit accomplie. La créature reste sous votre contrôle pendant 24 heures, après quoi elle cesse d'obéir aux ordres que vous lui avez", "duree": "À vérifier", "pages_source": [240], "description": "Vous décidez quelle action la créature va entreprendre et où elle se déplacera à son tour suivant, ou pouvez vous contenter de donner une instruction générale, comme garder une salle ou un couloir. Sans instruction de votre part, la créature entreprend l’action Esquive et ne se déplace que pour éviter les dangers. Une fois qu’elle a reçu un ordre, la créature s'y soumet jusqu’à ce que la tâche soit accomplie. La créature reste sous votre contrôle pendant 24 heures, après quoi elle cesse d'obéir aux ordres que vous lui avez donnés. Pour en garder le contrôle pendant 24 heures de plus, vous devez relancer ce sort sur lui avant la fin des 24 heures en cours. Relancer le sort ainsi réaffirme votre emprise sur un maximum de quatre créatures que vous avez animées par ce sort, au lieu d'en animer une nouvelle.\nEmplacement de niveau supérieur. Vous prenez ou prolongez le contrôle de deux Morts-vivants supplémentaires par niveau d'emplacement au-delà du 3°. Chacune de ces créatures doit être issue d’un tas d'os ou cadavre différent.", "illustration": null, "legende_illustration": null, "notes_verification": "champ_absent:duree", "statut": "ocr_non_valide", "id": "animation-des-morts", "html_body": "<p>Vous décidez quelle action la créature va entreprendre et où elle se déplacera à son tour suivant, ou pouvez vous contenter de donner une instruction générale, comme garder une salle ou un couloir. Sans instruction de votre part, la créature entreprend l’action Esquive et ne se déplace que pour éviter les dangers. Une fois qu’elle a reçu un ordre, la créature s'y soumet jusqu’à ce que la tâche soit accomplie. La créature reste sous votre contrôle pendant 24 heures, après quoi elle cesse d'obéir aux ordres que vous lui avez donnés. Pour en garder le contrôle pendant 24 heures de plus, vous devez relancer ce sort sur lui avant la fin des 24 heures en cours. Relancer le sort ainsi réaffirme votre emprise sur un maximum de quatre créatures que vous avez animées par ce sort, au lieu d'en animer une nouvelle.\nEmplacement de niveau supérieur. Vous prenez ou prolongez le contrôle de deux Morts-vivants supplémentaires par niveau d'emplacement au-delà du 3°. Chacune de ces créatures doit être issue d’un tas d'os ou cadavre différent.<\/p>\n"}, {"nom": "Animation des Objets", "ecole": "Transmutation", "niveau": 5, "classes": ["Barde", "Ensorceleur", "Magicien"], "incantation": "action", "portee": "36 m", "composantes": "V, S", "duree": "Concentration, jusqu'à 1 minute", "pages_source": [240, 241], "description": "Les objets s'animent selon vos ordres. Choisissez des objets non magiques à portée qui ne sont portés par personne, ne sont fixés à aucune surface et ne sont pas de taille Gig. Le maximum d'objets que vous pouvez animer est égal à votre modificateur de caractéristique d’incantation ; dans ce cadre, une cible de taille M ou inférieure compte pour un objet, une cible de taille G pour deux et une cible de taille\nTG pour trois. Chaque cible s'anime, se dote de pattes et devient un Artificiel reprenant le profil de l’objet animé ; la créature reste sous votre contrôle jusqu’à la fin du sort ou qu’elle tombe à O point de vie. Chaque créature ainsi créée constitue un allié pour vous et vos alliés. Au combat, elle partage votre rang d’Initiative, mais elle joue son tour juste après vous. Jusqu'à la fin du sort, vous pouvez par une action Bonus donner des ordres mentaux à toute créature que vous avez créée par ce sort et qui se trouve dans un rayon de 150 m. Vous pouvez ainsi contrôler plusieurs créatures, en les choisissant, à condition de leur intimer le même ordre. Sans instruction de votre part, la créature entreprend l’action\nEsquive et ne se déplace que pour éviter les dangers. Quand la créature tombe à O point de vie, elle retrouve sa forme de départ, tous les dégâts excédentaires étant répercutés sur celle-ci. UN BRASERO AFFECTÉ PAR LE ORT ANIMATION DES OBJETS OBJET ANIMÉ Artificiel de taille TG ou inférieure, non ali CA 15 Pv 10 (taille M ou inférieure), 20 (G), 40 (TC) Vitesse 9 m ne Le FOR 16 +3 +3 DEx 10 +0 +0 Con10 +0 +0 INT 3 4 -4 Sac 3 -4 -4 CHA ll -5 -5 Immunités poison, psychiques ; Charmé, Effrayé, Empoisonné, Épuisement, Paralysé Sens Vision aveugle 9 m, Perception passive 6 Langues comprend les langues que vous parlez FP aucun (PX 0 ; BM égal à votre bonus de maîtrise) ACTIONS\nCoup. Corps à corps : bonus égal à votre modificateur d'attaque des sorts, allonge 1,50 m. Touché : dégâts de force égaux à 1d4 + 3 (taille M ou inférieure), 2d6 + 3 + votre modificateur de caractéristique d’incantation (G), ou 2d12 + 3 + votre modificateur de caractéristique d'incantation (TG).\nEmplacement de niveau supérieur. Les dégâts de Coup de la créature augmentent de 1d4 (taille M ou inférieure), Id6 (taille G) ou 1d12 (taille TG) par niveau d'emplacement au-delà du 5°.", "illustration": null, "legende_illustration": null, "notes_verification": "encadre_statistiques_a_controler", "statut": "ocr_non_valide", "id": "animation-des-objets", "html_body": "<p>Les objets s'animent selon vos ordres. Choisissez des objets non magiques à portée qui ne sont portés par personne, ne sont fixés à aucune surface et ne sont pas de taille Gig. Le maximum d'objets que vous pouvez animer est égal à votre modificateur de caractéristique d’incantation ; dans ce cadre, une cible de taille M ou inférieure compte pour un objet, une cible de taille G pour deux et une cible de taille\nTG pour trois. Chaque cible s'anime, se dote de pattes et devient un Artificiel reprenant le profil de l’objet animé ; la créature reste sous votre contrôle jusqu’à la fin du sort ou qu’elle tombe à O point de vie. Chaque créature ainsi créée constitue un allié pour vous et vos alliés. Au combat, elle partage votre rang d’Initiative, mais elle joue son tour juste après vous. Jusqu'à la fin du sort, vous pouvez par une action Bonus donner des ordres mentaux à toute créature que vous avez créée par ce sort et qui se trouve dans un rayon de 150 m. Vous pouvez ainsi contrôler plusieurs créatures, en les choisissant, à condition de leur intimer le même ordre. Sans instruction de votre part, la créature entreprend l’action\nEsquive et ne se déplace que pour éviter les dangers. Quand la créature tombe à O point de vie, elle retrouve sa forme de départ, tous les dégâts excédentaires étant répercutés sur celle-ci. UN BRASERO AFFECTÉ PAR LE ORT ANIMATION DES OBJETS OBJET ANIMÉ Artificiel de taille TG ou inférieure, non ali CA 15 Pv 10 (taille M ou inférieure), 20 (G), 40 (TC) Vitesse 9 m ne Le FOR 16 +3 +3 DEx 10 +0 +0 Con10 +0 +0 INT 3 4 -4 Sac 3 -4 -4 CHA ll -5 -5 Immunités poison, psychiques ; Charmé, Effrayé, Empoisonné, Épuisement, Paralysé Sens Vision aveugle 9 m, Perception passive 6 Langues comprend les langues que vous parlez FP aucun (PX 0 ; BM égal à votre bonus de maîtrise) ACTIONS\nCoup. Corps à corps : bonus égal à votre modificateur d'attaque des sorts, allonge 1,50 m. Touché : dégâts de force égaux à 1d4 + 3 (taille M ou inférieure), 2d6 + 3 + votre modificateur de caractéristique d’incantation (G), ou 2d12 + 3 + votre modificateur de caractéristique d'incantation (TG).\nEmplacement de niveau supérieur. Les dégâts de Coup de la créature augmentent de 1d4 (taille M ou inférieure), Id6 (taille G) ou 1d12 (taille TG) par niveau d'emplacement au-delà du 5°.<\/p>\n"}, {"nom": "Antidétection", "ecole": "Abjuration", "niveau": 3, "classes": ["Barde", "Magicien", "Rôdeur"], "incantation": "action", "portee": "contact", "composantes": "V, S, M (une pincée de poudre de diamant d’une valeur minimale de 25 po, que le sort détruit)", "duree": "8 heures", "pages_source": [241], "description": "Pour toute la durée, vous cachez aux sorts de Divination une cible que vous touchez. La cible doit être une créature consentante, ou un lieu ou objet dont aucune dimension n'excède 3 m. Elle ne peut alors être ciblée par quelque sort de Divination que ce soit, ni perçue par des capteurs de scrutation magique. — .", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "antidetection", "html_body": "<p>Pour toute la durée, vous cachez aux sorts de Divination une cible que vous touchez. La cible doit être une créature consentante, ou un lieu ou objet dont aucune dimension n'excède 3 m. Elle ne peut alors être ciblée par quelque sort de Divination que ce soit, ni perçue par des capteurs de scrutation magique. — .<\/p>\n"}, {"nom": "Apaisement des Émotions", "ecole": "Enchantement", "niveau": 2, "classes": ["Barde", "Clerc"], "incantation": "action", "portee": "18 m", "composantes": "V, S", "duree": "Concentration, jusqu'à 1 minute", "pages_source": [241], "description": "Chaque Humanoïde pris dans une Sphère de 6 m de rayon centrée sur un point que vous choisissez à portée doit réussir un jet de sauvegarde de Charisme, sous peine d’être affecté par l'un des effets suivants (choisissez pour chaque créature) : La créature est immunisée contre les états Charmé et\nEffrayé jusqu'à la fin du sort. Si la créature était déjà Charmée ou Effrayée, ces états sont réprimés pour toute la durée. Vous pouvez choisir des créatures envers lesquelles la cible est Hostile ; celle-ci devient Indifférente à leur égard. Cette indifférence prend fin si la cible subit des dégâts ou est témoin de dégâts subis par ses alliés. Quand le sort prend fin, l'attitude de la créature revient à la normale. L ee ———— —", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "apaisement-des-emotions", "html_body": "<p>Chaque Humanoïde pris dans une Sphère de 6 m de rayon centrée sur un point que vous choisissez à portée doit réussir un jet de sauvegarde de Charisme, sous peine d’être affecté par l'un des effets suivants (choisissez pour chaque créature) : La créature est immunisée contre les états Charmé et\nEffrayé jusqu'à la fin du sort. Si la créature était déjà Charmée ou Effrayée, ces états sont réprimés pour toute la durée. Vous pouvez choisir des créatures envers lesquelles la cible est Hostile ; celle-ci devient Indifférente à leur égard. Cette indifférence prend fin si la cible subit des dégâts ou est témoin de dégâts subis par ses alliés. Quand le sort prend fin, l'attitude de la créature revient à la normale. L ee ———— —<\/p>\n"}, {"nom": "Apparence Trompeuse", "ecole": "Illusion", "niveau": 5, "classes": ["Barde", "Ensorceleur", "Magicien"], "incantation": "action", "portee": "9 m", "composantes": "V, S", "duree": "8 heures", "pages_source": [241, 242], "description": "Vous modifiez de manière illusoire l'aspect des créatures que vous choisissez parmi celles que vous voyez à portée. Une créature non consentante peut effectuer un jet de sauvegarde de Charisme. En cas de réussite, elle n'est pas affectée par le sort. Vous pouvez donner le même aspect à chaque cible ou varier les illusions. Le sort altère l'aspect du corps des cibles comme de leur équipement. Vous pouvez aussi les faire paraître plus grandes ou plus petites, individuellement, rrence de 30 cm, et les faire passer pour plus lourdes res. Le nouvel aspect de chaque cible doit préconfiguration de membres que la sienne, sauvegarde de tie ue TON TT", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "apparence-trompeuse", "html_body": "<p>Vous modifiez de manière illusoire l'a

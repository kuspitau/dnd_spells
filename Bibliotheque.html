egarde trois fois contre le sort, celui-ci prend fin. Si elle ate son JS trois fois, elle se transforme en pierre et reste soumise à l’état Pétrifié pour toute la durée. Ces réussites et “checs n'ont pas besoin d’être consécutifs ; notez-les quelque Jart, jusqu'à ce que la cible atteigne un total de trois pour ‘un ou l’autre. Si vous maintenez votre Concentration sur ce sort pendant toute la durée possible, la cible est Pétrifiée jusqu'à e que l’état soit éliminé par restauration suprême ou une nagie équivalente.", "illustration": null, "legende_illustration": null, "notes_verification": "champ_absent:incantation", "statut": "ocr_non_valide", "id": "petrification", "html_body": "<p>Vous tentez de transformer en pierre une créature que vous voyez à portée. La cible effectue un jet de sauvegarde le Constitution. En cas d'échec, elle subit l’état Entravé\nJour toute la durée. En cas de réussite, sa Vitesse tombe à O jusqu'au début de votre tour suivant. Les Artificiels ‘éussissent automatiquement ce JS. Une créature ainsi Entravée réitère le jet de sauvegarde le Constitution à la fin de chacun de ses tours. Si elle se sauvegarde trois fois contre le sort, celui-ci prend fin. Si elle ate son JS trois fois, elle se transforme en pierre et reste soumise à l’état Pétrifié pour toute la durée. Ces réussites et “checs n'ont pas besoin d’être consécutifs ; notez-les quelque Jart, jusqu'à ce que la cible atteigne un total de trois pour ‘un ou l’autre. Si vous maintenez votre Concentration sur ce sort pendant toute la durée possible, la cible est Pétrifiée jusqu'à e que l’état soit éliminé par restauration suprême ou une nagie équivalente.<\/p>\n"}, {"nom": "Piqûre mentale", "ecole": "Enchantement", "niveau": 0, "classes": ["Ensorceleur", "Magicien", "Occultiste"], "incantation": "À vérifier", "portee": "À vérifier", "composantes": "V", "duree": "1 round", "pages_source": [317, 318], "description": "Vous tentez de picoter l'esprit d’une créature que vous royez à portée. La cible doit réussir un jet de sauvegarde l'Intelligence sous peine de subir 1d6 dégâts psychiques et de oustraire 1d4 à son prochain jet de sauvegarde intervenant vant la fin de votre tour suivant.\nAmélioration de sort mineur. Les dégâts augmentent de d6 lorsque vous atteignez les niveaux 5 (2d6), 11 (3d6) et 7 (4d6).\n\nLe BaroE OTrrTo LANCE PORTAIL POUR\nOUVRIR UN ACCÈS VERS LES CONFINS. n \\", "illustration": null, "legende_illustration": null, "notes_verification": "champ_absent:incantation; champ_absent:portee", "statut": "ocr_non_valide", "id": "piqure-mentale", "html_body": "<p>Vous tentez de picoter l'esprit d’une créature que vous royez à portée. La cible doit réussir un jet de sauvegarde l'Intelligence sous peine de subir 1d6 dégâts psychiques et de oustraire 1d4 à son prochain jet de sauvegarde intervenant vant la fin de votre tour suivant.\nAmélioration de sort mineur. Les dégâts augmentent de d6 lorsque vous atteignez les niveaux 5 (2d6), 11 (3d6) et 7 (4d6).<\/p>\n<p>Le BaroE OTrrTo LANCE PORTAIL POUR\nOUVRIR UN ACCÈS VERS LES CONFINS. n \\<\/p>\n"}, {"nom": "Poigne Électrique", "ecole": "Évocation", "niveau": 0, "classes": ["Ensorceleur", "Magicien"], "incantation": "À vérifier", "portee": "contact", "composantes": "V, S", "duree": "instantanée", "pages_source": [318], "description": "La foudre jaillit de vous vers une créature que vous tentez de toucher. Effectuez une attaque de sort au corps à corps contre la cible. Si l'attaque touche, la cible subit 1d8 dégâts de foudre et ne peut pas effectuer d'attaque d'Opportunité jusqu'au début de son tour suivant.\nAmélioration de sort mineur. Les dégâts augmentent de 1d8 lorsque vous atteignez les niveaux 5 (2d8), 11 (3d8) et 17 (4d8).", "illustration": null, "legende_illustration": null, "notes_verification": "champ_absent:incantation", "statut": "ocr_non_valide", "id": "poigne-electrique", "html_body": "<p>La foudre jaillit de vous vers une créature que vous tentez de toucher. Effectuez une attaque de sort au corps à corps contre la cible. Si l'attaque touche, la cible subit 1d8 dégâts de foudre et ne peut pas effectuer d'attaque d'Opportunité jusqu'au début de son tour suivant.\nAmélioration de sort mineur. Les dégâts augmentent de 1d8 lorsque vous atteignez les niveaux 5 (2d8), 11 (3d8) et 17 (4d8).<\/p>\n"}, {"nom": "Portail", "ecole": "Invocation", "niveau": 9, "classes": ["Clerc", "Ensorceleur", "Magicien", "Occultiste"], "incantation": "action", "portee": "18 m", "composantes": "V, S, M (un diamant d'une valeur minimale de 5 000 po)", "duree": "Concentration, jusqu’à 1 minute", "pages_source": [318], "description": "Vous invoquez un portail reliant un espace inoccupé que vous voyez à portée à un lieu précis sur un autre plan d'existence. Le portail se présente comme une ouverture circulaire dont le diamètre peut aller de 1,50 m à 6 m. Vous l'orientez dans la direction de votre choix. Le portail per- 318 CHAPITRE 7 | SORTS siste pour toute la durée, sa destination étant visible par l'ouverture. Le portail est doté d'une face avant et d'une face arrière, sur chaque plan où il apparaît. Emprunter le portail n'est possible que si on le franchit par sa face avant. Tout ce qui le franchit ainsi est aussitôt transporté sur l’autre plan, pour apparaître dans l’espace inoccupé le plus proche du portail. Les divinités et autres souverains planaires peuvent empêcher les portails engendrés par ce sort de s'ouvrir en leur présence, voire où que ce soit en leur domaine. À l'incantation du sort, vous pouvez prononcer le nom d'une créature donnée (un pseudonyme, un titre ou un surnom ne suffisent pas). Si cette créature se trouve sur un plan autre que celui que vous occupez, le portail s'ouvre à proximité de la créature et la transporte jusqu’à l'espace inoccupé le plus proche du portail, sur votre plan. Vous n'avez nulle emprise particulière sur la créature, qui est libre d’agir à l'appréciation du MD. Elle peut ainsi s’en aller, vous attaquer ou vous aider.", "illustration": null, "legende_illustration": null, "notes_verification": "symboles_suspects", "statut": "ocr_non_valide", "id": "portail", "html_body": "<p>Vous invoquez un portail reliant un espace inoccupé que vous voyez à portée à un lieu précis sur un autre plan d'existence. Le portail se présente comme une ouverture circulaire dont le diamètre peut aller de 1,50 m à 6 m. Vous l'orientez dans la direction de votre choix. Le portail per- 318 CHAPITRE 7 | SORTS siste pour toute la durée, sa destination étant visible par l'ouverture. Le portail est doté d'une face avant et d'une face arrière, sur chaque plan où il apparaît. Emprunter le portail n'est possible que si on le franchit par sa face avant. Tout ce qui le franchit ainsi est aussitôt transporté sur l’autre plan, pour apparaître dans l’espace inoccupé le plus proche du portail. Les divinités et autres souverains planaires peuvent empêcher les portails engendrés par ce sort de s'ouvrir en leur présence, voire où que ce soit en leur domaine. À l'incantation du sort, vous pouvez prononcer le nom d'une créature donnée (un pseudonyme, un titre ou un surnom ne suffisent pas). Si cette créature se trouve sur un plan autre que celui que vous occupez, le portail s'ouvre à proximité de la créature et la transporte jusqu’à l'espace inoccupé le plus proche du portail, sur votre plan. Vous n'avez nulle emprise particulière sur la créature, qui est libre d’agir à l'appréciation du MD. Elle peut ainsi s’en aller, vous attaquer ou vous aider.<\/p>\n"}, {"nom": "Portail Arcanique", "ecole": "Invocation", "niveau": 6, "classes": ["Ensorceleur", "Magicien", "Occultiste"], "incantation": "action", "portee": "150 m", "composantes": "V, S", "duree": "Concentration, jusqu'à 10 minutes", "pages_source": [318, 319], "description": "Vous créez des portails de téléportation reliés. Choisissez 6 deux espaces inoccupés que vous voyez, de taille G et au . sol, l'un d'eux étant à portée et l’autre dans un rayon de 3 m S se Piésentens comme des cercles luisants en dimensions, remplis d'une brume opaque. Ils flottent qisiques ‘cestitubtres au-dessus du sol, auquel ils sont perpendiculaires. Chaque portail n’est ouvert que d'un côté (que vous choisissez). Tout ce qui franchit le côté ouvert d'un portail ressort aussitôt par le côté ouvert de l’autre portail, comme si les deux étaient adjacents. Par une action Bonus, vous pouvez changer l'orientation des côtés ouverts.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "portail-arcanique", "html_body": "<p>Vous créez des portails de téléportation reliés. Choisissez 6 deux espaces inoccupés que vous voyez, de taille G et au . sol, l'un d'eux étant à portée et l’autre dans un rayon de 3 m S se Piésentens comme des cercles luisants en dimensions, remplis d'une brume opaque. Ils flottent qisiques ‘cestitubtres au-dessus du sol, auquel ils sont perpendiculaires. Chaque portail n’est ouvert que d'un côté (que vous choisissez). Tout ce qui franchit le côté ouvert d'un portail ressort aussitôt par le côté ouvert de l’autre portail, comme si les deux étaient adjacents. Par une action Bonus, vous pouvez changer l'orientation des côtés ouverts.<\/p>\n"}, {"nom": "Porte Dimensionnelle", "ecole": "Invocation", "niveau": 4, "classes": ["Barde", "Ensorceleur", "Magicien", "Occultiste"], "incantation": "action", "portee": "150 m", "composantes": "V", "duree": "instantanée", "pages_source": [319], "description": "Vous vous téléportez en un lieu à portée. Vous arrivez précisément à l'endroit désiré. Il peut s'agir d'un lieu que vous voyez, que vous visualisez ou dont vous pouvez spécifier la distance et la direction, comme « 60 m directement en contrebas » ou « en montant vers le nord-ouest à 45 degrés sur 90 m ».\nVous pouvez aussi téléporter une créature consentante. Celle-ci doit se trouver dans un rayon de 1,50 m de vous quand vous vous téléportez, et réapparaît dans un rayon de 1,50 m de votre espace de destination. Si le sort est censé vous transporter (ou l’autre créature) en un lieu déjà occupé par une créature ou complètement obstrué par un ou plusieurs objets, vous et toute créature qui vous accompagne subissez chacun 4d6 dégâts de force et le sort ne vous téléporte pas.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "porte-dimensionnelle", "html_body": "<p>Vous vous téléportez en un lieu à portée. Vous arrivez précisément à l'endroit désiré. Il peut s'agir d'un lieu que vous voyez, que vous visualisez ou dont vous pouvez spécifier la distance et la direction, comme « 60 m directement en contrebas » ou « en montant vers le nord-ouest à 45 degrés sur 90 m ».\nVous pouvez aussi téléporter une créature consentante. Celle-ci doit se trouver dans un rayon de 1,50 m de vous quand vous vous téléportez, et réapparaît dans un rayon de 1,50 m de votre espace de destination. Si le sort est censé vous transporter (ou l’autre créature) en un lieu déjà occupé par une créature ou complètement obstrué par un ou plusieurs objets, vous et toute créature qui vous accompagne subissez chacun 4d6 dégâts de force et le sort ne vous téléporte pas.<\/p>\n"}, {"nom": "Possession", "ecole": "Nécromancie", "niveau": 6, "classes": ["Magicien"], "incantation": "1 minute", "portee": "personnelle", "composantes": "V, S, M (une gemme, un cristal ou un reliquaire d'une valeur minimale de 500 po)", "duree": "jusqu'à dissipation", "pages_source": [319], "description": "Votre corps sombre en catatonie tandis que votre âme le quitte pour pénétrer dans le récipient ayant servi de composante matérielle. Tant que votre âme occupe ce contenant, vous restez conscient de l'environnement comme si vous occupiez l'espace du récipient. Vous ne pouvez pas vous déplacer ni jouer de Réactions. La seule action que vous puissiez entreprendre consiste à projeter votre âme à une distance maximale de 30 m du récipient, soit en reprenant possession de votre corps (ce qui met un terme au sort) soit en tentant de posséder un autre corps Humanoïde. Vous pouvez tenter de posséder tout Humanoïde dans un rayon de 30 m de vous, à condition de le voir (les créatures protégées par le sort cercle magique ou protection contre le mal et le bien ne peuvent pas être possédées). La cible effectue un jet de sauvegarde de Charisme. En cas d'échec, votre âme se transporte dans le corps de la cible et l’âme de celle-ci se retrouve séquestrée dans le récipient. En cas de réussite, attendre 24 heures pour essayer à nouveau de la posséder. Une fois que vous possédez le corps d'une créature, vous la contrôlez. Vos points de vie et dés de vie, vos valeurs de Force, Dextérité et Constitution, votre Vitesse et vos sens sont remplacés par ceux de la créature. Vous conservez pour le reste votre profil. De son côté, l’âme de la créature possédée peut percevoir l'environnement depuis le récipient en usant de ses propres sens, mais elle ne peut pas se déplacer et subit l'état Neutralisé. Tant que vous possédez un corps, vous pouvez entreprendre l’action Magie pour quitter le corps hôte et retourner dans le récipient si celui-ci se trouve dans un rayon de 30 m, l'âme de la créature hôte retrouvant alors son corps. Si le corps hôte meurt alors que vous le possédez, la créature meurt et vous effectuez un jet de sauvegarde de Charisme contre votre propre DD de sauvegarde des sorts. En cas de réussite, vous retournez dans le récipient si celui-ci se trouve dans un rayon de 30 m. Dans le cas contraire, vous mourez. Si le contenant est détruit ou que le sort prend fin, votre âme retrouve votre corps. Si votre corps est distant de plus de 30 m de vous ou s’il est « mort », vous mourez. Si l'âme d'une autre créature occupe le récipient lorsqu'il est détruit, l'âme de celle-ci retrouve son corps s’il est vivant et dans un rayon de 30 m d'elle. Sans cela, la créature meurt.\nLe récipient est détruit quand le sort prend fin.", "illustration": null, "legende_illustration": null, "notes_verification": "encadre_statistiques_a_controler", "statut": "ocr_non_valide", "id": "possession", "html_body": "<p>Votre corps sombre en catatonie tandis que votre âme le quitte pour pénétrer dans le récipient ayant servi de composante matérielle. Tant que votre âme occupe ce contenant, vous restez conscient de l'environnement comme si vous occupiez l'espace du récipient. Vous ne pouvez pas vous déplacer ni jouer de Réactions. La seule action que vous puissiez entreprendre consiste à projeter votre âme à une distance maximale de 30 m du récipient, soit en reprenant possession de votre corps (ce qui met un terme au sort) soit en tentant de posséder un autre corps Humanoïde. Vous pouvez tenter de posséder tout Humanoïde dans un rayon de 30 m de vous, à condition de le voir (les créatures protégées par le sort cercle magique ou protection contre le mal et le bien ne peuvent pas être possédées). La cible effectue un jet de sauvegarde de Charisme. En cas d'échec, votre âme se transporte dans le corps de la cible et l’âme de celle-ci se retrouve séquestrée dans le récipient. En cas de réussite, attendre 24 heures pour essayer à nouveau de la posséder. Une fois que vous possédez le corps d'une créature, vous la contrôlez. Vos points de vie et dés de vie, vos valeurs de Force, Dextérité et Constitution, votre Vitesse et vos sens sont remplacés par ceux de la créature. Vous conservez pour le reste votre profil. De son côté, l’âme de la créature possédée peut percevoir l'environnement depuis le récipient en usant de ses propres sens, mais elle ne peut pas se déplacer et subit l'état Neutralisé. Tant que vous possédez un corps, vous pouvez entreprendre l’action Magie pour quitter le corps hôte et retourner dans le récipient si celui-ci se trouve dans un rayon de 30 m, l'âme de la créature hôte retrouvant alors son corps. Si le corps hôte meurt alors que vous le possédez, la créature meurt et vous effectuez un jet de sauvegarde de Charisme contre votre propre DD de sauvegarde des sorts. En cas de réussite, vous retournez dans le récipient si celui-ci se trouve dans un rayon de 30 m. Dans le cas contraire, vous mourez. Si le contenant est détruit ou que le sort prend fin, votre âme retrouve votre corps. Si votre corps est distant de plus de 30 m de vous ou s’il est « mort », vous mourez. Si l'âme d'une autre créature occupe le récipient lorsqu'il est détruit, l'âme de celle-ci retrouve son corps s’il est vivant et dans un rayon de 30 m d'elle. Sans cela, la créature meurt.\nLe récipient est détruit quand le sort prend fin.<\/p>\n"}, {"nom": "Poussière D'Étoile", "ecole": "Évocation", "niveau": 0, "classes": ["Barde", "Druide"], "incantation": "action", "portee": "18 m", "composantes": "V, S", "duree": "instantanée", "pages_source": [319], "description": "Vous projetez une particule de lumière vers une créature ou un objet à portée. Effectuez une attaque de sort à distance contre la cible. Si l'attaque touche, la cible subit 1d8 dégâts radiants et, jusqu'à la fin de votre tour suivant, elle émet une Lumière faible dans un rayon de 3 m et ne peut bénéficier de l'état Invisible.\nAmélioration de sort mineur. Les dégâts augmentent de 1d8 lorsque vous atteignez les niveaux 5 (2d8), 11 (3d8) et 17 (4d8).", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "poussiere-d-etoile", "html_body": "<p>Vous projetez une particule de lumière vers une créature ou un objet à portée. Effectuez une attaque de sort à distance contre la cible. Si l'attaque touche, la cible subit 1d8 dégâts radiants et, jusqu'à la fin de votre tour suivant, elle émet une Lumière faible dans un rayon de 3 m et ne peut bénéficier de l'état Invisible.\nAmélioration de sort mineur. Les dégâts augmentent de 1d8 lorsque vous atteignez les niveaux 5 (2d8), 11 (3d8) et 17 (4d8).<\/p>\n"}, {"nom": "Préméditation", "ecole": "Abjuration", "niveau": 6, "classes": ["Magicien"], "incantation": "10 minutes", "portee": "personnelle", "composantes": "V, S, M (une statuette en ivoire incrustée de gemmes, à votre image, d’une valeur minimale de 1 500 po)", "duree": "10 jours", "pages_source": [319, 320], "description": "Choisissez un sort du 5° niveau ou inférieur que vous pouvez lancer, dont le temps d'incantation est d'une action et qui peut vous cibler. Vous lancez le sort concerné, qu'on appellera « sort prémédité », dans le cadre de l'incantation de préméditation, et acquittez les emplacements des deux sorts. Le sort prémédité n'agit toutefois pas aussitôt. Au lieu de cela, il ne prendra effet que lorsqu'un déclencheur précis E CHAPITRE 7 | SORTS d& : conditions sont réunies pour la precaibes fois, que le vouliez ou non, puis la préméditation prend fin. Le sort prémédité ne prend effet que sur vous, même s'il est susceptible d'avoir d’autres cibles en temps normal. Vous ne pouvez recourir qu'à un sort de préméditation à la fois. Si vous relancez ce sort, la préméditation qui vous affectait déjà prend fin. La préméditation prend également fin si sa composante matérielle n'est plus sur vous. mens “ue, \\”", "illustration": null, "legende_illustration": null, "notes_verification": "symboles_suspects", "statut": "ocr_non_valide", "id": "premeditation", "html_body": "<p>Choisissez un sort du 5° niveau ou inférieur que vous pouvez lancer, dont le temps d'incantation est d'une action et qui peut vous cibler. Vous lancez le sort concerné, qu'on appellera « sort prémédité », dans le cadre de l'incantation de préméditation, et acquittez les emplacements des deux sorts. Le sort prémédité n'agit toutefois pas aussitôt. Au lieu de cela, il ne prendra effet que lorsqu'un déclencheur précis E CHAPITRE 7 | SORTS d&amp; : conditions sont réunies pour la precaibes fois, que le vouliez ou non, puis la préméditation prend fin. Le sort prémédité ne prend effet que sur vous, même s'il est susceptible d'avoir d’autres cibles en temps normal. Vous ne pouvez recourir qu'à un sort de préméditation à la fois. Si vous relancez ce sort, la préméditation qui vous affectait déjà prend fin. La préméditation prend également fin si sa composante matérielle n'est plus sur vous. mens “ue, \\”<\/p>\n"}, {"nom": "Prémonition", "ecole": "Divination", "niveau": 9, "classes": ["Barde", "Druide", "Magicien", "Occultiste"], "incantation": "1 minute", "portee": "contact", "composantes": "V, S, M (une plume de colibri)", "duree": "8 heures", "pages_source": [320], "description": "Vous touchez physiquement une créature consentante pour lui octroyer la faculté d'entrevoir l'avenir immédiat. Pour toute la durée, la cible a l'Avantage aux Tests d20 et les autres créatures subissent le Désavantage aux jets d'attaque contre elle. Le sort prend fin prématurément si vous le lancez à nouveau.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "premonition", "html_body": "<p>Vous touchez physiquement une créature consentante pour lui octroyer la faculté d'entrevoir l'avenir immédiat. Pour toute la durée, la cible a l'Avantage aux Tests d20 et les autres créatures subissent le Désavantage aux jets d'attaque contre elle. Le sort prend fin prématurément si vous le lancez à nouveau.<\/p>\n"}, {"nom": "Présence Royale de Yolane", "ecole": "Enchantement", "niveau": 5, "classes": ["Barde", "Magicien"], "incantation": "À vérifier", "portee": "personnelle", "composantes": "V, S, M (un diadème miniature)", "duree": "Concentration, jusqu’à 1 minute", "pages_source": [320], "description": "Vous vous enveloppez d’une prestance surnaturelle sous forme d'une Émanation de 3 m. Chaque fois que l’'Émanation pénètre dans l'espace d'une créature que vous voyez, ainsi que chaque fois qu'une créature que vous voyez pénètre dans l’'Émanation ou y termine son tour, vous pouvez la contraindre à un jet de sauvegarde de Sagesse. En cas d'échec, la cible subit 4d6 dégâts psychiques, ainsi que l’état\nÀ terre, et vous pouvez la repousser d'un maximum de 3 m. En cas de réussite, la cible subit uniquement la moitié de ces dégâts. Une même créature n'effectue en aucun cas ce JS plus d'une fois par tour. ‘ na Ve", "illustration": null, "legende_illustration": null, "notes_verification": "champ_absent:incantation", "statut": "ocr_non_valide", "id": "presence-royale-de-yolane", "html_body": "<p>Vous vous enveloppez d’une prestance surnaturelle sous forme d'une Émanation de 3 m. Chaque fois que l’'Émanation pénètre dans l'espace d'une créature que vous voyez, ainsi que chaque fois qu'une créature que vous voyez pénètre dans l’'Émanation ou y termine son tour, vous pouvez la contraindre à un jet de sauvegarde de Sagesse. En cas d'échec, la cible subit 4d6 dégâts psychiques, ainsi que l’état\nÀ terre, et vous pouvez la repousser d'un maximum de 3 m. En cas de réussite, la cible subit uniquement la moitié de ces dégâts. Une même créature n'effectue en aucun cas ce JS plus d'une fois par tour. ‘ na Ve<\/p>\n"}, {"nom": "Prestidigitation", "ecole": "Transmutation", "niveau": 0, "classes": ["Barde", "Ensorceleur", "Magicien", "Occultiste"], "incantation": "action", "portee": "3 m", "composantes": "V, S", "duree": "jusqu’à 1 heure", "pages_source": [320], "description": "mn\nEffet sensoriel. Vous produisez un effet sensoriel instantané et inoffensif, comme une pluie d'étincelles, une petite rafale, quelques notes de musique ou une odeur étrange.\nJeu avec le feu. Vous allumez ou éteignez une bougie, une torche ou un petit feu de camp, en un instant.\nNettoyage ou maculage. Vous nettoyez ou souillez en un instant un objet dont le volume ne dépasse pas 30 litres (ou 0,03 m3).\nSensation mineure. Vous refroidissez, réchauffez ou parfumez de la matière inerte pendant 1 heure, à condition que son volume ne dépasse pas 30 litres (ou 0,03 m3).\nMarque magique. Vous faites apparaître pendant 1 heure, sur un objet ou une surface, une couleur, une petite marque ou un symbole.\nCréation mineure. Vous créez une babiole non magique ou une image illusoire qui tient dans votre main. Elle persiste jusqu’à la fin de votre tour suivant. Une telle babiole ne peut pas infliger de dégâts et n’a aucune valeur monétaire.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "prestidigitation", "html_body": "<p>mn\nEffet sensoriel. Vous produisez un effet sensoriel instantané et inoffensif, comme une pluie d'étincelles, une petite rafale, quelques notes de musique ou une odeur étrange.\nJeu avec le feu. Vous allumez ou éteignez une bougie, une torche ou un petit feu de camp, en un instant.\nNettoyage ou maculage. Vous nettoyez ou souillez en un instant un objet dont le volume ne dépasse pas 30 litres (ou 0,03 m3).\nSensation mineure. Vous refroidissez, réchauffez ou parfumez de la matière inerte pendant 1 heure, à condition que son volume ne dépasse pas 30 litres (ou 0,03 m3).\nMarque magique. Vous faites apparaître pendant 1 heure, sur un objet ou une surface, une couleur, une petite marque ou un symbole.\nCréation mineure. Vous créez une babiole non magique ou une image illusoire qui tient dans votre main. Elle persiste jusqu’à la fin de votre tour suivant. Une telle babiole ne peut pas infliger de dégâts et n’a aucune valeur monétaire.<\/p>\n"}, {"nom": "Prière de Guérison", "ecole": "Abjuration", "niveau": 2, "classes": ["Clerc", "Paladin"], "incantation": "10 minutes", "portee": "9 m", "composantes": "V", "duree": "instantanée", "pages_source": [320], "description": "Un maximum de cinq créatures que vous choisissez parmi celles qui restent à portée pendant toute l’incantation reçoivent les bénéfices d'un Repos court et récupèrent chacune 2d8 points de vie. Une créature qui profite de ce sort doit terminer un Repos long pour pouvoir en profiter à nouveau.\nEmplacement de niveau supérieur. Les soins augmentent de 1d8 par niveau d'emplacement au-delà du 2°.", "illustration": null, "legende_illustration": null, "notes_verification": "encadre_statistiques_a_controler", "statut": "ocr_non_valide", "id": "priere-de-guerison", "html_body": "<p>Un maximum de cinq créatures que vous choisissez parmi celles qui restent à portée pendant toute l’incantation reçoivent les bénéfices d'un Repos court et récupèrent chacune 2d8 points de vie. Une créature qui profite de ce sort doit terminer un Repos long pour pouvoir en profiter à nouveau.\nEmplacement de niveau supérieur. Les soins augmentent de 1d8 par niveau d'emplacement au-delà du 2°.<\/p>\n"}, {"nom": "Projectile Magique", "ecole": "Évocation", "niveau": 1, "classes": ["Ensorceleur", "Magicien"], "incantation": "À vérifier", "portee": "36 m", "composantes": "V, S", "duree": "instantanée", "pages_source": [320], "description": "Vous créez trois traits de force magique et scintillante. Chaque projectile heurte une créature de votre choix parmi celles que vous voyez à portée. Un projectile inflige 1d4 + 1 dégâts de force à sa cible. Les traits frappent tous simultanément, sachant que vous pouvez viser une seule créature ou plusieurs.\nEmplacement de niveau supérieur. Le sort produit un trait supplémentaire par niveau d'emplacement au-delà du 1°.", "illustration": null, "legende_illustration": null, "notes_verification": "champ_absent:incantation; encadre_statistiques_a_controler", "statut": "ocr_non_valide", "id": "projectile-magique", "html_body": "<p>Vous créez trois traits de force magique et scintillante. Chaque projectile heurte une créature de votre choix parmi celles que vous voyez à portée. Un projectile inflige 1d4 + 1 dégâts de force à sa cible. Les traits frappent tous simultanément, sachant que vous pouvez viser une seule créature ou plusieurs.\nEmplacement de niveau supérieur. Le sort produit un trait supplémentaire par niveau d'emplacement au-delà du 1°.<\/p>\n"}, {"nom": "Projection Astrale", "ecole": "Nécromancie", "niveau": 9, "classes": ["Clerc", "Magicien", "Occultiste"], "incantation": "1 heure", "portee": "3 m", "composantes": "V, S, M (pour chaque cible affectée, une hyacinthe d'une valeur minimale de 1 000 po et un lingot d'argent ouvragé d'une valeur minimale de 100 po, compo- santes que le sort détruit)", "duree": "jusqu'à dissipation", "pages_source": [320, 321], "description": "D UE NE A ccctpes die plan). Le corps abandonné par chaque cible reçoit l'état Inconscient, dans un état d'animation suspendue ; il n’a pas besoin de s'alimenter ni de respirer et ne vieillit pas. Le corps astral d’une cible ressemble en tout point à sa forme mortelle et reprend son profil de jeu, ainsi que ses biens. La différence principale réside dans l’ajout d'une cordelette d'argent qui part d'un point entre les omoplates de la forme astrale. Ce lien n’est plus visible au bout de 30 cm. Si la cordelette est sectionnée, ce qui ne peut arriver que lorsqu'un effet le mentionne spécifiquement, le corps de la cible et la forme astrale meurent aussitôt. La forme astrale d’une cible peut voyager dans le Plan\nAstral. Dès qu'une forme astrale quitte ce plan, le corps de la cible et ses biens remontent le long de la corde argentée, et la cible reprend possession de son corps sur le nouveau plan. Tous les dégâts et effets qui s'appliquent à une forme astrale ne concernent aucunement le corps physique de la cible, et réciproquement. Si le corps d'origine d'une cible ou sa forme astrale tombe à O point de vie, le sort prend fin pour elle. Le sort prend fin pour toutes les cibles si vous consacrez l’action Magie à le révoquer. Quand le sort prend fin pour une cible qui n'est pas morte, celle-ci réapparaît dans son corps et émerge de son animation suspendue.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "projection-astrale", "html_body": "<p>D UE NE A ccctpes die plan). Le corps abandonné par chaque cible reçoit l'état Inconscient, dans un état d'animation suspendue ; il n’a pas besoin de s'alimenter ni de respirer et ne vieillit pas. Le corps astral d’une cible ressemble en tout point à sa forme mortelle et reprend son profil de jeu, ainsi que ses biens. La différence principale réside dans l’ajout d'une cordelette d'argent qui part d'un point entre les omoplates de la forme astrale. Ce lien n’est plus visible au bout de 30 cm. Si la cordelette est sectionnée, ce qui ne peut arriver que lorsqu'un effet le mentionne spécifiquement, le corps de la cible et la forme astrale meurent aussitôt. La forme astrale d’une cible peut voyager dans le Plan\nAstral. Dès qu'une forme astrale quitte ce plan, le corps de la cible et ses biens remontent le long de la corde argentée, et la cible reprend possession de son corps sur le nouveau plan. Tous les dégâts et effets qui s'appliquent à une forme astrale ne concernent aucunement le corps physique de la cible, et réciproquement. Si le corps d'origine d'une cible ou sa forme astrale tombe à O point de vie, le sort prend fin pour elle. Le sort prend fin pour toutes les cibles si vous consacrez l’action Magie à le révoquer. Quand le sort prend fin pour une cible qui n'est pas morte, celle-ci réapparaît dans son corps et émerge de son animation suspendue.<\/p>\n"}, {"nom": "Protection contre L'Énergie", "ecole": "Abjuration", "niveau": 3, "classes": ["Clerc", "Druide", "Ensorceleur", "Magicien", "Rôdeur"], "incantation": "action", "portee": "contact", "composantes": "V, S", "duree": "Concentration, jusqu’à 1 heure", "pages_source": [321], "description": "Pour toute la durée, la créature consentante que vous touchez bénéficie de la Résistance à un type de dégâts de votre choix entre : acide, feu, foudre, froid et tonnerre.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "protection-contre-l-energie", "html_body": "<p>Pour toute la durée, la créature consentante que vous touchez bénéficie de la Résistance à un type de dégâts de votre choix entre : acide, feu, foudre, froid et tonnerre.<\/p>\n"}, {"nom": "Protection contre le Mal et le Bien", "ecole": "Abjuration", "niveau": 1, "classes": ["Clerc", "Druide", "Magicien", "Occultiste", "Paladin"], "incantation": "action", "portee": "contact", "composantes": "V, S, M (une flasque d'eau bénite d'une valeur minimale de 25 po, que le sort détruit)", "duree": "Concentration, jusqu'à 10 minutes", "pages_source": [321], "description": "Jusqu'à la fin du sort, une créature consentante que vous touchez physiquement est protégée contre les créatures des types suivants : Aberrations, Célestes, Élémentaires,\nFées, Fiélons et Morts-vivants. Cette protection octroie plusieurs bénéfices. Les créatures concernées ont le Désavantage aux jets d'attaque contre la cible. Elles ne peuvent pas posséder la cible, ni lui infliger les états Charmé et 2 D PE SRE OC MR", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "protection-contre-le-mal-et-le-bien", "html_body": "<p>Jusqu'à la fin du sort, une créature consentante que vous touchez physiquement est protégée contre les créatures des types suivants : Aberrations, Célestes, Élémentaires,\nFées, Fiélons et Morts-vivants. Cette protection octroie plusieurs bénéfices. Les créatures concernées ont le Désavantage aux jets d'attaque contre la cible. Elles ne peuvent pas posséder la cible, ni lui infliger les états Charmé et 2 D PE SRE OC MR<\/p>\n"}, {"nom": "Protection contre la Mort", "ecole": "Abjuration", "niveau": 4, "classes": ["Clerc", "Paladin"], "incantation": "action", "portee": "contact", "composantes": "V, S", "duree": "8 heures", "pages_source": [321], "description": "Vous touchez une créature pour la préserver de la mort. La première fois que la cible est censée tomber à O point de vie avant la fin du sort, elle se retrouve en fait à 1 point de vie, puis le sort prend fin. Si ce sort est toujours actif alors que la cible est soumise à un effet censé la tuer sur le coup sans lui infliger de dégâts, cet effet est annulé en ce qui la concerne, et le sort prend fin.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "protection-contre-la-mort", "html_body": "<p>Vous touchez une créature pour la préserver de la mort. La première fois que la cible est censée tomber à O point de vie avant la fin du sort, elle se retrouve en fait à 1 point de vie, puis le sort prend fin. Si ce sort est toujours actif alors que la cible est soumise à un effet censé la tuer sur le coup sans lui infliger de dégâts, cet effet est annulé en ce qui la concerne, et le sort prend fin.<\/p>\n"}, {"nom": "Protection contre le Poison", "ecole": "Abjuration", "niveau": 2, "classes": ["Clerc", "Druide", "Paladin", "Rôdeur"], "incantation": "À vérifier", "portee": "contact", "composantes": "V, S", "duree": "1 heure", "pages_source": [321], "description": "Vous touchez physiquement une créature pour mettre fin sur elle à l'état Empoisonné. Pour toute la durée, la cible a l'Avantage aux jets de sauvegarde pour éviter l'état Empoisonné ou y mettre fin, et bénéficie de la Résistance aux dégâts de poison.", "illustration": null, "legende_illustration": null, "notes_verification": "champ_absent:incantation", "statut": "ocr_non_valide", "id": "protection-contre-le-poison", "html_body": "<p>Vous touchez physiquement une créature pour mettre fin sur elle à l'état Empoisonné. Pour toute la durée, la cible a l'Avantage aux jets de sauvegarde pour éviter l'état Empoisonné ou y mettre fin, et bénéficie de la Résistance aux dégâts de poison.<\/p>\n"}, {"nom": "Protections et Sceaux", "ecole": "Abjuration", "niveau": 6, "classes": ["Barde", "Magicien"], "incantation": "1 heure", "portee": "contact", "composantes": "V, S, M (sceptre en argent d'une valeur minimale de 10 po)", "duree": "24 heures", "pages_source": [321, 322], "description": "Vous créez une barrière qui protège un espace au sol d'une surface maximale de 225 mètres carrés. La zone protégée peut atteindre 6 m de haut et se présenter comme une zone carrée de 15 m de côté, cent carrés de 1,50 m de côté ou vingt-cinq carrés contigus de 3 m de côté. À l'incantation du sort, vous pouvez spécifier quels individus ne seront pas affectés par les effets du sort. Vous pouvez également définir un mot de passe immunisant contre ces effets l'individu qui le prononce dans un rayon de 1,50 m de la zone protégée.\nLe sort crée les effets ci-après au sein de la zone protégée. Dissipation de la magie n'a en soi aucun effet sur protections et sceaux, mais chacun des effets suivants peut être dissipé. Si ces quatre effets sont dissipés, protections et sceaux prend fin. Si vous lancez quotidiennement ce sort sur la même zone pendant 365 jours, il y persiste jusqu'à ce que tous # UN CLERC HUMAIN LANCE RAPPEL À LA VIE POUR RAMENER UN COMPAGNON D'AVENTURE\nD'ENTRE LES MORTS. + L\" 2\nCouloirs. La brume envahit les couloirs protégés, dans lesquels la Visibilité devient nulle. De plus, à chaque intersection ou embranchement qui présente un choix de direction, toute créature autre que vous a 50 % de chances de croire qu'elle a pris une direction autre que celle qu’elle a réellement empruntée, voire radicalement opposée.\nEscaliers. Tous les escaliers de la zone protégée sont envahis de filandres de la première à la dernière marche (équivalent du sort toile d'araignée). Tant que persiste le sort protections et sceaux, cette masse filandreuse se reconstitue en 10 minutes si on la détruit.\nPortes. Toutes les portes de la zone protégée sont magiquement verrouillées, comme si elles étaient condamnées par le sort verrou magique. De plus, vous pouvez assortir un maximum de dix portes d'une illusion afin qu’elles passent pour de simples pans de mur.\nAutres effets du sort. Appliquez l’un des effets magiques suivants à la zone protégée : Lumières dansantes dans quatre couloirs, avec une séquence simple que les lumières répètent tant que le sort persiste Bouche magique en deux endroits Nuage nauséabond en deux endroits (les vapeurs se reconstituent en 10 minutes si dispersées alors que persiste protections et sceaux) Bourrasque dans un couloir (le vent y souffle de manière continue tant que le sort persiste) Suggestion dans un carré de 1,50 m de côté ; toute créature qui pénètre dans ce carré reçoit mentalement la suggestion\n\na —————", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "protections-et-sceaux", "html_body": "<p>Vous créez une barrière qui protège un espace au sol d'une surface maximale de 225 mètres carrés. La zone protégée peut atteindre 6 m de haut et se présenter comme une zone carrée de 15 m de côté, cent carrés de 1,50 m de côté ou vingt-cinq carrés contigus de 3 m de côté. À l'incantation du sort, vous pouvez spécifier quels individus ne seront pas affectés par les effets du sort. Vous pouvez également définir un mot de passe immunisant contre ces effets l'individu qui le prononce dans un rayon de 1,50 m de la zone protégée.\nLe sort crée les effets ci-après au sein de la zone protégée. Dissipation de la magie n'a en soi aucun effet sur protections et sceaux, mais chacun des effets suivants peut être dissipé. Si ces quatre effets sont dissipés, protections et sceaux prend fin. Si vous lancez quotidiennement ce sort sur la même zone pendant 365 jours, il y persiste jusqu'à ce que tous # UN CLERC HUMAIN LANCE RAPPEL À LA VIE POUR RAMENER UN COMPAGNON D'AVENTURE\nD'ENTRE LES MORTS. + L&quot; 2\nCouloirs. La brume envahit les couloirs protégés, dans lesquels la Visibilité devient nulle. De plus, à chaque intersection ou embranchement qui présente un choix de direction, toute créature autre que vous a 50 % de chances de croire qu'elle a pris une direction autre que celle qu’elle a réellement empruntée, voire radicalement opposée.\nEscaliers. Tous les escaliers de la zone protégée sont envahis de filandres de la première à la dernière marche (équivalent du sort toile d'araignée). Tant que persiste le sort protections et sceaux, cette masse filandreuse se reconstitue en 10 minutes si on la détruit.\nPortes. Toutes les portes de la zone protégée sont magiquement verrouillées, comme si elles étaient condamnées par le sort verrou magique. De plus, vous pouvez assortir un maximum de dix portes d'une illusion afin qu’elles passent pour de simples pans de mur.\nAutres effets du sort. Appliquez l’un des effets magiques suivants à la zone protégée : Lumières dansantes dans quatre couloirs, avec une séquence simple que les lumières répètent tant que le sort persiste Bouche magique en deux endroits Nuage nauséabond en deux endroits (les vapeurs se reconstituent en 10 minutes si dispersées alors que persiste protections et sceaux) Bourrasque dans un couloir (le vent y souffle de manière continue tant que le sort persiste) Suggestion dans un carré de 1,50 m de côté ; toute créature qui pénètre dans ce carré reçoit mentalement la suggestion<\/p>\n<p>a —————<\/p>\n"}, {"nom": "Purification de la nourriture et de l’eau", "ecole": "Transmutation", "niveau": 1, "classes": ["Clerc", "Druide", "Paladin"], "incantation": "action ou rituel", "portee": "3 m", "composantes": "V, S", "duree": "instantanée", "pages_source": [322], "description": "Vous purgez de tout poison et pourriture les aliments et boissons dans une Sphère de 1,50 m de rayon centrée sur un point à portée.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "purification-de-la-nourriture-et-de-l-eau", "html_body": "<p>Vous purgez de tout poison et pourriture les aliments et boissons dans une Sphère de 1,50 m de rayon centrée sur un point à portée.<\/p>\n"}, {"nom": "Quête", "ecole": "Enchantement", "niveau": 5, "classes": ["Barde", "Clerc", "Druide", "Magicien", "Paladin"], "incantation": "1 minute", "portee": "18 m", "composantes": "V", "duree": "30 jours", "pages_source": [322, 323], "description": "Vous intimez un ordre verbal à une créature que vous voyez à portée, pour la contraindre à accomplir une tâche ou l'empêcher d'exécuter certains actes que vous définissez. La cible doit réussir un jet de sauvegarde de Sagesse sous peine de subir l'état Charmé pour toute la durée du sort. Elle réussit automatiquement ce JS si elle n'est pas en mesure de comprendre votre ordre. sa pas un Mort-vivant quand elle est morte et dont la mort Jun contact, vous ramenez à la vie une créature qui n'était remonte à un maximum de 10 jours.\nLa créature est ramenée à la vie avec 1 point de vie. Ce sort neutralise également tous les poisons qui affectaient la créature au moment de mourir. Ce sort referme toutes les blessures mortelles, mais ne fait pas repousser l'anatomie manquante. Si la créature a perdu une partie de son anatomie ou des organes essentiels à sa survie ; sa tête par exemple, le sort échoue automatiquement.\nRevenir d’entre les morts demeure une épreuve. La cible subit un malus de -4 aux Tests d20. Chaque fois qu’elle termine un Repos long, ce malus diminue de 1, jusqu’à ce qu'il tombe à 0.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "quete", "html_body": "<p>Vous intimez un ordre verbal à une créature que vous voyez à portée, pour la contraindre à accomplir une tâche ou l'empêcher d'exécuter certains actes que vous définissez. La cible doit réussir un jet de sauvegarde de Sagesse sous peine de subir l'état Charmé pour toute la durée du sort. Elle réussit automatiquement ce JS si elle n'est pas en mesure de comprendre votre ordre. sa pas un Mort-vivant quand elle est morte et dont la mort Jun contact, vous ramenez à la vie une créature qui n'était remonte à un maximum de 10 jours.\nLa créature est ramenée à la vie avec 1 point de vie. Ce sort neutralise également tous les poisons qui affectaient la créature au moment de mourir. Ce sort referme toutes les blessures mortelles, mais ne fait pas repousser l'anatomie manquante. Si la créature a perdu une partie de son anatomie ou des organes essentiels à sa survie ; sa tête par exemple, le sort échoue automatiquement.\nRevenir d’entre les morts demeure une épreuve. La cible subit un malus de -4 aux Tests d20. Chaque fois qu’elle termine un Repos long, ce malus diminue de 1, jusqu’à ce qu'il tombe à 0.<\/p>\n"}, {"nom": "Rayon Affaiblissant", "ecole": "Nécromancie", "niveau": 2, "classes": ["Magicien", "Occultiste"], "incantation": "À vérifier", "portee": "18 m", "composantes": "V, S", "duree": "Concentration, jusqu’à 1 minute", "pages_source": [323], "description": "Un rayon débilitant jaillit de vous vers une créature à portée. La cible effectue un jet de sauvegarde de Constitution. En cas de réussite, la cible a le Désavantage à son prochain jet d'attaque intervenant avant le début de votre tour suivant. En cas d'échec, elle a le Désavantage à tous ses Tests d20 basés sur la Force, pour toute la durée. Tout du long, elle soustrait aussi 1d8 à tous ses jets de dégâts. La cible réitère le JS à la fin de chacun de ses tours et met un terme au sort en cas de réussite.\nVous projetez trois rayons de flammes. Vous pouvez cibler une seule cible à portée ou bien plusieurs. Effectuez une attaque de sort à distance pour chaque rayon. Une attaque qui touche sa cible lui inflige 2d6 dégâts de feu.\nEmplacement de niveau supérieur. Vous produisez un | rayon supplémentaire par niveau d'emplacement au-delà du 2°. e |", "illustration": null, "legende_illustration": null, "notes_verification": "champ_absent:incantation; symboles_suspects", "statut": "ocr_non_valide", "id": "rayon-affaiblissant", "html_body": "<p>Un rayon débilitant jaillit de vous vers une créature à portée. La cible effectue un jet de sauvegarde de Constitution. En cas de réussite, la cible a le Désavantage à son prochain jet d'attaque intervenant avant le début de votre tour suivant. En cas d'échec, elle a le Désavantage à tous ses Tests d20 basés sur la Force, pour toute la durée. Tout du long, elle soustrait aussi 1d8 à tous ses jets de dégâts. La cible réitère le JS à la fin de chacun de ses tours et met un terme au sort en cas de réussite.\nVous projetez trois rayons de flammes. Vous pouvez cibler une seule cible à portée ou bien plusieurs. Effectuez une attaque de sort à distance pour chaque rayon. Une attaque qui touche sa cible lui inflige 2d6 dégâts de feu.\nEmplacement de niveau supérieur. Vous produisez un | rayon supplémentaire par niveau d'emplacement au-delà du 2°. e |<\/p>\n"}, {"nom": "Rayon Empoisonné", "ecole": "Nécromancie", "niveau": 1, "classes": ["Ensorceleur", "Magicien"], "incantation": "action", "portee": "18 m", "composantes": "V, S", "duree": "instantanée", "pages_source": [323], "description": "Vous dardez un rayon verdâtre vers une créature à portée.\nEffectuez une attaque de sort à distance contre la cible. Si l'attaque touche, la cible subit 2d8 dégâts de poison, ainsi que l'état Empoisonné jusqu'à la fin de votre tour suivant.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d8 par niveau d'emplacement au-delà du 1‘.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "rayon-empoisonne", "html_body": "<p>Vous dardez un rayon verdâtre vers une créature à portée.\nEffectuez une attaque de sort à distance contre la cible. Si l'attaque touche, la cible subit 2d8 dégâts de poison, ainsi que l'état Empoisonné jusqu'à la fin de votre tour suivant.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d8 par niveau d'emplacement au-delà du 1‘.<\/p>\n"}, {"nom": "Rayon de Givre", "ecole": "Évocation", "niveau": 0, "classes": ["Ensorceleur", "Magicien"], "incantation": "action", "portee": "18 m", "composantes": "V, S", "duree": "instantanée", "pages_source": [323], "description": "Un rayon de lueur zébrée bleuâtre et glaciale file vers une créature à portée. Effectuez une attaque de sort à distance contre la cible. Si l'attaque touche, la cible subit 1d8 dégâts de froid et sa Vitesse est réduite de 3 m jusqu’au début de votre tour suivant.\nAmélioration de sort mineur. Les dégâts augmentent de 1d8 lorsque vous atteignez les niveaux 5 (2d8), 11 (3d8) et 17 (4d8).", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "rayon-de-givre", "html_body": "<p>Un rayon de lueur zébrée bleuâtre et glaciale file vers une créature à portée. Effectuez une attaque de sort à distance contre la cible. Si l'attaque touche, la cible subit 1d8 dégâts de froid et sa Vitesse est réduite de 3 m jusqu’au début de votre tour suivant.\nAmélioration de sort mineur. Les dégâts augmentent de 1d8 lorsque vous atteignez les niveaux 5 (2d8), 11 (3d8) et 17 (4d8).<\/p>\n"}, {"nom": "Rayon de Lune", "ecole": "Évocation", "niveau": 2, "classes": ["Druide"], "incantation": "action", "portee": "36 m", "composantes": "V, S, M (une feuille de cocculus)", "duree": "Concentration, jusqu'à 1 minute", "pages_source": [323, 324], "description": "Un large rayon de lueur argentée ténue plonge sous forme d'un Cylindre de 1,50 m de rayon et 12 m de haut, centré en Po du son. le Cylindre gi qu'elle reste dans le Cylindre. En cas subit uniquement la moitié de ces dégâts. qui voit la zone du sort se déplacer dans son espace, ou qui pénètre dans la zone ou y termine son tour est également soumise à ce JS. Une même créature n'effectue en aucun cas ce JS plus d'une fois par tour.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d10 par niveau d'emplacement au-delà du 2°. RTE REE =", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "rayon-de-lune", "html_body": "<p>Un large rayon de lueur argentée ténue plonge sous forme d'un Cylindre de 1,50 m de rayon et 12 m de haut, centré en Po du son. le Cylindre gi qu'elle reste dans le Cylindre. En cas subit uniquement la moitié de ces dégâts. qui voit la zone du sort se déplacer dans son espace, ou qui pénètre dans la zone ou y termine son tour est également soumise à ce JS. Une même créature n'effectue en aucun cas ce JS plus d'une fois par tour.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d10 par niveau d'emplacement au-delà du 2°. RTE REE =<\/p>\n"}, {"nom": "Rayon de Soleil", "ecole": "Évocation", "niveau": 6, "classes": ["Clerc", "Druide", "Ensorceleur", "Magicien"], "incantation": "action", "portee": "personnelle", "composantes": "V, S, M (une loupe)", "duree": "Concentration, jusqu’à 1 minute", "pages_source": [324], "description": "Vous projetez un rayon de soleil sous forme d’une Ligne de 18 m de long et 1,50 m de large. Chaque créature prise dans la Ligne effectue un jet de sauvegarde de Constitution. En cas d'échec, elle subit 6d8 dégâts radiants, ainsi que l'état\nAveuglé jusqu'au début de votre tour suivant. En cas de réussite, elle subit uniquement la moitié de ces dégâts. Jusqu'à la fin du sort, vous pouvez entreprendre l’action\nMagie pour produire une nouvelle Ligne de radiance. Pour toute la durée, un point de radiance brille juste au-dessus de vous. Il émet une Lumière vive sur un rayon de 9 m et une Lumière faible sur 9 m de plus. Cette lumière est celle du soleil.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "rayon-de-soleil", "html_body": "<p>Vous projetez un rayon de soleil sous forme d’une Ligne de 18 m de long et 1,50 m de large. Chaque créature prise dans la Ligne effectue un jet de sauvegarde de Constitution. En cas d'échec, elle subit 6d8 dégâts radiants, ainsi que l'état\nAveuglé jusqu'au début de votre tour suivant. En cas de réussite, elle subit uniquement la moitié de ces dégâts. Jusqu'à la fin du sort, vous pouvez entreprendre l’action\nMagie pour produire une nouvelle Ligne de radiance. Pour toute la durée, un point de radiance brille juste au-dessus de vous. Il émet une Lumière vive sur un rayon de 9 m et une Lumière faible sur 9 m de plus. Cette lumière est celle du soleil.<\/p>\n"}, {"nom": "Rayon Traçant", "ecole": "Évocation", "niveau": 1, "classes": ["Clerc"], "incantation": "action", "portee": "36 m", "composantes": "V, S", "duree": "1 round", "pages_source": [324], "description": "Vous projetez un trait de lumière vers une créature à portée.\nEffectuez une attaque de sort à distance contre la cible. Si l'attaque touche, la cible subit 4d6 dégâts radiants et le prochain jet d'attaque effectué contre elle avant la fin de votre tour suivant a l’Avantage.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d6 par niveau d'emplacement au-delà du 1°. SRE TS", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "rayon-tracant", "html_body": "<p>Vous projetez un trait de lumière vers une créature à portée.\nEffectuez une attaque de sort à distance contre la cible. Si l'attaque touche, la cible subit 4d6 dégâts radiants et le prochain jet d'attaque effectué contre elle avant la fin de votre tour suivant a l’Avantage.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d6 par niveau d'emplacement au-delà du 1°. SRE TS<\/p>\n"}, {"nom": "Régénération", "ecole": "Transmutation", "niveau": 7, "classes": ["Barde", "Clerc", "Druide"], "incantation": "1 minute", "portee": "contact", "composantes": "V, S, M (un moulin à prières)", "duree": "1 heure", "pages_source": [324], "description": "Une créature que vous touchez physiquement récupère 4d8 + 15 points de vie. Pour toute la durée, la cible récupère 1 point de vie au début de chacun de ses tours et les parties sectionnées de son anatomie repoussent en 2 minutes.", "illustration": null, "legende_illustration": null, "notes_verification": "Transcription reprise directement sur les scans du manuel ; relecture exhaustive du lot encore nécessaire.", "statut": "ocr_non_valide", "id": "regeneration", "html_body": "<p>Une créature que vous touchez physiquement récupère 4d8 + 15 points de vie. Pour toute la durée, la cible récupère 1 point de vie au début de chacun de ses tours et les parties sectionnées de son anatomie repoussent en 2 minutes.<\/p>\n"}, {"nom": "Réincarnation", "ecole": "Nécromancie", "niveau": 5, "classes": ["Druide"], "incantation": "1 heure", "portee": "contact", "composantes": "V, S, M (es huile rares d'une de 1 000 po, que le sort détruit)", "duree": "instantanée", "pages_source": [324], "description": "Vous touchez physiquement un Humanoïde de ses restes. Si la créature n’est pas morte d 10 jours, le sort forme un nouveau corps et âme pour prendre possession de ce corps. Lar consultant la table suivante pour déter nouveau corps ou laissez le MD choisir di espèce jouable. 1d10 Espèce 1d10 Esp 1 Aasimar 6 : 3 | 2  Drakéide 7 Humain 3 Elfe 8 ns D 4 Gnome 9 5 Goliath 10 Les TT La créature réincarnée, qui fait les choix proposés par la description de l'espèce, se souvient de son ancienne vie et de ses expériences. Elle conserve les capacités dont elle disposait sous sa forme d’origine, si ce n'est qu'elle perd les traits de l’ancienne forme et acquiert ceux de la nouvelle.\nRER. UHR n", "illustration": null, "legende_illustration": null, "notes_verification": "Transcription reprise directement sur les scans du manuel ; relecture exhaustive du lot encore nécessaire.", "statut": "ocr_non_valide", "id": "reincarnation", "html_body": "<p>Vous touchez physiquement un Humanoïde de ses restes. Si la créature n’est pas morte d 10 jours, le sort forme un nouveau corps et âme pour prendre possession de ce corps. Lar consultant la table suivante pour déter nouveau corps ou laissez le MD choisir di espèce jouable. 1d10 Espèce 1d10 Esp 1 Aasimar 6 : 3 | 2  Drakéide 7 Humain 3 Elfe 8 ns D 4 Gnome 9 5 Goliath 10 Les TT La créature réincarnée, qui fait les choix proposés par la description de l'espèce, se souvient de son ancienne vie et de ses expériences. Elle conserve les capacités dont elle disposait sous sa forme d’origine, si ce n'est qu'elle perd les traits de l’ancienne forme et acquiert ceux de la nouvelle.\nRER. UHR n<\/p>\n"}, {"nom": "Réparation", "ecole": "Transmutation", "niveau": 0, "classes": ["Barde", "Clerc", "Druide", "Ensorceleur", "Magicien"], "incantation": "1 minute", "portee": "contact", "composantes": "V, S, M (deux magnétites)", "duree": "instantanée", "pages_source": [324, 325], "description": "Ce sort répare une dégradation (déchirure ou bris) sur l'objet que vous touchez, comme un maillon de chaîne brisé, une clef en deux morceaux, une cape déchirée ou une outre percée. Tant que la dégradation ne dépasse pas 30 cm dans quelque dimension que ce soit, vous la réparez et il n'en reste nulle trace. Ce sort peut réparer la structure physique d'un objet magique, mais il ne lui rendra pas sa magie. LES SORTS COMME RESPIRATION AQUATIQUE ET MARCHE SUR L'ONDE FACILITENT LES\nVISITES DES LIEUX OÙ RÈGNE L'EAU.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "reparation", "html_body": "<p>Ce sort répare une dégradation (déchirure ou bris) sur l'objet que vous touchez, comme un maillon de chaîne brisé, une clef en deux morceaux, une cape déchirée ou une outre percée. Tant que la dégradation ne dépasse pas 30 cm dans quelque dimension que ce soit, vous la réparez et il n'en reste nulle trace. Ce sort peut réparer la structure physique d'un objet magique, mais il ne lui rendra pas sa magie. LES SORTS COMME RESPIRATION AQUATIQUE ET MARCHE SUR L'ONDE FACILITENT LES\nVISITES DES LIEUX OÙ RÈGNE L'EAU.<\/p>\n"}, {"nom": "Repli Expéditif", "ecole": "Transmutation", "niveau": 1, "classes": ["Ensorceleur", "Magicien", "Occultiste"], "incantation": "action Bonus", "portee": "personnelle", "composantes": "V, S", "duree": "Concentration, jusqu'à 10 minutes", "pages_source": [325], "description": "Vous entreprenez l'action Pointe et, jusqu’à la fin du sort, vous pouvez entreprendre cette même action par une action\nBonus.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "repli-expeditif", "html_body": "<p>Vous entreprenez l'action Pointe et, jusqu’à la fin du sort, vous pouvez entreprendre cette même action par une action\nBonus.<\/p>\n"}, {"nom": "Représailles Infernales", "ecole": "Évocation", "niveau": 1, "classes": ["Occultiste"], "incantation": "Réaction, que vous jouez lorsqu'une créature que vous voyez dans un rayon de 18 m vous inflige des dégâts.", "portee": "18 m", "composantes": "V, S", "duree": "instantanée", "pages_source": [325], "description": "ER NT La créature qui vous a infligé des dégâts se retrouve un court instant cernée de flammes vertes. Elle effectue un jet de sauvegarde de Dextérité, et subit 2d10 dégâts de feu en cas d'échec, la moitié en cas de réussite.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d10 par niveau d'emplacement au-delà du 1°.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "represailles-infernales", "html_body": "<p>ER NT La créature qui vous a infligé des dégâts se retrouve un court instant cernée de flammes vertes. Elle effectue un jet de sauvegarde de Dextérité, et subit 2d10 dégâts de feu en cas d'échec, la moitié en cas de réussite.\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d10 par niveau d'emplacement au-delà du 1°.<\/p>\n"}, {"nom": "Résistance", "ecole": "Abjuration", "niveau": 0, "classes": ["Clerc", "Druide"], "incantation": "action", "portee": "contact", "composantes": "V, S", "duree": "Concentration, jusqu'à 1 minute", "pages_source": [325], "description": "Vous touchez physiquement une créature consentante en choisissant un type de dégâts entre : acide, contondants, feu, foudre, froid, nécrotiques, perforants, poison, radiants, tonnerre et tranchants. Quand la créature subit des dégâts du type retenu avant la fin du sort, elle réduit les dégâts subis de 1d4. Une même créature ne peut bénéficier qu'une fois par tour de ce sort.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "resistance", "html_body": "<p>Vous touchez physiquement une créature consentante en choisissant un type de dégâts entre : acide, contondants, feu, foudre, froid, nécrotiques, perforants, poison, radiants, tonnerre et tranchants. Quand la créature subit des dégâts du type retenu avant la fin du sort, elle réduit les dégâts subis de 1d4. Une même créature ne peut bénéficier qu'une fois par tour de ce sort.<\/p>\n"}, {"nom": "Respiration Aquatique", "ecole": "Transmutation", "niveau": 3, "classes": ["Druide", "Ensorceleur", "Magicien", "Rôdeur"], "incantation": "action ou rituel", "portee": "9 m", "composantes": "V, S, M (un court roseau)", "duree": "24 heures", "pages_source": [325], "description": "Ce sort octroie la faculté de respirer sous l'eau à un maximum de dix créatures consentantes que vous choisissez à portée, jusqu'à la fin du sort. Les créatures affectées conservent leurs autres modes respiratoires.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "respiration-aquatique", "html_body": "<p>Ce sort octroie la faculté de respirer sous l'eau à un maximum de dix créatures consentantes que vous choisissez à portée, jusqu'à la fin du sort. Les créatures affectées conservent leurs autres modes respiratoires.<\/p>\n"}, {"nom": "Restauration Partielle", "ecole": "Abjuration", "niveau": 2, "classes": ["Barde", "Clerc", "Druide", "Paladin", "Rédeur"], "incantation": "À vérifier", "portee": "contac Cmbmeies : V S", "composantes": "À vérifier", "duree": "instantanée", "pages_source": [326], "description": "Vous touchez physiquement une créature pour mettre fin à un état qui l’affecte parmi : Assourdi, Aveuglé, Empoisonné et Paralvsé.", "illustration": null, "legende_illustration": null, "notes_verification": "champ_absent:incantation; champ_absent:composantes", "statut": "ocr_non_valide", "id": "restauration-partielle", "html_body": "<p>Vous touchez physiquement une créature pour mettre fin à un état qui l’affecte parmi : Assourdi, Aveuglé, Empoisonné et Paralvsé.<\/p>\n"}, {"nom": "Restauration suprême", "ecole": "Abjuration", "niveau": 5, "classes": ["Barde", "Clerc", "Druide", "Paladin", "Rôdeur"], "incantation": "action", "portee": "contact", "composantes": "V, S, M (poudre de diamant d’une valeur minimale de 100 po, que le sort détruit)", "duree": "instantanée", "pages_source": [326], "description": "Vous touchez physiquement une créature pour lui retirer magiquement l’un des effets suivants :\n\n- 1 niveau d’Épuisement\n- L’état Charmé ou Pétrifié\n- Une malédiction, y compris l’Harmonisation éventuelle de la cible avec un objet magique maudit\n- Toute réduction de l’une des valeurs de caractéristique de la cible\n- Toute réduction du maximum de points de vie de la cible", "illustration": null, "legende_illustration": null, "notes_verification": "Transcription reprise directement sur les scans du manuel ; relecture exhaustive du lot encore nécessaire.", "statut": "ocr_non_valide", "id": "restauration-supreme", "html_body": "<p>Vous touchez physiquement une créature pour lui retirer magiquement l’un des effets suivants :<\/p>\n<ul>\n<li>1 niveau d’Épuisement<\/li>\n<li>L’état Charmé ou Pétrifié<\/li>\n<li>Une malédiction, y compris l’Harmonisation éventuelle de la cible avec un objet magique maudit<\/li>\n<li>Toute réduction de l’une des valeurs de caractéristique de la cible<\/li>\n<li>Toute réduction du maximum de points de vie de la cible<\/li>\n<\/ul>\n"}, {"nom": "Résurrection", "ecole": "Nécromancie", "niveau": 7, "classes": ["Barde", "Clerc"], "incantation": "1 heure", "portee": "contact", "composantes": "V, S, M (un diamant d'une valeur minimale de 1 000 po, que le sort détruit)", "duree": "instantanée", "pages_source": [326, 327], "description": "D'un contact, vous ramenez à la vie une créature dont la mort ne remonte pas à plus d’un siècle, qui n'est pas morte de vieillesse et n'était pas un Mort-vivant au moment de mourir.\nLa créature revient à la vie avec tous ses points de vie. Ce sort neutralise également tous les poisons qui affectaient la créature au moment de mourir. Ce sort referme toutes les blessures mortelles et restitue l'anatomie manquante.\nRevenir d’entre les morts demeure une épreuve. La cible subit un malus de -4 aux Tests d20. Chaque fois qu'elle termine un Repos long, ce malus diminue de 1, jusqu’à ce qu'il tombe à 0. L'incantation de ce sort s'avère éreintante lorsqu'il s’agit de ramener à la vie une créature morte depuis 365 jours ou plus. Tant que vous n'avez pas terminé de Repos long, vous ne pouvez plus lancer de sort et vous avez le Désavantage aux Tests d20. Portée : contact Composantes : V, S, M (au moins 25 000 po de diamants, que le sort détruit) Durée : instantanée Vous touchez une créature morte depuis un maximum de 200 ans pour quelque raison que ce soit, hormis de vieillesse.\nLa créature est ranimée avec tous ses points de vie. Ce sort referme toutes les plaies, neutralise tous les poisons, soigne toutes les maladies magiques et lève toutes les malédictions qui affectaient la cible à sa mort. Il remplace les organes et membres endommagés ou manquants. Si la créature était un Mort-vivant, elle retrouve sa forme de vivant. Le sort peut fournir un nouveau corps si celui d'origine n'existe plus, auquel cas vous devez prononcer le nom de la créature. Celle-ci apparaît en un espace inoccupé que vous choisissez dans un rayon de 3 m de vous.", "illustration": null, "legende_illustration": null, "notes_verification": "encadre_statistiques_a_controler", "statut": "ocr_non_valide", "id": "resurrection", "html_body": "<p>D'un contact, vous ramenez à la vie une créature dont la mort ne remonte pas à plus d’un siècle, qui n'est pas morte de vieillesse et n'était pas un Mort-vivant au moment de mourir.\nLa créature revient à la vie avec tous ses points de vie. Ce sort neutralise également tous les poisons qui affectaient la créature au moment de mourir. Ce sort referme toutes les blessures mortelles et restitue l'anatomie manquante.\nRevenir d’entre les morts demeure une épreuve. La cible subit un malus de -4 aux Tests d20. Chaque fois qu'elle termine un Repos long, ce malus diminue de 1, jusqu’à ce qu'il tombe à 0. L'incantation de ce sort s'avère éreintante lorsqu'il s’agit de ramener à la vie une créature morte depuis 365 jours ou plus. Tant que vous n'avez pas terminé de Repos long, vous ne pouvez plus lancer de sort et vous avez le Désavantage aux Tests d20. Portée : contact Composantes : V, S, M (au moins 25 000 po de diamants, que le sort détruit) Durée : instantanée Vous touchez une créature morte depuis un maximum de 200 ans pour quelque raison que ce soit, hormis de vieillesse.\nLa créature est ranimée avec tous ses points de vie. Ce sort referme toutes les plaies, neutralise tous les poisons, soigne toutes les maladies magiques et lève toutes les malédictions qui affectaient la cible à sa mort. Il remplace les organes et membres endommagés ou manquants. Si la créature était un Mort-vivant, elle retrouve sa forme de vivant. Le sort peut fournir un nouveau corps si celui d'origine n'existe plus, auquel cas vous devez prononcer le nom de la créature. Celle-ci apparaît en un espace inoccupé que vous choisissez dans un rayon de 3 m de vous.<\/p>\n"}, {"nom": "Retour à la Vie", "ecole": "Nécromancie", "niveau": 3, "classes": ["Clerc", "Druide", "Paladin", "Rôdeur"], "incantation": "action", "portee": "contact", "composantes": "V, S, M (un diamant d'une valeur minimale de 300 po, que le sort détruit)", "duree": "instantanée", "pages_source": [327], "description": "Vous touchez une créature morte dans la minute qui vient de s'écouler. La créature est ramenée à la vie avec 1 point de vie. Ce sort ne peut pas affecter une créature morte de vieillesse, pas plus qu'il ne restitue l'anatomie manquante. >", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "retour-a-la-vie", "html_body": "<p>Vous touchez une créature morte dans la minute qui vient de s'écouler. La créature est ramenée à la vie avec 1 point de vie. Ce sort ne peut pas affecter une créature morte de vieillesse, pas plus qu'il ne restitue l'anatomie manquante. &gt;<\/p>\n"}, {"nom": "Sanctification", "ecole": "Abjuration", "niveau": 5, "classes": ["Clerc"], "incantation": "24 heures", "portee": "contact", "composantes": "V, S, M (encens d'une valeur minimale de 1 000 po, que le sort détruit)", "duree": "jusqu'à dissipation", "pages_source": [327], "description": "Vous touchez un point pour investir la zone environnante de pouvoir sacré ou impie. Le rayon de la zone peut atteindre 18 m, le sort échouant si ce rayon chevauche une zone déjà affectée par le sort sanctification. La zone affectée présente s suivants. : sanctifiée. Choisissez un ou plusieurs types suivants : Aberrations, Célestes, Élémentaires, et Morts-vivants. Les créatures des types vent pénétrer volontairement dans la zone, > possédée, Charmée ou Effrayée par de e l'est plus tant qu'elle reste dans la zone. | recevoir l'état Yemen tant qu'elles sont dans la zone.\nDon des langues. Les créatures des types retenus peuvent communiquer avec toute autre créature présente dans la zone, même si elles ne parlent aucune langue en commun.\nInterférence extradimensionnelle. Les créatures des types retenus ne peuvent pas entrer dans la zone ni en sortir par téléportation ni en recourant au voyage interplanaire.\nLumière du jour. Une Lumière vive emplit la zone. Les Ténèbres magiques créées par des sorts de niveau inférieur à celui de ce sort ne peuvent pas occulter cette lumière.\nRepos paisible. Les dépouilles enterrées dans la zone ne peuvent pas être transformées en Morts-vivants.\nRésistance. Tant qu'elles sont dans la zone, les créatures des types retenus bénéficient de la Résistance à un type de dégâts de votre choix.\nSilence. Aucun son ne peut émaner de l’intérieur de la zone ni y pénétrer.\nTénèbres. Les Ténèbres envahissent la zone. Les lumières ordinaires, ainsi que les lumières magiques créées par des sorts de niveau inférieur à celui de ce sort ne peuvent pas éclairer la zone.\nTerreur. Les créatures des types retenus ne peuvent subir l'état Effrayé tant qu'elles sont dans la zone.\nVulnérabilité. Tant qu'elles sont dans la zone, les créatures des types retenus subissent la Vulnérabilité à un type de dégâts de votre choix.", "illustration": null, "legende_illustration": null, "notes_verification": "symboles_suspects", "statut": "ocr_non_valide", "id": "sanctification", "html_body": "<p>Vous touchez un point pour investir la zone environnante de pouvoir sacré ou impie. Le rayon de la zone peut atteindre 18 m, le sort échouant si ce rayon chevauche une zone déjà affectée par le sort sanctification. La zone affectée présente s suivants. : sanctifiée. Choisissez un ou plusieurs types suivants : Aberrations, Célestes, Élémentaires, et Morts-vivants. Les créatures des types vent pénétrer volontairement dans la zone, &gt; possédée, Charmée ou Effrayée par de e l'est plus tant qu'elle reste dans la zone. | recevoir l'état Yemen tant qu'elles sont dans la zone.\nDon des langues. Les créatures des types retenus peuvent communiquer avec toute autre créature présente dans la zone, même si elles ne parlent aucune langue en commun.\nInterférence extradimensionnelle. Les créatures des types retenus ne peuvent pas entrer dans la zone ni en sortir par téléportation ni en recourant au voyage interplanaire.\nLumière du jour. Une Lumière vive emplit la zone. Les Ténèbres magiques créées par des sorts de niveau inférieur à celui de ce sort ne peuvent pas occulter cette lumière.\nRepos paisible. Les dépouilles enterrées dans la zone ne peuvent pas être transformées en Morts-vivants.\nRésistance. Tant qu'elles sont dans la zone, les créatures des types retenus bénéficient de la Résistance à un type de dégâts de votre choix.\nSilence. Aucun son ne peut émaner de l’intérieur de la zone ni y pénétrer.\nTénèbres. Les Ténèbres envahissent la zone. Les lumières ordinaires, ainsi que les lumières magiques créées par des sorts de niveau inférieur à celui de ce sort ne peuvent pas éclairer la zone.\nTerreur. Les créatures des types retenus ne peuvent subir l'état Effrayé tant qu'elles sont dans la zone.\nVulnérabilité. Tant qu'elles sont dans la zone, les créatures des types retenus subissent la Vulnérabilité à un type de dégâts de votre choix.<\/p>\n"}, {"nom": "Sanctuaire", "ecole": "Abjuration", "niveau": 1, "classes": ["Clerc"], "incantation": "action Bonus", "portee": "9 m", "composantes": "V, S, M (un éclat de verre issu d'un miroir)", "duree": "1 minute", "pages_source": [327], "description": "Vous protégez une créature à portée. Jusqu'à la fin du sort, toute créature qui cible la créature protégée avec un jet d'attaque ou un sort nuisible doit réussir un jet de sauvegarde de Sagesse, sans quoi elle doit choisir une autre cible pour ne pas perdre l'attaque ou le sort. Ce sort ne protège pas la créature contre les zones d'effet. Le sort prend fin pour la créature protégée si elle effectue un jet d'attaque, lance un sort ou inflige des dégâts.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "sanctuaire", "html_body": "<p>Vous protégez une créature à portée. Jusqu'à la fin du sort, toute créature qui cible la créature protégée avec un jet d'attaque ou un sort nuisible doit réussir un jet de sauvegarde de Sagesse, sans quoi elle doit choisir une autre cible pour ne pas perdre l'attaque ou le sort. Ce sort ne protège pas la créature contre les zones d'effet. Le sort prend fin pour la créature protégée si elle effectue un jet d'attaque, lance un sort ou inflige des dégâts.<\/p>\n"}, {"nom": "Sanctuaire Privé de Mordenkainen", "ecole": "Abjuration", "niveau": 4, "classes": ["Magicien"], "incantation": "10 minutes", "portee": "36 m", "composantes": "V, S, M (une feuille de plomb)", "duree": "24 heures", "pages_source": [327, 328], "description": "Vous sécurisez magiquement une zone à portée. La zone est un Cube dont l'arête peut aller de 1,50 m à 30 m. Le sort\n\nÀ l'incantation du sort, vous décidez quel genre de sécurité octroie le sort, en choisissant autant de propriétés souhaitées parmi les suivantes : Les sons ne franchissent pas le périmètre de la zone protegee. Le périmètre de la zone protégée apparaît sombre et brumeux, ce qui empêche de voir au travers (y compris avec la Vision dans le noir). Les capteurs créés par les sorts de Divination ne peuvent ni apparaître à l'intérieur de la zone protégée ni franchir son périmètre. Les créatures de la zone ne peuvent pas être ciblées par les sorts de Divination. Rien ne peut se téléporter dans la zone protégée ou hors d'elle.\nLe voyage planaire est bloqué au sein de la zone protégée. Lancer ce sort quotidiennement au même endroit pendant 365 jours fait persister le sort jusqu'à dissipation.\nEmplacement de niveau supérieur. Vous pouvez augmenter l’arête du Cube de 30 m par niveau d'emplacement au-delà du 4,", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "sanctuaire-prive-de-mordenkainen", "html_body": "<p>Vous sécurisez magiquement une zone à portée. La zone est un Cube dont l'arête peut aller de 1,50 m à 30 m. Le sort<\/p>\n<p>À l'incantation du sort, vous décidez quel genre de sécurité octroie le sort, en choisissant autant de propriétés souhaitées parmi les suivantes : Les sons ne franchissent pas le périmètre de la zone protegee. Le périmètre de la zone protégée apparaît sombre et brumeux, ce qui empêche de voir au travers (y compris avec la Vision dans le noir). Les capteurs créés par les sorts de Divination ne peuvent ni apparaître à l'intérieur de la zone protégée ni franchir son périmètre. Les créatures de la zone ne peuvent pas être ciblées par les sorts de Divination. Rien ne peut se téléporter dans la zone protégée ou hors d'elle.\nLe voyage planaire est bloqué au sein de la zone protégée. Lancer ce sort quotidiennement au même endroit pendant 365 jours fait persister le sort jusqu'à dissipation.\nEmplacement de niveau supérieur. Vous pouvez augmenter l’arête du Cube de 30 m par niveau d'emplacement au-delà du 4,<\/p>\n"}, {"nom": "Saut", "ecole": "Transmutation", "niveau": 1, "classes": ["Druide", "Ensorceleur", "Magicien", "Rôdeur"], "incantation": "action Bonus", "portee": "contact", "composantes": "V, S, M (une patte arrière de sauterelle)", "duree": "1 minute", "pages_source": [328], "description": "LE SORT SCRUTATION PERMET À UN BARDE GNOME DE GARDER\nLE CONTACT AVEC SES AMIS ET PARENTS DE PAR LE MONDE.\nVous touchez une créature consentante. Une fois à chacun de ses tours jusqu'à la fin du sort, la créature peut sauter d'un maximum de 9 m en dépensant 3 m de déplacement.\nEmplacement de niveau supérieur. Vous pouvez cibler une créature supplémentaire par niveau d'emplacement au-delà du 1.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "saut", "html_body": "<p>LE SORT SCRUTATION PERMET À UN BARDE GNOME DE GARDER\nLE CONTACT AVEC SES AMIS ET PARENTS DE PAR LE MONDE.\nVous touchez une créature consentante. Une fois à chacun de ses tours jusqu'à la fin du sort, la créature peut sauter d'un maximum de 9 m en dépensant 3 m de déplacement.\nEmplacement de niveau supérieur. Vous pouvez cibler une créature supplémentaire par niveau d'emplacement au-delà du 1.<\/p>\n"}, {"nom": "Scrutation", "ecole": "Divination", "niveau": 5, "classes": ["Barde", "Clerc", "Druide", "Magicien", "Occultiste"], "incantation": "10 minutes", "portee": "personnelle", "composantes": "V, S, M (un focaliseur d'une valeur minimale de 1 000 po, comme une boule de cristal, un miroir en argent ou une vasque remplie d’eau bénite)", "duree": "Concentration, jusqu’à 10 minutes", "pages_source": [328, 329], "description": "Vous voyez et entendez une créature de votre choix, située sur le même plan d'existence que vous. La cible effectue un jet de sauvegarde de Sagesse, modifié par votre connaissance de la créature et le genre de lien physique que vous entretenez avec elle (voir les tables ci-après). La cible ignore contre quoi s'effectue le JS, et ressent juste une forme de malaise. Votre connaissance de la cible est... Modificateur au JS indirecte (vous avez entendu parler d'elle) +5 directe (vous l'avez rencontrée) +0 intime (vous la connaissez) -5 i, la cible n'est pas affectée et vous ne iser ce sort sur elle pendant 24 heures. as d'échec, le sort crée un capteur Invisible et intandar sun rayon de 3 m de la cible. Vous voyez et entenl'ir jaire du capteur comme si vous y étiez. D iince avec la cible, en restant dans un rayon pour toute la durée. Pour qui perçoit le capteur, raît comme un orbe lumineux de la taille de 1 qu'une créature, vous pouvez cibler un lieu que vez déjà vu. Ce faisant, le capteur apparaît à l'endroit é et ne bouge plus.", "illustration": null, "legende_illustration": null, "notes_verification": "", "statut": "ocr_non_valide", "id": "scrutation", "html_body": "<p>Vous voyez et entendez une créature de votre choix, située sur le même plan d'existence que vous. La cible effectue un jet de sauvegarde de Sagesse, modifié par votre connaissance de la créature et le genre de lien physique que vous entretenez avec elle (voir les tables ci-après). La cible ignore contre quoi s'effectue le JS, et ressent juste une forme de malaise. Votre connaissance de la cible est... Modificateur au JS indirecte (vous avez entendu parler d'elle) +5 directe (vous l'avez rencontrée) +0 intime (vous la connaissez) -5 i, la cible n'est pas affectée et vous ne iser ce sort sur elle pendant 24 heures. as d'échec, le sort crée un capteur Invisible et intandar sun rayon de 3 m de la cible. Vous voyez et entenl'ir jaire du capteur comme si vous y étiez.
